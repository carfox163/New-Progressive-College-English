说他的心脏还能承受撞击，但他的身体知道该说再见了。","a":"it’s time to say goodbye"}]},{"id":"cloze","part":"text","type":"cloze","title_en":"Comprehensive Practice 4.1 — Cloze","title_zh":"综合练习 4.1 · 完形填空","instr_en":"Complete the passage with the appropriate words or expressions in the box. Change the form when necessary.","instr_zh":"用方框中恰当的词或短语完成短文，必要时改变形式（方框中有多余选项）。","bank":["cycle","debt","meaningless","miserable","vanish","vicious","be content with","come into being","derive from","keep up with","most of all","out of date","poke fun at","strive for"],"passage":"Do you worry that others might {{1}} you if what you wear is too old fashioned or your gadgets {{2}}? If you do, you are not alone. For concern about {{3}} the Joneses is widespread. In a way, this is not surprising, for we are social animals and {{4}} social approval comes naturally to us. Yet it is easy to take things too far. Conspicuous consumption, spending on expensive items to impress others, can get out of control, leading us into {{5}} and making us feel {{6}}. It can trap us in a(n) {{7}} cycle that is never ending. We shall probably never reach a point where the desire to show off {{8}} altogether, but we need to learn to be a little bit more {{9}} what we already possess.","answers":["poke fun at","out of date","keeping up with","striving for","debt","miserable","vicious","vanishes","content with"]},{"id":"trans","part":"text","type":"translate","dir":"zh2en","title_en":"Comprehensive Practice 4.2 — Translation","title_zh":"综合练习 4.2 · 汉译英","instr_en":"Translate the following passage into English, using the words and phrases in the box below.","instr_zh":"用下面方框中的词或短语把下列短文译成英语。","bank":["contentment","debt","disappointment","ultimately","buy on credit","for that matter","hold onto","keep up with","strive for"],"items":[{"q":"你所在的居住区或许住着几户有钱的邻居，他们住着大房子，开着运动型多功能车（SUV）。街坊里有些人一点都不在乎，而另一些人可能觉得不仅要跟他们一样，而且在这方面还要超过（outdo）他们。你可能以为，一点嫉妒心能够激发你更加努力地工作，争取过更好的生活。然而，如果你坚持要和邻居比阔的想法，你就是在追风。等待你的是失望，而不是满足，因为如果你赊账购买，你最终将陷入深深的债务，即使你一周工作90小时也还不清。","a":"In your neighborhood there may be some wealthy families who live in big houses and ride in SUVs. While some people in the neighborhood don’t care a bit about that, others may feel like not only keeping up with them, but outdoing them, for that matter. You might think a little envy can motivate you to work harder and strive for a better life. But if you hold onto the idea of keeping up with the Joneses, you are chasing the wind. What lies ahead is disappointment, not contentment, because if you buy on credit, you’ll ultimately find yourself deeply in debt that you cannot repay even if you work 90 hours a week."}]},{"id":"r1tf","type":"tf","title_en":"Comprehension Check — Reading 1","title_zh":"阅读1 课文理解","instr_en":"Decide whether the following statements are true (T) or false (F), based on the article.","instr_zh":"根据文章内容判断下列说法正误（T／F）。","items":[{"q":"Conspicuous consumption, the lifestyle of celebrities and millionaires, is not fit for the general public.","zh":"炫耀性消费——名人和百万富翁的生活方式——并不适合普通大众。","a":"F"},{"q":"Most people believe they aren't the ones doing any needless spending, and as a matter of fact that's true.","zh":"多数人认为自己不是盲目花钱的那类人，而事实上确实如此。","a":"F"},{"q":"The average adult in America spends roughly $1,500 a month on nonessential items, which is not a big sum.","zh":"美国成年人平均每月在非必需品上花费约1500美元，这不算一笔大数目。","a":"F"},{"q":"Even huge sport utility vehicles are now being viewed as a necessity under the guise of safety.","zh":"如今，即使是大型运动型多功能车，也以安全为名被视为必需品。","a":"T"},{"q":"It will be a long time before cosmetic surgery, pleasure boats and second homes are counted as necessities.","zh":"美容手术、游艇和第二居所要过很久才会被算作必需品。","a":"F"},{"q":"Conspicuous consumption is only seen in Western countries. People in other parts of the world won't imitate their neighbors' lifestyles.","zh":"炫耀性消费只出现在西方国家，世界其他地方的人不会模仿邻居的生活方式。","a":"F"},{"q":"In a society that favors instant gratification over hard work, people are more likely to consume extravagantly.","zh":"在一个偏爱即时享受而非努力工作的社会里，人们更可能奢侈消费。","a":"T"},{"q":"Many of those who drive around the suburbs in their giant SUVs while talking on their new cell phones are heavily in debt.","zh":"许多人在郊区开着巨型SUV、用新手机打电话，其实负债累累。","a":"T"},{"q":"Once people get used to a certain luxury, they take it for granted, rely on it and finally can't live without it.","zh":"人们一旦习惯某种奢侈品，就会视之为理所当然，继而依赖它，最终离不开它。","a":"T"},{"q":"If you are still facing daily money worries and concerns about future finances, you should trim your needs and set your priorities.","zh":"如果你仍为日常开支发愁、担心未来的财务状况，就该削减需求、分清轻重缓急。","a":"T"}],"part":"r1"},{"id":"r1tr","type":"translate","title_en":"Translation — Reading 1","title_zh":"阅读1 英译中","instr_en":"Translate the following underlined sentences from the article into Chinese.","instr_zh":"把下列句子译成中文，注意画线部分的表达。","items":[{"q":"They aren't wearing ten pounds of gold chains, or gowns created by famous designers. Four-hundred-dollar haircuts, sprawling mansions, Rolls Royces and private planes aren't in their budget, so they assume their spending is reasonable.","a":"他们没有佩戴十磅重的金链子，也没有穿着由著名设计师制作的礼服。四百美金一次的理发、宽大的豪宅、劳斯莱斯轿车以及私人飞机都不在他们的预算之内，所以他们认为自己的各项花费合情合理。"},{"q":"Cosmetic surgery, pleasure boats, restaurant quality kitchen appliances, professional quality home gym equipment, and second homes are a few items that still qualify as luxuries in most people's minds, but that hasn't hurt their popularity.","a":"在多数人的心目中，美容手术、游艇、餐馆品质的厨房用具、专业品质的家用健身设备以及第二居所仍然被视为奢侈品，但这并没有损及它们受欢迎的程度。"},{"q":"The Western countries are well known for their excessive consumption, but the emerging middle classes in other parts of the world are working hard to join the crowd too.","a":"西方国家以过度消费而闻名，但世界上其他地方的新兴中产阶级也在拼命地加入这个群体。"},{"q":"The big homes, expensive toys and other goodies seem nice, but in reality they are unnecessary from a practical perspective, and will only make you happy for a very short period of time before the next \"must-have\" item rolls around.","a":"大房子、昂贵的玩具以及其他好东西好像都招人喜欢，但实际上从实用的角度看，这些东西未必需要，而且它们只能带来短暂的快乐。用不了多久，下一个“必需品”又将接踵而来。"}],"part":"r1"},{"id":"r2qa","type":"qa","title_en":"Comprehension Check — Reading 2","title_zh":"阅读2 课文理解","instr_en":"Skim the article and answer the following questions.","instr_zh":"快速浏览文章，回答下列问题。","items":[{"q":"What did Jia Fan buy during this year's Double 11? Did she make the purchase because of any discounts she could get?","zh":"贾帆在今年的双十一买了什么？她是因为有折扣才购买的吗？","a":"She only bought some toothpaste and shampoo. She made the purchase not because she could enjoy a discount, but rather she had happened to run out of stock."},{"q":"A growing number of Chinese youth are rejecting overspending and overconsumption. What do they call themselves and what do they advocate?","zh":"越来越多的中国年轻人拒绝过度花费与过度消费。他们自称什么？主张什么？","a":"They call themselves \"consumerism opponents\". They advocate buying less, saving more, frugality, and simple living."},{"q":"An anti-consumerism discussion group was created on a Chinese social media platform in 2020 and now has quite a large membership. What do members do in the discussion group?","zh":"2020年，一个反消费主义的讨论群在中国某社交媒体平台上成立，如今成员众多。群成员在群里做什么？","a":"They post examples of their unpleasant shopping experiences to help others avoid similar pitfalls, and share tips on how to avoid traps when making a purchase and how to rationally identify genuine shopping needs in the first place."},{"q":"According to the passage, how does consumerism affect our lives?","zh":"根据文章，消费主义如何影响我们的生活？","a":"Consumerism not only empties our wallets, but also creates anxiety, greed and the fear of missing out among us."},{"q":"What do people think of the consumption habits that consumerism opponents encourage?","zh":"人们如何看待消费主义反对者所提倡的消费习惯？","a":"They give positive attention and praise to the consumption habits that consumerism opponents encourage. They think these young people are acting more rationally when making purchase decisions."}],"part":"r2"},{"id":"viewing","part":"skills","type":"fill","title_en":"Viewing & Listening — Buffett & Gates Go Back to School","title_zh":"视听说 · 巴菲特与盖茨重返校园","instr_en":"View a short clip of the interview two or three times and fill in the blanks according to what you have heard.","instr_zh":"观看这段采访短片两到三遍，根据所听内容填空。","items":[{"q":"Even after Buffett was rich, he and his family lived in the ______, the only one home they’ve known in their life.","zh":"即便致富之后，巴菲特一家仍住在原来那栋房子里——那是他们一生中唯一住过的家。","a":"same house"},{"q":"The kids went to ______ in Omaha.","zh":"孩子们在奥马哈上公立学校。","a":"public schools"},{"q":"Gates thinks it is tough when children grow up in a rich environment without knowing that there are real ______.","zh":"盖茨认为，孩子在富裕环境中长大、却不知道存在真实的限制，这很棘手。","a":"limitations / limits"},{"q":"Gates hopes that people treat his children in a normal way and treat them for what they’re actually ______.","zh":"盖茨希望人们以平常心对待他的孩子，按照他们真正擅长的东西来对待他们。","a":"good at"},{"q":"Buffett says that the idea of dynastic fortunes ______ him off.","zh":"巴菲特说，家族巨额财富这个念头让他反感。","a":"turns"},{"q":"He insists that what America is about should be having a fair ______ for everyone with talents to get the brass ring.","zh":"他坚持认为，美国的要义在于让每个有才能的人都拥有公平的机会去摘取成功的桂冠。","a":"shot"}]}]},{"id":"b3u3","book":"Book 3","unit":"Unit 3","title_en":"Bridge Builders between the East and the West","title_zh":"东西方之间的桥梁建造者","text_title_en":"Unit 3 Bridge Builders between the East and the West","text_title_zh":"东西方之间的桥梁建造者","goals":["Upon completion of this unit, teachers are expected to have enabled students to:","have a thorough understanding of the text contextually and linguistically;","build up an active vocabulary to talk about bridge builders and know how to use the key words and expressions in context properly;","draw inspiration from the bridge builders in this unit and consider how they themselves can act as bridge builders;","write an essay on what the bridge builders in this unit have in common.","Part 2 Suggested Teaching Plan","I. Teaching process chart","This unit is designed for eight periods of classroom activities. In each of the periods, certain tasks are to be completed. Generally speaking, there may be several different ways to explore this unit. Here is a suggested teaching plan."],"passages":[{"id":"text","label_zh":"课文","label_en":"Text","title_en":"Joseph Needham and “China Firsts”","title_zh":"李约瑟和“中国首创”","author_en":"Steve Bale","author_zh":"史蒂夫·贝尔","lead_en":"China has long been famous for its four great inventions: the compass, gunpowder, papermaking and printing. And now, thanks in no small measure to the work of Joseph Needham, there is growing recognition throughout the world of the many other important inventions to have been discovered first in China.","lead_zh":"中国长期以来以其四大发明而闻名：指南针、火药、造纸术和印刷术。现在，在很大程度上要归功于李约瑟博士的工作，世界各地越来越多的人认识到许多其他重要发明是首先在中国被发现的。","paras":[{"n":1,"en":"By any measure, the rapidity of China’s progress in science and technology in the last two decades has been nothing short of astounding — the airports, the high-speed rail network, the subway systems, the 4G and increasingly 5G connectivity, the electric-vehicles and the ‘cashlessness’, among others.","zh":"无论用什么标准衡量，中国过去20年里科技的进步之快都是惊人的——机场、高铁网络、地铁系统、4G和日益普及的5G连接、电动汽车和“无现金”，等等。"},{"n":2,"en":"The growing fascination for all things Chinese has spurred a wave of interest in Chinese history. One of the popular subjects is ancient China’s technological superiority. Long-overdue news of China’s ‘four great inventions’ — paper making, printing, gunpowder, and the compass — has at last reached large numbers of people in the Western world.","zh":"世人对各种中国事物的兴趣渐涨，由此掀起一波研究中国历史的热潮。其中一个热门话题是古代中国的技术优势。西方世界的许多人终于得知早该传遍四方的中国“四大发明”——造纸术、印刷术、火药和指南针。"},{"n":3,"en":"The story has travelled far and wide. But, as is so often the case with stories, very few people know the name of the storyteller.","zh":"现在，这个故事已传遍四方。然而，同许多其他故事的情况一样，讲故事的人是谁，却鲜有人知。"},{"n":4,"en":"This would not have worried Joseph Needham (1900–1995) in the slightest. He was fully focused on one, albeit Herculean task: To give China the long-overdue respect it deserves for its scientific contributions to humankind.","zh":"李约瑟(1900–1995)根本就不为此所扰。他全心全意扑在一项艰巨的任务上:宣传中国对人类的科学贡献，让它得到早该得到的尊重。"},{"n":5,"en":"Joseph Needham studied biochemistry at the University of Cambridge under the tutelage of Sir Frederick Gowland Hopkins, who would be jointly-awarded the Nobel Prize in Physiology or Medicine in 1929. Needham was a brilliant student and equally exceptional researcher, who would go on to author more than 100 scientific publications between 1921 and 1942. Surely, then, it would only be a matter of time before he followed Sir Frederick’s path all the way to the Nobel rostrum.","zh":"李约瑟曾在剑桥大学学习生物化学，师从弗雷德里克·高兰·霍普金斯爵士。后者于1929年与他人共同获得诺贝尔生理学或医学奖。李约瑟成绩优异，做研究也同样出色，在1921年至1942年期间发表了100多篇科学论文。以此推想，他步弗雷德里克爵士后尘走上诺贝尔奖的领奖台肯定只是时间问题。"},{"n":6,"en":"Perhaps he would have, had he not met three young Chinese students who had arrived at Cambridge in 1937 to pursue doctoral research in biochemistry, including Lu Guizhen, who would become his second wife in 1989.","zh":"要是他没有遇到1937年来剑桥大学攻读生物化学博士研究学位的三名年轻中国学生，包括1989年成为他第二任妻子的鲁桂珍，也许他真会获得诺贝尔奖。"},{"n":7,"en":"Lu ignited his intense passion for studying Chinese characters, which he went on to describe as, “…A liberation, like going for a swim on a hot day. [For it gets you] entirely out of the prison of alphabetical words and into the glittering, crystalline world of ideographic characters.” Lu also fired Needham’s fervent interest in China’s long and illustrious history in numerous fields of science.","zh":"鲁桂珍激起了他学习汉字的强烈热情。他后来说:“——那是一种解放，就像在大热天去游泳。(因为它让你)完全脱离了字母文字的牢笼，进入了熠熠生辉、晶莹剔透的表意文字的世界。”鲁桂珍还激发了李约瑟对中国在众多科学领域的悠久而辉煌历史的狂热兴趣。"},{"n":8,"en":"With his strong scientific background and language proficiency, Needham was dispatched by the British government in late 1942 to head the British Scientific Mission in China. For the next six years he traveled around the country by all means of transportation, including jeeps, junks, wheelbarrows, camels, litters and goatskin rafts, collecting obscure, secondhand books on traditional science that became the basis of his extensive and unusual library.","zh":"鉴于李约瑟出色的科学背景和语言能力，英国政府于1942年底将他派遣到中国，任命他为英国赴华科学考察团团长。在接下来的六年里，他乘坐各种交通工具在中国各地旅行，包括吉普车、中式帆船、独轮手推车、骆驼、轿子和羊皮筏子，收集关于中国传统科学的鲜为人知的二手书籍。这些书籍为他庞大而不寻常的个人图书收藏奠定了基础。"},{"n":9,"en":"Many scientists and others he met were keen to talk about China’s incredible science history. They also introduced him to the literature that provided the all-important evidence that supported the many extraordinary stories.","zh":"他遇到的许多科学家和其他人都热衷于谈论中国不可思议的科学史。他们还向他介绍了一些文献，这些文献为许多非凡故事提供了至关重要的佐证。"},{"n":10,"en":"The greatest moment of enlightenment came at the ancient Mogao Caves, where Needham saw with his own eyes that the date appearing on the Diamond Sutra found in the ‘Library Cave’ corresponded to the 11th May 868 in the Gregorian calendar. Even more remarkable was that it was not hand-drawn, but printed…587 years before the first book was printed in Europe.","zh":"在古老的莫高窟，李约瑟受到了最大的启迪。他亲眼看到在“藏经洞”中发现的《金刚经》上标注的日期，换算成公历就是868年5月11日。更惊人的是，这部经文不是手抄的，而是印刷的......比欧洲第一次印刷书籍早了587年。"},{"n":11,"en":"This was the ‘China first’ that inspired Joseph Needham to embark on what would be a more than 50-year mission to dispel a long-held view in the West that China had neither science nor made any contribution to modern science, and to persuade the world that China had been the home of the world’s most advanced ancient civilisation by far.","zh":"正是这项“中国首创”鼓舞李约瑟承担起一个为时50多年的使命，消除西方长期以来认为中国既没有科学也没有对现代科学做出任何贡献的观念，并让世界相信中国是世界上最先进的古代文明的发源地。"},{"n":12,"en":"His experiences and rich encounters in China convinced him that the plan to write a “single slim volume” on the history of science in China needed to be re-thought: “During my time in China I realised that one volume would not be enough, and that it would probably have to be seven,” he wrote.","zh":"他在中国的经历和丰富的见闻使他相信，他需要修改原先写一册关于中国科学史的“薄薄小书”的打算。他写道:“在中国的日子里，我意识到写一卷书不够，可能要写上七卷。”"},{"n":13,"en":"Back in Cambridge, Joseph Needham began to type the pages that would become the monumental Science and Civilisation in China. He was surrounded by mountains of beloved books from numerous Chinese sources. A kid in the world’s biggest and best sweet shop: “What a cave of glittering treasures was opened up! …One after another, extraordinary inventions and discoveries clearly appeared… often, indeed generally, long preceding the parallel, or adopted inventions and discoveries of Europe. …Wherever one looked, there was ‘first’ after ‘first.’”","zh":"回到剑桥后，李约瑟着手写作，一张张打字纸集腋成裘，最终形成鸿篇巨著《中国科学技术史》。在中国天南地北觅来的备受他珍爱的众多书籍将他团团围住，犹如一名孩童身处世界上最大最好的糖果店:"},{"n":14,"en":"Indeed, there were so many ‘firsts’ after ‘firsts’, including those in chemistry, mathematics, navigation, medicine, botany, mechanics, civil engineering and agriculture, that, although the plan for seven volumes didn’t change, volumes 4 to 7 were split into 24 parts. Several of these were completed by academics from the Needham Research Institute and published after his death in 1995.","zh":"事实上，发现的一个又一个“首创”不胜枚举，涵盖了化学、数学、航海、医学、植物学、力学、土木工程和农业等诸多方面，以至于虽然李约瑟撰写七卷《中国科学技术史》的计划没有改变，但第四至第七卷被分成24本分册。其中某些分册由李约瑟研究所的学者在他1995年去世后完成并出版。"},{"n":15,"en":"The final book in the collection, Science and Civilisation in China, Volume 7, Part II: General Conclusions and Reflections, lists the 262 ‘firsts’ that were described in earlier volumes of the work.","zh":"该丛书的最后一本，即《中国科学技术史》第七卷第二分册《总的结论和思考》，列举了前几卷中提及的262个“首创”。"},{"n":16,"en":"Students of China consider Dr. Needham’s work a singular achievement and have compared it to that of Darwin and Gibbon in its size and scope. The historian Jonathan Spence wrote in 1982 that Science and Civilisation in China was “the most ambitious undertaking in Chinese studies during this century.”","zh":"研究中国的学者们认为李约瑟博士的著作成就非凡重大，称其在规模和范围上可与达尔文和吉本的著作媲美。历史学家史景迁于1982年写道，《中国科学技术史》是“本世纪汉学界最宏大的壮举”。"},{"n":17,"en":"On March 24th, 1995, Joseph Needham died at the age of 94. The world lost not only one of its greatest scholars of the 20th century, but also the most renowned bridge builder between the East and the West of our time.","zh":"1995年3月24日，李约瑟去世，享年94岁。世界不仅失去了20世纪最伟大的学者之一，还失去了我们这个时代最著名的东西交流桥梁建造者。"}],"audio_full":"textfull.mp3","vocab":[{"w":"by any measure","def":"no matter how a judgment is made","zh":"无论以哪种标准衡量","ex":["By any measure, Prof. Lu was one of the most respected Shakespeare scholars in the country."]},{"w":"nothing short of","def":"almost true, equal to","zh":"可以说是，无异于","ex":["The scope and depth of changes in China in the past decades are nothing short of remarkable."]},{"w":"among others","def":"(used when mentioning one or more examples)","zh":"其中包括","ex":["The museum has an extraordinary collection of paintings by, among others, Piccasso and Zhang Daqian."]},{"w":"superiority","def":"n. the quality of being better, more powerful, etc. than other people or things","zh":"优势; 优越","ex":["Can we not have dinner with the Johneses? They always put on an air of superiority.","This company’s superiority in electric vehicles is proven by the fact that every other company wants to beat it."]},{"w":"overdue","def":"a. that should have happened or been done some time/a long time ago(","zh":"早)该发生了的; (早已)逾期的","ex":["The Personal Data Protection Law is something long overdue, considering how much data is generated and transmitted without ordinary people’s knowledge."]},{"w":"far and wide","def":"over a large area","zh":"广泛地;到处","ex":["China sends out the message far and wide that we want peace and development.","We searched far and wide for a drug that is effective and reasonably priced."]},{"w":"deserve","def":"vt. be worthy of","zh":"应得，应受到(奖励或惩罚)","ex":["I think Mary deserves an apology after all the yelling you did."]},{"w":"jointly","def":"ad. together, in partnership","zh":"共同地","ex":["Schools, families and communities must work jointly to protect the mental health of children."]},{"w":"exceptional","def":"a. unusually good","zh":"出类拔萃的","ex":["All parents want their kids to do well, but a truly exceptional talent can be a curse as well as a blessing."]},{"w":"a matter of time","def":"certain to happen at some time in the future (","zh":"某事肯定发生)只是时间问题","ex":["It will be just a matter of time before the world switches to renewable energy."]},{"w":"all the way to/down/across sth.","def":"until the end/length/width of sth.","zh":"一直到; 纵贯","ex":["Tree roots stretch all the way down to find water and nutrients.Our sleeper trains will offer a new cross-border travel experience all the way across the continent."]},{"w":"ignite","def":"vt. spark, excite","zh":"点燃;激起","ex":["The 80’s pop song ignited memories of her days in the countryside.","It was the Nazi attack on Poland that ignited the Second World War."]},{"w":"intense","def":"a. very strong, very great","zh":"十分强烈的; 很大的","ex":["The emotion was so intense that she cried throughout the movie."]},{"w":"glitter","def":"vi. shine brightly with flashing lights","zh":"闪烁，闪光","ex":["She held out her hand to give others a better view of the glittering diamond ring."]},{"w":"fervent","def":"a. having or showing very strong and sincere feelings about sth.","zh":"热烈的;热情的","ex":["Prayer is nothing more than a fervent wish.","Randy was a fervent supporter of the learner-centered classroom."]},{"w":"proficiency","def":"n. a good standard of ability or skill","zh":"熟练，精通","ex":["It seems like every woman in Jane Austen’s novels has some sort of proficiency with the piano."]},{"w":"dispatch","def":"vt. send sb. or sth. somewhere for a particular purpose","zh":"派遣; 发送","ex":["The package was dispatched to the wrong address and returned.Sixty firefighters were dispatched to the scene but were unable to save the building."]},{"w":"obscure","def":"a. not well known","zh":"鲜为人知的","ex":["For some obscure reason, several of my files have gone missing in the latest update of the computer operating system."]},{"w":"basis","def":"n. the facts, ideas, and things from which sth. can be developed","zh":"基础; 根据","ex":["Agriculture was the basis of every civilization.On what basis did the police conclude that this was a suicide, not a murder?"]},{"w":"extensive","def":"a. large in size, degree or amount","zh":"大规模的; 广大的; 大量的","ex":["Because of the size of the bomb, the damage was extensive.","Extensive research has shown the positive effect of praise in child development."]},{"w":"keen","def":"a. wanting to do sth. or wanting sth. to happen very much","zh":"热衷于; 渴望","ex":["As a child I was keen on writing my own stories. I even won a literary award!He was keen to forget about the past and concentrate on the current relationship with Natalia."]},{"w":"correspond to/with","def":"be very similar to or the same as","zh":"相当于，类似于","ex":["In some countries, the role of president corresponds to that of prime minister in the UK."]},{"w":"embark on","def":"start","zh":"着手，开始","ex":["Five years ago today, I embarked on an adventure to Australia after getting my working holiday visa."]},{"w":"dispel","def":"vt. make sth. go away, esp. a belief, idea or feeling","zh":"驱散，消除(尤指信仰等)","ex":["Copernicus helped dispel the myth that humanity was at the centre of the universe."]},{"w":"by far","def":"(","zh":"常用于修饰比较级或最高级)by a great amount 最...; 显然","ex":["Public transportation is by far the easiest way to get around the city."]},{"w":"encounter","def":"n. an occasion when one meets or experiences sth.","zh":"遭遇，经历","ex":["I’ll never forget my first encounter with sharks at Cocos Island."]},{"w":"convince","def":"vt. make sb. feel certain that sth. is true","zh":"使确信，使信服","ex":["I’ve gained all the necessary information, and I am now convinced of the safety of this new building material."]},{"w":"slim","def":"a. thinner than usual","zh":"单薄的","ex":["The slim phone case fits my phone perfectly."]},{"w":"surround","def":"vt. be all around sb./sth.","zh":"围绕; 环绕","ex":["Istanbul is surrounded by water on three sides."]},{"w":"precede","def":"vt. happen or exist before (sth. or sb.)","zh":"先于... (发生或存在)","ex":["The official meeting between the two heads of state was preceded by a ceremony."]},{"w":"adopt","def":"vt. start to use","zh":"采用","ex":["In times of economic crises, it’s common for businesses to adopt the strategy of cost cutting."]},{"w":"civil","def":"a. relating to the ordinary people or things in a country that are not part of military, government, etc.; relating to citizens","zh":"民用的; 公民的","ex":["Some countries are keen on the civil use of nuclear power.","On August 23, 1965, a quarter of a million Americans marched to Washington D.C. demanding long overdue civil rights protection."]},{"w":"conclusion","def":"n. belief or opinion that is the result of reasoning","zh":"结论","ex":["After page 16 had been read, the child smiled and drew a conclusion, “The dragon is not lonely. He has friends.”"]},{"w":"scope","def":"n. range of matters being dealt with, studied, etc.","zh":"范围","ex":["After the earthquake, government officials started to survey the full scope of damage."]}]},{"id":"r1","label_zh":"阅读 1","label_en":"Reading 1","title_en":"From a Nuclear Physicist to a Dairy Farmer","title_zh":"从核物理学家到奶农","author_en":"","author_zh":"","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"Joan Hinton never could have imagined that China would become the destination of her lifetime. She came, she saw the changes, and ended up living here the rest of her life.","zh":"寒春压根儿不可能想象得到，中国将成为她生命旅程的目的地。她来到中国，目睹这里发生的变化，最终在这里度过了余生。"},{"n":2,"en":"Hinton was one of the few women to take part in the Manhattan Project to build the world’s first atomic bomb. In 1945, the 23-year-old Hinton quitted after witnessing atomic bombs dropped on two Japanese cities. “I did not want to spend my life figuring out how to kill people,” she told U.S. broadcaster National Public Radio back in 2002. “I wanted to figure out how to let people have a better life, not a worse one.”","zh":"寒春是参加制造世界上第一颗原子弹的曼哈顿计划的少数女性之一。1945年，23岁的寒春在目睹原子弹投向两个日本城市后辞职。“我不想把我的一生用在研究如何杀人上，”她于2002年在美国国家公共广播电台上说道。“我想找到让人们过上更好的生活、而不是更糟糕的生活的办法。”"},{"n":3,"en":"Hinton came from an intellectual background. Her mother was a campaigner for women’s rights and founder of a private, co-ed boarding school committed to progressive educational methods. Her brother William Hinton, a close observer of China, wrote many CPC- related books including Fanshen: A Documentary of Revolution in a Chinese Village.","zh":"寒春出生于知识分子家庭。她母亲是一名妇女权利运动人士，还创建了一所致力于进步教育方法的私立男女同校寄宿学校。她的哥哥韩丁近距离观察中国，写了《翻身:一个中国村庄的革命纪实》等许多与中国共产党有关的书籍。"},{"n":4,"en":"Her boyfriend Erwin Engst gathered his first impressions of China from the 1937 book Red Star over China written by Edgar Snow. He came to China on behalf of the UN in 1946 and went on to serve as an expert on farm equipment in Yan’an. Erwin kept on writing letters to urge Joan to come to China. He observed that China “was about to climb a hill.” “If you arrive late,” he added, “you’ll miss the bus.”","zh":"她的男友阳早从埃德加·斯诺1937年写的《红星照耀中国》一书中初步了解中国。1946年，他作为联合国代表来到中国，后来留在延安担任农用设备专家。阳早不断写信敦促寒春来中国。他对寒春说，中国“即将翻过一座山”。“如果你来晚了，”他补充说，“你会错失良机。”"},{"n":5,"en":"In 1948, Joan Hinton arrived at Yan’an, where she and Erwin got married. They bore witness to the establishment of the People’s Republic of China in 1949. (1) Hinton, who harbored high hopes of making milk available to the overall Chinese population, decided to apply herself to the improvement of agricultural machinery and the dairy industry at large.","zh":"1948年，寒春来到延安，在那里和阳早结婚。他们见证了1949年中华人民共和国的成立。寒春志向远大，她想让全体中国人民都喝上牛奶，决定致力于改良农业机械、推动整个乳品行业的发展。"},{"n":6,"en":"The couple moved, together with 83 Friesian cows, to grasslands in between northern Shanxi and Inner Mongolia. Four years later they moved with 1,000 head of cattle to Caotan Farm near Xi’an, where they spent the next 10 years. In the mid-1960s the couple was sent to run an experimental farm in Changping, on the outskirts of Beijing.","zh":"这对夫妇带着83头荷兰牛迁居山西北部和内蒙古之间的草原。四年后，他们带着1,000头牛搬到西安附近的草滩农场，在那里住了10年。20世纪60年代中期，这对夫妇被派往北京郊区的昌平经营一个实验农场。"},{"n":7,"en":"For 60 years Joan and Erwin spent every waking moment on cattle breeding and pushing forward the mechanization of dairy farming. Joan researched milk refrigeration and storage, filling a gap in domestic knowledge. The couple’s joint project — researching and planning the comprehensive mechanization of China’s dairy industry — had a huge influence on dairy farms across the country. In Chengchuan Town of Ordos City in Inner Mongolia, the Yang Zao and Han Chun Memorial Hall, citing Engst and Hinton’s Chinese names, officially opened in 2017.","zh":"寒春和阳早60年如一日地培育奶牛和推动乳品业机械化。寒春研究牛奶冷藏和储存技术，填补了国内知识的空白。这对夫妇的联合项目——中国乳业的全面机械化研究和规划——对全国的奶牛场产生了巨大影响。在内蒙古鄂尔多斯市城川镇，以二者中文名字命名的阳早寒春(三边牧场)陈列馆于2017年正式开放。"},{"n":8,"en":"(2) Many people who knew Joan say that she applied to the dairy industry all the skill and enthusiasm that had won her a place on the Manhattan Project. “Everyone was striving for the same goal and I was involved in a glorious cause,” the physicist-turned-farmer once remarked about those days.","zh":"许多认识寒春的人说，她把当年为自己在曼哈顿项目中赢得一席之地的所有技能和热情都用到了乳品行业。“每个人都在为同一个目标而奋斗，我参与了一项光荣的事业，”这位由物理学家转为奶农的人曾这样评价那段岁月。"},{"n":9,"en":"Hinton and her husband lived a simple life. (3) During her time in Yan’an, she barely stood out as a foreigner, dressed in cotton or wool gender-neutral clothing and wearing a set of keys around her waist. The villagers treated her like they would a family member. During one Chinese New Year’s party in the village she lived in, Hinton shared her sense of humor by amusing the locals with her performances using a northern Shaanxi dialect.","zh":"寒春和她的丈夫过着简朴的生活。在延安，几乎看不出她是个外国人，她身着当地男女都穿的那种棉袄或羊毛衣，腰上挂着一串钥匙。村民们把她当家里人看待。在她居住的村子里的一次春节聚会上，寒春用陕北方言表演节目，幽默风趣，令当地老乡忍俊不禁。"},{"n":10,"en":"Her most prized possession was an old violin crafted in Italy in the 19th century. Whenever the melodious sounds of the song Dongfang Hong (The East Is Red) resonated through the farm and across its land, colleagues would know that it was Hinton striking the strings of her beloved instrument.","zh":"她最珍贵的财产是一把19世纪意大利手工制作的古旧小提琴。每当悠扬的《东方红》乐曲在奶牛场和大地上空回荡，同事们都知道那是寒春在拉响她心爱的琴弦。"},{"n":11,"en":"In 1977, at the invitation of the U.S.-China Peoples Friendship Association, Hinton made her way back to the U.S. and delivered more than 250 speeches across 53 cities, telling Americans about her experiences in the great land of mystery that was China. She helped shape mutual understanding, friendship and mutual trust between both peoples.","zh":"1977年，应美中人民友好协会的邀请，寒春回访美国，在53个城市发表了250多场演讲，向美国人讲述她在中国这块神秘的大地上的经历。她增进了两国人民之间的相互理解、友谊和互信。"},{"n":12,"en":"On Christmas Day 2005, Erwin died after a long illness. (4) His obituary, at Joan’s insistence, included the sentence that he had “ceaselessly struggled for the liberation of all mankind.” She added that “it was our beliefs that kept us in China all our lives.”","zh":"2005年圣诞节，久在病榻的阳早去世。在寒春的坚持下，他的讣告中有这样一句话:他“为全人类的解放奋斗一生”。寒春还说:“我们在中国待了一辈子，是为信仰而来。”"},{"n":13,"en":"Erwin instructed in his will that his funeral should be the simplest of ceremonies. Joan demanded that Erwin’s pacemaker be removed from his body and given to someone who could not afford one. She also wanted her husband “buried on the dairy farm within sight of the cows.”","zh":"阳早在他的遗嘱中要求丧事从简。寒春要求摘下阳早的心脏起搏器，留给买不起起搏器的人。她还希望她的丈夫“葬在奶牛场能看得到牛的地方。”"},{"n":14,"en":"Hinton was the first foreigner to receive China’s permanent residence permit (green card) in 2004. When she passed away in Beijing in 2010 at the age of 89, some of her ashes were scattered across the grasslands of Inner Mongolia where she had worked.","zh":"2004年，寒春成为第一个获得中华人民共和国外国人永久居留身份证(“绿卡”)的外国人。2010年，她在北京去世，享年89岁，她的部分骨灰撒在她曾工作过的内蒙古草原上。"}],"audio_full":"r1full.mp3","vocab":[]},{"id":"r2","label_zh":"阅读 2","label_en":"Reading 2","title_en":"Telling China’s Story to the World","title_zh":"向世界讲述中国故事","author_en":"","author_zh":"","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"Michael Wood is no stranger to Chinese TV audience. A famous British historian and TV presenter, his China-themed works — The Story of China, The Story of China’s Reform and Opening-up, and Du Fu: China’s Greatest Poet — have all proved to be smash hits.","zh":"中国电视观众对迈克尔·伍德并不陌生。他是英国著名的历史学家和电视节目主持人，他以中国为主题的电视纪录片——《中国的故事》、《中国改革开放的故事》和《杜甫:中国最伟大的诗人》——都曾轰动一时。"},{"n":2,"en":"Wood discovered China at the age of 16. “I went into a bookshop in Manchestez, and there was a new Penguin Classic of Tang poetry,” he recalls, eyes twinkling at the memory. “As I turned the pages, it was like a kind of world that I never even dreamed existed. It was so fantastic.”","zh":"伍德在16岁的时候发现了中国。“我走进曼彻斯特的一家书店，里面有一本新到的企鹅经典唐诗选，”他回忆的时候双眸闪闪发亮。“我一页一页地翻看，一个我连做梦都没想到存在的世界在我眼前展开。它是如此神奇。”"},{"n":3,"en":"As soon as he could, he headed east. “I first filmed in China in the late ’80s. The reform and opening up was starting to pick up, and it was an incredibly exciting time to be there,” he says.","zh":"一有机会，他就往东方走。“80年代后期我第一次在中国拍摄的时候，改革开放的步伐刚开始加快，身临其境的体验极为激动人心，”他说。"},{"n":4,"en":"By 2016, Wood, who had already made several renowned TV documentary series worldwide, from the Amazon to the Zambezi, felt the timing was right to film The Story of China. “The rise of the new China is the greatest phenomenon of our time, and a historian might say that China is the big story of the last century of world history. To understand China today you need to start with its history; its history explains so much, including the Chinese people’s view of their own civilization.”","zh":"到2016年，伍德已经走遍全球，拍摄了从亚马孙河到赞比西河的多部知名电视系列纪录片。这时他觉得拍摄《中国的故事》的时机已经成熟。“新中国的崛起是我们这个时代最大的奇迹。一个历史学家可能会说，在上个世纪世界史上，中国发生的事该大书特书。要了解今天的中国，你需要从它的历史开始;它的历史解释了很多东西，包括中国人对自己文明的见解。”"},{"n":5,"en":"Besides, he cites Sinologist Simon Leys that“China is the other pole of the human mind.” For a Westerner, he added, it’s always a journey of discovery, noting that China is “the essential other, without the knowledge of which the West would not be able to perceive the outline and the limits of its own self.”","zh":"此外，他引用了汉学家李克曼的话说:“中国是人类思想的另一极。”他补充说，对于一个西方人，这始终是一个发现之旅。他指出，中国是“非常重要的他方，如果不了解她，西方将无法认知其自我的轮廓及局限。”"},{"n":6,"en":"He wants to dial down the differences and focus on the many similarities between the two cultures. “Unless you understand China as a Westerner, you won’t understand what are truly universal values in human society on Earth or what are just Western idiosyncrasies.”","zh":"他想淡化双方差异，而重点关注两种文化之间的众多相似之处。“作为一个西方人，如果你不了解中国，你就不会理解什么是地球上人类社会的真正普世价值，也不会理解哪些东西只是西方所特有而已。”"},{"n":7,"en":"“There’s a great word in English, which is being ‘fair’. You know, when English people say ‘that’s not fair’, that means something. And I think the Chinese have a great sense of fairness as well.”","zh":"“英语中有一个很好的词，那就是‘公平’。你知道，要是英国人说‘这不公平’，这就是件大事。而我认为中国人也有很强烈的公平感。”"},{"n":8,"en":"Wood says there’s another link that literally brings people together. “My experience of the Chinese people is how fantastically sociable and fun they are. The Chinese love dining together and drinking together, and so that side of it makes it very easy for an English person to feel at home in China.”","zh":"伍德说，还有另一种联系真正地让人们走到一起。“根据我和中国人打交道的经验，他们非常友善，跟他们在一起很开心。中国人喜欢一起吃饭、一起喝酒，所以这让一个英国人很容易产生宾至如归的感觉。”"},{"n":9,"en":"An important part of China’s huge written archive is poetry: “Chinese poetry is older than the Iliad or the Odyssey,” notes Wood, “and the continuous thread of poetry is so important to the Chinese people.” That was part of the inspiration for another hugely successful Sinocentric documentary first broadcast in 2020 — Du Fu: China’s Greatest Poet.","zh":"中国浩大的文字档案中的一个重要部分是诗歌。“中国的诗歌比《伊利亚特》或《奥德赛》还要古老，”伍德指出，“绵延不断的诗歌脉络对中国人来说非常重要。”这是2020年首次播出的另一部大获成功的中国主题纪录片——《杜甫:中国最伟大的诗人》——的灵感来源之一。"},{"n":10,"en":"Wood praises Du Fu highly. “People call him the greatest Chinese poet, but he’s more than that, really,” says Wood. “The Chinese talk about poet historians. Poets can say things that nobody else can say, and a Chinese person today can quote a line from Du Fu and everybody will know what they’re talking about — it’s ingrained in their psyches.”","zh":"伍德高度赞扬杜甫。“人们称他为最伟大的中国诗人，但说真的，他其实不只是一位诗人，”伍德说。“中国人把诗人称为历史学家。诗人可以表达别人无法言说的东西。今天如果一位中国人引用了杜甫的一行诗，其他人听到了都知道它指的是什么意思——这在他们的心灵中已根深蒂固。”"},{"n":11,"en":"It’s also ingrained in Wood’s — remember how the 16-year-old picked up a book of Tang poetry? Du Fu was a central figure in what’s known as High Tang poetry, meaning Wood was returning to a subject he has loved for half a century.","zh":"它也在伍德的心灵中根深蒂固——还记得16岁的他拿起一本唐诗时的感受吗?杜甫是盛唐诗歌的核心人物。这意味着伍德重温他热爱了半个世纪的主题。"},{"n":12,"en":"And that warmth is at the core of the Du Fu documentary, which was broadcast on the terrestrial CCTV network accessible by a billion viewers. “People loved it because it was about the heart, about feeling,” says Wood. “As a film-maker, you tell it as a life story — trying to conjure feelings out of the verse which will move people.”","zh":"而这种热情是杜甫纪录片的核心。该纪录片在中央电视台地面频道播出，10亿观众都可以看到。“人们喜爱它，因为它讲的是心灵、是情感，”伍德说。“作为一个电影制作人，你把它作为一个人生故事来讲述——努力用动人心弦的诗句唤起人内心的情感。”"},{"n":13,"en":"It worked. “Some pundit in Shanghai said it’s the best film about Chinese literature that’s ever been made — a bit of an exaggeration,” smiles Wood. Du Fu’s poems were read on-screen by Ian McKellen and again it worked perfectly: “So many Chinese people said ‘He looks just like Du Fu!’”","zh":"这个方法成功了。“上海的某位文化名人说这是有史以来关于中国文学的最好的影片——这有点夸张，”伍德笑道。伊恩·麦克莱恩在屏幕上吟诵了杜甫的诗句，同样反应极佳:“许多中国人说‘他看起来就像杜甫!’”"},{"n":14,"en":"Wood acknowledges TV is the best way to reach a mass market — both to entertain and to educate. “Television programs are very influential,” he says. “There are wonderful books written that have been read by a handful of people, but if you distill them into a TV program, you can reach millions. So those are important, worthwhile things to do.”","zh":"伍德承认电视是开拓大众市场的最佳途径——寓教于乐。“电视节目的影响力非常大，”他说。“有一些写得很好的书，只有少数人读过，但如果你把它们提炼成一个电视节目，你可以赢得数百万观众。所以这些都是重要的、值得做的事情。”"},{"n":15,"en":"As an academic himself, he appreciates the need to bring clarity without dumbing down, or talking down to the audience. A subject as huge as Chinese history could become overwhelming, and it’s the TV historian’s job to capture the essence through key elements.","zh":"身为学者，他认识到，电视纪录片必须清晰明了，但不能简单化，亦不可对观众居高临下。像中国历史这样庞大的主题可能让人望而生畏，而电视历史学家的工作就是通过关键元素来捕捉其精华。"},{"n":16,"en":"Empires and spheres of influence rise and fall. That can cause division, and Wood detects it in the current global mood. He worries that in a polarized world, the fear of otherness can lead to increased division.","zh":"帝国和势力范围起起落落。这可能导致分裂，而伍德在当前的全球心态中发现了这一苗头。他担心，在一个两极分化的世界里，对差异性的恐惧会导致分裂加剧。"},{"n":17,"en":"“Bridge-building between any cultures is important, always, because respect, understanding, even affection are things that motivate us as human beings. If you don’t have that, you can very easily lapse into demonization of the other side if things get difficult.”","zh":"“在任何文化之间架设桥梁都是重要的，而且始终如此，因为尊重、理解、甚至好感，都对我们人类起到激励作用。如果你没有这些，遇到麻烦时你就很容易妖魔化另一方。”"},{"n":18,"en":"The alternative, to Wood, is madness.","zh":"在伍德看来，如果不努力架设桥梁，那另一种选择就是疯狂。"},{"n":19,"en":"“The world hasn’t got the time — we cannot afford there to be any kind of conflict to this point, especially with the dire effects of climate change. We can all help each other, but removing conflict is the big thing. So that’s why building bridges is really vital. The longer we can stay, the more we can be friends.”","zh":"“我们的世界浪费不起时间——在目前的情况下，尤其是鉴于气候变化的极端影响，我们承受不起任何形式的冲突。我们都可以互相帮助，但消除冲突是一件大事。所以，建立桥梁真的至关重要。我们共处的时间越长，我们就越能成为朋友。”"}],"audio_full":"r2full.mp3","vocab":[]}],"vocab":[{"w":"by any measure","def":"no matter how a judgment is made","zh":"无论以哪种标准衡量","ex":["By any measure, Prof. Lu was one of the most respected Shakespeare scholars in the country."]},{"w":"nothing short of","def":"almost true, equal to","zh":"可以说是，无异于","ex":["The scope and depth of changes in China in the past decades are nothing short of remarkable."]},{"w":"among others","def":"(used when mentioning one or more examples)","zh":"其中包括","ex":["The museum has an extraordinary collection of paintings by, among others, Piccasso and Zhang Daqian."]},{"w":"spur","def":"vt. make an improvement or change happen faster","zh":"促进，刺激","ex":["The introduction of new technology has spurred economic growth and job creation."]},{"w":"superiority","def":"n. the quality of being better, more powerful, etc. than other people or things","zh":"优势; 优越","ex":["Can we not have dinner with the Johneses? They always put on an air of superiority.","This company’s superiority in electric vehicles is proven by the fact that every other company wants to beat it."]},{"w":"overdue","def":"a. that should have happened or been done some time/a long time ago(","zh":"早)该发生了的; (早已)逾期的","ex":["The Personal Data Protection Law is something long overdue, considering how much data is generated and transmitted without ordinary people’s knowledge."]},{"w":"far and wide","def":"over a large area","zh":"广泛地;到处","ex":["China sends out the message far and wide that we want peace and development.","We searched far and wide for a drug that is effective and reasonably priced."]},{"w":"not in the slightest","def":"not at all","zh":"毫不，一点也不","ex":["“Do you mind if I play the piano?” “Not in the slightest.”"]},{"w":"deserve","def":"vt. be worthy of","zh":"应得，应受到(奖励或惩罚)","ex":["I think Mary deserves an apology after all the yelling you did."]},{"w":"jointly","def":"ad. together, in partnership","zh":"共同地","ex":["Schools, families and communities must work jointly to protect the mental health of children."]},{"w":"exceptional","def":"a. unusually good","zh":"出类拔萃的","ex":["All parents want their kids to do well, but a truly exceptional talent can be a curse as well as a blessing."]},{"w":"go on to do sth.","def":"do sth. after completing sth. else","zh":"接着做另一件事","ex":["Many of the university’s graduates have gone on to become leaders in research, industry and government."]},{"w":"a matter of time","def":"certain to happen at some time in the future (","zh":"某事肯定发生)只是时间问题","ex":["It will be just a matter of time before the world switches to renewable energy."]},{"w":"all the way to/down/across sth.","def":"until the end/length/width of sth.","zh":"一直到; 纵贯","ex":["Tree roots stretch all the way down to find water and nutrients.Our sleeper trains will offer a new cross-border travel experience all the way across the continent."]},{"w":"ignite","def":"vt. spark, excite","zh":"点燃;激起","ex":["The 80’s pop song ignited memories of her days in the countryside.","It was the Nazi attack on Poland that ignited the Second World War."]},{"w":"intense","def":"a. very strong, very great","zh":"十分强烈的; 很大的","ex":["The emotion was so intense that she cried throughout the movie."]},{"w":"glitter","def":"vi. shine brightly with flashing lights","zh":"闪烁，闪光","ex":["She held out her hand to give others a better view of the glittering diamond ring."]},{"w":"fervent","def":"a. having or showing very strong and sincere feelings about sth.","zh":"热烈的;热情的","ex":["Prayer is nothing more than a fervent wish.","Randy was a fervent supporter of the learner-centered classroom."]},{"w":"proficiency","def":"n. a good standard of ability or skill","zh":"熟练，精通","ex":["It seems like every woman in Jane Austen’s novels has some sort of proficiency with the piano."]},{"w":"dispatch","def":"vt. send sb. or sth. somewhere for a particular purpose","zh":"派遣; 发送","ex":["The package was dispatched to the wrong address and returned.Sixty firefighters were dispatched to the scene but were unable to save the building."]},{"w":"by means of","def":"by using (sth.) or with the help of (sth.)","zh":"用，借助","ex":["I only wake up in time for work by means of an alarm clock."]},{"w":"obscure","def":"a. not well known","zh":"鲜为人知的","ex":["For some obscure reason, several of my files have gone missing in the latest update of the computer operating system."]},{"w":"basis","def":"n. the facts, ideas, and things from which sth. can be developed","zh":"基础; 根据","ex":["Agriculture was the basis of every civilization.On what basis did the police conclude that this was a suicide, not a murder?"]},{"w":"extensive","def":"a. large in size, degree or amount","zh":"大规模的; 广大的; 大量的","ex":["Because of the size of the bomb, the damage was extensive.","Extensive research has shown the positive effect of praise in child development."]},{"w":"keen","def":"a. wanting to do sth. or wanting sth. to happen very much","zh":"热衷于; 渴望","ex":["As a child I was keen on writing my own stories. I even won a literary award!He was keen to forget about the past and concentrate on the current relationship with Natalia."]},{"w":"correspond to/with","def":"be very similar to or the same as","zh":"相当于，类似于","ex":["In some countries, the role of president corresponds to that of prime minister in the UK."]},{"w":"embark on","def":"start","zh":"着手，开始","ex":["Five years ago today, I embarked on an adventure to Australia after getting my working holiday visa."]},{"w":"dispel","def":"vt. make sth. go away, esp. a belief, idea or feeling","zh":"驱散，消除(尤指信仰等)","ex":["Copernicus helped dispel the myth that humanity was at the centre of the universe."]},{"w":"by far","def":"(","zh":"常用于修饰比较级或最高级)by a great amount 最...; 显然","ex":["Public transportation is by far the easiest way to get around the city."]},{"w":"encounter","def":"n. an occasion when one meets or experiences sth.","zh":"遭遇，经历","ex":["I’ll never forget my first encounter with sharks at Cocos Island."]},{"w":"convince","def":"vt. make sb. feel certain that sth. is true","zh":"使确信，使信服","ex":["I’ve gained all the necessary information, and I am now convinced of the safety of this new building material."]},{"w":"slim","def":"a. thinner than usual","zh":"单薄的","ex":["The slim phone case fits my phone perfectly."]},{"w":"surround","def":"vt. be all around sb./sth.","zh":"围绕; 环绕","ex":["Istanbul is surrounded by water on three sides."]},{"w":"precede","def":"vt. happen or exist before (sth. or sb.)","zh":"先于... (发生或存在)","ex":["The official meeting between the two heads of state was preceded by a ceremony."]},{"w":"adopt","def":"vt. start to use","zh":"采用","ex":["In times of economic crises, it’s common for businesses to adopt the strategy of cost cutting."]},{"w":"civil","def":"a. relating to the ordinary people or things in a country that are not part of military, government, etc.; relating to citizens","zh":"民用的; 公民的","ex":["Some countries are keen on the civil use of nuclear power.","On August 23, 1965, a quarter of a million Americans marched to Washington D.C. demanding long overdue civil rights protection."]},{"w":"conclusion","def":"n. belief or opinion that is the result of reasoning","zh":"结论","ex":["After page 16 had been read, the child smiled and drew a conclusion, “The dragon is not lonely. He has friends.”"]},{"w":"compare sth./sb. to sth./sb. else","def":"show or state that sth./sb. is similar to sth./sb.","zh":"将...与...相提 并论","ex":["Suzhou is often compared to Venice because both cities have many canals and bridges."]},{"w":"scope","def":"n. range of matters being dealt with, studied, etc.","zh":"范围","ex":["After the earthquake, government officials started to survey the full scope of damage."]}],"exercises":[{"id":"opener","part":"opener","type":"qa","title_en":"Opener — Warming Up","title_zh":"单元导览 · 热身问答","instr_en":"Work in pairs and discuss the following questions.","instr_zh":"两人一组，讨论下列问题。","items":[{"q":"What does Richard Sears’ life story tell us about his role in digitizing ancient Chinese characters?","zh":"理查德·西尔斯的人生故事说明了他在汉字数字化方面起到了怎样的作用？","a":"Richard Sears, an American, devoted years of his life and a large sum of money to setting up a database of ancient Chinese characters, so that the characters — and the history they carry — could be preserved for future generations and shared with the world.","az":"美国人理查德·西尔斯投入了多年光阴和大量资金，建立起古汉字数据库，使汉字及其承载的历史得以保存并传给后代、与世界共享。"},{"q":"How did artist Wu Guanzhong bridge Eastern and Western art?","zh":"艺术家吴冠中是如何沟通东西方艺术的？","a":"Wu studied painting in Hangzhou and then in Paris. Back in China he experimented with ink and oil on paper to integrate elements from Western oil painting with those of Chinese ink painting. His Zhouzhuang reflects the interaction between the two: it uses traditional Chinese ink and brushwork, yet its composition reflects the Western emphasis on geometric forms and abstraction.","az":"吴冠中先在杭州、后赴巴黎学习绘画。回国后他在纸上尝试水墨与油彩，把西方油画与中国水墨的元素融为一体。他的《周庄》体现了二者的互动：既用中国传统笔墨技法，构图又体现西方对几何形状与抽象的重视。"}]},{"id":"org","part":"text","type":"qa","title_en":"Text Organization","title_zh":"课文结构分析","instr_en":"Pair work: The article centers on, in sequential order, Joseph Needham’s thoughts and deeds. Complete the table below and then compare your notes with your partner.","instr_zh":"结对练习：文章按时间顺序记述李约瑟的思想与经历。补全下表，然后与同伴对照。","items":[{"q":"Part One (Paras. 1–4)","zh":"第一部分（第1–4段）","a":"The story of China’s “four great inventions” is widely known today, but very few know the name of the storyteller.","az":"中国“四大发明”的故事如今广为人知，却很少有人知道讲述者的名字。"},{"q":"Part Two (Paras. 5–7)","zh":"第二部分（第5–7段）","a":"Joseph Needham’s interest in China was fired at the University of Cambridge.","az":"李约瑟对中国的兴趣是在剑桥大学被点燃的。"},{"q":"Part Three (Paras. 8–12)","zh":"第三部分（第8–12段）","a":"Joseph Needham’s journey across China inspired him to write about China’s advanced ancient civilization.","az":"李约瑟在中国的游历激发他去书写中国先进的古代文明。"},{"q":"Part Four (Paras. 13–16)","zh":"第四部分（第13–16段）","a":"Joseph Needham ended up writing seven volumes introducing the many “China firsts”.","az":"李约瑟最终写成了七卷本巨著，介绍众多“中国首创”。"},{"q":"Part Five (Para. 17)","zh":"第五部分（第17段）","a":"The world lost a great bridge builder between the East and the West when Joseph Needham died at the age of 94.","az":"李约瑟以94岁高龄辞世，世界失去了一位沟通东西方的伟大架桥人。"}]},{"id":"dig","type":"qa","title_en":"Digging into Detail","title_zh":"课文细读","instr_en":"Answer the following questions to better understand the text.","instr_zh":"回答下列问题，深入理解课文内容。","items":[{"q":"Which Herculean task was Joseph Needham focused on? (Para. 4)","zh":"李约瑟致力于完成哪一项艰巨的任务？（第4段）","a":"He was focused on giving China the long-overdue respect it deserves for its scientific contributions to humankind.","az":"他专注于给予中国应有的尊重——中国对人类科学贡献良多，这份尊重早已迟到了。"},{"q":"What was the promising career Joseph Needham had ahead of him at Cambridge? (Para. 5)","zh":"李约瑟在剑桥有着怎样前途光明的事业？（第5段）","a":"Becoming an accomplished biochemistry researcher.","az":"成为一名有成就的生物化学研究者。"},{"q":"What did Joseph Needham compare the study of Chinese characters to? (Para. 7)","zh":"李约瑟把学习汉字比作什么？（第7段）","a":"A liberation.","az":"一种解放。"},{"q":"On what grounds did the British government name Joseph Needham head of a scientific mission to China? (Para. 8)","zh":"英国政府依据什么任命李约瑟为赴华科学考察团团长？（第8段）","a":"His strong scientific background and language proficiency.","az":"他深厚的科学背景和出色的语言能力。"},{"q":"What insight did Joseph Needham have after seeing the date on the Diamond Sutra at the Mogao Caves? (Para. 10)","zh":"在莫高窟看到《金刚经》上的日期后，李约瑟得出了什么认识？（第10段）","a":"Printing was available in China at least 587 years before Europe.","az":"印刷术在中国出现的时间至少比欧洲早587年。"},{"q":"What was the long-held misperception in the West about China that Joseph Needham helped to dispel? (Para. 11)","zh":"李约瑟帮助澄清了西方长期以来对中国抱有的哪一误解？（第11段）","a":"China had neither science nor made any contribution to modern science.","az":"中国既没有科学，也没有对现代科学做出任何贡献。"}],"part":"text"},{"id":"diff","part":"text","type":"mc","title_en":"Understanding Difficult Sentences","title_zh":"难句理解","instr_en":"Choose the answer that correctly interprets the sentence from the text.","instr_zh":"选出对课文中句子释义正确的一项。","items":[{"q":"1. Long-overdue news of China’s “four great inventions” … has at last reached large numbers of people in the Western world. (Para. 2)","zh":"1. 中国“四大发明”这一迟到了太久的消息……终于传到了西方世界大批民众耳中。（第2段）","opts":[{"k":"A","en":"A large number of Westerners have finally heard about China’s “four great inventions”, something that should have reached their ears a long time ago.","zh":"大批西方人终于听说了中国的“四大发明”，这件事本该早就传到他们耳中。"},{"k":"B","en":"A large number of Westerners have waited a long time in order to hear the news about China’s “four great inventions”.","zh":"大批西方人为了听到中国“四大发明”的消息等了很久。"}],"a":"A"},{"q":"2. Surely, then, it would only be a matter of time before he followed Sir Frederick’s path all the way to the Nobel rostrum. (Para. 5)","zh":"2. 那么，他沿着弗雷德里克爵士的道路一路走向诺贝尔领奖台，想必只是时间问题。（第5段）","opts":[{"k":"A","en":"It was highly likely that he, like Sir Frederick, would eventually win a Nobel Prize.","zh":"他很可能会像弗雷德里克爵士一样最终获得诺贝尔奖。"},{"k":"B","en":"He followed the instruction of Sir Frederick and made his way to the Nobel rostrum in no time.","zh":"他遵照弗雷德里克爵士的指示，很快登上了诺贝尔领奖台。"}],"a":"A"},{"q":"3. For the next six years he traveled around the country…, collecting obscure, secondhand books on traditional science that became the basis of his extensive and unusual library. (Para. 8)","zh":"3. 此后六年他走遍全国……收集那些冷僻的二手传统科学书籍，它们成了他那庞大而独特藏书的基础。（第8段）","opts":[{"k":"A","en":"He traveled around China for the next six years in search of a large and exceptional library of traditional science hidden somewhere obscure.","zh":"他此后六年在中国各地奔走，寻找藏在某处的一座庞大而独特的传统科学藏书。"},{"k":"B","en":"He spent the next six years on the roads in China, building a large and exceptional library of its traditional science gradually.","zh":"他此后六年在中国的路途上奔走，逐步建成了关于中国传统科学的庞大而独特的藏书。"}],"a":"B"},{"q":"4. His experiences and rich encounters in China convinced him that the plan to write a “single slim volume” on the history of science in China needed to be re-thought… (Para. 12)","zh":"4. 在中国的经历和丰富的见闻使他确信，写一本“单薄的小册子”来讲述中国科学史的计划需要重新考虑……（第12段）","opts":[{"k":"A","en":"He realized, after his experiences and rich encounters in China, that “a single slim volume” would not be enough to contain all the history of science in China.","zh":"在中国的经历和丰富见闻之后，他意识到“一本单薄的小册子”远远装不下中国全部的科学史。"},{"k":"B","en":"Thanks to his experiences and rich encounters in China, he re-thought about his plan and decided to write a “single slim volume” on the history of science in China.","zh":"得益于在中国的经历和丰富见闻，他重新考虑了计划，决定写一本“单薄的小册子”讲述中国科学史。"}],"a":"A"},{"q":"5. Students of China consider Dr. Needham’s work a singular achievement… (Para. 16)","zh":"5. 研究中国的学者认为李约瑟博士的著作是一项非凡成就……（第16段）","opts":[{"k":"A","en":"Chinese students believe Dr. Needham’s work to be unique.","zh":"中国学生认为李约瑟博士的著作独一无二。"},{"k":"B","en":"China experts sing high praise of Dr. Needham’s extraordinary work.","zh":"研究中国的专家高度赞扬李约瑟博士非凡的著作。"}],"a":"B"}]},{"id":"kw11","part":"text","type":"fill","title_en":"Key Words & Expressions 1.1","title_zh":"重点词汇 1.1 · 选词填空","instr_en":"Fill in the blanks with words or phrases from the box below. Change the form where necessary.","instr_zh":"用下面方框中的词或短语填空，必要时改变形式。","bank":["adopt","basis","civil","dispel","exceptional","ignite","intense","overdue","proficiency","slim","spur","all the way to","among others","by any measure","correspond to/with","go on to","not in the slightest","nothing short of"],"items":[{"q":"It is not uncommon for a star athlete to ______ manage a sports team.","zh":"明星运动员转而管理一支运动队并不罕见。","a":"go on to","hint":"go on to do sth. 接着做；进而做"},{"q":"Creating new technologies to clean up the air could actually ______ economic growth rather than burden it.","zh":"创造清洁空气的新技术实际上可以刺激经济增长，而不是给它增加负担。","a":"spur","hint":"spur 促进；刺激"},{"q":"What approaches do/did/have you ______ to encourage your students to actively participate in class?","zh":"你采取了哪些方法来鼓励你的学生积极参与课堂？","a":"adopt","hint":"adopt 采用；采取"},{"q":"UNESCO’s “Educating for a Sustainable Future” program states that economic development forms the ______ of human development.","zh":"联合国教科文组织的“教育促进可持续未来”计划指出，经济发展是人类发展的基础。","a":"basis","hint":"basis 基础"},{"q":"The position of the arrow on the computer screen ______ your movement of the mouse.","zh":"电脑屏幕上箭头的位置与鼠标的移动相对应。","a":"corresponds with","hint":"correspond to/with 与……相对应"},{"q":"The unlawful killing of George Floyd has ______ anger and highlighted the continuing racism that affects black people in the US.","zh":"乔治·弗洛伊德被非法致死一事引发了愤怒，也凸显了影响美国黑人的持续种族主义。","a":"ignited","hint":"ignite 点燃；引发"},{"q":"The flat pack approach, or putting parts of furniture into ______ boxes for customers to assemble by themselves, not only lowers the cost of furniture, but also makes it easy to ship huge pieces.","zh":"平板包装法，即把家具零件装进细长的盒子里让顾客自行组装，不仅降低了家具成本，也使大件家具便于运输。","a":"slim","hint":"slim 细长的；薄薄的"},{"q":"Criminal Court judges can punish you for breaking the law by sending you to jail. ______ Court judges can order you to pay money or a fine, or make decisions about your family or your home.","zh":"刑事法庭的法官可以把违法者送进监狱以示惩罚。民事法庭的法官则可以判令其支付钱款或罚款，或就家庭、住房作出裁决。","a":"Civil","hint":"civil 民事的"},{"q":"The President’s medical team published his latest physical examination results to ______ doubts about his health.","zh":"总统的医疗团队公布了他最新的体检结果，以消除人们对他健康状况的怀疑。","a":"dispel","hint":"dispel 消除；驱散"},{"q":"My long suffering husband Mikey has a(n) ______ dislike of his photo being taken.","zh":"我那长期受折磨的丈夫米基极其不喜欢别人给他拍照。","a":"intense","hint":"intense 强烈的"},{"q":"Once children have achieved a certain ______ as a reader, they prefer to read silently.","zh":"孩子一旦达到一定的阅读能力，就更喜欢默读。","a":"proficiency","hint":"proficiency 熟练；水平"},{"q":"The land use contract contains rules, ______, regarding the treatment of waste.","zh":"土地使用合同包含有关废物处理等规则。","a":"among others","hint":"among others 其中；除其他外"},{"q":"We were not surprised ______ when Tu Youyou won the Nobel Prize.","zh":"屠呦呦获得诺贝尔奖时，我们一点也不惊讶。","a":"in the slightest","hint":"not in the slightest 一点也不"},{"q":"We had to listen to him snore ______ New York from Rome and didn’t sleep at all.","zh":"我们不得不听着他从罗马一路打鼾到纽约，根本没睡着。","a":"all the way to","hint":"all the way to 一路到"},{"q":"When your car is ______ for maintenance, there are some pretty obvious signs.","zh":"当你的车保养逾期时，会有一些相当明显的迹象。","a":"overdue","hint":"overdue 逾期的；迟到的"}]},{"id":"kw12","part":"text","type":"fill","title_en":"Key Words & Expressions 1.2","title_zh":"重点词汇 1.2 · 替换划线部分","instr_en":"Replace the underlined part in each of the following sentences with a word or phrase from the box below. Write your answer in the brackets. Change the form where necessary.","instr_zh":"用方框中的词或短语替换下列句子中画线的部分，把答案写在括号内，必要时改变形式。","bank":["convince","deserve","intense","jointly","keen","obscure","overdue","superiority","by any measure","by far","compare sth./sb. to sth./sb. else","embark on","far and wide"],"items":[{"q":"Liz is the right leader to take on the role as CEO of our company. She is outstanding [[any way you look at her]].","zh":"利兹是担任我们公司首席执行官的合适人选。不管怎么看，她都很出色。","a":"by any measure"},{"q":"In 1978, the government of China [[launched]] a major program of economic reform that will go down in history.","zh":"1978年，中国政府启动了一项将载入史册的重大经济改革计划。","a":"embarked on"},{"q":"Shakespeare believed the world was [[like]] a stage, on which all men and women were merely players.","zh":"莎士比亚认为世界就像一个舞台，世间男男女女都不过是演员。","a":"compared the world to a stage"},{"q":"Several companies are [[involved in]] developing a new flying taxi to overcome congestion in big cities.","zh":"几家公司正在联合开发一种新型飞行出租车，以克服大城市的拥堵。","a":"jointly"},{"q":"Good news never goes beyond the gate while bad news travels [[in all directions]].","zh":"好事不出门，坏事传千里。","a":"far and wide"},{"q":"I think Paul should get first prize — he has certainly [[earned]] it.","zh":"我认为保罗应该得一等奖——他确实当之无愧。","a":"deserves"},{"q":"The Silver Arrow is one of those [[little known]] bands that you might have heard about, but never actually hear.","zh":"“银箭”是那种你可能听说过、却从未真正听过的鲜为人知的乐队之一。","a":"obscure"},{"q":"We are [[eager]] to listen and communicate continuously with the public to improve and develop e-government services.","zh":"我们渴望持续倾听并与公众沟通，以改进和发展电子政务服务。","a":"keen"}]},{"id":"kw13","part":"text","type":"fill","title_en":"Key Words & Expressions 1.3","title_zh":"重点词汇 1.3 · 仿例完成句子","instr_en":"Complete each of the following sentences after the model with the word or phrase in brackets. Make changes or additions where necessary.","instr_zh":"仿照例句，用括号中的词或短语完成下列句子，必要时作改动或补充。","items":[{"q":"Model: He was fully focused on one, albeit Herculean task: To give China the long-overdue respect it ______ for its scientific contributions to humankind. (deserve)","zh":"范例：他全身心投入一项艰巨的任务：给予中国因其对人类科学的贡献而早该得到的尊重。（deserve）","a":"deserves"},{"q":"If you continue to drive like this, it’s only ______ before you get into a serious accident. (a matter of time)","zh":"如果你继续这样开车，出严重事故只是时间问题。","a":"a matter of time"},{"q":"After much research I came to the ______ that biochemistry suits my interest the best. (conclusion)","zh":"经过大量研究，我得出结论：生物化学最合我的兴趣。","a":"conclusion"},{"q":"A recent survey in Europe shows that personal contact is ______ the quickest way to a new job. (by far)","zh":"欧洲最近的一项调查显示，人际接触是找到新工作最快的途径。","a":"by far"},{"q":"The great challenges we face today, such as climate change and developing clean energy, are international in ______. (scope)","zh":"我们今天面临的巨大挑战，如气候变化和开发清洁能源，都具有国际范围。","a":"scope"},{"q":"Eyes ______ with anger, John shouted at the robbers who ______ their tent, “Let go of my child!” (glitter, surround)","zh":"约翰眼里闪着怒火，朝围住他们帐篷的劫匪大喊：“放开我的孩子！”","a":"glittering; surrounded"},{"q":"The smoke that filled the plane quickly ______ passengers to leave their luggage behind and get off as soon as possible. (convince)","zh":"机舱里弥漫的烟雾很快使乘客们确信应该丢下行李尽快下机。","a":"convinced"},{"q":"Your sister has already forgiven you. Your letter of apology to her is long ______. (overdue)","zh":"你姐姐已经原谅你了。你给她的道歉信早就该写了。","a":"overdue"},{"q":"Advertisements are designed to show the ______ of one product over similar products. (superiority)","zh":"广告旨在展示某一产品相对于同类产品的优越性。","a":"superiority"}]},{"id":"usage","part":"text","type":"mc","title_en":"Usage — The Use of the Word “Enough”","title_zh":"语法运用 · enough 的用法","instr_en":"Choose the correct answer from the given choices that completes the sentence appropriately.","instr_zh":"从所给选项中选出能恰当完成句子的答案。","items":[{"q":"1. I dreamt of becoming a professional singer, but my voice was ______.","zh":"1. 我梦想成为一名专业歌手，但我的嗓音不够好。","opts":[{"k":"a","en":"not good enough","zh":"不够好"},{"k":"b","en":"not enough good","zh":"（语序错误）"},{"k":"c","en":"good not enough","zh":"（语序错误）"}],"a":"A"},{"q":"2. We expect our employees to ______ for face-to-face communication with clients around the world.","zh":"2. 我们期望员工能把英语说得足够好，以便与世界各地的客户面对面沟通。","opts":[{"k":"a","en":"speak enough English","zh":"（语序错误）"},{"k":"b","en":"speak English enough well","zh":"（语序错误）"},{"k":"c","en":"speak English well enough","zh":"英语说得足够好"}],"a":"C"},{"q":"3. The Canadian professor ______ to pick up lots of Chinese idioms.","zh":"3. 这位加拿大教授在中国待的时间够长，学会了许多汉语习语。","opts":[{"k":"a","en":"has been in China enough long","zh":"（语序错误）"},{"k":"b","en":"has been enough in China","zh":"（语序错误）"},{"k":"c","en":"has been in China long enough","zh":"在中国待的时间够长"}],"a":"C"},{"q":"4. “Before the dinner, Prof. Smith, would you like to say a few words?” “I think ______. Let’s enjoy the evening.”","zh":"4. “晚宴开始前，史密斯教授，您想讲几句话吗？”“我想我说得够多了。咱们好好享受这个夜晚吧。”","opts":[{"k":"a","en":"I have said enough","zh":"我说得够多了"},{"k":"b","en":"I have enough said","zh":"（语序错误）"},{"k":"c","en":"I have had enough","zh":"我受够了"}],"a":"A"},{"q":"5. People always complain that there is too much to read but ______.","zh":"5. 人们总是抱怨要读的东西太多，却没有足够的时间去读。","opts":[{"k":"a","en":"not enough to read","zh":"（语义不完整）"},{"k":"b","en":"not enough time to read","zh":"没有足够的时间去读"},{"k":"c","en":"not time enough to read","zh":"（表达不常用）"}],"a":"B"},{"q":"6. “Does he stand a chance to win at the piano competition?” “I’m afraid not. He ______.”","zh":"6. “他有机会在钢琴比赛中获胜吗？”“恐怕没有。他练得不够。”","opts":[{"k":"a","en":"hasn’t enough practiced","zh":"（语序错误）"},{"k":"b","en":"hasn’t practiced enough","zh":"练得不够"},{"k":"c","en":"hasn’t practiced enough hard","zh":"（语义重复）"}],"a":"B"},{"q":"7. You hardly ______ to do your job, but you daren’t tell them to get out of the way.","zh":"7. 你几乎没有足够的空间干活，却又不敢叫他们让开。","opts":[{"k":"a","en":"had enough","zh":"（用法不符）"},{"k":"b","en":"had a room enough","zh":"（表达错误）"},{"k":"c","en":"had room enough","zh":"有足够的空间"}],"a":"C"},{"q":"8. I haven’t got time to finish it, but ______ to get the main idea.","zh":"8. 我没时间把它看完，但已经读了足够的部分来了解大意。","opts":[{"k":"a","en":"I’ve read enough the article","zh":"（表达错误）"},{"k":"b","en":"I’ve read enough of the article","zh":"这篇文章我读了足够的部分"},{"k":"c","en":"I’ve read the article enough","zh":"（语义不符）"}],"a":"B"}]},{"id":"sp31","part":"text","type":"rewrite","title_en":"Sentence Patterns 3.1 — nothing short of","title_zh":"句型 3.1 · nothing short of（简直；无异于）","instr_en":"Study the example from the text and then pair up the following eight half sentences.","instr_zh":"研读课文中的例句，然后把下面八个半句两两配对，组成完整的句子。","items":[{"q":"Model: By any measure, the rapidity of China’s progress in science and technology in the last two decades has been nothing short of astounding. (Para. 1)","zh":"范例：无论以何种标准衡量，中国过去二十年在科技上的发展速度都堪称惊人。（第1段）","a":"nothing short of = almost, equal to（几乎；等于）"},{"q":"Jim’s behavior at the party tonight …","zh":"吉姆今晚在聚会上的行为……","a":"Jim’s behavior at the party tonight was nothing short of rude.","az":"吉姆今晚在聚会上的行为简直是无礼。"},{"q":"The view from the hilltop on a clear day …","zh":"晴朗日子里从山顶看到的景色……","a":"The view from the hilltop on a clear day is nothing short of wonderful.","az":"晴朗日子里从山顶看到的景色简直美极了。"},{"q":"Science and Civilisation in China …","zh":"《中国科学技术史》……","a":"Science and Civilisation in China is nothing short of a masterpiece.","az":"《中国科学技术史》简直是一部杰作。"},{"q":"It’s nothing short of a dream …","zh":"这简直是一个梦想……","a":"It’s nothing short of a dream to have played for the national basketball team.","az":"能入选国家篮球队简直如同做梦一般。"}]},{"id":"sp32","part":"text","type":"rewrite","title_en":"Sentence Patterns 3.2 — as is the case with","title_zh":"句型 3.2 · as is the case with（与……情况一样）","instr_en":"Study the example from the text and then rewrite the following sentences using the structure “as is the case with”.","instr_zh":"研读课文中的例句，然后用“as is the case with”结构改写下列句子。","items":[{"q":"Model: The story has travelled far and wide. But, as is so often the case with stories, very few people know the name of the storyteller. (Para. 3)","zh":"范例：这个故事流传甚广。但就像故事常有的情形一样，很少有人知道讲故事者的名字。（第3段）","a":"as is the case with = as is also true about"},{"q":"Experiences from most successful sports teams show that some playfulness is part of team building.","zh":"大多数成功运动队的经验表明，一些嬉闹是团队建设的一部分。","a":"As is the case with most successful sports teams, some playfulness is part of team building.","az":"正如大多数成功运动队的情况一样，一些嬉闹是团队建设的一部分。"},{"q":"Organizations are like living beings. Both must constantly adapt to the changing times.","zh":"组织就像生命体，二者都必须不断适应变化的时代。","a":"Organizations must constantly adapt to the changing times, as is the case with living beings.","az":"组织必须不断适应变化的时代，正如生命体的情况一样。"},{"q":"Like most children, I grew up watching cartoons.","zh":"像大多数孩子一样，我是看动画片长大的。","a":"As is the case with most children, I grew up watching cartoons.","az":"正如大多数孩子的情况一样，我是看动画片长大的。"},{"q":"In addition to coffee, Arab traders were also important in the spread of sugar in Europe.","zh":"除咖啡外，阿拉伯商人在糖传入欧洲的过程中也很重要。","a":"As was the case with coffee, Arab traders were important in the spread of sugar in Europe.","az":"正如咖啡的情况一样，阿拉伯商人在糖传入欧洲的过程中发挥了重要作用。"}]},{"id":"cloze","part":"text","type":"cloze","title_en":"Comprehensive Practice 4.1 — Cloze","title_zh":"综合练习 4.1 · 完形填空","instr_en":"Complete the passage with the appropriate words or expressions in the box. Change the form when necessary.","instr_zh":"用方框中恰当的词或短语完成短文，必要时改变形式（方框中有多余选项）。","bank":["basis","conclusion","convince","dispel","encounter","exceptional","glitter","ignite","jointly","obscure","spur","superiority","surround","by far","by means of","embark on","nothing short of"],"passage":"One of the most famous of early travellers to bridge the gap between Europe and China, Marco Polo set out from his native Venice in 1271, {{1}} with his father and uncle. The long and dangerous overland journey to China they {{2}} was to take four years, but eventually in 1275 they reached Kublai Khan’s {{3}} court. The emperor greeted them all warmly but was {{4}} the most impressed with Marco. Marco’s {{5}} in China were to form the {{6}} of the book of his travels, a book full of admiration of China’s {{7}} in comparison with Europe. Many were impressed with what they learned from him; it was reading his book that was to {{8}} Christopher Columbus to set sail, convinced that he would reach China, only to find himself in America instead. Some contemporaries of Marco were so startled to read how far more advanced China was than the Europe of their day that they came to the {{9}} that his work was {{10}} fiction. On his deathbed they begged him to {{11}} the lies he had made up. But he simply replied that, far from inventing the wonders he had witnessed, “I have not told half of what I saw, for I knew I would not be believed.”","answers":["jointly","embarked on","glittering","by far","encounters","basis","superiority","spur","conclusion","nothing short of","dispel"]},{"id":"trans","part":"text","type":"translate","dir":"zh2en","title_en":"Comprehensive Practice 4.2 — Translation","title_zh":"综合练习 4.2 · 段落汉译英","instr_en":"Translate the following paragraph into English, using the words and phrases in the box below.","instr_zh":"用下面方框中的词或短语把下列段落译成英语。","bank":["dispatch","encounter","exceptional","extensive","fervent","precede","all the way to/down/across sth.","by means of","among others"],"items":[{"q":"潘威廉（William N. Brown）感谢中国让他见证了中国梦的实现。当他作为一名年轻的美国士兵被派往中国时，他对中国一无所知，但很快他就成为中国报纸的狂热读者，惊叹于中国如何全心全意地通过农业、医药等方面的尖端研究来满足人民的需求。1988年，他开始在厦门教书，亲身体验中国的不凡变革。1989年1月，他通过骑自行车、乘坐农用拖拉机和步行深入农村，调查改革对农民的影响。农民虽不富裕，但对未来持乐观态度。1994年，他和他的家人开车穿越中国。他们发现“要想富，先修路”的口号简单却有效。2019年，他再次驾车环游中国，途中跟人交流时发现，即使是最偏远地区的居民，都生活得有滋有味，有了新家，水泥路直达家门口，还借助世界上覆盖范围最广的互联网络从事着电子商务。","a":"William N. Brown thanks China for allowing him to bear witness to the fulfillment of the Chinese Dream. When he was dispatched to China as a young American soldier, he knew nothing about China, but soon he became a fervent reader of the Chinese press, marveling at how China dedicated itself wholeheartedly to meeting people’s needs through cutting-edge research in various fields, including agriculture and medicine, among others. In 1988, he started teaching in Xiamen, where he could experience China’s exceptional changes in person. In January, 1989, he traveled deep into the countryside on bicycles, farm tractors and on foot to see the impact of reforms on farmers. They were, though not well-off, optimistic about the future. In 1994, he and his family drove all the way across China. They found the slogan “Roads precede riches” simple but effective. In 2019, he drove around China again. The encounters with people during his journey showed that they, even those in the most remote areas, were prospering, with new homes, and concrete roads right to their doorsteps. And they were engaged in e-commerce by means of the world’s most extensive internet system."}]},{"id":"r1tf","type":"tf","title_en":"Comprehension Check — Reading 1","title_zh":"阅读1 课文理解","instr_en":"Decide whether the following statements are true (T) or false (F), based on the article.","instr_zh":"根据文章内容判断下列说法正误（T／F）。","items":[{"q":"Joan Hinton planned to come to China since very young.","zh":"寒春从小就打算到中国来。","a":"F"},{"q":"Joan Hinton quitted her job as a nuclear physicist because she did not want to help kill people.","zh":"寒春辞去核物理学家的工作，是因为她不想助人杀人。","a":"T"},{"q":"Erwin Engst got his first impressions of China from his brother-in-law William Hinton.","zh":"欧文·恩格斯特对中国的第一印象来自他的内兄威廉·欣顿。","a":"F"},{"q":"Erwin urged Joan to come to China to witness the big changes that were going to take place.","zh":"欧文力劝寒春到中国来，亲眼看看即将发生的巨大变化。","a":"T"},{"q":"Joan and Erwin worked hard for the improvement of agricultural machinery and the dairy industry in China.","zh":"寒春和欧文为改进中国的农业机械和乳品业而努力工作。","a":"T"},{"q":"There is a Yang Zao and Han Chun Memorial Hall in Yan'an.","zh":"延安建有阳早、寒春纪念馆。","a":"F"},{"q":"Joan Hinton played the violin at a Chinese New Year's party in Yan'an.","zh":"寒春在延安的一次春节联欢会上拉过小提琴。","a":"F"},{"q":"Joan Hinton toured the U.S. to speak about her experiences in China.","zh":"寒春曾在美国巡回演讲，讲述她在中国的经历。","a":"T"},{"q":"Joan gave away Erwin's pacemaker to someone who couldn't afford one.","zh":"寒春把欧文的起搏器送给了一位买不起起搏器的人。","a":"T"},{"q":"Joan and Erwin were the first couple to receive China's permanent residence permits.","zh":"寒春和欧文是首对获得中国永久居留证的外国夫妇。","a":"F"}],"part":"r1"},{"id":"r1tr","type":"translate","title_en":"Translation — Reading 1","title_zh":"阅读1 英译中","instr_en":"Translate the following underlined sentences from the article into Chinese.","instr_zh":"把下列句子译成中文，注意画线部分的表达。","items":[{"q":"Hinton, who harbored high hopes of making milk available to the overall Chinese population, decided to apply herself to the improvement of agricultural machinery and the dairy industry at large.","a":"寒春志向远大，她想让全体中国人民都喝上牛奶，于是决定致力于改良农业机械、推动整个乳品行业的发展。"},{"q":"Many people who knew Joan say that she applied to the dairy industry all the skill and enthusiasm that had won her a place on the Manhattan Project.","a":"许多认识寒春的人说，她把当年为自己在曼哈顿计划中赢得一席之地的所有技能和热情，都用到了乳品行业。"},{"q":"During her time in Yan'an, she barely stood out as a foreigner, dressed in cotton or wool gender-neutral clothing and wearing a set of keys around her waist.","a":"在延安期间，几乎看不出她是个外国人：她穿着男女都穿的棉衣或羊毛衣，腰上挂着一串钥匙。"},{"q":"His obituary, at Joan's insistence, included the sentence that he had \"ceaselessly struggled for the liberation of all mankind.\" She added that \"it was our beliefs that kept us in China all our lives.\"","a":"在寒春的坚持下，他的讣告中写入了这样一句话：他“为全人类的解放奋斗不息”。她还说：“是信仰让我们在中国待了一辈子。”"}],"part":"r1"},{"id":"r2qa","part":"r2","type":"qa","title_en":"Comprehension Check — Reading 2","title_zh":"阅读2 课文理解","instr_en":"Answer the following questions based on Reading 2.","instr_zh":"根据阅读2的内容回答下列问题。","items":[{"q":"How did Michael Wood’s fascination with China begin?","zh":"迈克尔·伍德对中国的兴趣是如何开始的？","a":"He found a Penguin Classic of Tang poetry at a bookstore in Manchester at the age of 16 and was fascinated.","az":"16岁那年，他在曼彻斯特的一家书店里发现了一本企鹅版唐诗，从此着了迷。"},{"q":"What do the Chinese and the British have in common according to Wood?","zh":"在伍德看来，中国人和英国人有什么共同之处？","a":"Both peoples have a great sense of fairness. And they are both sociable.","az":"两个民族都有强烈的公平意识，也都善于交际。"},{"q":"Why is Du Fu described as a “poet historian”?","zh":"为什么说杜甫是“诗人史家”？","a":"Du Fu is a poet historian. His poems have been ingrained in the Chinese psyches.","az":"杜甫是一位诗人史家，他的诗已经深深融入中国人的心灵。"},{"q":"Why does Wood stress mutual respect and understanding between cultures?","zh":"伍德为什么强调不同文化之间的相互尊重与理解？","a":"If there is no mutual respect and understanding between cultures, demonization of the other side is highly likely when things get difficult. Besides, the world has to work together to find solutions to pressing issues like climate change.","az":"如果文化之间缺乏相互尊重与理解，一旦形势艰难，就极可能把对方妖魔化。此外，全世界必须携手应对气候变化等紧迫问题。"}]},{"id":"r2cloze","part":"r2","type":"cloze","title_en":"Reading 2 — Word Bank Cloze","title_zh":"阅读2 · 选词填空","instr_en":"Read the following passage carefully. Select one word for each blank from a list of choices given in the word bank. You may not use any of the words in the bank more than once.","instr_zh":"仔细阅读下面短文，从词库中为每个空格选一个词，每个词只能使用一次。","bank":["clarity","detecting","distilled","documentaries","dumbing","embarked","empires","ignited","incredibly","influential","literally","phenomenon","renowned","universal","warmth"],"passage":"Michael Wood, a(n) {{1}} British historian and TV presenter, has captivated the Chinese TV audience with his insightful works on China’s history and culture. His {{2}} have proved to be smash hits in China. Wood’s fascination with China began at the age of 16, {{3}} by a book of Tang poetry he discovered in Manchester. This initial encounter motivated him to explore China, marking the beginning of a journey he describes as “{{4}} exciting.” Driven by a deep desire to gain insight into China, Wood {{5}} on filming in China in the late 1980s, during the period of reform and opening up. Recognizing China’s rise as the greatest {{6}} of the modern world, Wood was convinced that it was the time to unveil to the world China’s current state and its wealth of civilization. Wood is keenly aware of the {{7}} role television plays in reaching wide audiences, as it combines entertainment with education to tell China’s story. He tries to maintain {{8}} in presenting complex subjects such as Chinese policies, economy and culture, without {{9}} down the content. He believes that understanding China helps to understand what are the truly {{10}} values in human society.","answers":["renowned","documentaries","ignited","incredibly","embarked","phenomenon","influential","clarity","dumbing","universal"]},{"id":"r2tr","part":"r2","type":"translate","dir":"zh2en","title_en":"Reading 2 — Translation","title_zh":"阅读2 · 段落汉译英","instr_en":"Translate the following paragraphs into English.","instr_zh":"把下列段落译成英语。","items":[{"q":"随着全球化进程的不断推进，中国正以前所未有的方式与速度走向世界舞台。通过讲述真实、生动的中国故事，我们不仅仅是在传递中国的声音，更是在分享经验与智慧。","a":"As the process of globalization continues to advance, China is stepping onto the world stage in unprecedented ways and at unprecedented speeds. By telling real and vivid stories about China, we are not only conveying the voice of China, but also sharing experience and wisdom."},{"q":"推动中国文化走出去，我们能够展现中国的历史底蕴、发展成就和人文关怀，增进国际社会对中国的理解和认同。同时，这也是一个促进文化交流和互鉴的过程，有助于推动构建人类命运共同体。我们要以开放包容的心态，让世界感受中国文化的独特魅力。","a":"By promoting Chinese culture to go global, we can display China’s historical heritage, development achievements, and humanistic care, thereby enhancing the international community’s understanding and recognition of China. At the same time, this is also a process of promoting cultural exchange and mutual learning, which helps to promote the building of a community with a shared future for humanity. With an open and inclusive mindset, we aim to let the world feel the unique charm of Chinese culture."}]},{"id":"viewing","part":"skills","type":"fill","title_en":"Viewing & Listening — Alex Hua Tian: A Bridge Builder","title_zh":"视听说 · 华天：沟通中西的骑手","instr_en":"Alex Hua Tian (华天) is a Chinese Olympic rider born of a British mother and a Chinese father. View a short clip of him telling his life story and how he links horsemanship to cross-cultural understanding for two or three times. When you finish, fill in the following blanks according to what you have heard.","instr_zh":"华天是一位中国奥运马术骑手，父亲是中国人、母亲是英国人。观看他讲述自己人生经历、以及如何将马术与跨文化理解联系起来的短片两到三遍，然后根据所听内容填空。","items":[{"q":"My father grew up as an only son with four sisters, and met my British mother at the Canton Fair. My mum did Chinese at university here in the UK. And their relationship ______ as China ______.","zh":"我父亲是独生子，有四个姐妹，在广交会上认识了我英国籍的母亲。我母亲在英国的大学里学中文。随着中国______，他们的关系也______起来。","a":"developed; opened up","az":"developed（发展）；opened up（开放）"},{"q":"I think I could definitely say any ambition I have has probably come from ______.","zh":"我想我可以肯定地说，我所有的抱负大概都源自______。","a":"my Chinese roots","az":"我的中国根"},{"q":"My mum came from a very traditionally British horsing family. ______, I spent most afternoons with my mum at the stables, ______ when I was four years old.","zh":"我母亲来自一个非常传统的英国马术世家。______，我大部分的下午都和母亲在马厩度过，四岁就______。","a":"Growing up in Beijing; started to ride","az":"Growing up in Beijing（在北京长大）；started to ride（开始骑马）"},{"q":"It’s very difficult to understand how important the Beijing Olympics were, to China, but also to Chinese people. I think timing-wise it was, it was ______ in terms of national confidence.","zh":"很难理解北京奥运会对中国、也对中国人有多重要。我认为从时机上看，就民族自信而言，那真是______。","a":"perfect timing","az":"perfect timing（绝佳时机）"},{"q":"I’ve never ______ going to other championships and other Olympics where the whole population felt like they were invested in the Games themselves.","zh":"去参加其他锦标赛和其他奥运会时，我从未______——那种全体国民都觉得自己投身其中的感觉。","a":"felt that sense","az":"felt that sense（有过那种感受）"},{"q":"I’ve never felt that sense going to other championships and other Olympics where the whole population felt like they were ______.","zh":"……全体国民都觉得自己______了奥运会本身。","a":"invested in the Games themselves","az":"invested in the Games themselves（投身到奥运会之中）"},{"q":"Respect, responsibility and compassion, it’s quite clear that those values are
