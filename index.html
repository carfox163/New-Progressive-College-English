 not just the values you need to ______ with a horse.","zh":"尊重、责任与同理心——很显然，这些价值不仅仅是你与马______所需要的。","a":"develop a relationship","az":"develop a relationship（建立关系）"},{"q":"They’re also the values ______.","zh":"它们也是______的价值。","a":"behind humanity","az":"behind humanity（人性背后）"},{"q":"And I think if ______ can learn to deal with difficult issues and different cultures and people with different backgrounds in the same manner ...","zh":"而我认为，如果______能学会以同样的方式处理棘手问题、不同文化以及不同背景的人……","a":"we as a society","az":"we as a society（我们作为一个社会）"},{"q":"And I think if we as a society can learn to deal with difficult issues and different cultures and people with different backgrounds ______, with the respect, responsibility and compassion that you need for horsemanship ...","zh":"……不同背景的人______，带着马术所需要的那种尊重、责任与同理心……","a":"in the same manner","az":"in the same manner（以同样的方式）"},{"q":"I think relationships between different cultures, different peoples, different nations will be ______ to where it is nowadays.","zh":"我认为不同文化、不同民族、不同国家之间的关系，将会处在与当今______。","a":"in a very different place","az":"in a very different place（截然不同的境地）"}]}]},{"id":"b3u5","book":"Book 3","unit":"Unit 5","title_en":"Digital Age","title_zh":"数字时代","text_title_en":"Unit 5 Digital Age","text_title_zh":"数字时代","goals":["Upon completion of this unit, teachers are expected to have enabled students to:","have a thorough understanding of the text contextually and linguistically;","build up an active vocabulary to talk about digital technology and know how to use the key words and expressions in context properly;","analyze the pros and cons of the different applications of digital technology mentioned in this unit, including self-driving cars, machine learning, predictive analytics, and MOOCs;","write a well-developed process description of how to use a smart phone app.","Part 2 Suggested Teaching Plan","I. Teaching process chart","This unit is designed for six to eight periods of classroom activities. In each of the periods, certain tasks are to be completed. There may be several different ways to explore this unit. Here is a suggested teaching plan."],"passages":[{"id":"text","label_zh":"课文","label_en":"Text","title_en":"AlphaGo: Using Machine Learning to Master the Ancient Game of Go","title_zh":"阿尔法围棋:借助机器学习，精通古老的围棋","author_en":"Demis Hassabis","author_zh":"德米斯·哈萨比斯","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"The game of Go originated in China more than 2,500 years ago. Confucius wrote about the game, and it is considered one of the four essential arts required of any true Chinese scholar. Played by more than 40 million people worldwide, the rules of the game are simple: Players take turns to place black or white stones on a board, trying to capture the opponent’s stones or surround empty space to make points of territory. The game is played primarily through intuition and feel, and because of its beauty, subtlety and intellectual depth it has captured the human imagination for centuries.","zh":"围棋发源于中国，至今已有2500多年的历史。孔子曾经对围棋有过论述，它被视为任何中国学者必须掌握的四艺之一。全球有4000多万人下围棋。其规则很简单:棋手们轮流在棋盘上落下黑子或白子，试图吃掉对手的棋子，或者在棋盘上围地得分。下棋主要靠直觉和感觉。因为这个游戏的美、精妙和深邃的智慧，数个世纪以来，它一直令人神往。"},{"n":2,"en":"But as simple as the rules are, Go is a game of profound complexity. There are 10170 possible positions — that’s more than the number of atoms in the universe, and more than a googol times larger than chess.","zh":"不过，围棋的规则虽然简单，下起来却极其复杂。围棋有10170个可能的布局——比宇宙中的原子的数量还要多，比国际象棋的布局要多上10100倍。"},{"n":3,"en":"This complexity is what makes Go hard for computers to play, and therefore an irresistible challenge to artificial intelligence (AI) researchers, who use games as a testing ground to invent smart, flexible algorithms that can tackle problems, sometimes in ways similar to humans. The first game mastered by a computer was noughts and crosses (also known as tic-tac-toe) in 1952. Then fell checkers in 1994. In 1997 Deep Blue famously beat Garry Kasparov at chess. It’s not limited to board games either — the Watson computer system bested two champions at Jeopardy in 2011, and in 2014 our own algorithms learned to play dozens of computer games just from the raw pixel inputs. But to date, Go has thwarted AI researchers; computers still only play Go as well as amateurs. In other words, machines have topped the best humans at most games held up as measures of human intellect. But with Go, human grandmasters have maintained an edge over even the most agile computing systems.","zh":"因为这种复杂性，所以电脑下围棋很难，人工智能研究者们也因此把教会电脑下围棋看成诱人的挑战。他们以各类游戏为试验场，发明出智能的、灵活的算法，然后让这些算法解决问题。其方法有时候与人类的方法相似。1952年，电脑学会了第一个游戏，名叫井字过三关(也叫一字棋)。1994年，电脑又征服了西洋跳棋。1997年，“深蓝”击败了(国际象棋大师)加里·卡斯帕罗夫，名声大噪。电脑学会玩的游戏还不止棋盘游戏——2011年，“沃森”电脑系统完胜两位“危险边缘”电视智力问答节目的冠军。2014年，我们自己研发的算法仅仅通过输入原始像素就学会了玩几十种电脑游戏。然而，迄今为止，围棋一直让人工智能研究人员败北;电脑下围棋依然停留在业余水平。换句话说，机器在大多数被认为是人类智力衡量标准的游戏中已经打败了最好的人类玩家，但在围棋上，人类围棋大师即便是对最敏捷的计算机系统也一直保持着优势。"},{"n":4,"en":"Traditional AI methods — which construct a search tree over all possible positions — don’t have a chance in Go. So when we set out to crack Go, we took a different approach. We built a system, AlphaGo, that combines an advanced tree search with deep neural networks. These neural networks take a description of the Go board as an input and process it through 12 different network layers containing millions of neuron-like connections. One neural network, the “policy network,” selects the next move to play. The other neural network, the “value network,” predicts the winner of the game.","zh":"传统的人工智能方法——在所有可能的布局之上构建一个搜索树——在围棋上击败人的机会渺茫。于是，当我们着手突破围棋时，我们采用了一种不同的做法。我们建立的阿尔法围棋系统将高级树型检索同深度神经网络技术结合在一起。这些神经网络对棋盘的进展进行描绘并作为信息输入，再通过12个不同的网络层进行处理，这些网络层包含数以百万计的类神经元连接。其中一个名为“决策网络”的神经网络选择下一步落子。另一个名为“价值网络”的神经网络预测棋局的赢家。"},{"n":5,"en":"We trained the neural networks on 30 million moves from games played by human experts, until it could predict the human move 57 percent of the time (the previous record before AlphaGo was 44 percent). But our goal is to get the better of top human players, not just mimic them. To do this, AlphaGo learned to discover new strategies for itself, by playing thousands of games between its neural networks, and adjusting the connections using a trial-and-error process known as reinforcement learning. Of course, all of this requires a huge amount of computing power, so we made extensive use of the cloud platform.","zh":"我们拿围棋高手下过的3000万手棋来训练神经网络，直到它预测人类高手下一步落子的准确率达到57% (阿尔法围棋诞生前的最高记录是44%)。然而，我们的目标是打败最好的人类高手，而不只是模仿他们。为此，阿尔法围棋学会了自行寻找新策略。它在自己的神经网络间下了成千上万局围棋，通过被称为“增强式学习”的试错流程调整各层之间的连接。当然，所有这一切都需要巨大的计算能力，所以我们广泛利用了云平台。"},{"n":6,"en":"After all that training it was time to put AlphaGo to the test. First, we held a tournament between AlphaGo and the other top programs at the forefront of computer Go. AlphaGo won all but one of its 500 games against these programs. So the next step was to invite the reigning three-time European Go champion Fan Hui — an elite professional player who has devoted his life to Go since the age of 12 — to our London office for a challenge match. In a closed-door match last October, AlphaGo won by 5 games to 0. It was the first time a computer program had ever beaten a professional Go player.","zh":"千锤百炼后，该让阿尔法围棋接受考验了。首先，我们举办了一场邀请赛，让阿尔法围棋和计算机围棋博弈界的顶尖程序对抗。总共500局比赛中，阿尔法围棋只败了一场。于是，下一步我们邀请了连续获得最近三次欧洲围棋锦标赛冠军的樊麾——从12岁起就专攻围棋的精英职业棋手——到我们的伦敦办公室来一场挑战赛。在去年10月的一场闭门比赛中，阿尔法围棋取得了5比0的战绩。这是有史以来电脑程序第一次战胜了职业围棋选手。"},{"n":7,"en":"What’s next? In March, AlphaGo will face its ultimate challenge: a five-game challenge match in Seoul against the legendary Lee Sedol — the top Go player in the world over the past decade.","zh":"下一步做什么?今年3月，阿尔法围棋将面临终极挑战:赴首尔同传奇人物李世石——过去10年里世界上最好的围棋选手——进行5局决胜负的挑战赛。"},{"n":8,"en":"We are thrilled to have mastered Go and thus achieved one of the grand challenges of AI. However, the most significant aspect of all this for us is that AlphaGo isn’t just an “expert” system built with hand-crafted rules; instead it uses general machine learning techniques to figure out for itself how to win at Go. While games are the perfect platform for developing and testing AI algorithms quickly and efficiently, ultimately we want to apply these techniques to important real-world problems. Because the methods we’ve used are general-purpose, our hope is that one day they could be extended to help us address some of society’s toughest and most pressing problems, from climate modeling to complex disease analysis. We believe these techniques can accelerate scientific research. Scientists working alongside AI systems that can home in on areas of research are very likely to be fruitful. The same techniques could even suggest a way forward that might point the human expert to a breakthrough. We’re excited to see what we can use this technology to tackle next!","zh":"让电脑精通围棋，胜利通过人工智能界的最大挑战之一，让我们激动不已。不过，对我们来说，这一切之中最重要的一点是，阿尔法围棋不仅仅是一套用手工打造的规则建立的“专家”系统;它还能利用通常的机器学习技巧，独立寻找下围棋制胜的方法。游戏诚然是快速、高效开发和测试人工智能算法的最佳平台，但最终我们希望把这些技术应用到解决现实世界的重大问题上。因为我们使用的方法是多用途的，所以我们希望有一天它们能得到拓展，帮助我们解决社会上最艰巨、最迫切的问题，从气候建模到复杂的疾病分析。我们相信这些技术能够加速科学研究。科学家们与能够瞄准某些研究领域的人工智能系统一起合作很可能会有丰硕的成果。这些技术甚至能提出前进的方向，指点人类专家获得突破。这一技术接下来能攻克什么，我们高兴地拭目以待!"}],"audio_full":"textfull.mp3","vocab":[{"w":"originate","def":"vi. come into existence","zh":"发源","ex":["Sushi places in New York City aren’t necessarily run by Japanese people, and the staff originate anywhere from China, South Korea, the Dominican Republic, etc.","originate in come from 起源于e.g. Golf is a sport that originated in Scotland."]},{"w":"essential","def":"a. absolutely necessary","zh":"必要的","ex":["To have career success, it’s essential to establish good communication with your boss."]},{"w":"worldwide","def":"ad. throughout the world","zh":"在世界各地","ex":["The high volume of sales makes the low pricing policy profitable worldwide."]},{"w":"take turns","def":"do sth. in turns","zh":"轮流，依次","ex":["Through play, children learn to negotiate conflicts, solve problems, take turns and share."]},{"w":"opponent","def":"n.","zh":"对手","ex":["Try to keep your eyes open or you won’t know what your opponent is going to do next.","...surround empty space to make points of territory. (Para. 1): ...earn points by claiming the empty space surrounded by one’s stones as one’s own territory."]},{"w":"territory","def":"n.","zh":"地盘，领土","ex":["Dogs pee to mark territory.","The goal of the expedition is to map unexplored territory."]},{"w":"intuition","def":"n. knowing sth. without conscious reasoning or studying","zh":"直觉","ex":["I followed her closely. Intuition told me that she’d take me somewhere private so we could really talk."]},{"w":"intellectual","def":"a. of or relating to the intellect","zh":"智力的","ex":["The essence of mathematics lie in its beauty and intellectual challenge."]},{"w":"imagination","def":"n.","zh":"想象; 想象力","ex":["It might just be my imagination, but I can almost hear the entire room sigh in relief when he walks out."]},{"w":"profound","def":"a. very great or intense","zh":"巨大的，深刻的","ex":["The benefits of digital technology for disabled people are profound."]},{"w":"artificial","def":"a. manmade","zh":"人工的","ex":["Artificial light can trick animals into sleeping at the wrong time."]},{"w":"intelligence","def":"n.","zh":"智能","ex":["Will machine intelligence, a product of human design, be smarter than its creator?"]},{"w":"invent","def":"vt. create or design (sth. that has not existed before)","zh":"发明","ex":["Sally Fox didn’t invent colored cotton. It has always existed in nature. The Incas used it 2,500","years ago."]},{"w":"flexible","def":"a. capable of change","zh":"灵活的","ex":["Flexible work hours are popular with parents of young children."]},{"w":"tackle","def":"vt. deal with (a difficult situation)","zh":"应对(难题)","ex":["The new mayor vowed to tackle crime head-on."]},{"w":"best","def":"vt. beat","zh":"打败","ex":["The Evil Empire, otherwise known as the New York Yankees, bested my beloved Baltimore Orioles — the team I’ve rooted for since the early 1960s."]},{"w":"champion","def":"n.","zh":"冠军","ex":["Lakers fans panicked when the 16-time NBA champions lost a few games in a row."]},{"w":"raw","def":"a. not processed or analyzed","zh":"原始的","ex":["Since steel is the company’s number one raw material, steel price movements are a continuing concern."]},{"w":"input","def":"n. signal going into an electronic system","zh":"输入","ex":["If you’re only interested in reading — without taking notes, tweeting, or any other text input — a tablet may well be all you need."]},{"w":"to date","def":"until now","zh":"迄今为止","ex":["To date, evolution is the only well-supported explanation for life’s diversity.","...machines have topped the best humans at most games held up as measures of human intellect. (Para. 3): ...machines have beaten the best humans at most games that are highly regarded as challenges to the human intellect."]},{"w":"top","def":"vt. be better than","zh":"好于，超越","ex":["I do believe this episode of the Game of Thrones topped all others."]},{"w":"intellect","def":"n.","zh":"智力","ex":["When we started going out, it was your intellect that really won my heart."]},{"w":"construct","def":"vt. build; make","zh":"构建","ex":["A three-year-old child can construct almost all possible sentence types."]},{"w":"crack","def":"vt. discover the solution to, especially after a lot of effort","zh":"破解","ex":["The detectives are looking for evidence to crack the murder case."]},{"w":"process","def":"vt. perform mathematical or logical operations on (data) in order to obtain the required information","zh":"处理","ex":["A supercomputer processes data at lightening speeds, measured in floating-point operations per second (FLOPS). Data is processed as it is received."]},{"w":"layer","def":"n.","zh":"层","ex":["I dress hastily, but there is a limit to how fast you can put on two or three layers of clothes.","The top layer of the rug is badly worn but the bottom layer is still OK."]},{"w":"connection","def":"n.","zh":"连接","ex":["Is there a connection between IQ and career success?"]},{"w":"select","def":"vt. choose","zh":"挑选","ex":["Mary selected a red dress for the interview."]},{"w":"get the better of","def":"beat","zh":"打败，战胜","ex":["“I’m sure he will get in touch with you as soon as he can,” said Melissa, trying not to let her anger get the better of her. She knew she shouldn’t open the package, but her curiosity finally got the better of her and she opened it."]},{"w":"strategy","def":"n.","zh":"战略，策略","ex":["The local government has been eager to develop an environmentally-friendly economic strategy."]},{"w":"adjust","def":"vt. change so as to improve accuracy or get closer to standard","zh":"调整","ex":["It is said that salaries will be adjusted for inflation."]},{"w":"tournament","def":"n.","zh":"邀请赛，锦标赛","ex":["To return 12 years later and win the tournament will always mean something special to me."]},{"w":"forefront","def":"n. the leading position","zh":"最前沿","ex":["A reasonable parent would put his/her child’s welfare in the forefront of any decision."]},{"w":"reign","def":"vi. rule a nation as king","zh":"当国王;统治","ex":["In the U.K. the sovereign reigns but does not rule."]},{"w":"analysis","def":"n.","zh":"分析","ex":["An analysis of his blood sample proved that he had been poisoned."]},{"w":"accelerate","def":"vt. speed up","zh":"加快","ex":["The severe flood is likely to accelerate the decline in agriculture in the coming years."]},{"w":"home in on","def":"be directed or move towards (sth.)","zh":"对准...方向;向...移动","ex":["Sometimes they homed in on the right conclusion immediately, but some other times they missed the point entirely."]},{"w":"fruitful","def":"a. having plenty of results","zh":"富有成效的","ex":["2023 has been another year of fruitful cooperation between our two countries."]},{"w":"breakthrough","def":"n.","zh":"突破","ex":["Based on the breakthrough, researchers are working on new medicines that will specifically target these types of cancer."]}]},{"id":"r1","label_zh":"阅读 1","label_en":"Reading 1","title_en":"Keepsakes No More: The Coming Extinction of Concert Tickets","title_zh":"留念不再:音乐会纸质门票即将消亡","author_en":"Alan Cross","author_zh":"艾伦·克罗斯","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"A couple of years back, a buddy and I made a trip to New York to see a baseball game. When we popped up out of the subway near the stadium, I asked him for my ticket. That’s when it got complicated.","zh":"几年前，我和一个朋友去纽约看棒球比赛。当我们从体育场附近的地铁站走出来时，我向他索要我的门票。事情就此变得复杂起来。"},{"n":2,"en":"I learned that baseball teams no longer believed in paper tickets. I had to download a mobile ticketing app and then engage in a weird dance of ask-permission-grant-access with my friend’s phone which held two digital tickets. It was a clunky process, but I eventually got my ticket to display correctly on my phone and I was able to show the barcode to the guy at the gate. (1) Frankly, it was a bit of an ordeal, but if the baseball teams were doing it, then it was obvious that I’d seen the future.","zh":"我了解到，各大棒球队不再信奉纸质门票。我不得不下载一个手机购票软件，然后，因为两张门票都存在我朋友的手机上，我只好反复地用他的手机请求许可、获得访问权限，弄得我一头雾水。过程非常烦琐，但最终我的门票在我的手机上正确显示了，我能向检票员出示条形码了。坦率地说，这个过程有点折磨人，但如果棒球队都这样做，那么显然这是大势所趋。"},{"n":3,"en":"“Cool,” I thought. But I was also annoyed because it meant that I wouldn’t have a souvenir ticket stub from my baseball experience.","zh":"“酷，”我心想。但我也很恼火，因为这意味着我以后拿不到纪念观看棒球比赛的票根了。"},{"n":4,"en":"Ever since my first concert I’d kept the stub from every show I’d ever attended. I began by carefully taping them to the wall in my bedroom, eventually creating a timeline of my live music experience.","zh":"从第一次去听音乐会开始，我每看一场演出就保留一张票根。最初，我小心翼翼地把它们贴在我卧室的墙上，最终搞出一个按时间顺序排列的我听现场音乐会的集锦。"},{"n":5,"en":"People would marvel at my wall. “Have you really been to all these shows?” they’d ask. To which I’d reply, “Yep. I’m a concert-goin’ freak.”","zh":"别人看到我的墙会感到惊奇。“你真的看过所有这些演出吗?”他们会问。对此我会回答:“是的，我是个音乐会迷。”"},{"n":6,"en":"Each stub was a story in itself. In those days in Winnipeg, tickets were bought at box offices or from a cool record store. (2) All purchases required trips through time and space — no online selling back then! — and were almost always bought with cash. They needed to be stored somewhere safe until the day of the show. In the weeks leading up to the show, I would take them out of the envelope and gaze at them in anticipation of the gig. And each ticket told a story.","zh":"每张票根本身就是一个故事。当年我住在温尼伯，买票要去售票处或者一个很酷的唱片店。每一次购票都需要专门花时间亲自前往——那时没有网上售票!而且几乎都是用现金购买。演出之前，需要把它们存放在安全的地方。在演出前的几个星期里，我可能会把它们从信封里拿出来，凝视它们，期待着演出的到来。每张票都有一个故事。"},{"n":7,"en":"There was the time I was so awed by seeing a pop star that I waited outside the stage door to meet him after the show. I have an extra un-torn ticket from a show on April 30, 1979 that was supposed to go to a girl, but she turned me down. Imagine how I felt next to that empty seat when I saw her on the floor with another guy. (3) I was with a group of friends who lined up on the sidewalk overnight in the spring of 1981 to get show tickets only to lose our place in line when the crowd stampeded toward the doors at 9 am.","zh":"有一次，我在听演唱会时一位流行歌星的表演让我极为倾倒，为了见他一面，演出结束后我就去剧院后台入口处等着。我有一张多出来的1979年4月30日某演出的门票，没撕过，完好无缺。我本来想把它送给一个女孩，但她拒绝了我。演出当天，我看到她和另外一个男人也在场，请想象一下我坐在那个空座位旁边是何等的滋味。1981年春天，我和一群朋友在人行道上连夜排队买演出票，结果上午9点一到，众人蜂拥向门口，队形全散了，我们白白排了一晚上的队。"},{"n":8,"en":"When I left home, I carefully peeled each stub off the wall, gingerly removed the tape, and put everything in a shoebox, vowing to keep collecting such things, and promised myself that one day I’d give them all a proper display, maybe in a giant picture frame like I’d seen some do.","zh":"搬离父母家时，我小心翼翼地把票根一张张地从墙上剥下来，仔细地把胶带撕干净，然后把所有票根都放进一个鞋盒里，发誓要继续收集这样的东西，并且暗自许诺，总有一天我会把它们都好好地展示出来，也许像我看到过的一些人那样，把它们镶进一个巨大的相框里。"},{"n":9,"en":"The box grew heavy as years went by. (4) It was a physical record of my musical journey. In an era before the internet, this was how you kept track of your concert-going life and maturing (or not) as a music fan.","zh":"时光流逝，这个盒子越来越重。它是我音乐旅程的实物记录。在那个互联网尚未诞生的时代，你就用这种方式记录你听音乐会的生涯和一个音乐迷的成熟(也可能不成熟)的过程。"},{"n":10,"en":"But then somewhere around the turn of the century, I started to get careless, probably because (and I don’t mean to brag here) I was increasingly put on a guest list rather than given a hard ticket. When I did need to flash some paper, it was more often than not a barcode that I printed out from an email. Not very collectible, you know?","zh":"然而，从世纪之交的某个时候开始，我变得漫不经心起来，可能是因为(我无意在此吹嘘)作为嘉宾我受邀出席演出的次数越来越多，从而无需纸质门票了。如果实在有必要出示某种纸质凭证，那也往往会是我从电子邮件上打印出的条形码。没有多大收藏价值，你懂的吧?"},{"n":11,"en":"As the world became more digital, hard tickets started disappearing. And not long after that, after, we end up with me and my buddy outside of the stadium trying to figure out how to work the ticketing app.","zh":"随着世界变得更加数字化，纸质门票开始消失。而在那之后没多久，我和我的朋友就只好站在体育场外面研究如何操作购票应用程序了。"},{"n":12,"en":"Storing tickets on smartphones is becoming more and more popular as ticketing apps, venues, and promoters try to sell tickets that are more secure and digitally tied to the actual purchaser. Festivals now rely on RFID bracelets that you activate online and then tap to get in. And until the public started freaking about potential privacy breaches, a number of companies were working on facial recognition technology. (“No more piece of paper! No more bracelets! Your face will be your ticket!”)","zh":"在智能手机上存储门票正变得越来越流行，因为票务应用程序、场馆和演出筹办人试图销售更安全、与实际购买者数字绑定的门票。各大音乐节现在向观众发放电子标签手环。你可以在网上激活，然后刷手环入场。而当公众开始担心潜在的隐私泄露之时，一些公司已在研究人脸识别技术了。(“不再有纸张!不再用手环!你的脸将是你的门票!”)"},{"n":13,"en":"Perhaps you know of someone with one of these shoeboxes. The last time I looked at my collection, many of the tickets had faded to the point where they couldn’t be read. I really should have kept better care of them like a few friends who did the picture frame thing. One has his ticket stubs pressed between two panes of glass that form a lovely coffee table.","zh":"也许你认识拥有这样一个鞋盒的人。我最近一次看自己的收藏的时候，发现许多门票已经褪色到字迹模糊的地步。我真的应该早点向几位做了相框的朋友学习，对它们多加呵护。有一位朋友把票根压在两块玻璃之间，正好做个可爱的咖啡桌面。"},{"n":14,"en":"Collecting concert ticket stubs will soon be extinct. Instead, our memories will be preserved as selfies taken at our seats or video recordings of the gig that we never watch. Yes, there are T-shirts, programs, and an endless supply of other merchandises, but they all cost money. A ticket stub came with its own memories built into the cost.","zh":"收集音乐会票根的做法很快就会绝迹。取而代之的是，我们的记忆将通过观众席自拍照或我们从来不看的演出录像来保存。是的，T恤衫、节目单和无穷无尽的其他周边产品也可作为留念，但它们都要花钱。而一张票根的成本里已经包含了其本身独特的记忆。"},{"n":15,"en":"I’ve put that shoebox someplace very dry and safe. I’ll get those stubs in a frame. One day.","zh":"我已经把那个鞋盒放在一个非常干燥安全的地方。我会把这些存根镶进相框的。总有一天我会这么做。"}],"audio_full":"r1full.mp3","vocab":[]},{"id":"r2","label_zh":"阅读 2","label_en":"Reading 2","title_en":"Digital Transformation Fuels Energy Industry","title_zh":"数字化转型助推能源行业发展","author_en":"Sun Shangwu, Tian Xuefei and Ma Si","author_zh":"","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"Li Bin, a 57-year-old oil worker, knows only too well how bitingly cold it can be in Daqing, Heilongjiang province, in winter, when temperatures often plummet to -30 C.","zh":"57岁的石油工人李兵非常清楚黑龙江省大庆市冬季的寒冷程度，那里的气温经常暴跌至零下30摄氏度。"},{"n":2,"en":"Describing a winter patrol of a 3-square-kilometer operational area at a local oilfield, he said: “Fourteen colleagues and I had to inspect oil wells scattered across the patrol area every morning and afternoon. Each time, it took us four hours and we walked more than 10 kilometers a day.”","zh":"他在描述对当地一个油田的3平方公里作业区作冬季巡查时说:“我和14名同事每天上午和下午都要检查散布在巡逻区的油井。我们每次都要花四个小时，每天要走10多公里路。”"},{"n":3,"en":"But now their routine has been transformed. “Drones now patrol the operational area four times a day, and only six people are needed for additional inspection every three days. The technology has greatly reduced our workload and the risk of injury,” Li said, adding that ditches and swamps within the patrol area pose a danger to manual patrols.","zh":"但现在他们的日常工作已经发生了变化。李兵说:“现在无人机每天在作业区巡航四次，每三天只需要六个人进行额外的检查。这项技术大大减少了我们的工作量和受伤的风险。”他补充说，巡逻区域内的沟渠和沼泽对人工巡查构成危险。"},{"n":4,"en":"Li is just one of the growing number of front-line employees at the Daqing Oilfield Company who benefit from the wider use of digital technologies in their daily work.","zh":"大庆油田公司越来越多的一线员工在日常工作中受益于数字技术的广泛使用，李兵只是其中之一。"},{"n":5,"en":"Having produced some 2.4 billion metric tons of crude oil since 1959 and witnessed the nation’s rapid industrialization in past decades, Daqing Oilfield has emerged as a pioneer in digital transformation, offering a glimpse of how China’s sprawling energy industry is eager to continue innovating in a fast-changing environment, not just to meet present needs, but for future development.","zh":"自1959年以来，大庆油田已经生产了约24亿吨原油，并见证了国家过去几十年的快速工业化进程。大庆油田已成为数字化转型的先锋，让人们看到中国庞大的能源行业如何渴望在快速变化的环境中继续创新，其目的不仅是为了满足当下的需求，也是为了未来的发展。"},{"n":6,"en":"As oil exploration becomes more complex, there is an urgent need to strengthen on-site management and boost productivity.","zh":"石油勘探日渐复杂，迫切需要加强现场管理，提高生产力。"},{"n":7,"en":"The company has built a “smart brain” — a command center where technicians control 120,000 oil and gas wells, 100,000 km of oil and gas pipelines, and 30,000 km of electricity lines. This is in sharp contrast with a single phone in a mud building back in 1959. Approximately 500,000 internet-connected devices collect data around the clock at the oilfield, feeding over 10 billion sets of real- time data to the command center every second.","zh":"该公司已经建立了一个“智慧大脑”——大庆油田指挥中心。技术人员在那里控制着12万口油气井、10万公里的油气管道和3万公里的电力线路。这与1959年时一栋泥土建筑中仅有一部电话形成了鲜明的对比。约有50万台连接互联网的设备在油田一天24小时从不间断地收集数据，每秒钟向指挥中心提供超过100亿组实时数据。"},{"n":8,"en":"The company’s effort to get “smarter” is part of broader push by China to advance innovation in traditional industries. The 14th Five-Year Plan (2021-25) for the energy sector calls for the wider use of 5G, artificial intelligence, cloud computing, blockchain, the internet of things, and big data by energy companies. It also highlights the need to upgrade equipment and facilities in oil and gas fields, pipeline networks and warehouses to enable flexible reception of data and efficient production.","zh":"该公司努力变得“更智慧”，这是中国推动传统行业创新的更广泛努力的一部分。“十四五”规划(2021–2025)有关能源发展部分要求能源企业更广泛地使用5G、人工智能、云计算、区块链、物联网和大数据。“十四五”规划还强调，油气田、管网和仓库的设备和设施需要升级，以便灵活接收数据、实现高效生产。"},{"n":9,"en":"Daqing Oilfield is further tapping data-driven technologies for smart production.","zh":"大庆油田正在进一步利用数据驱动技术以实现智慧生产。"},{"n":10,"en":"At a production management center, operators issued an instruction for the immediate flushing of an oil well 10 km away, after detecting abnormal data. In the past, they could only rely on experience to decide when to flush wells. But now, with real- time parameters, they know which well needs to be flushed — and when. This has greatly improved work efficiency.","zh":"在一个生产管理中心，操作员检测到异常数据后下达指令，要求立即对10公里外的一口油井进行洗井。在过去，他们只能依靠经验来决定何时洗井。但现在，通过实时参数，他们知道该洗哪口井——以及什么时候洗。这大大提高了工作效率。"},{"n":11,"en":"An internet of things tracks the real-time data of every well in the eighth operational area, which occupies 9.04 square kilometers and houses a total of more than 1,170 oil and water wells. The system immediately sends alerts when problems such as electrical equipment failures occur, greatly reducing human supervision.","zh":"一个物联网追踪着第八作业区每口井的实时数据。该作业区占地9.04平方公里，总共有1170多口油水井。当电气设备故障等问题发生时，该系统立即发出警报，大大减少了人工监管。"},{"n":12,"en":"Well construction and intervention typically account for 40 percent — and often as much as 70 percent — of an oil or gas company’s capital spending. Furthermore, drilling and well activities are highly complex. They take place in an environment with significant health and safety risks. Digital technologies are bringing significant opportunities to improve all aspects of the operating model for wells, from streamlining core processes to strengthening front-line capabilities. They are improving the overall organizational model as well.","zh":"油水井建设和干预通常占石油或天然气公司资本支出的40%——往往高达70%。此外，钻井和油水井作业非常复杂。这些作业都在一个健康和安全风险很大的环境中进行。数字技术为改善油井运营模式的各个方面带来了重大机遇，从简化核心流程到加强一线能力，不一而足。数字技术也正在改善整个组织模式。"},{"n":13,"en":"Eager to reap the benefits, Daqing Oilfield is expanding its internet of things, which has already connected more than 38,500 oil and water wells. In three to four years, the system is expected to cover all the company’s 120,000 wells, with more than a million data- collecting devices in use.","zh":"大庆油田正在扩大其物联网，以便获得更多好处。目前，该系统已经连接了38,500多口油水井。再过三到四年，预计它将覆盖该公司的所有12万口油井，届时将有超过一百万个数据收集设备同时运转。"},{"n":14,"en":"The widespread use of digital technologies to boost production efficiency also yields human resources benefits for Daqing Oilfield. For one thing, despite the large number of workers approaching retirement, recruitment is not called for. For another, employees’ expectations for a better workplace are met. Freed from tedious tasks in harsh conditions, they now have more time to improve professional skills.","zh":"广泛使用数字技术来提高生产效率也为大庆石油带来了人力资源方面的好处。首先，尽管有大量工人即将退休，但公司并不需要招募新的人员。另一方面，员工对更好的工作场所的期望得到了满足。从恶劣条件下的繁琐工作中解脱出来后，他们现在有更多时间来提高专业技能。"},{"n":15,"en":"“Although I am 57, I still want to learn new things, just as the company does.” Li said.","zh":"“虽然我已经57岁了，但我仍然想学习新的东西，就像公司一样。”李兵说。"}],"audio_full":"r2full.mp3","vocab":[]}],"vocab":[{"w":"originate","def":"vi. come into existence","zh":"发源","ex":["Sushi places in New York City aren’t necessarily run by Japanese people, and the staff originate anywhere from China, South Korea, the Dominican Republic, etc.","originate in come from 起源于e.g. Golf is a sport that originated in Scotland."]},{"w":"essential","def":"a. absolutely necessary","zh":"必要的","ex":["To have career success, it’s essential to establish good communication with your boss."]},{"w":"worldwide","def":"ad. throughout the world","zh":"在世界各地","ex":["The high volume of sales makes the low pricing policy profitable worldwide."]},{"w":"take turns","def":"do sth. in turns","zh":"轮流，依次","ex":["Through play, children learn to negotiate conflicts, solve problems, take turns and share."]},{"w":"opponent","def":"n.","zh":"对手","ex":["Try to keep your eyes open or you won’t know what your opponent is going to do next.","...surround empty space to make points of territory. (Para. 1): ...earn points by claiming the empty space surrounded by one’s stones as one’s own territory."]},{"w":"territory","def":"n.","zh":"地盘，领土","ex":["Dogs pee to mark territory.","The goal of the expedition is to map unexplored territory."]},{"w":"intuition","def":"n. knowing sth. without conscious reasoning or studying","zh":"直觉","ex":["I followed her closely. Intuition told me that she’d take me somewhere private so we could really talk."]},{"w":"intellectual","def":"a. of or relating to the intellect","zh":"智力的","ex":["The essence of mathematics lie in its beauty and intellectual challenge."]},{"w":"imagination","def":"n.","zh":"想象; 想象力","ex":["It might just be my imagination, but I can almost hear the entire room sigh in relief when he walks out."]},{"w":"profound","def":"a. very great or intense","zh":"巨大的，深刻的","ex":["The benefits of digital technology for disabled people are profound."]},{"w":"artificial","def":"a. manmade","zh":"人工的","ex":["Artificial light can trick animals into sleeping at the wrong time."]},{"w":"intelligence","def":"n.","zh":"智能","ex":["Will machine intelligence, a product of human design, be smarter than its creator?"]},{"w":"invent","def":"vt. create or design (sth. that has not existed before)","zh":"发明","ex":["Sally Fox didn’t invent colored cotton. It has always existed in nature. The Incas used it 2,500","years ago."]},{"w":"flexible","def":"a. capable of change","zh":"灵活的","ex":["Flexible work hours are popular with parents of young children."]},{"w":"tackle","def":"vt. deal with (a difficult situation)","zh":"应对(难题)","ex":["The new mayor vowed to tackle crime head-on."]},{"w":"best","def":"vt. beat","zh":"打败","ex":["The Evil Empire, otherwise known as the New York Yankees, bested my beloved Baltimore Orioles — the team I’ve rooted for since the early 1960s."]},{"w":"champion","def":"n.","zh":"冠军","ex":["Lakers fans panicked when the 16-time NBA champions lost a few games in a row."]},{"w":"raw","def":"a. not processed or analyzed","zh":"原始的","ex":["Since steel is the company’s number one raw material, steel price movements are a continuing concern."]},{"w":"input","def":"n. signal going into an electronic system","zh":"输入","ex":["If you’re only interested in reading — without taking notes, tweeting, or any other text input — a tablet may well be all you need."]},{"w":"to date","def":"until now","zh":"迄今为止","ex":["To date, evolution is the only well-supported explanation for life’s diversity.","...machines have topped the best humans at most games held up as measures of human intellect. (Para. 3): ...machines have beaten the best humans at most games that are highly regarded as challenges to the human intellect."]},{"w":"top","def":"vt. be better than","zh":"好于，超越","ex":["I do believe this episode of the Game of Thrones topped all others."]},{"w":"intellect","def":"n.","zh":"智力","ex":["When we started going out, it was your intellect that really won my heart."]},{"w":"construct","def":"vt. build; make","zh":"构建","ex":["A three-year-old child can construct almost all possible sentence types."]},{"w":"crack","def":"vt. discover the solution to, especially after a lot of effort","zh":"破解","ex":["The detectives are looking for evidence to crack the murder case."]},{"w":"process","def":"vt. perform mathematical or logical operations on (data) in order to obtain the required information","zh":"处理","ex":["A supercomputer processes data at lightening speeds, measured in floating-point operations per second (FLOPS). Data is processed as it is received."]},{"w":"layer","def":"n.","zh":"层","ex":["I dress hastily, but there is a limit to how fast you can put on two or three layers of clothes.","The top layer of the rug is badly worn but the bottom layer is still OK."]},{"w":"connection","def":"n.","zh":"连接","ex":["Is there a connection between IQ and career success?"]},{"w":"select","def":"vt. choose","zh":"挑选","ex":["Mary selected a red dress for the interview."]},{"w":"get the better of","def":"beat","zh":"打败，战胜","ex":["“I’m sure he will get in touch with you as soon as he can,” said Melissa, trying not to let her anger get the better of her. She knew she shouldn’t open the package, but her curiosity finally got the better of her and she opened it."]},{"w":"strategy","def":"n.","zh":"战略，策略","ex":["The local government has been eager to develop an environmentally-friendly economic strategy."]},{"w":"adjust","def":"vt. change so as to improve accuracy or get closer to standard","zh":"调整","ex":["It is said that salaries will be adjusted for inflation."]},{"w":"put ... to the test","def":"make (sth./sb.) stand a usu. rigorous test","zh":"使接受严格考验","ex":["The effectiveness of this new drug will be put to the test in a three-year research project."]},{"w":"tournament","def":"n.","zh":"邀请赛，锦标赛","ex":["To return 12 years later and win the tournament will always mean something special to me."]},{"w":"forefront","def":"n. the leading position","zh":"最前沿","ex":["A reasonable parent would put his/her child’s welfare in the forefront of any decision."]},{"w":"reign","def":"vi. rule a nation as king","zh":"当国王;统治","ex":["In the U.K. the sovereign reigns but does not rule."]},{"w":"tough","def":"a. very difficult","zh":"艰巨的","ex":["However tough things seem, you must keep your spirits up."]},{"w":"analysis","def":"n.","zh":"分析","ex":["An analysis of his blood sample proved that he had been poisoned."]},{"w":"accelerate","def":"vt. speed up","zh":"加快","ex":["The severe flood is likely to accelerate the decline in agriculture in the coming years."]},{"w":"home in on","def":"be directed or move towards (sth.)","zh":"对准...方向;向...移动","ex":["Sometimes they homed in on the right conclusion immediately, but some other times they missed the point entirely."]},{"w":"fruitful","def":"a. having plenty of results","zh":"富有成效的","ex":["2023 has been another year of fruitful cooperation between our two countries."]},{"w":"breakthrough","def":"n.","zh":"突破","ex":["Based on the breakthrough, researchers are working on new medicines that will specifically target these types of cancer."]}],"exercises":[{"id":"opener","part":"opener","type":"qa","title_en":"Opener — Warming Up","title_zh":"单元导览 · 热身问答","instr_en":"Work in pairs and discuss the benefits and risks of self-driving cars.","instr_zh":"两人一组，讨论自动驾驶汽车的益处与风险。","items":[{"q":"What are the benefits of self-driving cars?","zh":"自动驾驶汽车有哪些益处？","a":"They free people from driving, so the latter can work or relax. They are never tired. People who can’t drive can travel around easily. They communicate with each other, probably resulting in fewer accidents and smoother traffic.","az":"把人从驾驶中解放出来，人们可以工作或休息；它们从不会疲劳；不会开车的人也能轻松出行；车辆之间可以互相通信，事故可能更少、交通更顺畅。"},{"q":"What are the risks of self-driving cars?","zh":"自动驾驶汽车有哪些风险？","a":"Those who drive for a living lose jobs. Can they always make the right driving decision? What if there is something wrong with either the software or the hardware? Where do all the data generated during driving go? Will they end up in safe hands?","az":"以开车为生的人会失业；它们总能做出正确的驾驶决策吗？软件或硬件出故障怎么办？驾驶过程中产生的海量数据流向何处？会不会落入可靠之手？"}]},{"id":"org","part":"text","type":"qa","title_en":"Text Organization","title_zh":"课文结构分析","instr_en":"Pair work: This expository essay gives a concise account of AI research at Google so far. The table below gives you the main parts of the article and the functions they serve. Write down the main idea of each part.","instr_zh":"结对练习：这篇说明文简要介绍了谷歌在人工智能领域的研究进展。下表给出文章各主要部分及其作用，请写出各部分大意。","items":[{"q":"Paras. 1–2 (Providing background information to this research)","zh":"第1–2段（交代研究背景）","a":"The ancient game of Go is profoundly complex.","az":"古老的围棋极其复杂。"},{"q":"Para. 3 (Summarizing what has and has not been done by other researchers)","zh":"第3段（综述其他研究者做过与未做的工作）","a":"AI researchers had tried very hard, but until this research, computers could only play Go as well as amateurs.","az":"人工智能研究者已做过很多努力，但在本研究之前，计算机下围棋的水平仅相当于业余棋手。"},{"q":"Paras. 4–5 (Describing the stages and methods used in this research)","zh":"第4–5段（说明研究阶段与方法）","a":"1) AlphaGo, a system that combines an advanced tree search with deep neural networks, was built. 2) The neural networks were trained on 30 million moves from games played by human experts. 3) AlphaGo learned to discover new strategies for itself.","az":"1）构建了把先进的树搜索与深度神经网络相结合的“阿尔法狗”系统；2）用人类高手对局的3000万步棋训练这些神经网络；3）阿尔法狗学会了自行发现新策略。"},{"q":"Para. 6 (Presenting the actual results of this research)","zh":"第6段（呈现研究成果）","a":"1) AlphaGo beat top computer Go programs. 2) AlphaGo beat European Go champion Fan Hui.","az":"1）阿尔法狗战胜了顶尖的计算机围棋程序；2）阿尔法狗战胜了欧洲围棋冠军樊麾。"},{"q":"Paras. 7–8 (Discussing the importance of this research and the next steps)","zh":"第7–8段（讨论研究意义与后续方向）","a":"1) Hopefully, in the future, general machine learning principles can be used to solve important real-world problems. 2) Next, AlphaGo will challenge the top Go player in the world.","az":"1）希望未来通用的机器学习原理能用于解决现实世界的重要问题；2）下一步，阿尔法狗将挑战世界顶级棋手。"}]},{"id":"dig","type":"qa","title_en":"Digging into Detail","title_zh":"课文细读","instr_en":"Answer the following questions to better understand the text.","instr_zh":"回答下列问题，深入理解课文。","items":[{"q":"Why is Go a complex game? (Para. 2)","zh":"围棋为何是一项复杂的博弈？（第2段）","a":"Because there are 10¹⁷⁰ possible positions — that's more than the number of atoms in the universe, and more than a googol times larger than chess.","az":"因为围棋有 10¹⁷⁰ 种可能的布局——这比宇宙中的原子数量还要多，并且比国际象棋的布局数量大 10¹⁰⁰ 倍。"},{"q":"Why do AI researchers use games? (Para. 3)","zh":"人工智能研究者为何要使用游戏？（第3段）","a":"They use games as a testing ground to invent smart, flexible algorithms that can tackle problems, sometimes in ways similar to humans.","az":"他们把游戏作为试验场，用来发明智能、灵活的算法，这些算法有时能以类似于人类的方式解决问题。"},{"q":"How do the methods used in AlphaGo differ from traditional AI methods? (Para. 4)","zh":"AlphaGo 所使用的方法与传统人工智能方法有何不同？（第4段）","a":"Traditional AI methods construct a search tree over all possible positions, whereas the methods used in AlphaGo combine an advanced tree search with deep neural networks.","az":"传统的人工智能方法是对所有可能的位置构建搜索树，而 AlphaGo 所使用的方法是把先进的树搜索与深度神经网络结合起来。"},{"q":"What does “reinforcement learning” most probably mean, judging from the context? (Para. 5)","zh":"从上下文判断，“强化学习”最可能是什么意思？（第5段）","a":"Learning through repeated trials, through which errors are corrected and correct solutions become knowledge.","az":"通过反复试验进行学习，在此过程中错误得到纠正，正确的解决方案成为知识。"},{"q":"Why is it important that AlphaGo uses general machine learning techniques? (Para. 8)","zh":"AlphaGo 采用通用的机器学习技术为何重要？（第8段）","a":"Because the same techniques can be used to tackle real-world problems.","az":"因为同样的技术可以用来解决现实世界中的问题。"}],"part":"text"},{"id":"diff","part":"text","type":"mc","title_en":"Understanding Difficult Sentences","title_zh":"难句理解","instr_en":"Choose the answer that correctly interprets the sentence from the text.","instr_zh":"选出对课文中句子释义正确的一项。","items":[{"q":"... because of its beauty, subtlety and intellectual depth it has captured the human imagination for centuries. (Para. 1)","zh":"……由于它的美、精妙与思想深度，几个世纪以来它一直吸引着人类的想象力。（第1段）","opts":[{"k":"A","en":"... human beings have been imagining winning the game for centuries.","zh":"……几个世纪以来，人类一直想象着赢得这一棋局。"},{"k":"B","en":"... human beings have been attracted to it for centuries.","zh":"……几个世纪以来，人类一直被它所吸引。"}],"a":"B"},{"q":"Then fell checkers in 1994. (Para. 3)","zh":"接着在1994年，跳棋也被攻克了。（第3段）","opts":[{"k":"A","en":"Then checkers was defeated in 1994.","zh":"然后在1994年，跳棋被击败了。（主语含糊，像是跳棋输掉了）"},{"k":"B","en":"Then computers beat human beings in checkers in 1994.","zh":"然后在1994年，计算机在跳棋上战胜了人类。"}],"a":"B"},{"q":"But with Go, human grandmasters have maintained an edge over even the most agile computing systems. (Para. 3)","zh":"但在围棋上，人类棋手即使面对最灵巧的计算机系统，也仍保持着优势。（第3段）","opts":[{"k":"A","en":"But human grandmasters have managed to play Go better than even the smartest computing systems.","zh":"但人类棋手下围棋的水平一直胜过哪怕最聪明的计算机系统。"},{"k":"B","en":"But human grandmasters have pushed even the most agile computing system to the edge.","zh":"但人类棋手把哪怕最灵巧的计算机系统逼到了边缘。"}],"a":"A"},{"q":"Traditional AI methods — which construct a search tree over all possible positions — don’t have a chance in Go. (Para. 4)","zh":"传统的人工智能方法——即在所有可能的棋位上构建搜索树——在围棋上没有取胜的机会。（第4段）","opts":[{"k":"A","en":"There is no hope for traditional AI methods ... to win at Go.","zh":"传统的人工智能方法……没有希望在围棋中取胜。"},{"k":"B","en":"Traditional AI methods ... don’t have a chance to play Go.","zh":"传统的人工智能方法……没有机会下围棋。"}],"a":"A"},{"q":"Because the methods we’ve used are general-purpose, our hope is that one day they could be extended to help us address some of society’s toughest and most pressing problems... (Para. 8)","zh":"由于我们所使用的方法是通用的，我们希望有一天它们能被推广，用来帮助解决社会上最棘手、最紧迫的一些问题……（第8段）","opts":[{"k":"A","en":"Because the methods we’ve used are for the general public, we hope to use them to solve some of society’s hardest and most urgent problems ...","zh":"由于我们所使用的方法是面向大众的，我们希望用它们来解决社会上最困难、最紧迫的一些问题……"},{"k":"B","en":"Because the methods we’ve used are not designed for a particular purpose, we hope to find more applications for them to solve society’s hardest and most urgent problems ...","zh":"由于我们所使用的方法并非为特定目的而设计，我们希望为它们找到更多用途，以解决社会上最困难、最紧迫的问题……"}],"a":"B"}]},{"id":"kw11","part":"text","type":"fill","title_en":"Key Words & Expressions 1.1","title_zh":"重点词汇 1.1 · 选词填空","instr_en":"Fill in the blanks with words or phrases from the box below. Change the form where necessary.","instr_zh":"用下面方框中的词或短语填空，必要时改变形式。","bank":["originate","essential","worldwide","opponent","territory","intuition","intellectual","imagination","profound","invent","flexible","tackle","best (v.)","champion","raw","input","top (v.)","intellect","construct","crack","process","layer","connection","select","strategy","adjust","tournament","forefront","reign","tough","analysis","accelerate","fruitful","breakthrough","originate in","take turns","to date","get the better of","put … to the test","home in on"],"items":[{"q":"My brother and I ______ walking the family dog.","zh":"我和哥哥轮流遛家里的狗。","a":"take turns / took turns","hint":"take turns 轮流"},{"q":"It is said that these sandstorms ______ the desert.","zh":"据说这些沙尘暴起源于沙漠。","a":"originate in","hint":"originate in 起源于"},{"q":"The coming public performance, her first one, will certainly ______ the young singer ______.","zh":"即将到来的公开演出是她的首场演出，必将考验这位年轻歌手。","a":"put … to the test","hint":"put … to the test 考验"},{"q":"Who is crazy enough to go swimming when there is a(n) ______ of ice on the lake?","zh":"湖面上结了一层冰时，谁会疯到去游泳？","a":"layer","hint":"layer 层"},{"q":"The police found no ______ between any of the suspects and the victim.","zh":"警方没有发现任何嫌疑人与受害者之间的关联。","a":"connection","hint":"connection 联系"},{"q":"Efforts are being made to ______ a more sustainable housing system in the city.","zh":"该市正在努力建设更可持续的住房体系。","a":"construct","hint":"construct 建造；构建"},{"q":"Both presidents agreed that the talks had been ______.","zh":"两位总统都认为会谈富有成果。","a":"fruitful","hint":"fruitful 富有成效的"},{"q":"______ capital is of increasing importance to an organization.","zh":"智力资本对一个组织越来越重要。","a":"Intellectual","hint":"intellectual 智力的"},{"q":"The robin keeps other birds off that part of the garden — that’s his ______.","zh":"知更鸟不让别的鸟靠近花园的那一片——那是它的领地。","a":"territory","hint":"territory 领地"},{"q":"John thanked his friend Mary and said it was always wise to trust a woman’s ______.","zh":"约翰感谢他的朋友玛丽，说相信女人的直觉总是明智的。","a":"intuition","hint":"intuition 直觉"},{"q":"Nobody has really ______ the problem of targeting advertising only to the right customers.","zh":"还没有人真正解决只向合适客户定向投放广告这一难题。","a":"cracked","hint":"crack 解决（难题）"},{"q":"The 9/11 terrorist attacks changed the lives of many Americans in a(n) ______ way.","zh":"9·11恐怖袭击以深刻的方式改变了许多美国人的生活。","a":"profound","hint":"profound 深刻的"},{"q":"Can you call back in two hours? I need time to ______ these questions.","zh":"你能在两小时后回电话吗？我需要时间处理这些问题。","a":"process","hint":"process 处理"},{"q":"Your ______ is wasted on that job. Why not quit it and work for me?","zh":"你干那份工作是大材小用。为什么不辞职来为我工作？","a":"intellect","hint":"intellect 才智"},{"q":"______ refers to any information or data that is sent to a computer for processing.","zh":"输入指任何被送入计算机进行处理的信息或数据。","a":"Input","hint":"input 输入"},{"q":"It was no easy job for our soccer team to ______ theirs.","zh":"我们足球队要胜过他们并非易事。","a":"best","hint":"best (v.) 胜过"}]},{"id":"kw12","part":"text","type":"fill","title_en":"Key Words & Expressions 1.2","title_zh":"重点词汇 1.2 · 替换划线部分","instr_en":"Replace the underlined part in each of the following sentences with a word or phrase from the box below. Write your answer in the brackets. Make changes or additions where necessary.","instr_zh":"用方框中的词或短语替换下列句子中画线的部分，把答案写在括号内，必要时作改动或补充。","bank":["essential","worldwide","select","tough","reign","to date","get the better of","home in on"],"items":[{"q":"Congratulations! This is the best book you have written [[so far]].","zh":"恭喜！这是你迄今为止写得最好的一本书。","a":"to date"},{"q":"It would be hard to [[defeat]] someone as experienced as she is at Go.","zh":"要战胜像她这样经验丰富的围棋手会很难。","a":"get the better of"},{"q":"The machine you are to design must be strong, and yet [[it is important]] that it should be light.","zh":"你要设计的机器必须坚固，但同样重要的是它必须很轻。","a":"it is essential"},{"q":"This test has been taken by millions of people [[around the world]].","zh":"这项测试已被全世界数百万人参加过。","a":"worldwide"},{"q":"The two police officers [[went straight toward]] the suspect at the bar.","zh":"两名警察径直朝酒吧里的嫌疑人走去。","a":"homed in on"},{"q":"No man can [[choose]] his parents.","zh":"没有人能够选择自己的父母。","a":"select"},{"q":"My boss has given me a very [[difficult]] assignment.","zh":"老板给了我一项非常棘手的任务。","a":"tough"},{"q":"The [[ruling]] world heavyweight champion said he’d defend his title once more and then retire even if he won.","zh":"这位在位的世界重量级拳击冠军表示，他将再卫冕一次，然后退役，即便获胜也是如此。","a":"reigning"}]},{"id":"kw13","part":"text","type":"fill","title_en":"Key Words & Expressions 1.3","title_zh":"重点词汇 1.3 · 仿例完成句子","instr_en":"Complete each of the following sentences after the model with the word or phrase in brackets. Make changes or additions where necessary.","instr_zh":"仿照例句，用括号中的词或短语完成下列句子，必要时作改动或补充。","items":[{"q":"Model: These neural networks take a description of the Go board as an ______ and process it through 12 different network layers containing millions of neuron-like connections. (input)","zh":"范例：这些神经网络把棋盘的描述作为输入，并通过包含数百万个类神经元连接的12个不同网络层进行处理。（input）","a":"input"},{"q":"The quarrel ______ a misunderstanding. (originate in)","zh":"这场争吵源于一场误会。","a":"originates / originated in"},{"q":"German universities are at/in the ______ of removing tuition from students. (forefront)","zh":"德国的大学走在免除学生学费的前列。","a":"forefront"},{"q":"The invention of the jet engine was a ______ in air transport. (breakthrough)","zh":"喷气式发动机的发明是航空运输领域的一项突破。","a":"breakthrough"},{"q":"If you study abroad, it may take you some time to ______ the local environment. (adjust)","zh":"如果你出国留学，可能要花些时间适应当地环境。","a":"adjust (yourself) to"},{"q":"This article offers a detailed ______ of China’s space program. (analysis)","zh":"这篇文章对中国的太空计划作了详细分析。","a":"analysis"}]},{"id":"wf21","part":"text","type":"fill","title_en":"Word Formation 2.1 — Compounds","title_zh":"构词法 2.1 · 合成词配对","instr_en":"Pair the words in Column A with the words in Column B to form compounds. Write them down in their usually used forms.","instr_zh":"把A栏与B栏的词配对组成合成词，并按通常写法写出。","items":[{"q":"nick ＋ name → ______（昵称）","a":"nickname"},{"q":"on ＋ looker → ______（旁观者）","a":"onlooker"},{"q":"earth ＋ shattering → ______（惊天动地的）","a":"earth-shattering"},{"q":"far ＋ fetched → ______（牵强的）","a":"far-fetched"},{"q":"set ＋ back → ______（挫折）","a":"setback"},{"q":"paper ＋ work → ______（文书工作）","a":"paperwork"},{"q":"over ＋ come → ______（克服）","a":"overcome"},{"q":"sight ＋ seeing → ______（观光）","a":"sightseeing"},{"q":"under ＋ take → ______（承担；从事）","a":"undertake"},{"q":"high ＋ light → ______（突出；亮点）","a":"highlight"}]},{"id":"wf22","part":"text","type":"fill","title_en":"Word Formation 2.2 — Compounds in Use","title_zh":"构词法 2.2 · 合成词填空","instr_en":"Complete each of the following sentences with one of the compounds above. Change the form where necessary.","instr_zh":"用上面的合成词填空完成下列句子，必要时改变形式。","items":[{"q":"You may think this a(n) ______ theory, but I believe it to be the true one.","zh":"你也许认为这是个牵强的理论，但我相信它是真的。","a":"far-fetched"},{"q":"His ______ was Lefty because he was left-handed.","zh":"他的绰号叫“左撇子”，因为他是左撇子。","a":"nickname"},{"q":"Markus, 34 years old at the time, decided not to let the ______ defeat him, but to start a new career in law.","zh":"当时34岁的马库斯决定不让这次挫折打败自己，而是开启法律方面的新事业。","a":"setback"},{"q":"Owing to her husband’s failing eyesight, she ______ the job of answering all his mail.","zh":"由于丈夫视力衰退，她承担了回复他所有信件的工作。","a":"undertook"},{"q":"It turns out that they don’t really have the ______ to prove they actually own the house!","zh":"结果发现，他们其实并没有能证明自己真正拥有这所房子的文书材料！","a":"paperwork"}]},{"id":"sp31","part":"text","type":"translate","dir":"zh2en","title_en":"Sentence Patterns 3.1 — It is the first time (that) …","title_zh":"句型 3.1 · It is the first time (that) …","instr_en":"Translate the following sentences from Chinese into English, using the structure “It is the first time + (that) clause”. Part of the translation has been done for you.","instr_zh":"用“It is the first time + (that) 从句”结构把下列句子译成英语，部分译文已给出。","items":[{"q":"这是该画第一次在中国以外的地方展出。 It is the first time that the painting ______ outside China.","a":"It is the first time that the painting has been shown outside China."},{"q":"我觉得这是他第一次这么努力。 I think it is the first time ______.","a":"I think it is the first time he has worked so hard."},{"q":"安第一次近距离地看到鲸鱼。 It was the first time that Ann ______ a whale at such a close distance.","a":"It was the first time that Ann had watched a whale at such a close distance."}]},{"id":"sp32","part":"text","type":"rewrite","title_en":"Sentence Patterns 3.2 — instead","title_zh":"句型 3.2 · instead（相反；而是）","instr_en":"Study the examples from this text and previous ones. Rewrite the following sentences with “instead”.","instr_zh":"研读本单元及前面课文中的例句，用 instead 改写下列句子。","items":[{"q":"She doesn’t study at all; she plays tennis all day.","zh":"她根本不学习，整天打网球。","a":"She doesn’t study. Instead, she plays tennis all day.","az":"她不学习。相反，她整天打网球。"},{"q":"Rachel broke up with Barry. They didn’t get married.","zh":"瑞秋和巴里分手了。他们没有结婚。","a":"Rachel didn’t marry Barry. Instead they broke up.","az":"瑞秋没有嫁给巴里。相反，他们分手了。"},{"q":"They knocked down a lovely old building; they built a car park there.","zh":"他们拆掉了一座漂亮的老建筑；在那里建了一个停车场。","a":"They knocked down a lovely old building and built a car park there instead.","az":"他们拆掉了一座漂亮的老建筑，取而代之在那里建了一个停车场。"}]},{"id":"cloze","part":"text","type":"cloze","title_en":"Comprehensive Practice 4.1 — Cloze","title_zh":"综合练习 4.1 · 完形填空","instr_en":"Complete the passage with the appropriate words or expressions in the box. Change the form when necessary.","instr_zh":"用方框中恰当的词或短语完成短文，必要时改变形式（方框中有多余选项）。","bank":["accelerate","adjust","artificial","breakthrough","construct","crack","intellectual","opponent","tackle","tournament","get the better of","put ... to the test"],"passage":"Those who champion the cause of artificial intelligence are celebrating a(n) {{1}}. For computer scientists have managed to {{2}} the problem of how to {{3}} a computer that can play the ancient game of Go better than humans. In {{4}} with grand masters the computer has {{5}} them, defeating one {{6}} after another. Some welcome the greater power of computers, arguing they will be willing slaves in helping us {{7}} our problems. Others, like the great scientist Stephen Hawking, fear computers may eventually become independent of us and bring the {{8}} of human beings to an end.","answers":["breakthrough","crack","construct","tournaments","got the better of","opponent","tackle","reign"]},{"id":"trans","part":"text","type":"translate","dir":"zh2en","title_en":"Comprehensive Practice 4.2 — Translation","title_zh":"综合练习 4.2 · 段落汉译英","instr_en":"Translate the following passage into English, using the words and phrases in the box below.","instr_zh":"用下面方框中的词或短语把下列段落译成英语。","bank":["construct","invent","imagination","raw","input","process","adjust","flexible","accelerate","intuition","select","strategy","tackle","tournament","top (v.)","opponent","champion"],"items":[{"q":"我是一名赛车设计师。这几年我对建造带人工智能的赛车很感兴趣。在我的想象中，我要发明的新车将通过摄像机和传感器收集原始数据，并具有强大的数据处理能力。它能灵活地适应环境、决定何时加速或减速。你知道，赛车手在选择策略时往往依靠直觉，可直觉在人紧张的时候就不灵了。人工智能从来不会紧张，所以更安全。一旦我攻克了设计中的难题，我将造一辆新赛车并带上它参加锦标赛。我希望它能战胜所有对手，夺得冠军称号。","a":"I am a race car designer. In recent years I have been greatly interested in constructing a race car with artificial intelligence. In my imagination, the race car I’m going to invent will collect raw data through video cameras and sensors. It will have strong data processing abilities. It can adjust to the environment, deciding when to accelerate or slow down in a flexible manner. You know, race car drivers always rely on intuition when selecting strategies, but intuition may fail if the person is tense. Artificial intelligence never feels tense, so it is safer. Once I’ve tackled the challenging problems in design, I will build a new race car and take it to a tournament. I hope it will top all opponents and become a champion."}]},{"id":"r1tf","type":"tf","title_en":"Comprehension Check — Reading 1","title_zh":"阅读1 课文理解","instr_en":"Decide whether the following statements are true (T) or false (F), based on the article.","instr_zh":"根据文章内容判断下列说法正误（T／F）。","items":[{"q":"Before the author and his buddy went to see a baseball game, his buddy had bought both tickets.","zh":"去看棒球赛之前，作者的朋友就已经把两张票都买好了。","a":"T"},{"q":"The author didn't think displaying tickets on the phone cool at all.","zh":"作者觉得用手机出示电子票一点也不酷。","a":"F"},{"q":"When he was young, the author displayed the stubs of the few concerts he had attended on the wall in order of time.","zh":"年轻时，作者把看过的几场音乐会的票根按时间顺序贴在墙上。","a":"F"},{"q":"The author taped stubs to the wall to impress other people.","zh":"作者把票根贴在墙上是为了给别人留下深刻印象。","a":"F"},{"q":"When the author was young, it was a lot of trouble buying concert tickets.","zh":"作者年轻时，买演唱会门票十分麻烦。","a":"T"},{"q":"The stubs recorded the author's hopes and disappointments, joy and pain.","zh":"那些票根记录了作者的希望与失望、欢乐与痛苦。","a":"T"},{"q":"Somewhere around the turn of the century, barcodes started to replace hard tickets.","zh":"大约在世纪之交，条形码开始取代纸质票。","a":"T"},{"q":"The tickets the author has collected over the years look new even today.","zh":"作者多年来收集的票，如今看上去依然崭新。","a":"F"},{"q":"The author now keeps his stubs on his coffee table.","zh":"作者现在把票根放在茶几上。","a":"F"},{"q":"To the author, tickets carry memories.","zh":"对作者而言，票承载着记忆。","a":"T"}],"part":"r1"},{"id":"r1tr","part":"r1","type":"translate","title_en":"Reading 1 — Translation","title_zh":"阅读1 · 英译汉","instr_en":"Translate into Chinese the underlined sentences in the article.","instr_zh":"把文章中画线的句子译成汉语。","items":[{"q":"Frankly, it was a bit of an ordeal, but if the baseball teams were doing it, then it was obvious that I’d seen the future.","a":"坦率地说，这个过程有点折磨人，但如果棒球队都这样做，那么显然这是大势所趋。"},{"q":"All purchases required trips through time and space — no online selling back then! — and were almost always bought with cash.","a":"每一次购票都需要专门花时间亲自前往——那时没有网上售票！而且几乎都是用现金购买。"},{"q":"I was with a group of friends who lined up on the sidewalk overnight in the spring of 1981 to get show tickets only to lose our place in line when the crowd stampeded toward the doors at 9 am.","a":"1981年春天，我和一群朋友在人行道上连夜排队买演出票，结果上午9点一到，众人蜂拥向门口，队形全散了，我们白白排了一晚上的队。"},{"q":"It was a physical record of my musical journey. In an era before the internet, this was how you kept track of your concert-going life and maturing (or not) as a music fan.","a":"它是我音乐旅程的实物记录。在那个互联网尚未诞生的时代，你就用这种方式记录你听音乐会的生涯和一个音乐迷的成熟（也可能不成熟）的过程。"}]},{"id":"r2qa","type":"qa","title_en":"Comprehension Check — Reading 2","title_zh":"阅读2 课文理解","instr_en":"Skim the article and answer the following questions.","instr_zh":"快速浏览文章，回答下列问题。","items":[{"q":"Why were winter patrols challenging to Li Bin and his colleagues?","zh":"为什么冬季巡检对李兵和他的同事来说是很大的挑战？","a":"They had to walk long distances and work long hours in the biting cold. In addition, they might get injured."},{"q":"Why is Daqing Oilfield going through digital transformation?","zh":"大庆油田为什么要进行数字化转型？","a":"To meet present needs, and for future development."},{"q":"What are the huge amount of data collected for?","zh":"收集海量数据是用来做什么的？","a":"To strengthen on-site management, to boost productivity, to improve work efficiency, to save human labor, and to reduce health and safety risks."},{"q":"What are some of the human resources benefits brought by digital technologies?","zh":"数字技术带来了哪些人力资源方面的好处？","a":"There is no need to hire new workers even though older workers are retiring. Workers are happier because their working conditions have been improved. They also have time to learn new skills."}],"part":"r2"},{"id":"r2cloze","part":"r2","type":"cloze","title_en":"Reading 2 — Word Bank Cloze","title_zh":"阅读2 · 选词填空","instr_en":"Read the following passage carefully. Select one word for each blank from a list of choices given in the word bank. You may not use any of the words in the bank more than once.","instr_zh":"仔细阅读下面短文，从词库中为每个空格选一个词，每个词只能使用一次。","bank":["detect","devices","expands","fuels","glimpses","inspecting","patrols","pose","processes","push","routine","scattered","significant","strengthened","transforming"],"passage":"In today’s energy sector, digital transformation is driving {{1}} changes. Take, for example, the Daqing Oilfield Company, where advancements like drones have revolutionized {{2}} operations. These unmanned aerial vehicles now undertake {{3}}, reducing both workload and risk for workers like Li Bin, who once faced bitter cold winters to inspect {{4}} oil wells. Daqing Oilfield’s journey mirrors China’s broader {{5}} for innovation in traditional industries. With a strategic focus on technologies like artificial intelligence and the internet of things, the company is {{6}} its operations. A “smart brain” command center, equipped with internet-connected {{7}}, facilitates real-time data analysis, enabling informed decision-making. This digital evolution not only enhances productivity but also improves safety across oilfields. By using data-driven technologies, operators can now {{8}} abnormal data and issue instructions immediately, streamlining processes and minimizing risks. As the company {{9}} its digital infrastructure, it enhances the capabilities of its workforce, offering opportunities for personal growth and skill development. Digital transformation is not just about adopting new technologies — it’s about reshaping entire industries. Daqing Oilfield’s transformation stands as evidence of how innovation {{10}} the energy industry towards a brighter, more efficient future.","answers":["significant","routine","patrols","scattered","push","transforming","devices","detect","expands","fuels"]},{"id":"r2tr","part":"r2","type":"translate","dir":"zh2en","title_en":"Reading 2 — Translation","title_zh":"阅读2 · 段落汉译英","instr_en":"Translate the following passage into English.","instr_zh":"把下列段落译成英语。","items":[{"q":"数字化转型正深刻影响着我国能源行业的发展。通过引入大数据、云计算和人工智能等先进技术，能源行业实现了从传统模式到数字化运营的变革。数字化转型不仅提升了能源开采（extraction）和生产的效率，还优化了能源分配和利用的方式。","a":"Digital transformation is profoundly influencing the development of China’s energy industry. Through the introduction of advanced technologies such as big data, cloud computing, and artificial intelligence, the energy industry has undergone a transformation from traditional models to digital operations. This digital transformation has not only improved the efficiency of energy extraction and production, but also optimized the way energy is distributed and utilized."}]}]},{"id":"b4u1","book":"Book 4","unit":"Unit 1","title_en":"Ocean Exploration","title_zh":"海洋探索","text_title_en":"Unit 1 Ocean Exploration","text_title_zh":"海洋探索","goals":["Upon completion of this unit, teachers are expected to have enabled students to:","understand the text linguistically and contextually;","use the key words and expressions in context properly;","talk about the importance of the oceans and ocean study, the current status of ocean study and why it is far from satisfactory;","get familiar with argumentative writing.","Part 2 Suggested Teaching Plan","I. Teaching process chart","This unit is designed for eight periods of classroom activities. In each of the periods, certain tasks are to be completed. The following is a suggested teaching plan for fulfilling those tasks. If you plan six periods for this unit, cut down time budgeted for Reading & Interacting and Readings 1 & 2 by one period, respectively."],"passages":[{"id":"text","label_zh":"课文","label_en":"Text","title_en":"When We Explore the Deep Sea, We Are Exploring for Our Own Survival","title_zh":"探索深海也是探索我们自身的生存","author_en":"Dr Greg Stone","author_zh":"格雷格·斯通博士","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"In 1953, on the heels of a discovery of a second coelacanth specimen in the Comoros Islands off Madagascar’s coast, J.L.B. Smith, the man who described the species, wrote in The Times of London: “We have in the past assumed that we have mastery not only of the land but of the sea... We have not. Life goes on there just as it did from the beginning. Man’s influence is as yet but a passing shadow. This discovery means that we may find other fishlike creatures, supposedly extinct but still living in the sea.”","zh":"1953年，在马达加斯加近海的科摩罗群岛发现第二具腔棘鱼标本之后不久，J. L. B. 史密斯(他曾对该物种进行过描述)在伦敦《泰晤士报》上写道:“我们过去认为不仅已经征服了陆地还征服了大海......实际上我们没有。生命在海洋里繁衍生息，一如既往。时至今日，人的影响只不过是浮光掠影。这一发现意味着我们可能会发现其他类鱼生物，这些生物被认为已经灭绝但却仍然生活在海洋里。”"},{"n":2,"en":"Unlike the coelacanth, which was thought to have gone extinct, we have known for centuries that giant squid have existed in our oceans’ depths. But unable to observe them alive in their deep sea home, we have understood very little about how they live, where they live and how they behave.","zh":"与人们认为已经灭绝的腔棘鱼不同，早在数世纪之前，我们就知道巨鱿存在于海洋深处。由于无法观察到深海老家的活巨鱿，我们对它们的生活状况、栖息地点，以及它们的行为了解甚少。"},{"n":3,"en":"That is, until 2012, when Drs. Edith Widder, Steve O’Shea and Tsunemi Kobodera filmed the elusive and mysterious giant in its natural deep-sea habitat for the first time — a landmark moment in ocean exploration and an example of how technology and ingenuity can overcome the monumental challenges we face in exploring the deep. But it is a drop in the vast ocean- sized bucket of amazing discoveries waiting to be made.","zh":"这种无知状况一直延续至2012年，那一年，伊迪丝·威德、史提夫·奥谢和窪寺恒己三位博士第一次在天然深海栖息地拍摄到难以捉摸的神秘巨鱿。这是海洋探索史上具有里程碑意义的时刻，同时也是一个实例，证明技术和智慧如何克服我们在深海探索领域面临的巨大挑战。但在等待我们发现的奥秘之中，它仅仅是沧海之一粟。"},{"n":4,"en":"As a scientist, I want to explore the great wonders our ocean has to offer. As a conservationist, I need to explore the vital human-ocean connection: how the ocean can provide for people and how our impacts affect the health of our oceans. This is critically important for us this century. Our population is rapidly growing toward 9 billion people and our demand for food, fresh water and energy is predicted to double.","zh":"作为一个科学家，我想探索海洋中那些匪夷所思的奇迹，作为一个自然环境保护者，我需要探索人与海洋的重要联系:海洋如何能够为人们提供生存资源，以及我们对海洋的健康有何影响。在本世纪，这对我们是至关重要的。我们的人口正迅速增长，即将达到90亿，我们对粮食、淡水和能源的需求预计将翻一番。"},{"n":5,"en":"Healthy oceans can help ease the increasing burden our population is placing on this planet, but we need to be able to explore, observe and learn about the oceans in their entirety in order to protect and conserve them effectively.","zh":"健康的海洋可以帮助缓解我们的人口对这个星球造成的负担，但是为了有效保护海洋，我们必须能够探索、观察和了解海洋的全部。"},{"n":6,"en":"I am no stranger to deep-sea exploration. In fact, I was on the same research vessel, just before the filming of the squid, making a documentary that would later become the Shark Week program Alien Sharks of the Deep. We sank a whale, which had died from apparently natural causes and washed up on shore, 2,000 feet below the Sea of Japan and then descended in submersibles to observe the ensuing feeding frenzy by an array of creatures.","zh":"我对深海探险并不陌生。事实上，在拍摄巨鱿之前，我就在同一艘考察船上，制作一部名为《鲨鱼:来自深海的陌生客》的纪录片，该片后来成了一个《鲨鱼周》节目。我们把一条显然是自然死亡后被冲上海岸的鲸鱼沉入2,000英尺深的日本海海底，然后坐在潜水器里下潜到海底去观察其后各种各样的生物豪享这场盛宴。"},{"n":7,"en":"Although we did not get to film the giant squid or observe any species new to science, we did manage to film an important and often overlooked part of the ocean life cycle. When animals in the ocean, particularly large ones like whales, die and sink to the bottom, they create their own micro-ecosystem, sort of like an oasis in the desert. Hagfish, deep sea isopods and the large and powerful six-gill shark all showed up to feed on the buffet we had set on the sea floor.","zh":"虽然我们没有拍摄到巨鱿，也没有观察到任何科学尚未知晓的新物种，我们确实设法拍摄到了海洋生命周期的一个重要的、常为人们忽视的部分。当海洋中的动物特别是像鲸鱼这样的大动物死亡并且沉到海底时，它们创造了自己的微生态系统，有点像沙漠中的绿洲。盲鳗、等足类深海动物和强大的六鳃鲨全都出场，来吃我们放在海底的自助餐。"},{"n":8,"en":"Making these kinds of observations are incredibly important to understanding how the ocean works. Think of it like an antique watch. As long as it keeps ticking, you will know what time it is. What happens if it is not keeping accurate time or it stops? You can’t understand what the problem is by just looking. You have to crack it open and when you do, you find an intricate and complicated system of gears designed to make this machine function. Unfortunately, getting inside every part of the ocean is not as simple as opening a watch.","zh":"做这类观察，对了解海洋如何运行是非常重要的。把海洋想像作一块古董手表。只要它保持滴答作响，你就会知道时间。如果它计时不准或不走了，会怎样呢?你光看是弄不明白怎么回事的。你必须打开它。一打开，你就会发现一个使这台机器运转的精细复杂的齿轮传动系统。不幸的是，进入海洋的每一个部分并不像打开一块表那么简单。"},{"n":9,"en":"The deep sea is the most hostile environment on Earth. Reaching it requires the same kind of methods, technology and expertise required for exploring space. Yet despite the similarity in how we employ technology to explore both the ocean and space, there is a great disparity between the amount of funding put toward space exploration and ocean exploration. The result? We have better maps of the surface of Mars than we do of our own planet’s sea floor.","zh":"深海是地球上最为险恶的环境。到达深海所需的方法、技术和专业知识，与探索宇宙空间相差无几。然而，在探索海洋和探索空间中，尽管在如何利用技术方面相似之处甚多，投入两者的资金却有天壤之别。结果呢？我们绘制的火星地表图比我们自己星球的海底图精准得多。"},{"n":10,"en":"There are no doubt countless discoveries to be made under the surface of the sea, whether they are species we know to exist but have yet to observe in their own habitat, species new to science or those species thought long extinct.","zh":"毫无疑问，在洋面之下将会发现无数物种，有的是我们已知存在但尚未在它们自己的栖息地观察到的，有的是科学尚未发现的，有的则是我们以为早已灭绝的。"},{"n":11,"en":"All of these types of findings fit together in a jigsaw puzzle that, as it reaches completion, reveals to us how people fit into the picture and how we can best manage, conserve and protect the oceans for our own benefit.","zh":"所有这些发现将拼成一幅图案，这个拼图一旦完成，就会揭示人类在图中的位置，展示如何从我们自身利益考虑去管理、保存和保护海洋的最佳方法。"},{"n":12,"en":"It is imperative that we keep pushing the limits of our ocean. We will not find megalodon, but we might find the key to our survival on Earth.","zh":"我们必须坚持不懈地去克服海洋探索中遭遇的各种挑战。我们不会找到巨齿鲨，但是可能会发现我们能在地球上生存下去的关键。"}],"audio_full":"textfull.mp3","vocab":[{"w":"explore","def":"v. search into or travel in (an area) for the purpose of discovery","zh":"探测，考察exploration: n. 探测，考察","ex":["The company is eager to explore for oil. Columbus discovered America but did not explore the new continent. Our team is now exploring ways to improve energy efficiency. The mountain climbers used this hut as a base for further exploration."]},{"w":"survival","def":"n. the state of continuing to live or exist","zh":"生存","ex":["“Survival of the fittest” is the law of the jungle. An animal’s sense of smell is crucial to its survival."]},{"w":"on the heels of","def":"following closely; keeping in step with","zh":"紧跟...之后","ex":["Journalists arrived (hot) on the heels of the police for news about the accident."]},{"w":"specimen","def":"n. a portion or quantity of material for use in testing, examination, or study","zh":"标本","ex":["We have to test a specimen of your blood before you can become a donor."]},{"w":"species","def":"(pl. species) n.(","zh":"生物学)物种","ex":["The giant panda used to be an endangered (濒临灭绝的) species, but now it has been reclassified as a vulnerable (易受伤害的) species."]},{"w":"assume","def":"vt. take for granted; suppose","zh":"想当然，以为","ex":["We can safely assume that everyone in this small town has a mobile phone."]},{"w":"from the beginning","def":"","zh":"从一开始","ex":["Let me tell you what happened on this trip right from the beginning."]},{"w":"influence","def":"n.","zh":"影响","ex":["As the biggest employer of this town, DuPont has a huge amount of influence on local politics."]},{"w":"As yet","def":"(used in negatives) until now/then","zh":"到目前(或那时)为止","ex":["There is no cure for this disease as yet. We have got so many questions, but as yet no answers.","Unlike the coelacanth, which was thought to have gone extinct, we have known for centuries that giant squid have existed in our oceans’ depths. (Para. 2): In this sentence, the non- restrictive attributive clause explains in what sense the giant squid is unlike the coelacanth: The giant squid has been known to exist for centuries, while the coelacanth is thought to have gone extinct.giant: n. a living being of great size 巨人，巨大的怪物 a. having extremely large size or power 巨大的e.g. He was one of the intellectual giants of our country. The body of a giant whale has (been) washed up onto the beach."]},{"w":"observe","def":"vt. watch attentively","zh":"观察observation: n. 观察","ex":["The role of scientists is to observe and describe the world, not to try to control it. They observed how the parts of the machine fitted together. She spent two nights in the hospital under close observation."]},{"w":"elusive","def":"a. difficult to find, describe, understand or achieve","zh":"难以捉摸的","ex":["Late night taxis are elusive and far from cheap. Her answer was elusive."]},{"w":"for the first time","def":"","zh":"第一次","ex":["When were modern intelligence techniques taken to the battlefield for the first time?"]},{"w":"landmark","def":"n. an object (such as a stone or tree) that marks the boundary of land; an event or development that marks a turning point","zh":"地标；里程碑","ex":["The Golden Gate Bridge is a famous landmark of San Francisco. In 1954, the U.S. Supreme Court ruled in its landmark decision Brown v. Board of Education that racial segregation in public schools was unconstitutional."]},{"w":"vital","def":"a. of the utmost importance; full of life and vigor","zh":"重要的；充满活力的","ex":["Regular exercise is vital to our health. Exercise keeps her young and vital."]},{"w":"Provide for","def":"supply what is needed for","zh":"供养，供给","ex":["Elaine would not let her boyfriend provide for her."]},{"w":"impact","def":"n.","zh":"冲击，影响","ex":["The impact of high housing price on spending is obvious."]},{"w":"planet","def":"n.","zh":"行星","ex":["The Earth is one of the planets orbiting (around) the sun."]},{"w":"learn about","def":"","zh":"了解，学习","ex":["Forgive those who betray you or break your heart, for they have helped you learn about trust."]},{"w":"entirety","def":"n. the whole or total amount of sth.","zh":"全部in one’s entirety: as a whole 整体地，全面地","ex":["The peace plan has not been accepted by the parties in its entirety. The movie should be shown in its entirety, or not at all."]},{"w":"alien","def":"a. strange, unfamiliar; foreign","zh":"陌生的，不常见的；外国的","ex":["Sushi is an alien food to many residents here. They are strongly opposed to the presence of alien forces in their country.","We sank a whale, which had died from apparently natural causes and washed up on shore, 2,000 feet below the Sea of Japan ... (Para. 6): Please take note that the adverbial phrase “2,000 feet below the Sea of Japan” modifies the verb “sank.” So the sentence means that “we” found a whale which had died from apparently natural causes and washed up on shore, and “we” sank it to the ocean floor which was 2,000 feet below the Sea of Japan.die from/of: 因...而死e.g. The doctor told the patient that two alternatives were available to him — have the surgery, or die of the infection."]},{"w":"array","def":"n.","zh":"大批，大量","ex":["There was a vast array of colours to choose from."]},{"w":"overlook","def":"vt. fail to notice or consider","zh":"忽视","ex":["We tend to overlook all sorts of warning signals about our own health until it finally fails."]},{"w":"feed on","def":"eat","zh":"以...为食，吃","ex":["The seals (海豹) feed mainly on fish and squid."]},{"w":"gear","def":"n.","zh":"齿轮","ex":["John usually oils the gears before he starts the machine."]},{"w":"hostile","def":"a. very unfriendly","zh":"不友好的；敌对的","ex":["As a politician, he ought to know how to handle hostile media. The camel can survive much longer than any other animal in the hostile desert habitat."]},{"w":"expertise","def":"n. special skills or knowledge in a particular subject","zh":"专长","ex":["None of our competitors comes close to our level of expertise."]},{"w":"amount","def":"n.","zh":"数量，总额","ex":["Our project is as yet far from completion. A considerable amount of work remains to be done."]},{"w":"funding","def":"n.","zh":"资金","ex":["We need to find new sources of funding for the project to continue. As a private school, the college does not receive any government funding."]},{"w":"countless","def":"a.","zh":"数不清的","ex":["Tom’s family, and countless others in their community, are against Brexit (英国脱欧)."]},{"w":"under/below/beneath the surface of","def":"","zh":"在...的表面之下","ex":["We could see fish swimming just under the surface of the water. There was anger just beneath the surface of his voice."]},{"w":"fit together","def":"be well suited to each other","zh":"非常相配;吻合","ex":["I don’t see how the ideas and facts fit together in your theory. The witness’s story has a few details that do not fit together."]},{"w":"completion","def":"n.","zh":"完成，实现","ex":["Upon successful completion of the four-year program, the students will be awarded a bachelor’s degree."]},{"w":"reveal","def":"vt. Make known (sth. Concealed or secret)","zh":"揭露，透露","ex":["Under the terms of their agreement with the drug manufacturer, victims are not allowed to reveal the details of the settlement plan."]},{"w":"fit into","def":"(","zh":"使)适合，适应","ex":["She fitted into the team very well. You need to fit this piece of evidence into the rest.","for sb.’s benefit/for the benefit of sb.: 为...的利益e.g. Instead of viewing animals as made for our benefit, we should think that we must be of benefit to them."]},{"w":"imperative","def":"a. extremely important and needing to be done or dealt with immediately","zh":"必要的，急需做的","ex":["It is imperative that we intensify our efforts to predict climate change accurately."]}]},{"id":"r1","label_zh":"阅读 1","label_en":"Reading 1","title_en":"Mars Can Wait. Oceans Can’t.","title_zh":"火星可以等待，海洋等不起","author_en":"Amitai Etzioni","author_zh":"阿米泰·埃齐奥尼","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"While space travel still gets a lot of attention, not enough attention has been accorded to a major new expedition to the deepest point in the ocean, some 7 miles deep — the recent journey by James Cameron, on behalf of National Geographic.","zh":"太空旅行仍然举世瞩目，而最近詹姆斯·卡梅隆代表美国《国家地理》杂志进行的一次旅行，一次到达海洋最深处——约七英里深——的重大新远征，却没有多少人关注。"},{"n":2,"en":"The cover story of the prestigious journal Foreign Affairs lays out the “Case for Space.” “60 Minutes” recently ran a story about the dire effects on Florida’s space industry of scaling back our extraterrestrial endeavors. Some leading politicians have called for building a permanent base on the moon. And President Obama has talked of preparing to eventually send Americans into orbit around Mars.","zh":"著名的《外交事务》杂志的封面文章做了一次“太空之辩”。《60分钟时事杂志》节目最近有一则报道，谈到收缩我们的太空探索活动对佛罗里达州航天工业的严重影响。一些政界要人呼吁在月球建立永久基地。奥巴马总统也谈到要准备最终将美国人送入绕火星航行的轨道。"},{"n":3,"en":"Actually, there are very good reasons to stop spending billions of dollars on manned space missions, to explore space in ways that are safer and much less costly, and to grant much higher priority to other scientific and engineering mega-projects, the oceans in particular.","zh":"事实上，我们有很充分的理由停止为载人航天任务花费数十亿美元，以更安全更节约的方式探索太空，并让其他科研项目和大型工程项目优先上马，特别是海洋项目。"},{"n":4,"en":"The main costs of space exploration arise from the fact that we are set on sending humans, rather than robots. The reasons such efforts drive up the costs include: A human needs a return ticket, while a robot can go one way. Space vehicles for humans must be made safe, while we can risk a bunch of robots without losing sleep. Robots are much easier to feed, experience little trouble when subject to prolonged weightlessness, and are much easier to shield from radiation. And they can do most tasks humans can.","zh":"太空探索的主要成本源于一个事实，即我们一心想把人(而不是机器人)送往太空。这样做就抬高了成本，因为人去太空需要有回程票，而机器人可以有去无回。载人的太空飞行器必须安全，而拿几个机器人去冒险，不会使我们夜不能眠。机器人还容易喂养，长时间处于失重状态也无大碍，防辐射也容易。人能做的事，它们大多都能做。"},{"n":5,"en":"(1) British Astronomer Royal Martin Rees writes, “I think that the practical case (for manned flights) gets weaker and weaker with every advance in robotics and miniaturization. It’s hard to see any particular reason or purpose in going back to the moon or indeed sending people into space at all.” Nobel Laureate Steven Weinberg calls manned missions “an incredible waste of money” and argues that “for the cost of putting a few people on a very limited set of locations on Mars we could have dozens of unmanned, robotic missions roving all over Mars.”","zh":"英国皇家天文学家马丁·里斯写道，“我认为，随着机器人研究和微型化的每一个进步，(载人航天飞行)实用性之辩会越来越单薄无力。很难看到任何特别的理由或目的，再把人送往月球或太空。”诺贝尔奖得主斯蒂文·温伯格把载人航天任务称为“令人难以置信的烧钱”，并说“用把几个人送到火星有限几处地方所花的钱，我们可以执行几十次无人驾驶的探索任务，让机器人跑遍火星各处。”"},{"n":6,"en":"The main argument for using humans is a public relations one. For example, the “Sputnik moment” spurred the United States into action after a relatively fallow period in its space efforts. Also, astronauts are said to inspire our youth to become scientists and explorers. (2) However, it is far from established that we cannot achieve the same effects by making other R&D projects our main priority.","zh":"用人完成太空探索的主要理由是公共关系。例如，“斯普特尼克时刻”刺激美国在太空努力相对放松了一段时间后采取行动。另外，据说宇航员会激励我们年轻人成为科学家和探险家。然而，没有证据表明，如果我们优先其他研发项目，就不能达到同样的效果。"},{"n":7,"en":"Take the oceans, about which we know much less than the dark s
