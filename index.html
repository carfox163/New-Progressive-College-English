d after walking out of that office for good.","az":"她基本被当作牛马使唤，学不到什么东西，每天下班都感到空虚；但按任何标准辞职都是不可接受的，她从没想过辞职。她一定是反复给母亲打电话，母亲在评估她的情况后命令她辞职。她永远走出那间办公室后，感到如释重负。"},{"q":"When: searching for a new job — working conditions, mental state, and actions taken","zh":"时间：找新工作期间——工作状况、心理状态与采取的行动","a":"Quitting wasn’t easy. The unknown was scary. At that time, she was tied to a year-long lease in an expensive city and lacked consistent income. So she did two things. First, she found part-time work to generate enough to pay the rent each month and she used emergency savings to cover daily expenses. Second, she started a blog and committed herself to writing a blog post a day. Meanwhile, she was networking and job searching until she finally landed a paid internship at a news outlet in New York City.","az":"辞职并不容易，未知令人害怕。当时她在一座物价高昂的城市签了一年的租约，又没有稳定收入，于是做了两件事：一是找兼职，挣够每月房租，并动用应急储蓄支付日常开销；二是开博客，坚持每天写一篇。与此同时她不断建立人脉、投递工作，最终在纽约一家新闻机构找到了一份带薪实习。"},{"q":"When: in her second job — working conditions, mental state, and actions taken","zh":"时间：做第二份工作时——工作状况、心理状态与采取的行动","a":"The workdays are long but unlike her first job, it is challenging and fulfilling, something she is passionate about. The lesson she learned is that quitting is sometimes OK and sometimes necessary.","az":"工作日很长，但与第一份工作不同，这份工作富有挑战、令人充实，是她真正热爱的事。她学到的教训是：辞职有时是可以的，有时甚至是必要的。"}]},{"id":"dig","type":"qa","title_en":"Digging into Detail","title_zh":"课文细读","instr_en":"Answer the following questions to better understand the text.","instr_zh":"回答下列问题，深入理解课文。","items":[{"q":"Did the writer ever think of quitting her first job after she found it unfulfilling? (Para. 3)","zh":"作者在发现第一份工作无法带来成就感之后，有没有想过辞职？（第3段）","a":"No, the thought of quitting never crossed her mind. It would be unacceptable by any standard.","az":"没有，辞职的念头从未在她脑中闪过。无论用什么标准衡量，辞职都是不可接受的。"},{"q":"What did the writer's mom do after assessing her situation? (Para. 4)","zh":"作者的母亲在评估了她的处境之后做了什么？（第4段）","a":"Her mom gave her an ultimatum, demanding that she quit her job as soon as she could.","az":"她母亲给了她一份最后通牒，要求她尽快辞职。"},{"q":"What was the writer afraid of as far as quitting her job was concerned? (Para. 8)","zh":"就辞去工作而言，作者害怕什么？（第8段）","a":"She was afraid of what would come next and she was also afraid of being called a quitter.","az":"她害怕接下来会发生什么，也害怕被人称为半途而废的人。"},{"q":"How did writing a blog post a day benefit the writer when she was between jobs? (Para. 14)","zh":"在待业期间，每天写一篇博客文章给作者带来了什么好处？（第14段）","a":"Writing a blog post a day kept her busy and grounded during a time of uncertainty, and allowed her to start and finish at least one thing a day, which boosted her confidence. Also, when she started applying to writing positions, the blog gave her something to talk about during interviews.","az":"在充满不确定性的时期，每天写一篇博客让她保持忙碌和踏实，也让她每天至少能开始并完成一件事，这提升了她的自信。此外，当她开始申请写作类职位时，博客也让她在面试中有内容可谈。"},{"q":"Did the writer get a lot of replies to her job applications? (Para. 16)","zh":"作者的求职申请收到了很多回复吗？（第16段）","a":"No, she didn't. Most of the time, she never heard back; sometimes, she would get a flat “no”; and one time, she got a “yes”.","az":"没有。大多数时候她根本没有收到回复；有时会得到一个干脆的“不”；只有一次，她得到了一个“是”。"}],"part":"text"},{"id":"diff","part":"text","type":"mc","title_en":"Understanding Difficult Sentences","title_zh":"难句理解","instr_en":"Choose the answer that correctly interprets the sentence from the text.","instr_zh":"选出对课文中句子释义正确的一项。","items":[{"q":"That attitude served me well — until I started working full-time. (Para. 1)","zh":"那种态度曾让我受益匪浅——直到我开始全职工作。（第1段）","opts":[{"k":"A","en":"That attitude had helped before I started working full-time.","zh":"在我开始全职工作之前，那种态度一直对我有帮助。"},{"k":"B","en":"That attitude was important for me especially when I started working full-time.","zh":"那种态度对我很重要，尤其是当我开始全职工作以后。"}],"a":"A"},{"q":"... I felt prepared to tackle anything that was thrown my way, which happened to be a lot. (Para. 2)","zh":"……我觉得自己已做好准备去应付抛给我的任何事情，而这样的事情恰好很多。（第2段）","opts":[{"k":"A","en":"... I felt prepared to face up to anything that got in my way, which turned out to be a lot.","zh":"……我觉得自己已做好准备去直面任何挡路的事，而这些事结果很多。"},{"k":"B","en":"I felt prepared to deal with anything that was assigned to me, which happened to be a lot.","zh":"我觉得自己已做好准备去处理分配给我的任何事情，而这些事情恰好很多。"}],"a":"B"},{"q":"Money-wise, I'd be fine temporarily, but I needed a plan. (Para. 11)","zh":"钱的问题上，暂时还撑得住，但我需要一个计划。（第11段）","opts":[{"k":"A","en":"As far as money was concerned, I'd be fine for the time being, but I needed a plan.","zh":"就钱而言，我暂时还过得去，但我需要一个计划。"},{"k":"B","en":"Since I had been living on a tight budget, I'd be fine for the moment, but I needed a plan.","zh":"由于我一直过得紧巴巴的，眼下还撑得住，但我需要一个计划。"}],"a":"A"},{"q":"Most of the time, I never heard back; sometimes, I would get a straight up \"no\"… (Para. 16)","zh":"大多数时候，我从未收到回音；有时，我会得到一个干脆的“不”……（第16段）","opts":[{"k":"A","en":"Most of the time, I got no response after an interview; sometimes, I would get a flat refusal ...","zh":"大多数时候，面试之后我没有收到任何回复；有时，我会遭到断然拒绝……"},{"k":"B","en":"Most probably I never heard about the company; sometimes they just told me \"no\"...","zh":"最可能的情况是我从未听说过那家公司；有时他们只是对我说“不”……"}],"a":"A"},{"q":"Walking away isn't the right answer all the time, and I still don't think it's the answer most of the time ... (Para. 19)","zh":"抽身而退并非在任何时候都是正确的答案，而且我仍然认为它在多数时候也算不上答案……（第19段）","opts":[{"k":"A","en":"Leaving that office for good wasn't the right answer back then, and I still don't think it's the answer at all ...","zh":"当时永远离开那间办公室并非正确的答案，而且我至今仍认为它根本算不上答案……"},{"k":"B","en":"Quitting isn't always the right thing to do, and I still don't think it helps to solve problems most of the time ...","zh":"辞职并不总是正确的做法，而且我仍然认为它在多数时候无助于解决问题……"}],"a":"B"}]},{"id":"kw11","part":"text","type":"fill","title_en":"Key Words & Expressions 1.1","title_zh":"重点词汇 1.1 · 选词填空","instr_en":"Fill in the blanks with words or phrases from the box below. Change the form where necessary.","instr_zh":"用下面方框中的词或短语填空，必要时改变形式。","bank":["career","quit","basically","evaluate","temporary","exit","productive","relief","eagerness","plus","consistent","expense","stability","uncertainty","introductory","fine-tune","application","opportunity","dread","take it upon/on oneself to do sth.","give sb. an ultimatum","take its/a toll (on sb./sth.)","better off","in the long run","put energy into","wash over","for good","every ounce of (one’s) courage/energy/strength","to this day","fall back on","rack up","commit (oneself) to doing sth.","pull the trigger (on sth.)","whine about"],"items":[{"q":"Have you filled in the ______ form for your passport yet?","zh":"你填好护照申请表了吗？","a":"application","hint":"application 申请（表）"},{"q":"Mr. Turner ______ his job as an exceptional TV news reporter to take up dairy farming.","zh":"特纳先生辞去了出色的电视新闻记者工作，转而从事奶牛养殖。","a":"quits / quit / quitted","hint":"quit 辞职"},{"q":"With all of these medical bills, I just don’t have any more money to ______.","zh":"有这么多的医药费，我再也没有钱可以依靠了。","a":"fall back on","hint":"fall back on 依靠；求助于"},{"q":"At a time of economic ______, risk taking can seem particularly difficult.","zh":"在经济不确定时期，冒险似乎格外困难。","a":"uncertainty","hint":"uncertainty 不确定"},{"q":"The singer bowed to the fervent audience several times before making her ______ from the stage.","zh":"这位歌手在离开舞台之前，多次向热情的观众鞠躬。","a":"exit","hint":"exit 退场；离开"},{"q":"You can’t have a(n) ______ discussion if people aren’t listening to each other.","zh":"如果人们不互相倾听，就不可能有富有成效的讨论。","a":"productive","hint":"productive 富有成效的"},{"q":"The effects of the drug on patients’ behavior is extremely difficult to ______.","zh":"这种药物对病人行为的影响极难评估。","a":"evaluate","hint":"evaluate 评估"},{"q":"She was invited to speak at a conference jointly held by two associations, with an offer to cover all her ______.","zh":"她受邀在两个协会联合举办的会议上发言，对方还提出承担她的全部费用。","a":"expenses","hint":"expense 费用"},{"q":"It is the role of the regulators to promote market confidence and ______.","zh":"监管者的职责是促进市场信心与稳定。","a":"stability","hint":"stability 稳定"},{"q":"The kids ______ to wash your car — I’m so proud of them for doing it without being told!","zh":"孩子们主动去洗你的车——他们不用人吩咐就做了，我真为他们骄傲！","a":"took it upon themselves","hint":"take it upon oneself to do sth. 主动承担做某事"},{"q":"There was a great sense of ______ among the workers at the decision not to close the factory.","zh":"得知不关闭工厂的决定，工人们感到极大的宽慰。","a":"relief","hint":"relief 宽慰；解脱"},{"q":"He ______ his daughter ______: unless she started looking for jobs he would throw her out of the house.","zh":"他给女儿下了最后通牒：除非她开始找工作，否则他会把她赶出家门。","a":"gave; an ultimatum","hint":"give sb. an ultimatum 向某人下最后通牒"},{"q":"Getting my children, 6 and 4, ready for bed required ______.","zh":"让6岁和4岁的孩子上床睡觉，需要我用尽每一分力气／意志力。","a":"every ounce of my strength / willpower","hint":"every ounce of one’s strength 每一分力气"},{"q":"The government would monitor property prices and ______ its land-sales policies if necessary.","zh":"政府将监测房价，并在必要时微调土地出让政策。","a":"fine-tune","hint":"fine-tune 微调"},{"q":"As a computer programmer, you will be ______ moving to a city that is home to a lot of tech companies.","zh":"作为一名计算机程序员，搬到一个拥有众多科技公司的城市会更好。","a":"better off","hint":"better off 境况更好"}]},{"id":"kw12","part":"text","type":"fill","title_en":"Key Words & Expressions 1.2","title_zh":"重点词汇 1.2 · 替换划线部分","instr_en":"Replace the underlined part in each of the following sentences with a word or phrase from the box below. Change the form where necessary.","instr_zh":"用方框中的词或短语替换下列句子中画线的部分，必要时改变形式。","bank":["basically","plus","rack up","pull the trigger on","for good","dread","whine about","to this day","eagerness","introductory"],"items":[{"q":"The village has remained [[for the most part]] unchanged for over 300 years.","zh":"这个村庄三百多年来基本上没有变化。","a":"basically"},{"q":"I convinced my wife not to go on holiday in August — it’ll be too hot — and [[also]] it’ll be more expensive.","zh":"我说服了妻子不在八月去度假——那时太热——而且花费也更高。","a":"plus"},{"q":"You could easily [[accumulate]] debt if you don’t keep track of your credit card bills.","zh":"如果你不留心信用卡账单，很容易就积欠债务。","a":"rack up"},{"q":"If we don’t [[make a final decision]] on this deal then we might never get the chance again.","zh":"如果我们不对这笔交易做出最终决定，可能就再也没有机会了。","a":"pull the trigger on"},{"q":"Several months later, his shop closed down [[permanently]] and I lost all trace of him.","zh":"几个月后，他的店铺永久关停，我也失去了他的一切音讯。","a":"for good"},{"q":"Most of us are [[scared of]] public speaking, but if you think of it as a simple communication process, you won’t be nervous.","zh":"我们大多数人都害怕公开演讲，但如果你把它看作一个简单的交流过程，就不会紧张。","a":"dread"},{"q":"Please don’t [[complain about]] Sally. She is sorry she couldn’t come to your party, but it’s not the end of the world.","zh":"请别抱怨萨莉。她很抱歉没能来参加你的聚会，但这也不是什么天塌下来的事。","a":"whine about"},{"q":"Over the next few months, Emma and I corresponded with each other and a friendship began that continues [[up to now]].","zh":"在接下来的几个月里，我和埃玛互通书信，一段友谊就此开始，并一直延续至今。","a":"to this day"},{"q":"The teacher was deeply impressed by the students’ diligence and their [[willingness]] to learn.","zh":"学生们的勤奋和求知的热忱给老师留下了深刻印象。","a":"eagerness"},{"q":"I’d like to make some [[opening]] remarks before beginning the lecture.","zh":"在开始讲课之前，我想先说几句开场白。","a":"introductory"}]},{"id":"kw13","part":"text","type":"fill","title_en":"Key Words & Expressions 1.3","title_zh":"重点词汇 1.3 · 仿例完成句子","instr_en":"Complete each of the following sentences after the model with the word or phrase in brackets. Make changes or additions where necessary.","instr_zh":"仿照例句，用括号中的词或短语完成下列句子，必要时作改动或补充。","items":[{"q":"Model: I used my emergency savings to cover my day-to-day expenses. I wouldn’t be saving any money, but I also wouldn’t be ______ any debt. (rack up)","zh":"范例：我用应急存款支付日常开销。我存不下钱，但也不会积欠债务。（rack up）","a":"racking up"},{"q":"There are three ______ building, but only one leads directly onto the street. (exit)","zh":"这栋楼有三个出口，但只有一个直接通向街道。","a":"exits from the"},{"q":"You may want to quit school now, but you’ll regret it ______. (in the long run)","zh":"你现在可能想退学，但从长远来看你会后悔的。","a":"in the long run"},{"q":"The ceasefire will only provide a ______ to the crisis. (temporary)","zh":"停火协定只能为这场危机提供暂时的解决办法。","a":"temporary solution"},{"q":"The government has adopted extensive policies to encourage steady and ______. (consistent)","zh":"政府已采取广泛的政策，以促进稳定而持续的（经济）增长。","a":"consistent (economic) growth"},{"q":"Maybe he doesn’t love me anymore, thought Juliet, and a deep feeling of sadness ______. (wash over)","zh":"也许他不再爱我了，朱丽叶心想，一股深深的悲伤涌上心头。","a":"washed over her"},{"q":"For the past several years, he has been ______ an academic career. (put energy into)","zh":"过去几年里，他一直把精力投入到打造学术事业中。","a":"putting (all) his energy into building"},{"q":"He ______ a new album as a mark of respect for his father. (commit (oneself) to doing sth.)","zh":"他致力于制作一张新专辑，以此表达对父亲的敬意。","a":"committed himself to producing"},{"q":"If you’re always working late, your job could be ______ in more ways than you may realize. (take its/a toll on sb./sth.)","zh":"如果你总是工作到很晚，你的工作可能正以你意想不到的多种方式损害你／你的健康／你的家庭。","a":"taking a toll on you / your health / your family"}]},{"id":"usage","part":"text","type":"fill","title_en":"Usage — Participles Used as Adjectives","title_zh":"语法运用 · 分词作定语","instr_en":"Fill in the blanks with appropriate words from the box below.","instr_zh":"用方框中恰当的词填空。","bank":["existing","energy-saving","unmanned","ice-coated","shrinking","sworn"],"items":[{"q":"Software downloaded from the net is often unsupported, and may cause conflicts with ______ software in use at your company.","zh":"从网上下载的软件通常不受支持，可能会与你公司正在使用的现有软件产生冲突。","a":"existing"},{"q":"______ building materials have been widely used in the construction of the new trading zone.","zh":"节能建筑材料已广泛用于新贸易区的建设。","a":"Energy-saving"},{"q":"The ______ Mars rover sent back a huge sum of information on the planet.","zh":"无人火星探测器发回了关于这颗行星的大量信息。","a":"unmanned"},{"q":"The fast food deliverer slipped on the ______ steps and broke his leg.","zh":"这名快餐外卖员在结冰的台阶上滑倒，摔断了腿。","a":"ice-coated"},{"q":"With a ______ labor force, many companies are planning to use more robots in their production lines.","zh":"随着劳动力不断缩减，许多公司正计划在生产线上使用更多机器人。","a":"shrinking"},{"q":"In the legend of the Butterfly Romance, Liang Shanbo was unwilling to part with Zhu Yingtai, his ______ brother, and accompanied Zhu for eighteen miles on her journey home.","zh":"在《梁祝》传说中，梁山伯不愿与结拜兄弟祝英台分别，一路送了她十八里。","a":"sworn"}]},{"id":"sp31","part":"text","type":"fill","title_en":"Sentence Patterns 3.1 — happen to be / do sth.","title_zh":"句型 3.1 · happen to be / do sth.（碰巧）","instr_en":"Use “happen to be/do sth.” to complete each of the following sentences in English according to the Chinese given.","instr_zh":"用“happen to be/do sth.”结构，根据所给汉语完成下列句子。","items":[{"q":"我们打电话时她刚巧不在家。 ______ when we called.","zh":"我们打电话时她刚巧不在家。","a":"She happened to be out"},{"q":"要是我碰巧看到地段好的公寓招租，一定会告诉你。 I’ll let you know if ______.","zh":"要是我碰巧看到地段好的公寓招租，一定会告诉你。","a":"I happen to see an apartment for rent in a good location"},{"q":"他说写歌只是为了愉悦自己，而幸运的是他的歌迷们恰巧也喜欢这些歌。 He said he wrote songs just to please himself and was lucky that ______.","zh":"他说写歌只是为了愉悦自己，而幸运的是他的歌迷们恰巧也喜欢这些歌。","a":"his fans happened to like them, too"}]},{"id":"sp32","part":"text","type":"rewrite","title_en":"Sentence Patterns 3.2 — It is … to do/doing/that …","title_zh":"句型 3.2 · 先行词 it 的用法","instr_en":"Use “It is … to do/doing/that …” to rewrite the sentences given below.","instr_zh":"用“It is … to do/doing/that …”结构改写下列句子。","items":[{"q":"Not to go to the theater to see the live dance performance will be a pity.","zh":"不去剧院看现场舞蹈表演会是一件憾事。","a":"It will be a pity not to go to the theater to see the live dance performance.","az":"不去剧院看现场舞蹈表演将是一件憾事。"},{"q":"Crying over spilled milk is no good.","zh":"为打翻的牛奶哭泣是没有用的。","a":"It’s no good crying over spilled milk.","az":"覆水难收，哭也无用。"},{"q":"That he agreed to undertake the job was not surprising at all.","zh":"他同意承担这项工作，这一点也不令人意外。","a":"It was not surprising at all that he agreed to undertake the job.","az":"他同意接下这份工作，这一点也不奇怪。"}]},{"id":"cloze","part":"text","type":"cloze","title_en":"Comprehensive Practice 4.1 — Cloze","title_zh":"综合练习 4.1 · 完形填空","instr_en":"Complete the passage with the appropriate words or expressions from the box. Change the form when necessary.","instr_zh":"用方框中恰当的词或短语完成短文，必要时改变形式。","bank":["career","application","opportunity","relief","stability","expense","energy","quit","dread","plus","for good","every ounce of","put energy into","fine-tune","rack up","fall back on","commit (oneself) to doing sth.","pull the trigger (on sth.)"],"passage":"When you finally land your first job you may well feel a deep sense of {{1}}. Having spent {{2}} your {{3}} on numerous {{4}} you may well hope that all that job hunting is gone {{5}} and that you can look forward to a {{6}} marked by {{7}}. Unfortunately, so fast is the pace of change that sooner or later you will probably find yourself once more having to {{8}} applying for a new job. Perhaps you spot a golden {{9}} opening up elsewhere. Or perhaps, through no fault of your own, your job simply ceases to exist. Either way it will be time to dust off your CV and {{10}} it to the requirements of whichever post you are after. Fortunately, next time around you will have the advantage of all the practical experience you have {{11}} to boast about. {{12}}, by then, you can also hope to have an established network of professional contacts whose help you can {{13}}.","answers":["relief","every ounce of","energy","applications","for good","career","stability","put energy into","opportunity","fine-tune","racked up","Plus","fall back on"]},{"id":"trans","part":"text","type":"translate","dir":"zh2en","title_en":"Comprehensive Practice 4.2 — Translation","title_zh":"综合练习 4.2 · 段落汉译英","instr_en":"Translate the following passage into English, using the words and phrases in the box below.","instr_zh":"用下面方框中的词或短语把下列段落译成英语。","bank":["commit (oneself) to doing sth.","take it upon/on oneself to do sth.","better off","to this day","in the long run","uncertainty","opportunity","tackle"],"items":[{"q":"数年前，我在一家大公司担任高级经理，过着典型的朝九晚五的生活，一切都按部就班。我挣的钱足够支付家庭开支。我的职业生涯循序渐进，从入门级开始，上升到高级职位。那是一份不错的工作，但是我渐渐感到了厌倦。所以，我就辞职去了一家初创公司，时至今日我还供职于此。在这里工作就像把十年的工作量压缩到两年。如果你感到厌倦，那是因为你没有致力于学习新事物，而不是没有有趣的问题有待解决。与先前雇主不一样的是，我目前就职的这家公司把失败视为潜在的机会。如果一家公司愿意承担风险允许你失败，它就给了你学习和成长的机会。此外，在小公司，你可以主动承担多重工作，面对不确定因素时，你有望独自做出明智的决定，而在大公司，做决定可能是整个部门的事情。","a":"Years ago, I was a senior manager at a big corporation. I lived a typical corporate life, clocking in at 9 am and clocking out at 5 pm. Everything proceeded as a matter of routine. I made more than enough to cover household expenses. My career path progressed from entry-level positions to more senior ones. It wasn’t a bad job, but gradually I got bored. So I quit and went to a startup, where I am still working to this day. Working here is like compressing ten years’ worth of work into two years. If you get bored, it’s because you are not committing yourself to learning new things, not because there aren’t interesting problems to tackle. Unlike my previous employer, the company I am working for at present sees failure as a potential opportunity. If a company is willing to take on the risk of allowing you to fail, it gives you the opportunity to learn and grow. Besides, in a smaller company, you take it upon yourself to perform multiple functions, and you are expected to make informed decisions all by yourself when faced with uncertainties, whereas in larger companies such decision making may be the responsibility of an entire department."}]},{"id":"r1match","type":"qa","title_en":"Comprehension Check — Reading 1","title_zh":"阅读1 段落定位","instr_en":"Skim the text and identify the paragraph from which the information in each of the following statements is derived. Write down the paragraph number in the brackets.","instr_zh":"快速浏览课文，判断下列每句话的信息出自哪一段，并写出段落编号。","items":[{"q":"A. Do not hesitate to include your personal interests and hobbies on your CV.","zh":"不要犹豫，把你的个人兴趣和爱好写进简历。","a":"第 6 段"},{"q":"B. If you love to play sports, you are very likely sociable and competitive.","zh":"如果你喜欢运动，你很可能善于交际且富有竞争意识。","a":"第 8 段"},{"q":"C. While CVs can help to achieve fair play, they can also arouse prejudice and discrimination.","zh":"虽然简历有助于实现公平竞争，但它们也可能引起偏见和歧视。","a":"第 10 段"},{"q":"D. Your résumé or CV should be viewed as an argument on why the employer should hire you.","zh":"你的简历应当被看作一篇论证，说明雇主为什么应该雇用你。","a":"第 15 段"},{"q":"E. Do not talk big about yourself; rather, use your cover letter to relevantly present yourself.","zh":"不要自我吹嘘；相反，用求职信恰当地展示自己。","a":"第 19 段"}],"part":"r1"},{"id":"r1tr","type":"translate","title_en":"Translation — Reading 1","title_zh":"阅读1 英译中","instr_en":"Translate the following underlined sentences from the article into Chinese.","instr_zh":"把下列句子译成中文，注意画线部分的表达。","items":[{"q":"The question: is it bragging or relevant to add, say, that you're an ultra-marathon runner or that you've summited Mount Qomolangma?","a":"问题是：如果你在简历中说自己是超级马拉松跑者，或者说自己曾登顶珠穆朗玛峰，这究竟是在自我吹嘘，还是与求职相关？"},{"q":"\"[It] gives me an idea of the applicant's personality and helps me differentiate appropriate candidates from the pack,\" she said. \"I am able to get a very quick snapshot at what makes you tick.\"","a":"“这让我对求职者的个性有所了解，也帮助我从众多应聘者中区分出合适的人选，”她说，“我能很快地大致看清你是个什么样的人、什么在驱动你。”"},{"q":"These create the potential for employers to make non-relevant assumptions about you or your position in society, and conscious and unconscious bias can come into play.","a":"这些内容有可能使雇主对你或你在社会中的地位作出毫不相干的臆断，有意和无意的偏见也就可能随之而来。"},{"q":"Everything you include needs to support the goal of landing the target position or at least convincing the employer that your hobby is an asset.","a":"你写进去的每一样内容都必须有助于实现获得目标职位这一目标，或者至少要让雇主相信，你的业余爱好是一项优势。"},{"q":"Whatever the case, your CV should be used to reinforce the image you are trying to present.","a":"无论如何，简历都应该用来强化你力图呈现的个人形象。"}],"part":"r1"},{"id":"r2cloze","part":"r2","type":"cloze","title_en":"Reading 2 — Word Bank Cloze","title_zh":"阅读2 · 选词填空","instr_en":"Read the following passage carefully. Select one word for each blank from a list of choices given in the word bank. You may not use any of the words in the bank more than once.","instr_zh":"仔细阅读下面短文，从词库中为每个空格选一个词，每个词只能使用一次。","bank":["aiming","executive","possess","strengthen","confident","involved","proposals","updated","connect","links","recruits","voluntary","engaging","obtained","requirements"],"passage":"Are you wondering how to look for a job? There are ways you can prepare to start looking for a job. The place to begin your job search is to identify or know what you’re {{1}} at. Make sure you {{2}} the qualities needed for the position. Have your résumé concise and {{3}}, and list the attributes that meet the {{4}} of the job description. Once you know the type of job you’re looking for, online news articles, industry association and union websites are a great place to start. Keep in mind that only 20% of jobs are printed in newspapers these days, and over 60% of jobs are {{5}} through networking. Networking is a great tool to use in your job search. Establishing {{6}} with people working in similar fields can be very beneficial. If you speak with someone you know, they can give you leads on jobs that are available in the industry or other organizations that are looking for new {{7}}. Job fairs and industry conferences are a great way to meet with employers directly. By {{8}} in these activities, you can get your questions answered, get more information and expand your network. Business directories can {{9}} you with employers. You can search by industry type or business. You can also access information on that particular business’ address, phone number, fax and even the {{10}} you need to contact when applying for the job. Job search websites are valuable, as employers can post their vacancies to the website. Most of the time you can apply right away by email directly to the company. Networking, attending job fairs, joining professional associations, and using job search websites are some of the best ways to look for work.","answers":["aiming","possess","updated","requirements","obtained","links","recruits","engaging","connect","executive"]},{"id":"r2mc","type":"mc","title_en":"Comprehension Check — Reading 2","title_zh":"阅读2 课文理解","instr_en":"Choose the best answer for each of the following.","instr_zh":"为下列各题选择最佳答案。","items":[{"q":"Universities in China and the UK are facing similar tasks to ______.","zh":"中英两国大学都面临着类似的任务，即______。","opts":[{"k":"A","en":"make their graduates employable","zh":"让毕业生具备就业能力"},{"k":"B","en":"do research on possible employers","zh":"对潜在雇主开展研究"},{"k":"C","en":"invite proposals for new UK-China cooperation","zh":"征集新的中英合作提案"},{"k":"D","en":"build partnerships between institutions","zh":"在院校之间建立合作关系"}],"a":"A"},{"q":"Research found that employers in both countries put a great emphasis on ______.","zh":"研究发现，两国雇主都非常看重______。","opts":[{"k":"A","en":"an ability to build connections","zh":"建立人脉的能力"},{"k":"B","en":"the responsibilities students take on","zh":"学生承担的责任"},{"k":"C","en":"the activities students participate in","zh":"学生参与的活动"},{"k":"D","en":"leadership qualities and initiative","zh":"领导素质与主动性"}],"a":"D"},{"q":"Marketing executives in both China and the UK attach great importance to ______.","zh":"中英两国的市场营销主管都非常重视______。","opts":[{"k":"A","en":"creativity","zh":"创造力"},{"k":"B","en":"team spirit","zh":"团队精神"},{"k":"C","en":"communication skills","zh":"沟通能力"},{"k":"D","en":"foreign language ability","zh":"外语能力"}],"a":"C"},{"q":"Challenged by change, banking in China requires new recruits to be able to ______.","zh":"面对变革带来的挑战，中国银行业要求新员工能够______。","opts":[{"k":"A","en":"be familiar with textbook knowledge","zh":"熟悉课本知识"},{"k":"B","en":"continuously update their knowledge","zh":"不断更新自己的知识"},{"k":"C","en":"put their ideas and insights into action","zh":"把想法和见解付诸行动"},{"k":"D","en":"show a disposition towards customer-related activity","zh":"表现出从事客户相关工作的意愿"}],"a":"B"},{"q":"For UK employers, the most important attribute of graduates seeking work in human resources is ______.","zh":"对英国雇主而言，应聘人力资源岗位的毕业生最重要的素质是______。","opts":[{"k":"A","en":"an ability to motivate people","zh":"激励他人的能力"},{"k":"B","en":"an understanding of how companies work","zh":"了解公司如何运作"},{"k":"C","en":"being ethically strong and empathetic","zh":"品德过硬且富有同理心"},{"k":"D","en":"time management and good organisation","zh":"时间管理与良好的组织能力"}],"a":"D"}],"part":"r2"},{"id":"r2tr","part":"r2","type":"translate","dir":"zh2en","title_en":"Reading 2 — Translation","title_zh":"阅读2 · 段落汉译英","instr_en":"Translate the following passage into English.","instr_zh":"把下列段落译成英语。","items":[{"q":"随着大学生人数逐年增加，毕业生面临着更激烈的就业竞争。需要各方的合作与共同努力，提升大学毕业生就业率。国家部门应协调用人单位对各种岗位的需求，以求空缺职位对毕业生的有效供给。","a":"As the number of college students increases year by year, graduates are faced with more fierce competition for employment. It requires the cooperation and joint efforts of all parties to improve the employment rate of college graduates. State departments should coordinate the employers’ demand for various positions in order to effectively supply vacancies to graduates."}]}]},{"id":"b4u6","book":"Book 4","unit":"Unit 6","title_en":"Human-Robot Relations","title_zh":"人与机器人","text_title_en":"Unit 6 Human-Robot Relations","text_title_zh":"人与机器人","goals":["Part One Teaching Goals","Upon completion of this unit, teachers are expected to have enabled students to:","have a thorough understanding of the text contextually and linguistically;","build up an active vocabulary to talk about human-robot relations, and know how to use the key words and expressions in context properly;","exchange ideas on the topic of the potential benefits and risks of artificial intelligence and intelligent machines;","discuss approaches we can take to keep AI safe;","get familiar with descriptive and argumentative writing.","Part 2 Suggested Teaching Plan"],"passages":[{"id":"text","label_zh":"课文","label_en":"Text","title_en":"Don’t Fear Artificial Intelligence","title_zh":"不用害怕人工智能","author_en":"Ray Kurzweil","author_zh":"雷·库兹威尔","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"Stephen Hawking, the pre-eminent physicist, recently warned that artificial intelligence (AI), once it surpasses human intelligence, could pose a threat to the existence of human civilization. Other thought leaders have voiced similar concerns.","zh":"杰出的物理学家史蒂芬·霍金近期发出警告说，人工智能(简写为AI)一旦超过人类的智力，可能对人类文明的生存造成威胁。其他思想领袖也表达了类似的忧虑。"},{"n":2,"en":"If AI becomes an existential threat, it won’t be the first one. Humanity was introduced to existential risk when I was a child sitting under my desk during the civil-defense drills of the 1950s. Since then we have encountered comparable specters, like the possibility of a bioterrorist creating a new virus for which humankind has no defense. Technology has always been a double-edged sword, since fire kept us warm but also burned down our villages.","zh":"如果人工智能变成生存威胁，这并非是第一个。在20世纪50年代民防演习期间，我还是个孩子，躲在桌子下面。那时候人类就开始领教了生存危险。此后，我们还遭遇过类似的幽灵，例如生物恐怖主义者可能制造出一种人类无法防护的新病毒。技术一直是把双刃剑，火可以给予我们温暖，但也可以烧毁我们的村庄。"},{"n":3,"en":"The typical dystopian futurist movie has one or two individuals or groups fighting for control of “the AI.” Or we see the AI battling the humans for world domination. But this is not how AI is being integrated into the world today. AI is not in one or two hands; it’s in 1 billion or 2 billion hands. A kid in Africa with a smartphone has more intelligent access to knowledge than the President of the United States had 20 years ago. As AI continues to get smarter, its use will only grow. Virtually everyone’s mental capabilities will be enhanced by it within a decade.","zh":"在一部典型的反乌托邦未来主义电影中，有一两个人或群体争夺“人工智能”的控制权，或者我们看到人工智能为了主宰世界与人类搏斗。然而，这不是人工智能融入当今世界的方式。人工智能并非由一两个人掌控，而是由十亿、二十亿人掌控。和美国总统20年前接触知识的渠道相比，一个拥有智能手机的非洲孩子接触知识的渠道更加智能化。随着人工智能变得越来越聪明，它的使用将只增不减。事实上，人工智能有望在10年内提高每个人的大脑能力。"},{"n":4,"en":"We will still have conflicts among groups of people, each enhanced by AI. That is already the case. But we can take some comfort from a profound, exponential decrease in violence, as documented in Steven Pinker’s 2011 book, The Better Angels of Our Nature: Why Violence Has Declined. According to Pinker, al- though the statistics vary somewhat from location to location, the rate of death in war is down hundredfold compared with six centuries ago. Since that time, murders have declined tenfold. People are surprised by this. The impression that violence is on the rise results from another trend: exponentially better information about what is wrong with the world — another development aided by AI.","zh":"人类不同群体间的冲突仍将持续，而人工智能会使每次冲突变得更加激烈。情况已经是这样的了。然而，史蒂文·平克在2011年出版的《人性中的善良天使:暴力为什么会减少》一书中表明，暴力冲突大幅度减少，这让我们得到一些安慰。史蒂文·平克写道，尽管地区之间的数据有所不同，但与6个世纪以前相比，战争中的死亡率成百倍地降低了。自那时起，凶杀案件数量下降了10倍。人们对此感到惊讶。其实暴力有增无减的印象源自另外一个趋势，那就是人们对世界问题的了解越来越多、也越来越快——而这种进展也是受到人工智能推动的。"},{"n":5,"en":"There are strategies we can deploy to keep emerging technologies like AI safe. Consider biotechnology, which is perhaps a couple of decades ahead of AI. A meeting called the Asilomar Conference on Recombinant DNA was organized in 1975 to assess its potential dangers and devise a strategy to keep the field safe. The resulting guidelines, which have been revised by the industry since then, have worked very well: there have been no significant problems, accidental or intentional, for the past 39 years. We are now seeing major advances in medical treatments reaching clinical practice and thus far none of the anticipated problems.","zh":"我们可以使用策略保证人工智能等新技术的安全性。我们看一下生物技术的情况。它领先人工智能约20多年。1975年，阿西洛马DNA重组技术会议召开，其目的是评估生物技术的潜在危险，制定策略以确保该领域的安全。自那时起，该行业不断对会议制定的指南进行修订，到目前为止效果良好:在过去39年没有出现重大的问题，不管是意外的还是故意的。目前，医疗上的重大进步进入临床实践，之前预料的问题尚未出现。"},{"n":6,"en":"Consideration of ethical guidelines for AI goes back to Isaac Asimov’s three laws of robotics, which appeared in his short story “Runaround” in 1942, eight years before Alan Turing introduced the field of AI in his 1950 paper “Computing Machinery and Intelligence.” The median view of AI practitioners today is that we are still several decades from achieving human-level AI. I am more optimistic and put the date at 2029, but either way we do have time to devise ethical standards.","zh":"为人工智能建立道德指南可以追溯到艾萨克·阿西莫夫于1942年出版的短篇故事《转圈圈》中提出的机器人三定律，而8年后阿兰·图灵才在其论文“计算机器和智能”中提出了人工智能这一概念。今天，人工智能从业者们趋中的观点是，人工智能要和人类智能媲美仍需几十年时间，而我更加乐观，把这个日期提前至2029年。但无论如何，我们的确有时间制定人工智能道德标准。"},{"n":7,"en":"There are efforts at universities and companies to develop AI safety strategies and guidelines, some of which are already in place. Similar to the Asilomar guidelines, one idea is to clearly define the mission of each AI program and to build in encrypted safeguards to prevent unauthorized uses.","zh":"各大高校和企业都在着手制定人工智能安全策略和指南，有些已经就绪。与阿西洛马指南相类似，它们的想法之一是清楚地界定每项人工智能计划的使命，建立加密安全措施，防止未经许可的使用。"},{"n":8,"en":"Ultimately, the most important approach we can take to keep AI safe is to work on our human governance and social institutions. We are already a human-machine civilization. The best way to avoid destructive conflict in the future is to continue the advance of our social ideals, which has already greatly reduced violence.","zh":"归根结底，为了保证人工智能的安全，最重要的是继续改善我们人类的治理和社会制度。我们早已进入人类与机器共存的文明社会，避免未来破坏性冲突的最好方法是继续推进已经使暴力大幅度降低的社会行为准则。"},{"n":9,"en":"AI today is advancing the diagnosis of disease, finding cures, developing renewable clean energy, helping to clean up the environment, providing high-quality education to people all over the world, helping the disabled (including providing Hawking’s voice) and contributing in a myriad of other ways. We have the opportunity in the decades ahead to make major strides in addressing the grand challenges of humanity. AI will be the pivotal technology in achieving this progress. We have a moral imperative to realize this promise while controlling the peril. It won’t be the first time we’ve succeeded in doing this.","zh":"当今的人工智能正在提升疾病诊断水平，寻找治疗方法，开发可再生清洁能源，帮助清洁环境，给全世界人们提供高质量的教育，帮助残疾人(包括为霍金提供声音)，以及用无数的其他方式对人类做出贡献。在未来几十年里，我们有机会在应对人类巨大挑战方面取得长足进展。人工智能将成为取得这些进步的关键技术。我们有道义上的责任在实现这一目的的同时控制危险。此前，我们已经有过成功的先例。"}],"audio_full":"textfull.mp3","vocab":[{"w":"surpass","def":"vt. be better or greater than","zh":"超越，胜过","ex":["The athlete surpassed the world record."]},{"w":"pose","def":"vt. present (a problem, threat, etc.)","zh":"形成，构成","ex":["Pollution poses serious problems in our life."]},{"w":"existence","def":"n. the state of existing","zh":"存在","ex":["There is no doubt as to the existence of global warming."]},{"w":"voice","def":"vt. express in words","zh":"表达","ex":["The author voices worry over the current financial crisis."]},{"w":"encounter","def":"vt. be faced with (sth. difficult, dangerous, etc.)unexpectedly","zh":"遭遇;面临","ex":["People in modern society encounter various stresses in life."]},{"w":"comparable","def":"a .similar","zh":"相似的","ex":["Is the efficiency of electric cars comparable to that of conventional gasoline cars?"]},{"w":"burn down","def":"destroy or damage (sth.) with fire","zh":"烧毁","ex":["Many houses were burned down in the fire.","Or we see the AI battling the humans for world domination. (Para. 3): Or we see in the movie AI and humans fighting against each other for control of the world."]},{"w":"enhance","def":"vt. improve the quality, value, or amount of (sth.)","zh":"提高，增加，加强","ex":["The company tried hard to enhance its reputation.","take/draw comfort from/in (doing) sth.: feel calmer, happier, or more hopeful after one has been worried or unhappy 从...得到安慰e.g. The refugees took comfort in the kindness of strangers."]},{"w":"decrease","def":"n. a change downward","zh":"减少","ex":["The decrease in working population has become a concern in many developed countries."]},{"w":"violence","def":"n. behavior that is intended to hurt other people physically","zh":"暴力，暴行","ex":["The United Nations called for an end to the violence."]},{"w":"statistics","def":"n. collection of information shown in numbers","zh":"数据，统计资料","ex":["There are no reliable statistics for the number of victims in the disaster."]},{"w":"vary","def":"v. change or be different according to the situation","zh":"变化，改变","ex":["The cause of the sickness varies from person to person. This restaurant is known for varying its menu with the season."]},{"w":"somewhat","def":"ad. to some degree","zh":"稍微，有点","ex":["The doctor believes the case of the patient is somewhat out of the ordinary."]},{"w":"on the rise","def":"increasing","zh":"上升, 增加","ex":["The temperature is on the rise."]},{"w":"result from","def":"happen because of sth. else that happened first","zh":"因...而发生，产生自","ex":["Many health problems result from what you eat or the way you eat it."]},{"w":"trend","def":"n. a general direction in which sth. is developing or changing","zh":"趋势","ex":["The report is about the trend toward part-time employment."]},{"w":"aid","def":"vt. help or support","zh":"帮助，支持","ex":["So far there is little systematic effort from the government to aid the refugees."]},{"w":"a couple of","def":"(infml) an indefinite small number of","zh":"几个，三两个","ex":["I worked in a supermarket for a couple of weeks in the summer."]},{"w":"potential","def":"a. likely to develop into a particular type of person or thing in the future","zh":"潜在的，可能的","ex":["Forecasters say that potential flooding and mudslide could be life threatening."]},{"w":"guideline","def":"n. rules or instructions about the best way to do sth.","zh":"指南;准则","ex":["Should government provide clear guidelines for college education?"]},{"w":"revise","def":"vt. change (sth.) because of new information or ideas","zh":"修订；修改","ex":["I soon came to revise my opinion of the movie."]},{"w":"accidental","def":"a. happening by chance","zh":"偶然的；意外的","ex":["Their meeting was completely accidental."]},{"w":"clinical","def":"a.","zh":"临床的","ex":["The drug proved quite effective in clinical trials."]},{"w":"consideration","def":"n. thinking about sth.","zh":"考虑","ex":["What is your chief consideration in choosing a job?"]},{"w":"go back to","def":"have developed from (sth.) that happened or existed a long time ago","zh":"追溯到","ex":["The history of the town goes back to the beginning of the sixth century.","The median view of AI practitioners today is that we are still several decades from achieving human-level AI. (Para. 6): AI practitioners today tend to agree that it will take us several decades to achieve human-level AI."]},{"w":"in place","def":"working or ready to work; established","zh":"到位的;已确定的","ex":["Are there any policies against pollution in place?"]},{"w":"similar to","def":"almost the same as","zh":"类似","ex":["Some Westerners think the Japanese language is similar to the Chinese language."]},{"w":"build in","def":"make (sth.) a necessary part of sth.","zh":"使成为组成部分，列入","ex":["You could build in a wardrobe with mirrored doors. We can build in a special clause to make the contract better for you."]},{"w":"institution","def":"n. an established system, law or practice","zh":"制度，机制","ex":["WTO is a multilateral trade institution."]},{"w":"avoid","def":"vt. keep away from or stop oneself from doing (sth.)","zh":"避免","ex":["No one can avoid making mistakes."]},{"w":"destructive","def":"a. causing great damage","zh":"破坏的；毁灭性的","ex":["The recent earthquake was very destructive."]},{"w":"renewable","def":"a.","zh":"可再生的；可更新的","ex":["All our paper is made from timber from renewable forests. Renewable energy such as solar or wind energy is theoretically inexhaustible."]},{"w":"disabled","def":"a. (of a person) having a physical or mental condition that limits movements, senses, or activities","zh":"残疾的","ex":["Disabled people can have easy access to the service."]},{"w":"moral","def":"a. based on the principle of right conduct rather than legality; concerned with the principles of right and wrong behavior","zh":"道义上的；道德的","ex":["They promised moral and financial support. Man is gifted with a moral sense by which he distinguishes good from evil."]}]},{"id":"r1","label_zh":"阅读 1","label_en":"Reading 1","title_en":"As Robots Replace People, Where Will Workers Go?","title_zh":"当机器人取代人时，工人将何去何从?","author_en":"Nouriel Roubini","author_zh":"鲁里埃尔·鲁比尼","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"Technology innovators and CEOs seem positively giddy nowadays about what the future will bring. New manufacturing technologies have generated feverish excitement about what some see as a Third Industrial Revolution. In the years ahead, technological improvements in robotics and automation will boost productivity and efficiency, implying significant economic gains for companies. (1) But, unless the proper policies to nurture job growth are put in place, it remains uncertain whether demand for labor will continue to grow as technology marches forward.","zh":"谈到未来将带给我们什么，技术创新者和公司执行总裁们似乎已冲昏了头脑。新的制造技术已经使人们兴奋不已，有的人认为这就是第三次工业革命。在未来的几年中，机器人技术和自动化领域的技术改善将提高生产力和效率，这意味着给公司带来巨大的经济收益。但是，除非制定适当的政策造就更多的工作机会，否则，随着技术的进步劳动力需求是否将继续增加仍会不明朗。"},{"n":2,"en":"Recent technological advances have three biases: they tend to be capital-intensive (thus favoring those who already have financial resources); skill-intensive (thus favoring those who already have a high level of technical proficiency); and labor-saving (thus reducing the total number of unskilled and semi-skilled jobs in the economy). The risk is that robotics and automation will displace workers in blue-collar manufacturing jobs before the dust of the Third Industrial Revolution settles.","zh":"近期的技术进步有三种倾向:资本密集(从而有利于那些已经拥有资金的人);技能密集(从而有利于那些已经拥有高水平技能的人);节约劳动力(从而减少经济中无技能和半技能工作岗位的总量)。其风险是在第三次工业革命尘埃落定前，机器人技术和自动化将取代蓝领制造业工人。"},{"n":3,"en":"The rapid development of smart software over the last few decades has been perhaps the most important force shaping the coming manufacturing revolution. Software innovation, together with 3D printing technologies, will open the door to those workers who are educated enough to participate; for everyone else, however, it may feel as though the revolution is happening elsewhere. Indeed, the factory of the future may be 1,000 robots and one worker manning them. Even the shop floor can be swept better and cheaper by a robot than by any worker.","zh":"过去几十年间迅速发展的智能软件也许已成为左右未来制造业革命的最重要的力量。软件创新加上3D打印技术将为那些受过足够教育的人们提供参与的机会。但是，对其他人来说，这场革命就好像发生在别处。事实上，未来工厂可能有1,000个机器人，但只有一位操纵它们的工人。与任何一位工人相比，机器人甚至能够把车间地板打扫得更干净而且花费更少。"},{"n":4,"en":"For the developed countries, this may seem like old news. After all, for the last 30 years, the manufacturing base in Asia’s emerging economies has been displacing that of the old industrial powers of Western Europe and North America. But there is no guarantee that gains in service-sector employment will continue to offset the resulting job losses in industry.","zh":"对于发达国家而言，这可能看似旧闻。毕竟在过去30年，亚洲新兴经济体的制造基地一直在取代西欧和北美工业强国的老制造基地。但是无法保证服务领域新增的就业将继续抵消由此带来的工业岗位的流失。"},{"n":5,"en":"For starters, technology is making even many service jobs tradable, enabling them to be offshored to emerging markets. And, eventually, technology will replace manufacturing and service jobs in emerging markets as well.","zh":"首先，技术正让许多服务性工作变得也可转让，使这些工作可以外包到亚洲和其他海外新兴市场。最终，新技术也将取代新兴市场的制造业和服务业工作岗位。"},{"n":6,"en":"Today, for example, a patient in New York may have his MRI sent digitally to, say, Bangalore, where a highly skilled radiologist reads it for one-quarter of what a New York-based radiologist would cost. But how long will it be before a computer software can read those images faster, better and cheaper than the radiologist in Bangalore can?","zh":"例如，今天纽约的病人可把他的核磁共振图像用数字手段发送到班加罗尔，那里技术高超的放射科医生读片费用仅为纽约放射科医生的四分之一。但是，还得多久，计算机软件就能比班加罗尔的放射科医生读得更快、更好、更便宜呢?"},{"n":7,"en":"Likewise, in the next decade, consumer electronics manufacturers plan to replace much of their workforce with robots. And soon enough voice recognition software will replace the call centers of Bangalore and Manila.","zh":"同样地，在今后10年间，消费电子产品制造商们计划用机器人替代其劳动力中的相当多的人。不久的将来，语音识别软件将取代位于班加罗尔和马尼拉的呼叫中心。"},{"n":8,"en":"Job-reducing technological innovations will affect education, healthcare, government and even transportation. For example, will we still need so many teachers in the decades to come if the cream of the profession can produce increasingly sophisticated online courses that millions of students can take? If not, how will all of those former teachers earn a living?","zh":"减少工作岗位的技术创新将影响教育、医疗保健、政府，甚至交通。例如，如果教育界的精英能够不断地开设可供成千上万学生选读的优良网络课程，在未来几十年我们还需要如此多的教师吗?如果不需要，那么原来那么多的教师将靠什么谋生呢?"},{"n":9,"en":"Governments, too, are shedding labor — particularly governments burdened by high deficits and debts. (2) And, by transforming how services are provided to the public, the e-government trend can offset the employment losses with productivity gains.","zh":"政府部门也在减少劳动力——特别是被高赤字和高债务拖累的政府部门。通过改变服务公众的方式，电子政务能够用工作效率的提高来抵消雇员减少带来的负面影响。"},{"n":10,"en":"Even transportation is being revolutionized by technology. In a matter of years, driverless cars may render millions of jobs obsolete.","zh":"新技术甚至正在使交通发生革命性的变化。只要再过几年，无人驾驶汽车可能使几百万份工作不复存在。"},{"n":11,"en":"And, of course technological innovation that is capital-intensive and labor-saving is one of the factors — together with the related winner- take-all effects — driving the rise in income and wealth inequality. Rising inequality then becomes a drag on demand and growth (as well as a source of social and political instability), because it distributes income from those who spend more (lower- and middle-income households) to those who save more (high-net-worth individuals and corporate firms).","zh":"当然，资本密集型和节约劳动力的技术创新，加上相关的赢者通吃的效果，是加剧收入和财富不均的众多因素之一。而不平等现象的加剧就要拖需求和增长的后腿(也是社会和政治不稳定的源头)，因为它拿走消费多的人(中低收入家庭)的收入，转而分配给那些储蓄多的人(高净值个人和公司)。"},{"n":12,"en":"Obviously, this is not the first time the world has faced such problems, and the past can help serve as a model for resolving them. Late 19th- and early 20th-century leaders sought to minimize the worst features of industrialization. (3) Child labor was abolished throughout the developed world, working hours and conditions became more humane, and a social safety net was put in place to protect vulnerable workers and stabilize the (often fragile) macro economy.","zh":"很显然，这不是世界第一次面对这样的问题，过去的经验可以作为解决当前问题的范例。19世纪后期和20世纪初期的领袖们努力使工业化最糟糕的负面影响最小化。童工在所有发达国家被废除，工作时间和工作环境变得更加人性化，社会保障系统建立并运行以保护作为弱势群体的工人以及稳定(经常是脆弱的)宏观经济。"},{"n":13,"en":"As we begin to seek enlightened solutions to the challenges that the Third Industrial Revolution presents, one overall theme looms large: the gains from technology must be channeled to a broader base of the population than has benefited so far. That requires a major educational component. In order to create broad-based prosperity, workers need the skills to participate in the brave new world implied by a digital economy.","zh":"当我们开始寻找明智的方法来应对第三次工业革命所带来的挑战时，摆在我们面前的一大主题是技术带来的好处必须输送给基数更大的人群，而不是现在的既得利益者。要做到这点，需要一个重大的教育要素。为了创造大面积繁荣，工人们需要掌握技能投身到由数字经济带来的崭新的世界中。"},{"n":14,"en":"(4) Even that may not be sufficient, in which case it will become necessary to provide permanent income support to those whose jobs are displaced by software and machines. Here, too, we should attend carefully to the lessons of the past.","zh":"甚至这些也许还不够，必须给那些工作岗位被软件和机器替代的人们提供永久的收入支持。为此，我们也应该仔细研究过去的教训。"}],"audio_full":"r1full.mp3","vocab":[]},{"id":"r2","label_zh":"阅读 2","label_en":"Reading 2","title_en":"Will China Be a Leader in Robotics?","title_zh":"中国会成为机器人领域的领袖吗?","author_en":"Jaap van Etten","author_zh":"亚柏·凡·埃滕","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"This week is the big World Robot Conference in Beijing, with many newspapers and websites writing about robots and the sector’s market potential.","zh":"本周盛大的世界机器人大会在北京举行，许多报纸和网站报道了机器人和这个领域的市场潜力。"},{"n":2,"en":"However for years robots have already been ‘big business’. The global industrial robotics business was worth $10.7 billion in 2014, according to the International Federation of Robotics (IFR). China was the largest market, shipping over 57,000 industrial robots, with Japan in second, followed by the United States. According to IFR forecasts the sales figures in China are expected to continue to rise dramatically, totaling 150,000 units by 2018.","zh":"但是多年来机器人一直就是笔“大生意”。根据国际机器人联盟(IFR)提供的数据，2014年全球工业机器人市场规模为107亿美元。中国是最大的市场，工业机器人发货量超过57,000个，日本排名第二，美国第三。根据国际机器人联盟预测，中国的销售数字有望继续大幅度提高，预计2018年总量达到150,000台。"},{"n":3,"en":"During the past decades, China was known for its seemingly limitless supply of low-wage workers. China’s emergence as an automation hub contradicts many assumptions about robots and the global economy. However, earlier this year China published its national plan ‘Made in China 2025’. This plan aims to modernize China’s industry, and pays special attention to its manufacturing processes, including shifting labor-intensive work to robots.","zh":"在过去几十年，中国似乎能不断地提供廉价工人，并以此出名。中国成为新兴的自动化中心同许多关于机器人和全球经济的假想相左。但是，今年早些时候，中国发布了名为“中国制造2025”的国家计划。此计划目的在于使中国工业现代化，非常重视制造工序，包括把劳动密集型的工作转给机器人做。"},{"n":4,"en":"It is said that by the end of 2015 or early 2016 China will release a five-year development plan (as an annex to ‘Made in China 2025’) for its indigenous robot industry, ambitiously aiming to more than double the market share of made-in-China robots to 50 percent by 2020.","zh":"据说，中国将于2015年末或2016年初发布其本土机器人工业五年发展规划(作为中国制造2025的附录)。该规划目标远大:力求到2020年将中国制造的机器人所占市场的份额提高到50%，比目前份额翻一番还要多。"},{"n":5,"en":"In 2014, Chinese factories accounted for about a quarter of the global ranks of industrial robots (>50 percent increase over 2013) and this boom is likely to continue. According to the IFR, it will have more installed manufacturing robots than any other country by 2017.","zh":"2014年，中国工厂使用的工业机器人占全球总量的四分之一(比2013年增长50%还要多)，这种增长趋势还会延续。根据国际机器人联盟报道，到2017年中国装备的制造业机器人数量将比任何其他国家都多。"},{"n":6,"en":"Currently, the global market is dominated by industrial robots, having about an 80 percent market share. The use of robots currently accounts for 10 percent of the manufacturing process, but that figure is expected to rise to 20 percent by 2025. Many companies therefore still focus their investments on the development of industrial robotics. But it is clear that the market of service robots will surpass that of industrial robotics in the future. We already see that the application of robots is extending from manufacturing industry into the service sector, including medicine and healthcare, not just domestic applications.","zh":"目前，工业机器人在全球机器人市场中占主要地位，拥有约80%的市场份额。当前制造业10%的过程采用机器人，但到2025年，这个数字预计将上升到20%。因此，许多公司仍把投资集中在工业机器人的开发上。但很明显，将来服务业机器人的市场将超过工业机器人市场。我们已经看到机器人的运用正在从制造行业扩展到服务行业，除了家用领域，还包括医学和健康保障领域。"},{"n":7,"en":"It is interesting to see at the conference that Chinese researchers have already mastered technology for the whole industrial chain of service robotics. They have developed various service robots, including those capable of cleaning, cooking, and helping the elderly and handicapped.","zh":"很有意思的是，人们在大会上看到中国研究者们已经掌握了服务机器人产业链上的所有技术。他们已经开发了各种各样的服务机器人，包括那些能够清扫、烹饪以及帮助老年人和残疾人的机器人。"},{"n":8,"en":"But China still has a long way to go, according to the general manager of a technology firm in Fujian Province:","zh":"但是，福建省一家技术公司的总经理认为:中国仍有很长的路要走。他说:“工业机器人的主要部件，如感应器和马达，仍然是进口的，没有几家机器人制造商为大规模生产做好了准备。”","blk":[{"en":"“Key parts of industrial robots, such as sensors and motors, are still imported, and not many robot makers are ready for mass production.”","zh":"","t":"li"}]},{"n":9,"en":"There are more than 1,000 robot-related firms across China, but quality — not quantity — is the robot sector’s biggest challenge.","zh":"全中国有超过1,000家与机器人相关的公司，但是质量——而非数量——是机器人领域的最大挑战。"},{"n":10,"en":"More and more Chinese factories are starting to introduce robots in a bid to replace human labor. There are two (linked) reasons why they are looking into new strategies and automatization:","zh":"越来越多的中国工厂正在开始引进机器人以替代人工。有两个(相关的)原因驱使它们探究新策略和自动化:","blk":[{"en":"Labor shortage caused by more people rejecting factory jobs.","zh":"越来越多的人拒绝在工厂工作，从而引发劳动力短缺。","t":"li"},{"en":"Rising wages. Chinese factory workers nowadays earn two to six times more than their peers in Thailand or Cambodia.","zh":"涨薪。现在中国产业工人的工资是泰国或柬埔寨工人的2至6倍多。","t":"li"}]},{"n":11,"en":"Although the IFR expects China to have more installed manufacturing robots than any other country in 2017, it has to be mentioned that China’s robot-to-worker ratio is still rather low, about 36 robots per 10,000 factory workers. South Korea employs the most robots, with 478 per 10,000 workers, followed by Japan with 315 and Germany with 292 robots per 10,000 workers.","zh":"尽管国际机器人联盟预计，到2017年，中国装备的制造业机器人将超过任何其他国家，有一点不得不提:中国的机器人和工人之比率仍然很低，大概是每10,000名工人有36个机器人。韩国使用机器人最多，每10,000名工人有478个机器人，其次是日本，每10,000名工人有315个，第三是德国，每10,000名工人有292个。"},{"n":12,"en":"Let’s see what the future will bring or how we can shape it. Whether a dystopian future where the ‘droids are taking our jobs’ will happen, or if we can master robots and end up in a more pleasant future. So far in China there seems little evidence that robots are having a big impact on employment. Average urban wages in China rose more than 10% in 2014, and the country remains on target to create at least 10 million new jobs this year. But given the mentioned low robot-to-worker ratio and without assessing the possibilities of introducing artificial intelligence (AI) into white collar jobs, it’s too early to make any conclusions based on these figures.","zh":"让我们一起展望未来将带来什么或者我们如何能塑造未来。未来究竟是“机器人夺走我们工作”的反乌托邦，还是以我们主宰机器人而获得更美满结局?目前，似乎很少有证据证明机器人正在对中国的就业产生大的影响。2014年，中国城市平均工资增幅超过10%，而今年有望实现其创造至少1,000万个工作岗位的目标。但是考虑到前面提及的机器人相对工人的低比率，而且还没有对人工智能引入白领工作是否可能进行评估，基于这些数据而得出任何结论都为时过早。"},{"n":13,"en":"To finish, let’s look again at the question of whether China will be a leader in robotics. Certainly it can be said that it is already leading if you look at the market share of industrial robots. As Chinese companies keep pushing the boundaries of innovation, there are high hopes that they will cease sourcing technology and key parts from foreign manufacturers and that China will be an all-round leader in robotics.","zh":"最后，让我们回头再看一下这个问题:中国是否会成为机器人领域的领袖。当然，如果看一下工业机器人的市场份额，可以说中国已经处于领先地位。随着中国企业不断推动创新，很有可能他们将停止向外国制造商采购技术和关键部件，中国将成为机器人技术的全面领导者。"}],"audio_full":"r2full.mp3","vocab":[]}],"vocab":[{"w":"surpass","def":"vt. be better or greater than","zh":"超越，胜过","ex":["The athlete surpassed the world record."]},{"w":"pose","def":"vt. present (a problem, threat, etc.)","zh":"形成，构成","ex":["Pollution poses serious problems in our life."]},{"w":"existence","def":"n. the state of existing","zh":"存在","ex":["There is no doubt as to the existence of global warming."]},{"w":"voice","def":"vt. express in words","zh":"表达","ex":["The author voices worry over the current financial crisis."]},{"w":"encounter","def":"vt. be faced with (sth. difficult, dangerous, etc.)unexpectedly","zh":"遭遇;面临","ex":["People in modern society encounter various stresses in life."]},{"w":"comparable","def":"a .similar","zh":"相似的","ex":["Is the efficiency of electric cars comparable to that of conventional gasoline cars?"]},{"w":"burn down","def":"destroy or damage (sth.) with fire","zh":"烧毁","ex":["Many houses were burned down in the fire.","Or we see the AI battling the humans for world domination. (Para. 3): Or we see in the movie AI and humans fighting against each other for control of the world."]},{"w":"be integrated into","def":"","zh":"使结合，融入","ex":["They are providing help for the newcomers to be integrated into society."]},{"w":"have access to","def":"","zh":"有...的使用权，有机会使用","ex":["Needy students have access to educational loans."]},{"w":"enhance","def":"vt. improve the quality, value, or amount of (sth.)","zh":"提高，增加，加强","ex":["The company tried hard to enhance its reputation.","take/draw comfort from/in (doing) sth.: feel calmer, happier, or more hopeful after one has been worried or unhappy 从...得到安慰e.g. The refugees took comfort in the kindness of strangers."]},{"w":"decrease","def":"n. a change downward","zh":"减少","ex":["The decrease in working population has become a concern in many developed countries."]},{"w":"violence","def":"n. behavior that is intended to hurt other people physically","zh":"暴力，暴行","ex":["The United Nations called for an end to the violence."]},{"w":"statistics","def":"n. collection of information shown in numbers","zh":"数据，统计资料","ex":["There are no reliable statistics for the number of victims in the disaster."]},{"w":"vary","def":"v. change or be different according to the situation","zh":"变化，改变","ex":["The cause of the sickness varies from person to person. This restaurant is known for varying its menu with the season."]},{"w":"somewhat","def":"ad. to some degree","zh":"稍微，有点","ex":["The doctor believes the case of the patient is somewhat out of the ordinary."]},{"w":"on the rise","def":"increasing","zh":"上升, 增加","ex":["The temperature is on the rise."]},{"w":"result from","def":"happen because of sth. else that happened first","zh":"因...而发生，产生自","ex":["Many health problems result from what you eat or the way you eat it."]},{"w":"trend","def":"n. a general direction in which sth. is developing or changing","zh":"趋势","ex":["The report is about the trend toward part-time employment."]},{"w":"aid","def":"vt. help or support","zh":"帮助，支持","ex":["So far there is little systematic effort from the government to aid the refugees."]},{"w":"a couple of","def":"(infml) an indefinite small number of","zh":"几个，三两个","ex":["I worked in a supermarket for a couple of weeks in the summer."]},{"w":"potential","def":"a. likely to develop into a particular type of person or thing in the future","zh":"潜在的，可能的","ex":["Forecasters say that potential flooding and mudslide could be life threatening."]},{"w":"guideline","def":"n. rules or instructions about the best way to do sth.","zh":"指南;准则","ex":["Should government provide clear guidelines for college education?"]},{"w":"revise","def":"vt. change (sth.) because of new information or ideas","zh":"修订；修改","ex":["I soon came to revise my opinion of the movie."]},{"w":"accidental","def":"a. happening by chance","zh":"偶然的；意外的","ex":["Their meeting was completely accidental."]},{"w":"clinical","def":"a.","zh":"临床的","ex":["The drug proved quite effective in clinical trials."]},{"w":"consideration","def":"n. thinking about sth.","zh":"考虑","ex":["What is your chief consideration in choosing a job?"]},{"w":"go back to","def":"have developed from (sth.) that happened or existed a long time ago","zh":"追溯到","ex":["The history of the town goes back to the beginning of the sixth century.","The median view of AI practitioners today is that we are still several decades from achieving human-level AI. (Para. 6): AI practitioners today tend to agree that it will take us several decades to achieve human-level AI."]},{"w":"in place","def":"working or ready to work; established","zh":"到位的;已确定的","ex":["Are there any policies against pollution in place?"]},{"w":"similar to","def":"almost the same as","zh":"类似","ex":["Some Westerners think the Japanese language is similar to the Chinese language."]},{"w":"build in","def":"make (sth.) a necessary part of sth.","zh":"使成为组成部分，列入","ex":["You could build in a wardrobe with mirrored doors. We can build in a special clause to make the contract better for you."]},{"w":"institution","def":"n. an established system, law or practice","zh":"制度，机制","ex":["WTO is a multilateral trade institution."]},{"w":"avoid","def":"vt. keep away from or stop oneself from doing (sth.)","zh":"避免","ex":["No one can avoid making mistakes."]},{"w":"destructive","def":"a. causing great damage","zh":"破坏的；毁灭性的","ex":["The recent earthquake was very destructive."]},{"w":"renewable","def":"a.","zh":"可再生的；可更新的","ex":["All our paper is made from timber from renewable forests. Renewable energy such as solar or wind energy is theoretically inexhaustible."]},{"w":"disabled","def":"a. (of a person) having a physical or mental condition that limits movements, senses, or activities","zh":"残疾的","ex":["Disabled people can have easy access to the service."]},{"w":"make strides in sth./doing sth.","def":"make great progress; improve quickly","zh":"取得很大进步","ex":["The country has made great strides in providing health care for its citizens. Our government has made great strides in poverty reduction."]},{"w":"moral","def":"a. based on the principle of right conduct rather than legality; concerned with the principles of right and wrong behavior","zh":"道义上的；道德的","ex":["They promised moral and financial support. Man is gifted with a moral sense by which he distinguishes good from evil."]}],"exercises":[{"id":"opener","part":"opener","type":"qa","title_en":"Opener — Warming Up","title_zh":"单元导览 · 热身问答","instr_en":"Watch the video clip and work in pairs to discuss the following questions.","instr_zh":"观看视频并两人一组讨论下列问题。","items":[{"q":"Which is smarter, the human brain or the computer mind? What does the speaker think?","zh":"人脑与电脑哪个更聪明？讲话者是怎么看的？","a":"There is no match for the human brain in the universe, and changing that is the ultimate goal of artificial intelligence. Artificial intelligence is not about building a robot but creating a computer mind that can think like a human.","az":"宇宙中没有什么是人脑的对手，而改变这一点正是人工智能的终极目标。人工智能不是造一个机器人，而是创造一个能像人一样思考的计算机心智。"},{"q":"Some say AI will save humanity; others say it could destroy us. What is your view?","zh":"有人说人工智能会拯救人类，也有人说它可能毁灭我们。你怎么看？","a":"Some say AI will save humanity. Others say it could destroy us. Either way, if and when it happens, the world will be changed forever.","az":"有人说人工智能会拯救人类，也有人说它可能毁灭我们。无论哪种，一旦成为现实，世界都将被彻底改变。"},{"q":"It is widely recognized that while robots can take over certain tasks, they will not completely replace humans. Which occupations are likely to be automated, and which will still require humans?","zh":"人们普遍认为机器人可以接手某些工作，但不会完全取代人类。哪些职业可能被自动化，哪些仍需人类参与？","a":"Routine, rule-based jobs such as assembly-line work, data entry and basic customer service are most likely to be automated. Jobs that call for emotional intelligence, creativity, judgement and care — teachers, nurses, social workers, artists and engineers — will continue to require human involvement.","az":"流水线作业、数据录入、基础客服等常规性、规则化的工作最可能被自动化；而需要情商、创造力、判断力与关怀的工作——教师、护士、社工、艺术家、工程师——仍离不开人。"}]},{"id":"org","part":"text","type":"qa","title_en":"Text Organization","title_zh":"课文结构分析","instr_en":"Pair work: This text can be divided into four parts. The paragraph numbers of each part have been given to you. Now write down the main idea of each part and compare notes with your partner.","instr_zh":"结对练习：课文可分为四个部分，各部分所含段落已给出。写出每部分的大意，然后与同伴对照。","items":[{"q":"Part One (Para. 1)","zh":"第一部分（第1段）","a":"Some thinkers believe that AI could pose a threat to the existence of human civilization.","az":"一些思想家认为，人工智能可能对人类文明的存续构成威胁。"},{"q":"Part Two (Paras. 2–4)","zh":"第二部分（第2–4段）","a":"The author holds a different view and lists several reasons for his optimistic stand. First, mankind has been confronted with existential threats before. Technology has always been a double-edged sword. Second, in the digital age, AI is not in one or two hands but in one or two billion hands. Third, statistics show violence has declined in the past few centuries.","az":"作者持不同看法，并列出乐观立场的若干理由：其一，人类此前也曾面临生存性威胁，技术历来是把双刃剑；其二，在数字时代，人工智能并不掌握在一两个人手里，而是掌握在十亿、二十亿人手中；其三，统计显示过去几个世纪暴力在减少。"},{"q":"Part Three (Paras. 5–8)","zh":"第三部分（第5–8段）","a":"The author puts forward the strategies which can be deployed to keep emerging technologies like AI safe. The most important approach we can take to keep AI safe, he thinks, is to work on our human governance and social institutions.","az":"作者提出可用于保障人工智能等新兴技术安全的策略。他认为，最重要的是完善人类治理与社会制度。"},{"q":"Part Four (Para. 9)","zh":"第四部分（第9段）","a":"The author concludes that AI will be the pivotal technology in addressing the grand challenges of humanity and humans will be able to make it safe.","az":"作者总结道，人工智能将成为应对人类重大挑战的关键技术，而人类有能力让它为我所用、确保安全。"}]},{"id":"dig","type":"qa","title_en":"Digging into Detail","title_zh":"课文细读","instr_en":"Answer the following questions to better understand the text.","instr_zh":"回答下列问题，深入理解课文。","items":[{"q":"Why does the author say AI won't be the first existential threat to humankind? (Para. 2)","zh":"作者为什么说人工智能不会是第一个威胁人类生存的问题？（第2段）","a":"Because we have already encountered a lot of threats, such as the possibility of a bioterrorist creating a new virus for which humankind has no defense.","az":"因为我们已经遭遇过许多威胁，例如生物恐怖分子可能制造出一种人类无法防御的新病毒。"},{"q":"Why has technology always been a double-edged sword? (Para. 2)","zh":"为什么技术一直是一把双刃剑？（第2段）","a":"Because technology can affect our life both positively and negatively.","az":"因为技术既能对我们的生活产生积极影响，也能产生消极影响。"},{"q":"What does the author want to tell us by mentioning Steven Pinker's 2011 book? (Para. 4)","zh":"作者提到史蒂文·平克 2011 年的著作，是想告诉我们什么？（第4段）","a":"He wants to tell us that violence is declining and we can take comfort from it.","az":"他想告诉我们，暴力正在减少，我们可以从中得到安慰。"},{"q":"What is the purpose of the meeting called the Asilomar Conference on Recombinant DNA? (Para. 5)","zh":"阿西洛马重组 DNA 会议的目的是什么？（第5段）","a":"To assess the potential dangers of recombinant DNA and devise a strategy to keep the field safe.","az":"评估重组 DNA 的潜在危险，并制定确保该领域安全的策略。"},{"q":"Who first considered ethical guidelines for AI? (Para. 6)","zh":"谁最先考虑为人工智能制定伦理准则？（第6段）","a":"Isaac Asimov.","az":"艾萨克·阿西莫夫。"},{"q":"What is the author's attitude toward achieving human-level AI? (Para. 6)","zh":"作者对实现人类水平的人工智能持什么态度？（第6段）","a":"He is more optimistic than other scientists and predicts that we will achieve human-level AI by 2029.","az":"他比其他科学家更乐观，并预测我们将在 2029 年实现人类水平的人工智能。"},{"q":"According to the author, what is the most important approach we can take to keep AI safe? (Para. 8)","zh":"根据作者的观点，确保人工智能安全最重要的途径是什么？（第8段）","a":"The most important approach is to work on our human governance and social institutions.","az":"最重要的途径是改进人类的治理方式和社会制度。"},{"q":"What does the author conclude in the last paragraph? (Para. 9)","zh":"作者在最后一段得出了什么结论？（第9段）","a":"He concludes that we should not fear AI and we will be able to use it in a safe way.","az":"他的结论是：我们不应害怕人工智能，我们将能够以安全的方式使用它。"}],"part":"text"},{"id":"diff","part":"text","type":"mc","title_en":"Understanding Difficult Sentences","title_zh":"难句理解","instr_en":"Choose the answer that correctly interprets the sentence from the text.","instr_zh":"选出对课文中句子释义正确的一项。","items":[{"q":"AI is not in one or two hands; it's in 1 billion or 2 billion hands. (Para. 3)","zh":"人工智能并非掌握在一两个人手中，而是掌握在十亿、二十亿人手中。（第3段）","opts":[{"k":"A","en":"AI is not made by one or two people but by lots of people.","zh":"人工智能不是由一两个人、而是由很多人创造出来的。"},{"k":"B","en":"Not one or two people use AI, but 1 billion or 2 billion people use it.","zh":"使用人工智能的并非一两个人，而是十亿、二十亿人在使用它。"}],"a":"B"},{"q":"That is already the case. (Para. 4)","zh":"情况已经如此。（第4段）","opts":[{"k":"A","en":"AI already assists groups that are in conflict.","zh":"人工智能已经在协助那些处于冲突中的群体。"},{"k":"B","en":"This is true that AI leads to conflicts among groups of people.","zh":"人工智能确实会引发人群之间的冲突。"}],"a":"A"},{"q":"The impression that violence is on the rise results from another trend: exponentially better information about what is wrong with the world ... (Para. 4)","zh":"之所以有暴力正在上升的印象，源于另一种趋势：关于世界上种种问题的信息正以指数级速度变得更为充分……（第4段）","opts":[{"k":"A","en":"We are better-informed about violent acts being committed around the world nowadays, which makes us feel that violence is increasing ...","zh":"如今我们更容易获悉世界各地发生的暴力行为，这让我们觉得暴力在增加……"},{"k":"B","en":"The fact that better information about what is wrong with the world results in another trend of violence increasing is impressive ...","zh":"关于世界问题的更充分信息导致了暴力上升的另一种趋势，这一点令人印象深刻……"}],"a":"A"},{"q":"..., but either way we do have time to devise ethical standards. (Para. 6)","zh":"……但无论哪种情况，我们确实还有时间制定伦理准则。（第6段）","opts":[{"k":"A","en":"but we still have enough time to come up with ethical standards in more than one way.","zh":"但我们仍有足够的时间，用不止一种方式提出伦理准则。"},{"k":"B","en":"..., but we certainly have time to work out ethical standards whether we achieve human-level AI in several decades or in 2029.","zh":"……但无论我们是在几十年后还是在2029年达到人类水平的人工智能，我们当然都有时间制定出伦理准则。"}],"a":"B"},{"q":"There are efforts at universities and companies to develop AI safety strategies and guidelines, some of which are already in place. (Para. 7)","zh":"高校和企业都在努力制定人工智能安全策略与准则，其中有些已经到位。（第7段）","opts":[{"k":"A","en":"Many universities and companies are working at developing AI safety strategies and guidelines; some strategies and guidelines have already been made and used.","zh":"许多高校和企业都在制定人工智能安全策略与准则；有些策略与准则已经制定并投入使用。"},{"k":"B","en":"Many universities and companies are working at developing AI safety strategies and guidelines but some strategies and guidelines remain the same as before.","zh":"许多高校和企业都在制定人工智能安全策略与准则，但有些策略与准则仍和从前一样。"}],"a":"A"}]},{"id":"kw11","part":"text","type":"fill","title_en":"Key Words & Expressions 1.1","title_zh":"重点词汇 1.1 · 选词填空","instr_en":"Fill in the blanks with words or phrases from the box below. Change the form where necessary.","instr_zh":"用下面方框中的词或短语填空，必要时改变形式。","bank":["surpass","pose","existence","voice","encounter","comparable","enhance","decrease","violence","statistics","vary","somewhat","trend","aid","potential","guideline","revise","accidental","clinical","consideration","institution","avoid","destructive","renewable","disabled","moral","burn down","be integrated into","have access to","take/draw comfort from/in (doing) sth.","on the rise","result from","a couple of","go back to","in place","similar to","build in","make strides in sth./doing sth."],"items":[{"q":"Some people give a regular monthly donation while others ______ the amount they give.","zh":"一些人每月定期捐款，而另一些人捐款的数额则各不相同。","a":"vary","hint":"vary 变化；不同"},{"q":"Legislators are ______ additional measures to protect business interests abroad.","zh":"立法者正在纳入额外的措施，以保护海外商业利益。","a":"building in","hint":"build in 纳入；内置"},{"q":"My Irish heritage ______ the day when my great-great-great grandfather married the daughter of a wealthy Irish landowner.","zh":"我的爱尔兰血统可以追溯到我高曾祖父迎娶一位富有爱尔兰地主的女儿的那一天。","a":"goes back to","hint":"go back to 追溯到"},{"q":"It was reported that heavy rain led to ______ flash floods throughout the Phoenix, Arizona area yesterday.","zh":"据报道，昨天亚利桑那州凤凰城地区的大雨引发了毁灭性的暴洪。","a":"destructive","hint":"destructive 毁灭性的"},{"q":"The foundations of modern medicine were being laid during the 16th century — namely, by the introduction of ______ instruction in hospitals.","zh":"现代医学的基础是在16世纪奠定的——具体地说，是通过在医院引入临床教学。","a":"clinical","hint":"clinical 临床的"},{"q":"Safety features are fully ______ the design of the new vehicles.","zh":"安全性能已完全融入新车的设计之中。","a":"integrated into","hint":"be integrated into 被融入"},{"q":"The man was accused of trying to ______ the school by setting fire to a pile of papers.","zh":"这名男子被指控企图点燃一堆纸来烧毁学校。","a":"burn down","hint":"burn down 烧毁"},{"q":"Fashion ______ are difficult to predict these days and it’s widely believed that they primarily exist just to sell clothes.","zh":"如今时尚潮流很难预测，人们普遍认为它们的存在主要只是为了卖衣服。","a":"trends","hint":"trend 趋势；潮流"},{"q":"Change in ecosystem structure may ______ reduction of sea ice and related temperature changes.","zh":"生态系统结构的变化可能源于海冰的减少以及相关的温度变化。","a":"result from","hint":"result from 由……引起"},{"q":"When my condition improved after taking the herbal medicine, the doctor said it was purely ______.","zh":"服用草药后我的病情好转，医生说是纯属偶然。","a":"accidental","hint":"accidental 偶然的"},{"q":"We follow very strict ______ on the use and storage of personal details on computers.","zh":"我们在计算机上使用和存储个人资料方面遵循非常严格的准则。","a":"guidelines","hint":"guideline 准则"},{"q":"I know my daughter goes out a lot at night, but I ______ the fact that she’s always with friends.","zh":"我知道女儿晚上常外出，但让我感到宽慰的是她总是和朋友在一起。","a":"take comfort from","hint":"take/draw comfort from 从……中得到安慰"},{"q":"Firefighters pointed to three ______ causes of the fire last night.","zh":"消防员指出了昨晚大火的三个可能成因。","a":"potential","hint":"potential 潜在的；可能的"},{"q":"Aside from the threat of physical ______, the mass deployment of AI robots would have huge socio-economic impacts.","zh":"除了人身暴力的威胁之外，人工智能机器人的大规模部署还会产生巨大的社会经济影响。","a":"violence","hint":"violence 暴力"},{"q":"While no one could reasonably suggest that AI is a threat to human ______ currently, it is the technology’s unknown future that is causing concerns.","zh":"虽然目前没有人能合理地认为人工智能威胁到人类生存，但正是这项技术未知的未来令人担忧。","a":"existence","hint":"existence 生存；存在"}]},{"id":"kw12","part":"text","type":"fill","title_en":"Key Words & Expressions 1.2","title_zh":"重点词汇 1.2 · 替换划线部分","instr_en":"Replace the underlined part in each of the following sentences with a word or phrase from the box below. Write your answer in the brackets. Change the form where necessary.","instr_zh":"用方框中的词或短语替换下列句子中画线的部分，把答案写在括号内，必要时改变形式。","bank":["institution","on the rise","comparable","enhance","a couple of","revise","aid","somewhat","encountered","in place"],"items":[{"q":"The [[system]] of slavery in America dates back to the early 1600s when the first African slaves were brought to the New World.","zh":"美国的奴隶制度可以追溯到17世纪初，那时第一批非洲奴隶被带到新大陆。","a":"institution"},{"q":"The official statistics show that housing prices have been [[going up]] over the past few years.","zh":"官方统计数据显示，过去几年房价一直在上涨。","a":"on the rise"},{"q":"Men and women should receive equal pay when they perform work that involves [[similar]] skills and responsibility.","zh":"男女在从事技能和责任相当的工作时应获得同等报酬。","a":"comparable"},{"q":"A number of our clients want to look younger to [[improve]] their career prospects.","zh":"我们的一些客户希望显得更年轻，以改善职业前景。","a":"enhance"},{"q":"There’s not much in the way of entertainment in this town — just the cinema and [[a few]] pubs.","zh":"这个镇上没什么娱乐——只有一家电影院和几家酒吧。","a":"a couple of"},{"q":"The staff were asked to work together to [[make necessary changes to]] the proposal before submitting it again.","zh":"员工们被要求共同合作，在再次提交前对提案作必要的修改。","a":"revise"},{"q":"Huge projects designed to [[help]] poorer countries can sometimes do more harm than good.","zh":"旨在援助较贫穷国家的大型项目有时弊大于利。","a":"aid"},{"q":"Though troubled, she felt [[more or less]] relieved at not having to keep the secrets to herself anymore.","zh":"尽管心绪不宁，但不必再独自保守秘密让她多少感到宽慰。","a":"somewhat"},{"q":"You are the most extraordinary and wonderful woman I have [[met]] since I came to this university.","zh":"自我来到这所大学，你是我所遇到过的最非凡、最美好的女性。","a":"encountered"},{"q":"The arrangements are all [[ready]] for the concert next Thursday.","zh":"下周四音乐会的各项安排都已就绪。","a":"in place"}]},{"id":"kw13","part":"text","type":"fill","title_en":"Key Words & Expressions 1.3","title_zh":"重点词汇 1.3 · 仿例完成句子","instr_en":"Complete each of the following sentences after the model with the word or phrase in brackets. Make changes or additions where necessary.","instr_zh":"仿照例句，用括号中的词或短语完成下列句子，必要时作改动或补充。","items":[{"q":"Model: A meeting called the Asilomar Conference on Recombinant DNA was organized in 1975 to assess its ______ dangers and devise a strategy to keep the field safe. (potential)","zh":"范例：1975年召开了一次名为“阿西洛马重组DNA会议”的会议，以评估其潜在危险并制定保障该领域安全的策略。（potential）","a":"potential"},{"q":"The new law will allow more ______ people to enter the mainstream of American life. (disabled)","zh":"这部新法律将使更多残疾人能够进入美国生活的主流。","a":"disabled"},{"q":"To my grandmother it seems that ______ standards in today’s society are in decline. (moral)","zh":"在我祖母看来，当今社会的道德水准似乎在下降。","a":"moral"},{"q":"To solve the energy problem, we are encouraged to use ______ energy such as wind and solar power. (renewable)","zh":"为了解决能源问题，我们被鼓励使用风能和太阳能等可再生能源。","a":"renewable"},{"q":"Although we speak of marriage as an ______, it is only an imperfect one. (institution)","zh":"虽然我们把婚姻称为一种制度，但它只是一种不完善的制度。","a":"institution"},{"q":"We are approaching the time when machines will be able to ______ humans at almost any task. (surpass)","zh":"我们正在接近这样一个时代：机器将能在几乎任何任务上超越人类。","a":"surpass"},{"q":"According to (official) ______, the Japanese work longer hours than workers in most other industrialized countries. (statistics)","zh":"根据（官方）统计，日本人的工作时间比大多数其他工业化国家的工人更长。","a":"statistics"},{"q":"At the initial stage, all the investigators were asked to ______ making judgments about who should be to blame for the incident. (avoid)","zh":"在初期阶段，所有调查人员都被要求避免就该事件应由谁负责作出判断。","a":"avoid"},{"q":"That is an interesting job offer — I’d give it serious ______ if I were you. (consideration)","zh":"那是一份很有意思的工作邀约——如果我是你，我会认真考虑它。","a":"consideration"}]},{"id":"usage","part":"text","type":"fill","title_en":"Usage 2.1 — “as” as a Conjunction","title_zh":"语法运用 2.1 · as 作连词的替换","instr_en":"Replace the underlined part of each sentence with an appropriate word or expression while keeping its original meaning.","instr_zh":"用恰当的词或表达替换下列句子中画线的部分，保持原意不变。","items":[{"q":"Still, [[as]] I think about my son … I can’t help but wonder what the world holds in store for him.","zh":"尽管如此，当我想到我的儿子时……我不禁想知道这个世界为他准备了什么。","a":"when"},{"q":"And [[as much as]] you love this person, you have to admit your friend is driving rather recklessly and too fast.","zh":"尽管你非常爱这个人，你也不得不承认你的朋友开车相当鲁莽而且太快。","a":"although"},{"q":"But by late 1943, the Germans told the Japanese that the Polish Jews were “stateless” — Poland no longer existed, [[as]] it was under German rule, they claimed.","zh":"但到1943年末，德国人告诉日本人波兰犹太人是“无国籍者”——他们声称波兰已不复存在，因为它处在德国统治之下。","a":"because / since"}]},{"id":"usage2","part":"text","type":"fill","title_en":"Usage 2.2 — Using “as”","title_zh":"语法运用 2.2 · 用 as 完成句子","instr_en":"Use “as” to complete each of the following sentences in English according to the Chinese given.","instr_zh":"根据所给汉语，用 as 完成下列句子。","items":[{"q":"______ (正像在世界其他地方那样), the most popular emoji in life and work is the happy face.","zh":"正像在世界其他地方那样，生活和工作中最流行的表情符号是笑脸。","a":"Just as it is in the rest of the world"},{"q":"______ (像他们做的那样去做), and have that as your breakfast instead.","zh":"照他们的样子做，把它当作你的早餐。","a":"Do as they do"},{"q":"The first time she sat on a bus with her mother, she also thought becoming a bus conductor would be great, ______ (因为她可以每天坐公共汽车).","zh":"她第一次和母亲坐公共汽车时，也觉得当售票员很不错，因为她可以每天坐公共汽车。","a":"as she could ride the bus every day"}]},{"id":"sp31","part":"text","type":"fill","title_en":"Sentence Patterns 3.1 — once","title_zh":"句型 3.1 · once（一旦；一经）","instr_en":"Use “once” to complete each of the following sentences in English according to the Chinese given.","instr_zh":"根据所给汉语，用 once 完成下列句子。","items":[{"q":"______ (新条例一经制定成功), they can be applied to every taxpayer.","zh":"新条例一经制定完成，就可以适用于每一个纳税人。","a":"Once the new rules are in place"},{"q":"We are going to make a decision at a later date ______ (一旦情况稳定).","zh":"一旦情况稳定，我们会在稍后的日子作出决定。","a":"once everything has stabilized"},{"q":"______ (她一旦拿到密码), she will just log into the boss’s machine and move the files over to another USB stick.","zh":"她一旦拿到密码，就会直接登录老板的电脑，把文件转移到另一个U盘上。","a":"Once she obtains the password"}]},{"id":"sp32","part":"text","type":"fill","title_en":"Sentence Patterns 3.2 — similar to","title_zh":"句型 3.2 · similar to（与……相似）","instr_en":"Use “similar to” to complete each of the following sentences in English according to the Chinese given.","instr_zh":"根据所给汉语，用 similar to 完成下列句子。","items":[{"q":"About 70,000 migrants crossed the Mediterranean into Italy from January to June this year, ______ (和去年同期相似).","zh":"今年1月至6月约有7万名移民穿越地中海进入意大利，与去年同期相似。","a":"similar to the same period last year"},{"q":"______ (和这些工具相似), Voxer allows you to send voice, text and photo messages to other users.","zh":"与这些工具相似，Voxer 允许你向其他用户发送语音、文本和图片信息。","a":"Similar to these tools"},{"q":"______ (和你之前提到的例子相似), the presidential election will have very real economic and political consequences.","zh":"与你之前提到的例子相似，总统选举将产生非常实际的经济和政治后果。","a":"Similar to the examples you have mentioned"}]},{"id":"cloze","part":"text","type":"cloze","title_en":"Comprehensive Practice 4.1 — Cloze","title_zh":"综合练习 4.1 · 完形填空","instr_en":"Complete the passage with the appropriate words or expressions in the box. Change the form when necessary.","instr_zh":"用方框中恰当的词或短语完成短文，必要时改变形式（方框中有多余选项）。","bank":["voice","decrease","pose","trend","vary","institution","enhance","existence","on the rise","go back to","be integrated into","in place","take/draw comfort from"],"passage":"We live in a world where the use of robots is {{1}}. Should this be welcomed? There is no doubt that they have the ability to {{2}} our standard of living, enabling us to live a more comfortable {{3}}. Yet fears have been {{4}} that robots may eventually {{5}} a threat to humanity. With the {{6}} towards ever smarter robots as artificial intelligence becomes ever more enhanced, could it be possible that they could
