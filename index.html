ide of the moon. Ninety percent of the ocean floor has not even been charted, and while we have been to the moon, the technology to explore the ocean’s floors is still being developed. For example, a permanent partially-submerged sea exploration station, called the SeaOrbiter, is currently in development.","zh":"就以海洋为例。我们对海洋的所知，远远少于我们对月球背光面的了解。90%的海底没有绘制成图。我们已经到过月球，但探索海底的技术还正在开发之中，比如，目前正在开发海洋探测者号，它是一个部分沉没在水下的永久性海洋探测站。"},{"n":8,"en":"The oceans play a major role in controlling our climate. But we have not learned yet how to use them to cool us off rather than contribute to our overheating. (3) Ocean organisms are said to hold the promise of cures for an array of diseases. An examination of the unique eyes of skate (ray fish) led to advances in combating blindness, the horseshoe crab was crucial in developing a test for bacterial contamination, and sea urchins helped in the development of test-tube fertilization.","zh":"海洋在控制我们的气候中起着主要作用。但我们尚未学会如何利用海洋为我们降温而不是使已经过热的气候火上加油。海洋生物据说有望提供治愈一系列疾病的办法。研究鳐鱼(也称雷鱼)的独特的眼睛，使我们在战胜失明方面取得了进步。在研发细菌污染测试方法方面，马蹄蟹至关重要，而海胆对试管受精的研发也很有帮助。"},{"n":9,"en":"The toadfish’s ability to regenerate its central nervous system is of much interest to neuroscientists. A recent Japanese study concluded that the drug eribulin, which was derived from sea sponges, is effective in combating breast, colon, and urinary cancer.","zh":"蟾鱼的中枢神经系统能再生，这使神经科学家很感兴趣。最近日本的一项研究得出结论，从海绵中提炼出来的药物艾日布林，在防治乳腺癌、结肠癌、泌尿系统癌症方面很有疗效。"},{"n":10,"en":"Given the looming crisis of water scarcity, we badly need more efficient and less costly methods to desalinate ocean water. By 2025, 1.8 billion people are expected to suffer from severe water scarcity, with that number jumping to 3.9 billion by 2050 — well over a third of the entire global population.","zh":"由于水资源短缺危机迫近，我们急需更有效、更低成本的方法来淡化海水。到2025年，预计将有18亿人遭受严重的缺水，而到2050年该数字将跳到39亿，大大超过全球人口的三分之一。"},{"n":11,"en":"(4) If the oceans do not make your heart go pitter-patter, how about engineering a bacterium that eats carbon dioxide — and thus helps protect the world from overheating — AND excretes fuel which will allow us to drive our cars and machines, without oil? I cannot find any evidence that people young or old, Americans or citizens of other nations, would be less impressed or less inspired with such a breakthrough than with one more set of photos of a far away galaxy or a whole Milky Way full of stars.","zh":"如果海洋并不使你怦然心动，那么制造一种细菌，它能吃掉二氧化碳，不让世界过热，并且它还排出燃料，使我们开车开机器都不用油，你觉得怎样呢?我有理由相信，这样的科学突破将令人们(无论老少，无论是美国人还是别国公民)感动和振奋，其震撼力将远远超过又一组遥远星系或整个群星点缀的银河系的照片。"},{"n":12,"en":"Space enthusiasts claim that space exploration has generated major spinoffs for our life right here on Earth. President Obama suggested that the Apollo mission “produced technologies that have improved kidney dialysis and water purification systems; sensors to test for hazardous gases; energy-saving building materials; and fire-resistant fabrics used by firefighters and soldiers.” A few more innovations can be added to the list: digital imaging, implantable pacemakers, collision-avoidance systems on aircraft, precision LASIK eye surgery, and global positioning satellites.","zh":"热心太空的人声称，太空探索为我们在地球上的生存产生了重要的副产品。奥巴马总统曾经说过阿波罗计划“产生了改进肾透析和水净化系统的技术、检测有害气体的传感器、节能的建筑材料、消防队员和士兵使用的耐火织物。”除了他提到的还可以另加上几项其他创新:数字成像、植入式心脏起搏器、飞机上的防撞系统、眼科的精密激光视力矫正手术，以及全球定位卫星。"},{"n":13,"en":"Of course, the space environment is radically different from the one on Earth. Materials and technologies that are suited for a vacuum, zero gravity, and extreme cold and heat are not the ones we typically can use on Earth.","zh":"当然，空间环境与地球环境大相径庭。适用于真空、零重力、极端温度的材料和技术不是我们通常可以在地球使用的。"},{"n":14,"en":"Elias Carayannis, professor of Science, Technology, Innovation and Entrepreneurship at The George Washington University, notes “government agencies — particularly those such as the National Aeronautics and Space Administration that are continually pressured to justify their activities — tout the spin-off value of their investments in sometimes quite extravagant claims.” Products such as Velcro, Tang, and Teflon that are often cited as spinoffs of space technology did not actually result from the space program.","zh":"乔治·华盛顿大学科技创新和创业教授伊莱亚斯·卡拉扬尼斯指出，“政府机构——尤其是像美国国家航空航天局之类的需要不断证明自己活动的必要性的机构——有时把航天业副产品的价值吹得天花乱坠。”实际上经常被引为航天技术副产品的维可牢、菓珍、特氟龙等，并非产生于太空计划。"},{"n":15,"en":"Space promoters tell us, once every few months, that there are signs that there might be or has been water on one of the planets that might make “life” possible. I wonder if some of those who hear these reports interpret them to mean that we expect to find a civilization out there. What scientists are really talking about is organic material, the kind found in any compost — not a reason to spend billions of dollars of public funds.","zh":"每隔数月，太空计划的推动者就要告诉我们，有迹象表明，有一颗行星上可能有或者曾经有过水，使“生命”有可能存在。我真不知道，听到这些报告的人是否会把它们解读为我们期待在太空发现一个文明社会。其实科学家们说的是有机物质，在任何堆肥中发现的那种物质——这可不是花费数十亿美元公共资金的理由。"},{"n":16,"en":"In short, do not cry for Mars. It is not going away. We can send R2D2 to explore it and still keep a whole pile of dough for important and inspiring exploration missions right here on Earth, starting at the beach nearest you.","zh":"总之，不要为火星哭泣，它不会消失。我们可以把R2D2(宇航技工机器人)送上去探索火星，同时仍能用省下的一大堆钱，从离你最近的海滩开始，在地球上进行重要而令人鼓舞的探索。"}],"audio_full":"r1full.mp3","vocab":[]},{"id":"r2","label_zh":"阅读 2","label_en":"Reading 2","title_en":"Race to the Deep","title_zh":"奔向深海","author_en":"Rebecca Morelle","author_zh":"丽贝卡·莫莱尔","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"In a shipyard a few hours south of Shanghai music is playing, Chinese lions are dancing and giant balloons are whipping about in the wind.","zh":"位于上海以南几小时车程的一个船厂里，人们奏着音乐，舞起中国狮子，巨型气球在风中飘荡。"},{"n":2,"en":"A huge crowd has gathered to watch China’s new scientific research ship enter the water for the first time. And after the obligatory bottle of champagne is smashed, the tethers are cut and the 100m-long vessel rolls into the water.","zh":"一大群人聚集在这里观看中国新科研船的首次下水。按照习俗行过将一瓶香槟在船首击碎的掷瓶礼，切断缆绳，这百米长的船就下水了。"},{"n":3,"en":"This ship, equipped with on-board labs and the latest scientific kit, will eventually explore the world’s oceans.","zh":"这艘船配有船载实验室和最新的科研器具，最终将探索世界的海洋。"},{"n":4,"en":"But it is also going to help China plunge beneath the waves: it will serve as a launch-pad for submarines that can dive to the deepest parts of the ocean.","zh":"但它也将帮助中国投身于海浪之下的世界:它将作为发射台，让潜水艇潜入海底最深处。"},{"n":5,"en":"“Humans know much less about the deep oceans than we know about the surface of the Moon and Mars. That’s why I want to develop the facility for ocean scientists to reach the deep seas,” says Prof. Cui Weicheng.","zh":"“人类对深海的了解远不及对月球和火星表面的了解。这就是为什么我要建造这艘船，让海洋科学家进入深海，” 崔维成教授说。"},{"n":6,"en":"He is the dean of deep sea science at Shanghai Ocean University and head of the Rainbow Fish project which built the new research ship. His team is also busy developing submersibles.","zh":"崔维成是上海海洋大学深渊科学技术研究中心主任、“彩虹鱼”项目的负责人，正是这个项目造了这艘科研船。他们团队正忙于开发潜水器。"},{"n":7,"en":"One of its unmanned subs4 reached a depth of 4,000m (13,000ft) in its most recent trial.","zh":"该公司建造的一艘无人驾驶潜水艇在最近一次试验中潜入了4,000米(13,000英尺)的深海。"},{"n":8,"en":"But Rainbow Fish’s ultimate goal is manned exploration and it plans to take humans to the very bottom of the ocean — the Mariana Trench, in the Pacific, at a depth of nearly 11,000m (36,000ft).","zh":"但“彩虹鱼”的终极目标是载人探索，计划把人送到最深的海底——太平洋的马里亚纳海沟，其深度接近11,000米(36,000英尺)。"},{"n":9,"en":"Cui shows me around a life-size model of the submarine that he hopes will make the dive in 2019. It’s bright red, about 10m-long and has a streamlined design.","zh":"崔带我参观了潜艇模型，其尺寸与他希望能在2019年下水的潜水艇相同。它是鲜红色的，约10米长，流线型设计。"},{"n":10,"en":"He explains that there is room inside for a crew of three, who will be protected by a thick metal sphere.","zh":"他解释说，潜艇可容纳三名船员，有厚厚的金属球形面保护他们。"},{"n":11,"en":"“At the moment, we are in the design stage, so we are testing several extremely high-strength materials for it.”","zh":"“目前，我们处在设计阶段，所以我们正在为它测试几种强度极高的材料。”"},{"n":12,"en":"It will have to withstand immense pressures from the crushing weight of water above. If there are any weaknesses the submarine will implode.","zh":"该潜艇必须能够承受来自其上方海水的千钧压力。如果有任何弱点，潜艇就会崩塌。"},{"n":13,"en":"The deepest ocean is a place few people have ever experienced first-hand.","zh":"最深的海洋是个几乎没有人亲身体验过的地方。"},{"n":14,"en":"The first dive to the Mariana Trench was carried out in 1960 by US Navy Lieutenant Don Walsh and Swiss engineer Jacques Piccard. Their vessel, the Bathyscaphe Trieste, creaked and groaned as it made the descent, taking nearly five hours.","zh":"1960年，美国海军上尉唐·沃尔什和瑞士工程师雅克·皮卡德首次潜入马里亚纳海沟。他们的“的里雅斯特”号深海潜艇下沉花了近5个小时，一路发出嘎吱嘎吱的呻吟。"},{"n":15,"en":"The only other manned expedition was carried out by Hollywood director James Cameron, who took a solo plunge in a bright green submarine in 2012.","zh":"唯一的另一次载人探险是由好莱坞导演詹姆斯·卡梅隆完成的，他单人驾驶一艘鲜绿色的潜艇于2012年潜入海底。"},{"n":16,"en":"Rainbow Fish wants its sub to be next.","zh":"“彩虹鱼”项目组希望其所造的潜艇将会进行下一次海底探险。"},{"n":17,"en":"The team foresees three groups using the Rainbow Fish research ship and submarines.","zh":"该团队预测有三个群体会使用其科研船和潜艇。"},{"n":18,"en":"The first, naturally, is the scientists who are interested in studying deep-sea science and technology. The second group is offshore companies and oil companies. The last one is tourists and adventurers who want to go down themselves to have a look at what’s going on there.","zh":"首先自然是有兴趣研究深海科技的科学家们。第二个群体是海洋企业和石油公司。最后是想亲自到海底看看是怎么回事的游客和冒险家。"},{"n":19,"en":"Deep-sea research is a difficult, high-risk activity — and much of the ocean remains unexplored. But Cui, who hopes to be the first Chinese person to reach the Mariana Trench, believes that China could be the nation to truly open up this final frontier.","zh":"深海研究是一个难度大风险高的活动，大部分海洋仍然未被探测过。但崔维成希望成为潜入马里亚纳海沟的第一个中国人，他认为中国可以成为真正揭开这最后疆域面纱的国家。"}],"audio_full":"r2full.mp3","vocab":[]}],"vocab":[{"w":"explore","def":"v. search into or travel in (an area) for the purpose of discovery","zh":"探测，考察exploration: n. 探测，考察","ex":["The company is eager to explore for oil. Columbus discovered America but did not explore the new continent. Our team is now exploring ways to improve energy efficiency. The mountain climbers used this hut as a base for further exploration."]},{"w":"survival","def":"n. the state of continuing to live or exist","zh":"生存","ex":["“Survival of the fittest” is the law of the jungle. An animal’s sense of smell is crucial to its survival."]},{"w":"on the heels of","def":"following closely; keeping in step with","zh":"紧跟...之后","ex":["Journalists arrived (hot) on the heels of the police for news about the accident."]},{"w":"specimen","def":"n. a portion or quantity of material for use in testing, examination, or study","zh":"标本","ex":["We have to test a specimen of your blood before you can become a donor."]},{"w":"species","def":"(pl. species) n.(","zh":"生物学)物种","ex":["The giant panda used to be an endangered (濒临灭绝的) species, but now it has been reclassified as a vulnerable (易受伤害的) species."]},{"w":"assume","def":"vt. take for granted; suppose","zh":"想当然，以为","ex":["We can safely assume that everyone in this small town has a mobile phone."]},{"w":"from the beginning","def":"","zh":"从一开始","ex":["Let me tell you what happened on this trip right from the beginning."]},{"w":"influence","def":"n.","zh":"影响","ex":["As the biggest employer of this town, DuPont has a huge amount of influence on local politics."]},{"w":"As yet","def":"(used in negatives) until now/then","zh":"到目前(或那时)为止","ex":["There is no cure for this disease as yet. We have got so many questions, but as yet no answers.","Unlike the coelacanth, which was thought to have gone extinct, we have known for centuries that giant squid have existed in our oceans’ depths. (Para. 2): In this sentence, the non- restrictive attributive clause explains in what sense the giant squid is unlike the coelacanth: The giant squid has been known to exist for centuries, while the coelacanth is thought to have gone extinct.giant: n. a living being of great size 巨人，巨大的怪物 a. having extremely large size or power 巨大的e.g. He was one of the intellectual giants of our country. The body of a giant whale has (been) washed up onto the beach."]},{"w":"observe","def":"vt. watch attentively","zh":"观察observation: n. 观察","ex":["The role of scientists is to observe and describe the world, not to try to control it. They observed how the parts of the machine fitted together. She spent two nights in the hospital under close observation."]},{"w":"elusive","def":"a. difficult to find, describe, understand or achieve","zh":"难以捉摸的","ex":["Late night taxis are elusive and far from cheap. Her answer was elusive."]},{"w":"for the first time","def":"","zh":"第一次","ex":["When were modern intelligence techniques taken to the battlefield for the first time?"]},{"w":"landmark","def":"n. an object (such as a stone or tree) that marks the boundary of land; an event or development that marks a turning point","zh":"地标；里程碑","ex":["The Golden Gate Bridge is a famous landmark of San Francisco. In 1954, the U.S. Supreme Court ruled in its landmark decision Brown v. Board of Education that racial segregation in public schools was unconstitutional."]},{"w":"a drop in the bucket/in the ocean","def":"","zh":"沧海一粟","ex":["I can show you around a bit. But what I know about the city is but a drop in the ocean."]},{"w":"vital","def":"a. of the utmost importance; full of life and vigor","zh":"重要的；充满活力的","ex":["Regular exercise is vital to our health. Exercise keeps her young and vital."]},{"w":"Provide for","def":"supply what is needed for","zh":"供养，供给","ex":["Elaine would not let her boyfriend provide for her."]},{"w":"impact","def":"n.","zh":"冲击，影响","ex":["The impact of high housing price on spending is obvious."]},{"w":"planet","def":"n.","zh":"行星","ex":["The Earth is one of the planets orbiting (around) the sun."]},{"w":"learn about","def":"","zh":"了解，学习","ex":["Forgive those who betray you or break your heart, for they have helped you learn about trust."]},{"w":"entirety","def":"n. the whole or total amount of sth.","zh":"全部in one’s entirety: as a whole 整体地，全面地","ex":["The peace plan has not been accepted by the parties in its entirety. The movie should be shown in its entirety, or not at all."]},{"w":"alien","def":"a. strange, unfamiliar; foreign","zh":"陌生的，不常见的；外国的","ex":["Sushi is an alien food to many residents here. They are strongly opposed to the presence of alien forces in their country.","We sank a whale, which had died from apparently natural causes and washed up on shore, 2,000 feet below the Sea of Japan ... (Para. 6): Please take note that the adverbial phrase “2,000 feet below the Sea of Japan” modifies the verb “sank.” So the sentence means that “we” found a whale which had died from apparently natural causes and washed up on shore, and “we” sank it to the ocean floor which was 2,000 feet below the Sea of Japan.die from/of: 因...而死e.g. The doctor told the patient that two alternatives were available to him — have the surgery, or die of the infection."]},{"w":"array","def":"n.","zh":"大批，大量","ex":["There was a vast array of colours to choose from."]},{"w":"overlook","def":"vt. fail to notice or consider","zh":"忽视","ex":["We tend to overlook all sorts of warning signals about our own health until it finally fails."]},{"w":"feed on","def":"eat","zh":"以...为食，吃","ex":["The seals (海豹) feed mainly on fish and squid."]},{"w":"crack open","def":"break (sth.) open","zh":"打开，砸开","ex":["The door is locked. We need to crack it open."]},{"w":"gear","def":"n.","zh":"齿轮","ex":["John usually oils the gears before he starts the machine."]},{"w":"hostile","def":"a. very unfriendly","zh":"不友好的；敌对的","ex":["As a politician, he ought to know how to handle hostile media. The camel can survive much longer than any other animal in the hostile desert habitat."]},{"w":"expertise","def":"n. special skills or knowledge in a particular subject","zh":"专长","ex":["None of our competitors comes close to our level of expertise."]},{"w":"amount","def":"n.","zh":"数量，总额","ex":["Our project is as yet far from completion. A considerable amount of work remains to be done."]},{"w":"funding","def":"n.","zh":"资金","ex":["We need to find new sources of funding for the project to continue. As a private school, the college does not receive any government funding."]},{"w":"countless","def":"a.","zh":"数不清的","ex":["Tom’s family, and countless others in their community, are against Brexit (英国脱欧)."]},{"w":"under/below/beneath the surface of","def":"","zh":"在...的表面之下","ex":["We could see fish swimming just under the surface of the water. There was anger just beneath the surface of his voice."]},{"w":"fit together","def":"be well suited to each other","zh":"非常相配;吻合","ex":["I don’t see how the ideas and facts fit together in your theory. The witness’s story has a few details that do not fit together."]},{"w":"completion","def":"n.","zh":"完成，实现","ex":["Upon successful completion of the four-year program, the students will be awarded a bachelor’s degree."]},{"w":"reveal","def":"vt. Make known (sth. Concealed or secret)","zh":"揭露，透露","ex":["Under the terms of their agreement with the drug manufacturer, victims are not allowed to reveal the details of the settlement plan."]},{"w":"fit into","def":"(","zh":"使)适合，适应","ex":["She fitted into the team very well. You need to fit this piece of evidence into the rest.","for sb.’s benefit/for the benefit of sb.: 为...的利益e.g. Instead of viewing animals as made for our benefit, we should think that we must be of benefit to them."]},{"w":"imperative","def":"a. extremely important and needing to be done or dealt with immediately","zh":"必要的，急需做的","ex":["It is imperative that we intensify our efforts to predict climate change accurately."]}],"exercises":[{"id":"opener","part":"opener","type":"qa","title_en":"Opener — Warming Up","title_zh":"单元导览 · 热身问答","instr_en":"Look at the picture while listening to the recording, then work with your partner to answer the questions.","instr_zh":"边听录音边看图，然后与同伴一起回答下列问题。","items":[{"q":"According to the speaker, what does the SeaOrbiter look like?","zh":"按照讲话者的描述，SeaOrbiter（“海洋轨道器”）看上去像什么？","a":"It looks like a giant ship sinking in the sea.","az":"它看上去像一艘正在沉入大海的巨轮。"},{"q":"What purpose will the SeaOrbiter serve?","zh":"它有什么用途？","a":"It will be a permanent mobile exploration station for scientists to observe what is going on under the surface of the sea.","az":"它将成为一座永久性的移动考察站，供科学家观察海面下发生的一切。"},{"q":"How many such vessels will be built and launched according to the architect?","zh":"按照设计师的说法，将建造并下水多少艘这样的船？","a":"According to him, half a dozen such vessels will be built and launched.","az":"据他说，将建造并下水六艘这样的船。"}]},{"id":"org","part":"text","type":"qa","title_en":"Text Organization","title_zh":"课文结构分析","instr_en":"Pair work: This text can be divided into four parts. The paragraph numbers of each part have been given to you. Now write down the main idea of each part and compare notes with your partner.","instr_zh":"结对练习：课文可分为四个部分，各部分所含段落已给出。写出每部分的大意，然后与同伴对照。","items":[{"q":"Part One (Paras. 1–3)","zh":"第一部分（第1–3段）","a":"Man is far from having control of the ocean. We know very little about it, and the discoveries we have made, though monumental, are but a drop in an ocean-sized bucket.","az":"人类远未掌控海洋。我们对它知之甚少，已有的发现虽堪称里程碑，却只是汪洋中的一滴水。"},{"q":"Part Two (Paras. 4–5)","zh":"第二部分（第4–5段）","a":"The human-ocean connection is vital to us. Healthy oceans can help ease the burden of our rapidly increasing population on Earth.","az":"人类与海洋的关联对我们至关重要。健康的海洋有助于缓解迅速增长的人口给地球带来的负担。"},{"q":"Part Three (Paras. 6–9)","zh":"第三部分（第6–9段）","a":"It is very important to make observations of how the ocean works. However, owing to lack of funds, compared to space exploration, ocean exploration is lagging far behind, with the result that we know as yet little about the deep sea.","az":"观察海洋如何运作非常重要。然而由于资金匮乏，与太空探索相比，海洋探索远远落后，以致我们对深海至今所知甚少。"},{"q":"Part Four (Paras. 10–12)","zh":"第四部分（第10–12段）","a":"True, there are countless discoveries to be made and lots of work to be done, but it is worth our while to do so as we might find the key to our survival on Earth.","az":"诚然，还有无数发现有待做出、大量工作有待完成，但这值得我们去做，因为我们可能因此找到在地球上生存下去的关键。"},{"q":"1.2 Does the author focus on the ocean, on space exploration, or on both? How does he begin his essay, and why does he end it the way he does?","zh":"1.2 作者关注的是海洋、太空探索，还是两者兼有？他如何开篇？又为何这样收尾？","a":"Both. He begins through a brief account of his participation in the exploration below the Sea of Japan. He ends it by echoing the keynote of the essay: When we explore the deep sea, we are exploring for our own survival.","az":"两者兼有。开篇简述他参与日本海深海探测的经历；结尾呼应全文主旨：我们探索深海，就是在为自身的生存而探索。"}]},{"id":"dig","type":"qa","title_en":"Digging into Detail","title_zh":"课文细读","instr_en":"Answer the following questions to better understand the text.","instr_zh":"回答下列问题，深入理解课文。","items":[{"q":"What does the discovery of the coelacanth specimen show? (Para. 1)","zh":"腔棘鱼标本的发现说明了什么？（第1段）","a":"It shows that there are creatures living in the sea which we thought were extinct.","az":"它表明，海洋中仍生活着我们原以为已经灭绝的生物。"},{"q":"Why is the filming of the giant squid for the first time described as a landmark moment in ocean exploration? (Para. 3)","zh":"为什么说首次拍到巨型鱿鱼是海洋探索史上的里程碑时刻？（第3段）","a":"Because the scientists did it the hard way. They had to overcome monumental challenges with ingenuity and the use of advanced technology before they finally made it.","az":"因为科学家们是以极为艰难的方式做到的：他们凭借巧思和先进技术克服了巨大的挑战，才最终成功。"},{"q":"Why is ocean conservation important to man? (Para. 4)","zh":"海洋保护对人类为何重要？（第4段）","a":"Because, among other things, the ocean helps ease the burden of our growing population on Earth.","az":"因为除其他因素外，海洋有助于缓解地球上不断增长的人口所带来的负担。"},{"q":"What does \"an important part of the ocean life cycle\" refer to? (Para. 7)","zh":"“海洋生命循环中的重要一环”指的是什么？（第7段）","a":"It refers to the fact that each creature that dies and sinks to the ocean floor becomes food for other creatures, thus creating an ecosystem of its own.","az":"它指的是：每一个死亡并沉入海底的生物都会成为其他生物的食物，从而形成自身的生态系统。"},{"q":"Is there any similarity between space and ocean exploration? (Para. 9)","zh":"太空探索与海洋探索之间有相似之处吗？（第9段）","a":"Yes, there is similarity in how we use technology in exploring them. The methods, technology and expertise are similar.","az":"有。两者在运用技术进行探索的方式上相似，方法、技术和专业知识都相通。"}],"part":"text"},{"id":"diff","part":"text","type":"mc","title_en":"Understanding Difficult Sentences","title_zh":"难句理解","instr_en":"Choose the answer that correctly interprets the sentence from the text.","instr_zh":"选出对课文中句子释义正确的一项。","items":[{"q":"Man's influence is as yet but a passing shadow. (Para. 1)","zh":"人类的影响迄今为止不过是转瞬即逝的影子。（第1段）","opts":[{"k":"A","en":"So far man has had no lasting influence on the ocean.","zh":"迄今为止，人类对海洋并未产生持久的影响。"},{"k":"B","en":"The shadow people cast on water changes quickly.","zh":"人在水面上投下的影子变化得很快。"}],"a":"A"},{"q":"That is, until 2012, when Drs. Edith Widder, Steve O'Shea and Tsunemi Kobodera filmed the elusive and mysterious giant in its natural deep-sea habitat for the first time ... (Para. 3)","zh":"也就是说，直到2012年——那一年伊迪丝·威德、史提夫·奥谢和洼寺恒己三位博士首次在深海自然栖息地拍摄到这只神秘莫测的巨兽……（第3段）","opts":[{"k":"A","en":"It was not until 2012 that Drs. Edith Widder, Steve O'Shea and Tsunemi Kobodera filmed the elusive and mysterious giant in its natural deep-sea habitat for the first time ...","zh":"直到2012年，三位博士才首次在深海自然栖息地拍摄到这只神秘莫测的巨兽……"},{"k":"B","en":"We knew very little about the elusive and mysterious giant until 2012, when Drs. Edith Widder, Steve O'Shea and Tsunemi Kobodera filmed it in its natural deep-sea habitat for the first time ...","zh":"在2012年之前，我们对这只神秘莫测的巨兽所知甚少；直到那一年三位博士才首次在它的深海自然栖息地拍到它……"}],"a":"B"},{"q":"Healthy oceans can help ease the increasing burden our population is placing on this planet ... (Para. 5)","zh":"健康的海洋有助于缓解我们的人口正给这颗星球施加的、日益加重的负担……（第5段）","opts":[{"k":"A","en":"Healthy oceans can provide for us and make our fast growing population less dependent on other resources of the planet.","zh":"健康的海洋能为我们提供给养，并使快速增长的人口减少对这颗星球其他资源的依赖。"},{"k":"B","en":"Healthy oceans can help reduce the demand of our fast growing population for food and energy and make our world cleaner.","zh":"健康的海洋有助于减少快速增长的人口对食物和能源的需求，并让我们的世界更洁净。"}],"a":"A"},{"q":"... and then descended in submersibles to observe the ensuing feeding frenzy by an array of creatures. (Para. 6)","zh":"……然后乘潜水器下潜，观察随之而来的众多生物疯狂进食的场面。（第6段）","opts":[{"k":"A","en":"... and then went down to the ocean floor in submersibles to watch a host of creatures eating away the dead whale.","zh":"……然后乘潜水器下到海底，观看一大群生物啃食那具鲸尸。"},{"k":"B","en":"... and then went to the submersibles for a look at all sorts of creatures that followed the dead whale and fed on it.","zh":"……然后走到潜水器那里，去看各种各样跟着鲸尸并以它为食的生物。"}],"a":"A"},{"q":"It is imperative that we keep pushing the limits of our ocean. (Para. 12)","zh":"我们必须继续推进对海洋探索的极限。（第12段）","opts":[{"k":"A","en":"It is essential we keep striving to find fresh ways to overcome the challenges faced by ocean exploration.","zh":"我们必须不断努力，寻找新的方法来克服海洋探索所面临的挑战。"},{"k":"B","en":"It is essential we should not let the ocean limit us.","zh":"关键是绝不能让海洋限制我们。"}],"a":"A"}]},{"id":"kw11","part":"text","type":"fill","title_en":"Key Words & Expressions 1.1","title_zh":"重点词汇 1.1 · 选词填空","instr_en":"Fill in the blanks with words or phrases from the box below. Change the form where necessary.","instr_zh":"用下面方框中的词或短语填空，必要时改变形式。","bank":["explore","survival","specimen","species","assume","influence","giant","observe","elusive","landmark","vital","impact","planet","alien","array","overlook","gear","hostile","expertise","amount","funding","countless","completion","reveal","imperative","on the heels of","from the beginning","as yet","for the first time","provide for","a drop in the bucket","in one’s entirety","die from/of","feed on","crack open","under/below/beneath the surface of","fit together","fit into","for sb.’s benefit/for the benefit of sb."],"items":[{"q":"Autumn has arrived here ______ a hot summer with unexpected speed.","zh":"炎夏刚过，秋天就出人意料地迅速到来了。","a":"on the heels of","hint":"on the heels of 紧随……之后"},{"q":"As a diplomat, he has witnessed the birth of the new nation and is well placed to ______ its growth during this critical period of its history.","zh":"作为一名外交官，他见证了这个新国家的诞生，也处在观察其在这一历史关键时期发展的有利位置。","a":"observe","hint":"observe 观察"},{"q":"When you make travel plans, you’d better ______ that every flight can be late.","zh":"你制定旅行计划时，最好假定每个航班都可能晚点。","a":"assume","hint":"assume 假定"},{"q":"“I have made it quite clear ______ that I want to be part of the team,” John said.","zh":"“我从一开始就说得很清楚，我想成为团队的一员，”约翰说。","a":"from the beginning","hint":"from the beginning 从一开始"},{"q":"When Alice first came to the country, she was shocked by the way of life there that was totally ______ to her and the ______ environment where local people looked at her with a suspicious eye.","zh":"爱丽丝初到这个国家时，那里的生活方式让她震惊——那对她来说完全陌生；环境也充满敌意，当地人用怀疑的眼光看她。","a":"alien; hostile","hint":"alien 陌生的；hostile 充满敌意的"},{"q":"Andrew made an initial contribution. But there is ______ no firm commitment to further cash payments.","zh":"安德鲁做了初步的贡献。但到目前为止还没有关于后续现金支付的明确承诺。","a":"as yet","hint":"as yet 至今；到目前为止"},{"q":"______ in decades, the leaders of the two nations shook hands and sat down to talk.","zh":"几十年来第一次，两国的领导人握手并坐下来会谈。","a":"For the first time","hint":"for the first time 第一次"},{"q":"“Do fish ______ each other?” “Yes. At least many of them do.”","zh":"“鱼会互相捕食吗？”“会。至少很多鱼是这样。”","a":"feed on","hint":"feed on 以……为食"},{"q":"Our old classroom building, which was built a century ago, has become a sort of a local ______.","zh":"我们那座建于一个世纪前的旧教学楼，已经成了当地的一处地标。","a":"landmark","hint":"landmark 地标"},{"q":"The dwarf sees farther than the ______ when he stands on the latter’s shoulder.","zh":"矮人站在巨人的肩上，会比巨人看得更远。","a":"giant","hint":"giant 巨人"},{"q":"All these parts are supposed to ______ in this device.","zh":"所有这些零件都应该在这个装置里装配在一起。","a":"fit together","hint":"fit together 装配在一起"},{"q":"We visited the local markets and saw a wonderful ______ of fruit and vegetables.","zh":"我们逛了当地的市场，看到琳琅满目的水果和蔬菜。","a":"array","hint":"an array of 一系列；大量"},{"q":"I am afraid this plan of yours does not ______ the company’s overall marketing strategy.","zh":"恐怕你这个计划与公司的整体营销战略不相吻合。","a":"fit into","hint":"fit into 适合；符合"},{"q":"Astronauts have brought back ______ of rock from the moon.","zh":"宇航员从月球带回了岩石标本。","a":"specimens","hint":"specimen 标本"},{"q":"If one wants to ______ the possibilities of Europe’s political future, one needs to examine the development of European culture.","zh":"如果有人想探索欧洲政治未来的各种可能性，就需要研究欧洲文化的发展。","a":"explore","hint":"explore 探索"},{"q":"A set of ______ are installed to control the speed and direction of the vehicle.","zh":"车辆上安装了一组齿轮，用以控制速度和方向。","a":"gears","hint":"gear 齿轮"}]},{"id":"kw12","part":"text","type":"fill","title_en":"Key Words & Expressions 1.2","title_zh":"重点词汇 1.2 · 替换划线部分","instr_en":"Replace the underlined part in each of the following sentences with a word or phrase from the box below. Write your answer in the brackets. Make changes or additions where necessary.","instr_zh":"用方框中的词或短语替换下列句子中画线的部分，把答案写在括号内，必要时作改动或补充。","bank":["elusive","expertise","imperative","completion","as yet","in its entirety","dying of hunger","for the benefit of"],"items":[{"q":"Governments of all levels should take positive steps to conserve our oceans [[in the interests of]] future generations.","zh":"各级政府都应采取积极措施，为了子孙后代的利益保护我们的海洋。","a":"for the benefit of"},{"q":"It is [[extremely important]] for us to change our way of thinking or we will be out of step with our times.","zh":"改变思维方式对我们来说极其重要，否则我们就会与时代脱节。","a":"imperative"},{"q":"The document needs to be read and understood [[as a whole]].","zh":"这份文件需要整体阅读和理解。","a":"in its entirety"},{"q":"An agreement to end the fighting remains [[difficult to achieve]].","zh":"结束这场战斗的协议仍难以达成。","a":"elusive"},{"q":"In this African village many children are facing death [[because they have nothing to eat]].","zh":"在这个非洲村庄，许多孩子因为没有食物而面临死亡。","a":"dying of hunger"},{"q":"We have the resources as well as the [[special knowledge and skills]] to finish the project.","zh":"我们拥有完成这个项目所需的资源以及专业知识和技能。","a":"expertise"},{"q":"No incoming freshman has applied for financial aid [[so far]].","zh":"到目前为止还没有新生申请经济资助。","a":"as yet"},{"q":"Our project is nearing [[an end]], but we still need some help from you.","zh":"我们的项目已接近尾声，但仍需要你的一些帮助。","a":"completion"}]},{"id":"kw13","part":"text","type":"fill","title_en":"Key Words & Expressions 1.3","title_zh":"重点词汇 1.3 · 仿例完成句子","instr_en":"Complete each of the following sentences after the model with the word or phrase in brackets. Make changes or additions where necessary.","instr_zh":"仿照例句，用括号中的词或短语完成下列句子，必要时作改动或补充。","items":[{"q":"Model: We … then descended in submersibles to observe the ensuing feeding frenzy by an ______ of creatures. (array)","zh":"范例：我们……随后乘潜水器下潜，观察接下来一大群生物疯狂进食的场面。（array）","a":"array"},{"q":"The bookshelf was designed to ______ this corner of our bedroom. (fit into)","zh":"这个书架设计得正好可以放进我们卧室的这个角落。","a":"fit into"},{"q":"Tigers are most active at night and ______ animals such as deer and wild pigs. (feed on)","zh":"老虎夜间最活跃，以鹿和野猪等动物为食。","a":"feed on"},{"q":"The new law’s ______ on police practice is hard to evaluate right now. (impact)","zh":"目前还很难评估这部新法律对警务实践的影响。","a":"impact"},{"q":"No details of the company’s financial condition ______ at the recent shareholder meeting. (reveal)","zh":"在最近的股东大会上，该公司财务状况的细节没有被披露。","a":"were revealed"},{"q":"Why don’t we ______ a bottle of champagne to celebrate? (crack open)","zh":"我们为什么不开瓶香槟庆祝一下呢？","a":"crack open"},{"q":"Reform of this country’s medical system will follow ______ the new law. (on the heels of)","zh":"该国医疗体系的改革将紧随这部新法律之后展开。","a":"on the heels of"}]},{"id":"usage","part":"text","type":"fill","title_en":"Usage — sort of / kind of","title_zh":"语法运用 · sort of / kind of 的用法","instr_en":"Complete the following sentences by using “sort of” or “kind of”.","instr_zh":"用 sort of 或 kind of 完成下列句子。","items":[{"q":"He says he’s OK, but I feel ______ worried about him.","zh":"他说他没事，但我有点儿为他担心。","a":"sort of / kind of"},{"q":"“Oh, I didn’t know you are a writer!” “Yes, I am, ______.”","zh":"“哦，我不知道你是作家！”“是的，算是吧。”","a":"sort of / kind of"},{"q":"In the bright-red over-sized coat, she looked ______ funny.","zh":"穿着那件鲜红的超大号外套，她看上去有点滑稽。","a":"sort of / kind of"},{"q":"From what my grandfather told me, my great grandfather had ______ education.","zh":"据我祖父说，我的曾祖父受过一点教育。","a":"some sort of / some kind of"},{"q":"Finally he felt he needed to make ______ a decision.","zh":"最后他觉得自己多少得做个决定。","a":"some sort of / some kind of"},{"q":"Being Jane’s close friend, Barbara ______ expected to be invited to her wedding.","zh":"作为简的密友，芭芭拉有点期待能受邀参加她的婚礼。","a":"sort of / kind of"}]},{"id":"sp31","part":"text","type":"rewrite","title_en":"Sentence Patterns 3.1 — like / unlike","title_zh":"句型 3.1 · like / unlike（与……一样／不像……）","instr_en":"Use the word “like” or “unlike” to rewrite the following sentences after the models.","instr_zh":"仿照范例，用 like 或 unlike 改写下列句子。","items":[{"q":"His father is intelligent. But he lacks intelligence.","zh":"他父亲很聪明，但他却缺乏才智。","a":"Unlike his father, he lacks intelligence.","az":"与他父亲不同，他缺乏才智。"},{"q":"Most computer systems on the list are easy to install. But this one is not.","zh":"清单上的大多数计算机系统都易于安装，但这个不是。","a":"Unlike most computer systems on the list, this one is not easy to install.","az":"不像清单上大多数计算机系统，这个不易安装。"},{"q":"Most rivers in China run from west to east, and the Yellow River runs that way too.","zh":"中国大多数河流自西向东流，黄河也是如此。","a":"Like most rivers in China, the Yellow River runs from west to east.","az":"像中国大多数河流一样，黄河自西向东流。"},{"q":"In their early youth, Tom’s two brothers showed an interest in politics. But Tom took an interest in music.","zh":"汤姆的两个兄弟年少时就对政治感兴趣，而汤姆却对音乐感兴趣。","a":"Unlike his two brothers who showed an interest in politics in their early youth, Tom took an interest in music.","az":"不像他那两个年少时就对政治感兴趣的兄弟，汤姆对音乐感兴趣。"}]},{"id":"sp32","part":"text","type":"fill","title_en":"Sentence Patterns 3.2 — … need to do …","title_zh":"句型 3.2 · need to do（需要做某事）","instr_en":"Complete each of the following sentences by translating the Chinese given in brackets into English, using the structure “… need to do …”.","instr_zh":"用“… need to do …”结构把括号中的汉语译成英语，完成下列句子。","items":[{"q":"Nancy felt that she ______ (需要休一个假期) before beginning the freshman year.","zh":"南希觉得在开始大一生活之前她需要休一个假期。","a":"needed to take a vacation"},{"q":"The data in this report ______ (需要纠正和更新).","zh":"这份报告中的数据需要纠正和更新。","a":"need to be corrected and updated"},{"q":"John thought she ______ (不需要打电话请医生) as he felt much better now.","zh":"约翰认为她不需要打电话请医生，因为他现在感觉好多了。","a":"didn’t need to call a doctor"}]},{"id":"cloze","part":"text","type":"cloze","title_en":"Comprehensive Practice 4.1 — Cloze","title_zh":"综合练习 4.1 · 完形填空","instr_en":"Complete the passage with the appropriate words or expressions in the box. Change the form when necessary.","instr_zh":"用方框中恰当的词或短语完成短文，必要时改变形式（方框中有多余选项）。","bank":["observe","overlook","planet","expertise","species","funding","survival","explore","vital","provide for","learn about","beneath the surface of","a drop in the bucket","for the benefit of sb."],"passage":"We have spent a great deal of time and money exploring space, but remain ignorant about vast areas of our own {{1}}. For we still know little of the world {{2}} the seas. With so much to {{3}} life in the depths of the ocean it is surprising there is so little {{4}} for deep sea exploration. It amounts to little more than {{5}} of what is needed if we are to make full use of this {{6}} resource. Given our growing population the oceans may even hold the key to the {{7}} of our {{8}}. It would be foolish to continue to {{9}} their importance.","answers":["planet","beneath the surface of","learn about","funding","a drop in the bucket","vital","survival","species","overlook"]},{"id":"trans","part":"text","type":"translate","dir":"zh2en","title_en":"Comprehensive Practice 4.2 — Translation","title_zh":"综合练习 4.2 · 段落汉译英","instr_en":"Translate the following passage into English, using the words and phrases in the box below.","instr_zh":"用下面方框中的词或短语把下列段落译成英语。","bank":["beneath the surface of sth.","a drop in the bucket","provide for","ease the burden of","vital","countless","impact","funding"],"items":[{"q":"我们每年花费巨额资金观察气候的变化以及群星的运行。诚然这是必要的，但是我们忽视了海洋对我们这颗行星的影响，为了解海洋所做甚少。海洋对我们的生存至关重要。它们以其表层下的无数物种为我们提供给养。它们帮助减轻我们日益增长的人口对地球造成的负担。另外，海洋在调控气候方面起着重要的作用。因此，我们必须增加对海洋探测的投入。","a":"Every year we spend huge amounts of money observing the change in our climate and the movement of the stars. True, this is necessary, but we have overlooked the influence of the oceans on our planet, and have done little to understand them. The oceans are vital to our survival. With countless species beneath their surface, they provide for us. They help ease the burden of our growing population on Earth. Besides, the oceans play an important role in climate control. Therefore, we must increase the amount of funding for ocean exploration."}]},{"id":"r1match","type":"qa","title_en":"Comprehension Check — Reading 1","title_zh":"阅读1 段落定位","instr_en":"Skim the text and identify the paragraph from which the information in each of the following statements is derived. Write down the paragraph number in the brackets.","instr_zh":"快速浏览课文，判断下列每句话的信息出自哪一段，并写出段落编号。","items":[{"q":"A. The creation of a bacterium that can eat carbon dioxide and produce fuel would benefit mankind much more than some of the space programs.","zh":"创造一种可以吸收二氧化碳并产生燃料的细菌，将比某些太空计划更有利于人类。","a":"第 11 段"},{"q":"B. In the eyes of space advocates spinoffs of space exploration benefit life on earth.","zh":"在太空倡导者看来，太空探索的副产品有益于地球上的生命。","a":"第 12 段"},{"q":"C. James Cameron's expedition to the deepest point in the ocean has not been given enough attention.","zh":"詹姆斯·卡梅隆对海洋最深处的探险没有得到足够的重视。","a":"第 1 段"},{"q":"D. Sending humans into space is far more costly than sending robots.","zh":"将人类送入太空的成本远高于将机器人送入太空。","a":"第 4 段"},{"q":"E. Finding of water on some planets does not equal finding civilizations there.","zh":"在某些行星上找到水并不等于在那里找到文明。","a":"第 15 段"},{"q":"F. Media coverage and politicians are mostly in favor of space projects.","zh":"媒体报道和政治家大多支持太空项目。","a":"第 2 段"},{"q":"G. The arguments for manned space missions do not seem convincing.","zh":"支持载人航天任务的论据似乎并不令人信服。","a":"第 6 段"},{"q":"H. Some government agencies exaggerate the value of space projects.","zh":"一些政府机构夸大了太空项目的价值。","a":"第 14 段"}],"part":"r1"},{"id":"r1tr","part":"r1","type":"translate","title_en":"Reading 1 — Translation","title_zh":"阅读1 · 英译汉","instr_en":"Translate into Chinese the underlined sentences in the article.","instr_zh":"把文章中画线的句子译成汉语。","items":[{"q":"British Astronomer Royal Martin Rees writes, “I think that the practical case (for manned flights) gets weaker and weaker with every advance in robotics and miniaturization.”","a":"英国皇家天文学家马丁·里斯写道：“我认为，随着机器人技术和微型化水平的每一次进步，（载人航天飞行）的现实理由都变得越来越无力。”"},{"q":"However, it is far from established that we cannot achieve the same effects by making other R&D projects our main priority.","a":"然而，迄今为止并没有证据表明，如果把其他研发项目作为首要任务，我们就无法取得同样的效果。"},{"q":"Ocean organisms are said to hold the promise of cures for an array of diseases.","a":"据说海洋生物有望为治愈一系列疾病提供方法。"},{"q":"If the oceans do not make your heart go pitter-patter, how about engineering a bacterium that eats carbon dioxide — and thus helps protect the world from overheating — AND excretes fuel which will allow us to drive our cars and machines, without oil?","a":"如果海洋并不能让你怦然心动，那么设计一种细菌如何？它能吃掉二氧化碳，从而保护世界不至于过热，还能排出燃料，使我们开车开机器都不用油。"}]},{"id":"r2cloze","part":"r2","type":"cloze","title_en":"Reading 2 — Word Bank Cloze","title_zh":"阅读2 · 选词填空","instr_en":"Read the following passage carefully. Select one word for each blank from a list of choices given in the word bank. You may not use any of the words in the bank more than once.","instr_zh":"仔细阅读下面短文，从词库中为每个空格选一个词，每个词只能使用一次。","bank":["awareness","creatures","habitats","plunged","commercial","diving","immense","series","cooperated","essential","impacted","threats","covering","explore","launch"],"passage":"June 8 is World Oceans Day, an occasion to celebrate and honor the oceans on the earth. On this particular day, we are bringing you some facts about oceans and how to protect them, raising {{1}} about their importance. There are four oceans on the earth — the Arctic Ocean, the Atlantic Ocean, the India Ocean, and the Pacific Ocean, {{2}} about 71 percent of the earth’s surface. Based on the scientific theory of evolution, all {{3}} on the earth, including human beings, have ancestors that were living in the sea. Oceans are {{4}} to human beings because they provide us oxygen, food and clean water. They also help to regulate the climate and bring us endless inspiration. However, due to a(n) {{5}} of human activities, the oceans are being destroyed day by day. Major {{6}} to oceans, including plastic pollution, overfishing, destructive fishing, habitat destruction of marine life, as well as global warming, had {{7}} the world’s oceans for years. To save the oceans, various nations and organizations have {{8}} to come up with solutions to ease and control these threats. China is one of the active participants in this endeavor. As of now, China has 20 marine nature reserves, which are building safe {{9}} for lots of marine lives such as white dolphins and sea turtles. The theme for 2019 World Oceans Day, “Gender and the Ocean,” is aiming to {{10}} the gender dimension of humankind’s relationship with oceans. In recent years, both scientists and researchers made contributions to ocean protection. Facing the problem of ocean pollution, all human beings should join forces as an entity since we are all living on this blue planet.","answers":["awareness","covering","creatures","essential","series","threats","impacted","cooperated","habitats","explore"]},{"id":"r2mc","type":"mc","title_en":"Comprehension Check — Reading 2","title_zh":"阅读2 课文理解","instr_en":"Choose the best answer for each of the following.","instr_zh":"为下列各题选择最佳答案。","items":[{"q":"The title “Race to the Deep” means ______.","zh":"标题“Race to the Deep（奔向深海）”的意思是______。","opts":[{"k":"A","en":"a competition to see who can dive the deepest into the ocean","zh":"看谁能潜入海洋最深处的竞赛"},{"k":"B","en":"a competition to see who can understand and make the best of the deep sea","zh":"看谁能理解并最好地利用深海的竞赛"},{"k":"C","en":"a competition to see which submarine can plunge the deepest into the waters","zh":"看哪艘潜艇能潜入水域最深处的竞赛"},{"k":"D","en":"a competition to seize a portion of the deep sea","zh":"争夺一部分深海的竞赛"}],"a":"B"},{"q":"What function does the new scientific research ship serve?","zh":"这艘新的科研船起什么作用？","opts":[{"k":"A","en":"As a deep-sea facility for tourist adventures.","zh":"作为供游客探险的深海设施。"},{"k":"B","en":"As a supply ship for scientific explorations.","zh":"作为科学考察的补给船。"},{"k":"C","en":"As a station for observing giant squid.","zh":"作为观测巨鱿的站点。"},{"k":"D","en":"As a launch-pad for submarines.","zh":"作为潜艇的发射平台。"}],"a":"D"},{"q":"How deep did Rainbow Fish's unmanned sub reach in its most recent trial?","zh":"“彩虹鱼”的无人潜艇在最近一次试验中到达了多深？","opts":[{"k":"A","en":"2,000m.","zh":"2,000 米。"},{"k":"B","en":"3,000m.","zh":"3,000 米。"},{"k":"C","en":"4,000m.","zh":"4,000 米。"},{"k":"D","en":"5,000m.","zh":"5,000 米。"}],"a":"C"},{"q":"What is Prof. Cui Weicheng currently doing?","zh":"崔维成教授目前正在做什么？","opts":[{"k":"A","en":"Testing high-strength materials for building submarines.","zh":"为建造潜艇测试高强度材料。"},{"k":"B","en":"Designing a thick metal sphere for submarine crews.","zh":"为潜艇乘员设计厚金属球舱。"},{"k":"C","en":"Charting the Mariana Trench in the western Pacific Ocean.","zh":"绘制西太平洋马里亚纳海沟的海图。"},{"k":"D","en":"Making plans for his dive to the bottom of the Mariana Trench.","zh":"为他潜入马里亚纳海沟底部做计划。"}],"a":"A"},{"q":"Who were the first people to make a dive to the Mariana Trench?","zh":"最早潜入马里亚纳海沟的人是谁？","opts":[{"k":"A","en":"Don Walsh and Jacques Piccard.","zh":"唐·沃尔什和雅克·皮卡德。"},{"k":"B","en":"James Cameron and his crew.","zh":"詹姆斯·卡梅隆和他的船员。"},{"k":"C","en":"Cui Weicheng and his team.","zh":"崔维成和他的团队。"},{"k":"D","en":"Offshore companies and oil companies.","zh":"离岸公司和石油公司。"}],"a":"A"}],"part":"r2"},{"id":"r2tr","part":"r2","type":"translate","dir":"zh2en","title_en":"Reading 2 — Translation","title_zh":"阅读2 · 段落汉译英","instr_en":"Translate the following passage into English.","instr_zh":"把下列段落译成英语。","items":[{"q":"21世纪是海洋时代。近年来，随着技术进步和装备水平提升，中国海洋探测能力不断提高，取得了一系列令人瞩目的成绩。","a":"The 21st century is the age of the ocean. In recent years, with the advancement of technology and equipment, China’s ocean exploration capabilities have continued to improve, and China has made a series of impressive achievements."}]}]},{"id":"b4u3","book":"Book 4","unit":"Unit 3","title_en":"Job Hunting","title_zh":"求职","text_title_en":"Unit 3 Job Hunting","text_title_zh":"求职","goals":["Upon completion of this unit, teachers are expected to have enabled students to:","have a thorough understanding of the text contextually and linguistically;","expand their vocabulary about job hunting and know how to use the key words and expressions in context properly;","have a clear idea of what the target employers are looking for in job applicants, how to present a clear message to them about who you are and what you do best, and how to prepare well to succeed in job interviews;","conduct mock job interviews to learn how to answer interviewers’ difficult questions, develop interview strategies, improve communication skills and reduce stress before an actual interview;","become familiar with letter writing, more specifically, the writing of a job application letter.","Part 2 Suggested Teaching Plan","I. Teaching process chart"],"passages":[{"id":"text","label_zh":"课文","label_en":"Text","title_en":"The Best Career Advice I Ever Got Came from My Mom, Who Made Me Quit My First Job at Age 22","title_zh":"妈妈让我在22岁辞掉第一份工作，这是她给我的最好的职业建议","author_en":"Kathleen Elkins","author_zh":"凯瑟琳·埃尔金斯","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"Growing up, my family taught me, “quitters are losers,” which, when I was little, was mostly applied to things like sports. That attitude served me well — until I started working full-time.","zh":"从小到大，家人一直教育我“放弃者即失败者”。在我小时候，这个家训主要是用在诸如体育运动之类的事情上。这一态度助力我前行——直到我开始了全职工作。"},{"n":2,"en":"When I graduated from college four years ago and started my first “real world” job in Boston, I felt prepared to tackle anything that was thrown my way, which happened to be a lot. I was basically treated like a workhorse and there wasn’t much learning. I felt unfulfilled at the end of each workday.","zh":"四年前，我大学毕业，在波士顿开始从事第一份“真实世界”工作。我做好心理准备，对派给我的任务来者不拒，而这些任务十分繁杂。人家把我当成老黄牛，而且我也没学到什么。每个工作日结束，我都感到一事无成。"},{"n":3,"en":"Still, the thought of quitting never crossed my mind. After all, you can’t leave your first job at age 22, especially not after just two months! It would be unacceptable, by society’s standards, my family’s standards and my own.","zh":"然而，我从未起过放弃的念头。毕竟，你不能在22岁时就辞掉你的第一份工作，尤其不能干了两个月就辞职!以社会的标准、我家的标准抑或是我自己的标准来看，这是不可接受的。"},{"n":4,"en":"I must have called my mom one too many times after tough workdays, though, because one Wednesday night, she showed up on my doorstep. She took it upon herself to fly 850 miles from North Carolina to Boston to evaluate my situation for herself. On Thursday night, she gave me an ultimatum, “I’m not leaving your apartment until you quit your job.”","zh":"可是，我一定是在难熬的工作日结束后给妈妈打了太多次电话，因为某个周三的晚上，她出现在我的住所门前。她毅然从北卡罗来纳州飞行850英里来到波士顿，亲自评估我的状态。周四晚，她给我下了最后通牒:“在你辞职之前，我不会离开你的公寓。”"},{"n":5,"en":"She had seen the toll the work had taken on me in just a few months. Though I was usually happy, I laughed a lot less now and dragged more. It was clear to her that my situation wasn’t just temporary. I was going to continue having bad, unfulfilling days, which she knew, and I know now, is a surefire sign that you should start planning your exit.","zh":"她看到了这份工作在短短数月里让我付出的代价。我一向是开开心心的，可现在笑容却少了很多，疲疲沓沓的。她看得清清楚楚，我的状态显然不只是暂时的，我这种糟糕的、不称心的日子还会继续过下去。当时她就知道，而现在我也知道了，那是我应该开始规划退场的明确信号。"},{"n":6,"en":"Mom didn’t like seeing me unhappy, but that wasn’t her main motivation: Sometimes unhappiness can be productive or important. She said I’d be better off in the long run if I redirected all the energy I was putting into my current position towards finding a different, better fit.","zh":"妈妈不喜欢看到我怏怏不乐，但那不是她的主要动机:有时怏怏不乐会让人有所收获，或者产生重大影响。她说，如果我把投入到目前这份工作中的所有精力转向寻找一份别的更合适的工作，从长远看，我会过得更好一些。"},{"n":7,"en":"I listened to her and gave my two weeks’ notice the next day. The pure relief that washed over me after walking out of that office for good should have tipped me off, but I didn’t know at the time whether or not I had made the right choice, so I was anxious, too.","zh":"我听从了妈妈的建议，第二天便告知雇主两周后离职。我最后一次走出那间办公室，解脱感油然而生。这本该是向我透露了一个重要信息，但那时我并不知道自己的抉择是否正确，所以解脱之余还是忧心忡忡。"},{"n":8,"en":"Quitting, it turns out, is really hard. The unknown is scary. Lack of income: super scary! I wasn’t just afraid of what would come next, I was afraid of being called a quitter.","zh":"事实上，放弃真的很难。未知是可怕的，收入没了，尤其可怕!我不仅惧怕接下来会发生什么，我还惧怕被视为轻易放弃的人。"},{"n":9,"en":"If fear is the only thing keeping you in the office, though, that’s a red flag. You want to be working for something, not simply because you’re afraid of something. And, as clichéd as it may sound, eagerness and excitement count.","zh":"可是，如果惧怕是让你留下的唯一原因，那就是一个危险信号。你要为了一个目的而工作，而非仅仅因为你惧怕什么而工作。再者，对工作保持热忱和兴奋很重要，尽管这听起来像是陈词滥调。"},{"n":10,"en":"It took every ounce of my courage, plus my mom’s tough love, to quit. To this day, it’s the best career choice I’ve ever made.","zh":"这次辞职，我用尽了所有的勇气，还幸亏有妈妈严厉的爱。时至今日，它是我做过的最好的职业选择。"},{"n":11,"en":"But it wasn’t an easy one. I was tied to a year-long lease in an expensive city and lacked consistent income. I did have a few months’ worth of savings to fall back on and no student loans. Money-wise, I’d be fine temporarily, but I needed a plan.","zh":"但是，这个选择并不容易。在这个生活成本高昂的城市，我有一年期的租房合同在身，却没了持续的工资收入。好在我还有几个月的存款可以依靠，而且我没有背上学生贷款。钱暂时还够用，但我需要一个计划。"},{"n":12,"en":"So I did two things: First, I found part-time work. I started babysitting and stringing tennis rackets right away to generate enough to pay rent each month. I used my emergency savings to cover my day-to-day expenses. I wouldn’t be saving any money, but I also wouldn’t be racking up any debt.","zh":"于是我做了两件事:首先，我找了兼职工作，立马开始代人照看小孩、给网球拍穿线，以此挣足每月的房租。我把应急储蓄金用来支付日常开销。尽管一分钱都存不下来，但我也没有累积什么债务。"},{"n":13,"en":"Second, I started a blog. I still didn’t know exactly what I wanted to do with my life, but I knew that I found comfort and stability in writing, so I started there.","zh":"然后，我开始写博客。那时我仍不清楚这一生我到底想干什么，但是我知道写作予我以慰藉和安定感，所以我就写起来。"},{"n":14,"en":"I committed to writing a blog post a day. It kept me busy and grounded during a time of uncertainty, and allowed me to start and finish at least one thing each day, which is always a confidence booster. Plus, when I started applying to writing positions, the blog gave me something to talk about during interviews.","zh":"我决心每天写一篇博文。在一切不确定的时日里，写博文使我忙碌且踏实，让我每天至少有始有终完成一件事，也一直能提振我的信心。此外，当我开始申请写作方面的工作时，博文让我面试时有话可谈。"},{"n":15,"en":"When I wasn’t working or blogging, I was networking and job searching. I leveraged my college alumni network, sending out introductory emails and scheduling phone calls with anyone who would talk to me. I fine-tuned my résumé and made a goal of submitting at least one job application a day.","zh":"要是我没在兼职或者写博文，那我就在社交或者找工作。我借助大学母校的校友关系网，发送邮件自我介绍，与任何愿意和我交谈的人约时间电话联络。我对简历进行微调，并定下了每天至少投递一份求职申请的目标。"},{"n":16,"en":"Over the next three months, I filled out a lot of job applications. Most of the time, I never heard back; sometimes, I would get a straight up “no”; and one time, I got a “yes.” It was for an internship at a news outlet in New York City. It paid and promised the opportunity to turn into a full-time position, so I pulled the trigger and moved at the start of 2015.","zh":"这之后的三个月，我填写了很多份求职申请书。多数时候是石沉大海;有时是直截了当的回绝;但有一次，我收到一个肯定的答复。那是一个在纽约市里一家新闻机构的实习岗位，有报酬并且承诺有可能转为全职，我便当机立断，于2015年初搬了家。"},{"n":17,"en":"Indeed, the internship led to a full-time financial journalist’s position which I haven’t quitted to this day. Like my first job, the workdays are long, but unlike that first job, it is challenging and fulfilling, something I’m passionate about. I never phoned my mother to whine about it.","zh":"确实，实习结束后，我转为全职的财经记者，至今仍在干着。这份工作与我的第一份一样，工作时间长，但它与第一份工作的不同之处在于，它具有挑战性、给我成就感和满足感，令我热爱。我从未给妈妈打电话抱怨过它。"},{"n":18,"en":"Had I not quit that first job, I could still be working there today, living for the weekends, dreading Mondays and stalled in my career.","zh":"如果没有放弃那第一份工作，今天的我还是在那里上班，期盼周末，恐惧周一，职业发展陷入停滞。"},{"n":19,"en":"Walking away isn’t the right answer all the time, and I still don’t think it’s the answer most of the time — but, as my mom taught me, sometimes it is OK to quit. Sometimes it’s necessary.","zh":"转身离弃并不总是解决问题的正确办法，我仍然认为多数时候它不是一个办法——但是，正如妈妈教导的那样，放弃有时是可行的，有时甚至是必须的。"}],"audio_full":"textfull.mp3","vocab":[{"w":"career","def":"n.","zh":"生涯，职业","ex":["I took this new job because I felt that I could make a good career for myself there."]},{"w":"quit","def":"v. stop doing sth. or leave a job or a place","zh":"停止;辞职，离开","ex":["Despite opposition from his family, he quit school and became an actor. If we expect that life won’t be perfect, we’ll be able to avoid that impulse to quit."]},{"w":"basically","def":"ad. for the most part; chiefly","zh":"大体上；基本上","ex":["She’s made one or two spelling errors — but the essay is basically well written."]},{"w":"evaluate","def":"vt. determine the importance, effectiveness, or worth of; assess","zh":"评估;评价","ex":["What are the most important points to consider when evaluating an employee’s performance?"]},{"w":"temporary","def":"a. not lasting or needed for very long","zh":"短暂的；暂时的","ex":["According to the report, over 6% of the labor force are working on a temporary basis."]},{"w":"exit","def":"n.","zh":"退出，(尤指演员)退场；出口","ex":["Brexit refers to Britain’s exit from the E.U.At the end of the performance, there was a mad dash for the exit."]},{"w":"productive","def":"a. having positive results; resulting in or providing a large amount or supply of sth.","zh":"富有成效的；多产的","ex":["We had a very productive meeting — a lot of problems were solved.What was once desert has become productive farmland."]},{"w":"better off","def":"in a preferable position or situation","zh":"境况更好","ex":["I know you’re unhappy that the relationship ended, but you’re better off without him."]},{"w":"in the long run","def":"over a relatively long or extended length of time in the future","zh":"从长远看","ex":["True, there’s some uncertainty in the Chinese economy. But in the long run, you’ve got to be confident."]},{"w":"relief","def":"n.(","zh":"不快过后的)轻松；解脱","ex":["It was such a relief to hear that Marta was found safe and well."]},{"w":"wash over","def":"(of a feeling) suddenly affect sb. strongly, so that they are not aware of anything else(","zh":"情绪)突然而深刻地袭来","ex":["A feeling of warmth washed over him at the thought of his daughter."]},{"w":"for good","def":"permanently; forever","zh":"永久地，永远地","ex":["He had thought his cancer was gone for good but, sadly, this was not the case."]},{"w":"eagerness","def":"n.","zh":"热切，渴望","ex":["The book describes Amelia Earhart’s eagerness for new experiences.","every ounce of (one’s) courage/energy/strength, etc.: all the courage/energy/strength etc. that one has 所有的勇气/精力/体力等 e.g. He tried to open the door by using every ounce of his strength."]},{"w":"plus","def":"conj. and also","zh":"而且；加上","ex":["The Johnsons decided to move to the suburb, where their kids could play in the yard. Plus, the school there is really nice."]},{"w":"to this day","def":"up to and including the present moment","zh":"到现在，直到今天","ex":["To this day nobody knows what happened to him."]},{"w":"consistent","def":"a. happening in the same way and continuing for a period of time","zh":"连续的；持续的","ex":["It is an institution which had consistent growth in the 1980s, 1990s and continues to grow every year."]},{"w":"fall back on","def":"depend on (sb. or sth.) that one has kept in reserve","zh":"求助于；依靠","ex":["We fell back on our savings to get us through the hard times."]},{"w":"expense","def":"n. (usu. pl.)","zh":"开销，花费","ex":["If you intend to go back to school, we have to start cutting down on our expenses."]},{"w":"rack up","def":"acquire or accumulate a large number or amount of (sth.)","zh":"累积","ex":["Any kind of travel tends to rack up several incidental(附带的)costs — taxi fares, Internet access fees, phone calls, tips, laundry charges, etc."]},{"w":"stability","def":"n. the quality of being stable","zh":"稳定；稳固","ex":["It’s my good luck to have grown up in a period of relative economic stability.","commit (oneself) to doing sth.: promise or pledge to do sth. 承诺或保证做某事 e.g. The government has committed itself to improving healthcare for all."]},{"w":"uncertainty","def":"n. the state of being uncertain","zh":"不确定性","ex":["Look deeply at the risks as well as the benefits of new technology. If those risks can be managed, keep going even in the face of uncertainty."]},{"w":"introductory","def":"a. of, relating to, or constituting an introduction","zh":"介绍的；引导的","ex":["This is an introductory course in business management."]},{"w":"fine-tune","def":"vt. make very small changes to sth. so that it is as good as it can possibly be","zh":"对...微调","ex":["A speech coach works with actors to fine-tune their accent for the film."]},{"w":"application","def":"n. an official request for sth., usually in writing(","zh":"通常指书面的)申请；请求","ex":["I’ve sent off applications for four different jobs."]},{"w":"opportunity","def":"n. an occasion or situation that makes it possible to do or achieve sth.","zh":"机会;时机","ex":["She was given the opportunity to manage a day-care center.","pull the trigger (on sth.): make a final decision or commit to a certain course of action (about sth.) 做出最终决定 e.g. He couldn’t pull the trigger on any home, and announced he would continue to rent."]},{"w":"whine about","def":"complain about (sb./sth.) in an irritating, childish, or peevish way","zh":"抱怨，发牢骚","ex":["Timmy whined about his coworkers for the entire evening."]},{"w":"dread","def":"vt. be in terror of; fear intensely","zh":"对...感到恐惧;非常害怕","ex":["He’s dreading the exam — he’s sure he’s going to fail."]}]},{"id":"r1","label_zh":"阅读 1","label_en":"Reading 1","title_en":"Should You Cross This Line to Get the Job? 1","title_zh":"为了得到这份工作，你该越过这道线吗?","author_en":"Elizabeth Garone","author_zh":"伊丽莎白·加洛尼","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"In today’s press-a-button-and-it’s-sent environment, résumés and CVs flood many companies at a staggering pace.","zh":"在如今这个“一键发送”的环境中，简历以令人震惊的速度像洪水一般涌入很多公司的邮箱。"},{"n":2,"en":"The average time spent on a résumé by recruiters is a mere six seconds. Maybe that’s why some people, particularly in the tech world, have begun looking for other ways to stand out. (1) The question: is it bragging or relevant to add, say, that you’re an ultra-marathon runner or that you’ve summited Mount Qomolangma?","zh":"招聘官看每份简历平均只花费6秒钟。也许正因为如此，有些人，特别是在科技界，开始寻求其他方式使自己脱颖而出。问题是，当你在简历中说自己是超级马拉松运动员，或是曾经登顶过珠穆朗玛峰，这会让招聘官认为你是在吹嘘炫耀，还是说真的能对你的求职有所帮助呢?展现一点个性","blk":[{"en":"Show a little personality","zh":"","t":"h"}]},{"n":3,"en":"The answer: it depends. This is, again, where tailoring a CV to the position you’re seeking — and even the company and hiring managers you’re targeting — is crucial.","zh":"答案是，视具体情况而定。至关重要的是，必须针对你所申请的职位——甚至目标公司和招聘经理——定制自己的简历。"},{"n":4,"en":"“If you are trying to demonstrate that you embody perseverance and dedication, including on a CV that you ran a marathon can demonstrate your personality and values,” said New Jersey-based human resources consultant Merrick Rosenberg.","zh":"“如果你想展示自己凡事坚持不懈，尽心尽力，那么在简历中加入你跑马拉松的信息可以体现你的个性和价值观，”新泽西的一位人力资源顾问梅里克·罗森博格说。"},{"n":5,"en":"On the other hand, mentioning that you ran five marathons could come across as bragging, according to Rosenberg, so avoid going overboard with personal achievements. “Identifying a few impressive accomplishments can help make the case that you are the type of person they would like to hire,” he said.","zh":"然而，如果你说自己曾经跑过5次马拉松，那就有吹嘘之嫌，所以罗森博格说不要过分强调个人成就。“认准几个令人印象深刻的成就足以展示你正是他们想要招募的人，”他说。"},{"n":6,"en":"But, in general, with so many people going for the same job, don’t be afraid to include your personal interests and hobbies on your CV, said Southern Australia-based business consultant Jo Schneider in an email. (2) “[It] gives me an idea of the applicant’s personality and helps me differentiate appropriate candidates from the pack,” she said. “I am able to get a very quick snapshot at what makes you tick.”","zh":"不过，南澳大利亚的一位企业顾问乔·施耐德在一份邮件中表示，通常而言，由于申请同一个职位的人很多，所以不要害怕在自己的简历中加入个人兴趣和业余爱好。“这可以使我大致了解求职者的个性，帮助我在众多求职者中挑选出合适的人，”她说。“我可以很快了解你的行为动因。”"},{"n":7,"en":"That helps her keep her team “dynamic, diverse and in line with my company’s culture and values”.","zh":"这可以帮助她保持团队的“活力和多样性，并与我们公司的文化和价值观保持一致。”"},{"n":8,"en":"Small details can say a lot, Schneider said. For example, if someone watches movies, reads, and cooks, then he or she is probably introverted but creative. Plays sports? There’s a high chance of being sociable and competitive. Those who enjoy singing, dancing and live entertainment and music, are likely to be fun, outgoing and energetic, she said.","zh":"施耐德说，细节里面蕴含很多信息。例如，如果有人经常看电影、读书或烹饪，那么此人很可能内向，但富有创造力。喜欢运动呢?这个人很有可能善于交际，喜欢竞争。她说，喜欢唱歌跳舞、现场娱乐节目和听音乐的人可能非常有趣、性格外向、活力十足。精挑细选","blk":[{"en":"Choose carefully","zh":"","t":"h"}]},{"n":9,"en":"Mentioning irrelevant — and possibly controversial — hobbies, such as hunting or cage fighting, can cross the line, said Kate Headley, a UK-based diversity consultant, in an email.","zh":"英国的一位多样化咨询顾问凯特·海德里在电子邮件中表示，在简历中提及打猎或角斗等不相关、可能有争议的业余爱好就不恰当了。"},{"n":10,"en":"“While CVs can act to help level the playing field in terms of inclusion, they can also open the door to prejudice and discrimination,” she said. (3) “These create the potential for employers to make non-relevant assumptions about you or your position in society, and conscious and unconscious bias can come into play.”","zh":"“虽然从包容性来说简历有助于实现公平竞争，但也会对偏见和歧视打开方便之门，”她说。“这有可能导致雇主对你或你在社会中的地位做出毫不相干的臆断，有意无意的偏见有可能影响招聘决定。”"},{"n":11,"en":"Always ask yourself if the outside interests you mention have some relevance to the position for which you are applying.","zh":"时刻记住问自己，你所提及的兴趣爱好与你申请的职位是否有关系。"},{"n":12,"en":"“If the personal achievement — regardless how noble — is very time-consuming and not related to the target position, [you run] the risk of the employer thinking the achievement may distract from [your] job performance, and it can have an adverse effect,” said résumé coach Lisa Rangel based in New York.","zh":"“无论你的个人成就多么了不起，如果它十分耗时且与目标职位无关，你就有可能面临风险，雇主可能认为你的个人成就会分散你的精力，影响工作业绩，因而会给求职带来不利影响，”纽约的一位简历撰写顾问丽莎·兰格尔说。"},{"n":13,"en":"It may not seem fair, but that’s reality, she said. (4) Everything you include needs to support the goal of landing the target position or at least convincing the employer that your hobby is an asset. For example: “If you are a professional looking to transition into a sales role and you don’t have a ton of sales experience, showing that you run half-marathons can demonstrate an inner desire to achieve and beat your own personal record,” said Rangel. “The inner drive for self-achievement and consistent personal goal accomplishment is a desirable trait wanted by companies for new sales hires.”","zh":"这似乎有失公允，她说，但事实就是如此。你在简历中包含的所有信息都必须有助于你获得所求的职位，至少也要使雇主相信，你的业余爱好是一个优点。例如，“如果你是一名想要转行做销售的专业人士，而你没有太多的营销经验，那么在简历中提及你曾经多次跑过半程马拉松便可证明你内心的求胜意愿，以及打破个人纪录的愿望，”兰格尔说。“自我实现的内在意愿和始终如一的个人目标是一项优良品质，企业在招聘新的销售人员时都很看重这一点。”"},{"n":14,"en":"(5) Whatever the case, your CV should be used to reinforce the image you are trying to present.","zh":"无论如何，简历都应该用来强化你力图呈现的个人形象。"},{"n":15,"en":"Seattle-based James Stanger, a senior director with an industry trade association, suggests looking at your résumé or CV as an argument. “It’s an argument on why you should hire me, and you have elevator pitch time to make your case,” he said in an email. “You have to have things that stand out in a positive way, something that grabs my attention, and has supporting data.” If you understand your audience, then you can get creative, as long as the content is relevant, Stanger said.","zh":"西雅图一家行业贸易协会高级总监詹姆斯·斯泰杰建议将简历看作一篇议论文。“这是一篇关于你为什么要聘用我的议论文，你只有很短暂的时间来阐述你的观点，”他在电子邮件中写道。“你的简历里必须有一些突出的积极正面的东西，能吸引我的关注，而且要辅以佐证。”斯泰杰说，如果你了解你的受众，你就可以在内容相关的前提下发挥创意。用以强化形象","blk":[{"en":"Use it as reinforcement","zh":"","t":"h"}]},{"n":16,"en":"As long as your accomplishments support the image that you are trying to present, they can provide an added advantage in the interview process. Just make sure you take the time to relate it to an aspect of your personality or work ethic, according to Rosenberg.","zh":"只要你展示的成就能够支撑你试图呈现的形象，就可以在面试中带来额外的优势。罗森博格认为，必须花点时间将其与你的个性或职业道德的某个方面联系起来。"},{"n":17,"en":"“If you want to display that you have highly developed people skills as a computer programmer, you might want to include your volunteer work as public speaker to raise awareness of a cause you support,” he said.","zh":"“如果你想展示自己是一位有很高的人际沟通能力的编程员，你或许应该在简历中包含你从事志愿服务，作公共演讲吸引他人关注你所支持的事业的经历，”他说。"},{"n":18,"en":"And remember that too much of anything can backfire.","zh":"切记，不管什么事，做过了头，就适得其反。"},{"n":19,"en":"“I don’t like big personal spiels on who [jobseekers] are, their hopes and aspirations and how they want to change the world,” said Schneider. Use your cover letter to outline a little about yourself that is relevant to the job you are applying for, and what you are looking for in the role, she said, adding “be straightforward and to the point.”","zh":"“我不喜欢听求职者夸夸其谈，讲述他们自己的人生、希望和抱负以及改变世界的雄心壮志，”施耐德说。她说，应该用简历的附信大致说明你的情况与你所申请的职位之间的关系，以及你希望从这个职位中得到什么，“应该直截了当，切中主题”。"}],"audio_full":"r1full.mp3","vocab":[]},{"id":"r2","label_zh":"阅读 2","label_en":"Reading 2","title_en":"China: Making Graduates Employable","title_zh":"中国:提高毕业生的就业能力","author_en":"Liz Lightfoot","author_zh":"利兹·莱特富特","lead_en":"","lead_zh":"","paras":[{"n":1,"en":"Universities in China are facing similar demands to improve the employability of their graduates as those in the UK, new research among employers has revealed.","zh":"在雇主中展开的一项新的研究表明，与英国一样，中国的大学也面临着提高毕业生就业能力的需求。"},{"n":2,"en":"The Chinese government issued a circular earlier this year urging universities and colleges to strengthen their efforts in preparing students for the workplace. In Britain, the government has set up its own internship scheme to help graduates find work during the recession.","zh":"今年早些时候，中国政府发布通知，敦促高等院校加强学生就业准备方面的努力。在英国，政府建起自己的实习计划，以帮助学生在经济衰退时期找到工作。"},{"n":3,"en":"But what are the skills employers want and how much do they differ between the two nations? That is the question Dr. Troy Heffernan, a senior lecturer in marketing at the University of Plymouth, set out to answer through his involvement in one of 13 partnerships between institutions in the UK and China funded by the British Council to exchange ideas and develop programmes aimed at improving the entrepreneurship and employability of graduates.","zh":"可是，雇主需要什么技能?中英两国在这方面有多大的不同呢?普利茅斯大学市场营销的高级讲师特洛伊·赫弗南博士试图在参与中英大学间13个伙伴合作计划之一的过程中解答这个问题，这些计划由英国文化协会资助，旨在就如何提高毕业生的创业和就业能力交流思想、开发项目。"},{"n":4,"en":"“We found employers in both countries put a great emphasis on leadership qualities and initiative — things that are learned through the activities students engage in and the responsibilities they take on during their time at university,” Heffernan told a conference in London organised by the council, which is inviting proposals for 10 new UK-China partnerships.","zh":"“我们发现在中英两国，用人单位都很重视领导才干和主动精神，这些都是在大学期间通过参与活动、承担责任而学到的。”赫弗南在英国文化协会组织的一次伦敦会议上这样说。该会议邀请人们为10个新的中英伙伴合作计划递交计划书。"},{"n":5,"en":"The University of Plymouth and its partner China Agricultural University in Beijing are working to determine the skills most likely to lead to employability and successful careers. Staff at both universities have conducted face-to-face and telephone interviews with local employers of graduates in three areas, marketing, human resources and finance-accounting.","zh":"普利茅斯大学和地处北京的合作伙伴中国农业大学正致力于确定哪些技能最有可能带来就业机会和职业成功。两所大学的工作人员在市场营销、人力资源和财务会计三个领域对当地毕业生的雇主进行了面对面和电话采访。"},{"n":6,"en":"A draft of a report to be published later this year shows marketing executives in both countries put a high emphasis on good communication skills. In the UK they chose communication — including written and verbal communication, networking skills and foreign language ability — as the top priority followed by the ability to work in a team.","zh":"今年晚些时候将要公布的一份报告的草案显示，中英两国的市场营销主管都高度重视良好的沟通能力。在英国，沟通能力——包括口头和笔头沟通、建立关系网络的能力和外语能力——被认为是至关重要的，其次是团队合作能力。"},{"n":7,"en":"The Chinese employers said the person who could complete a job and get things done was highly prized. Next they sought creativity — an attribute of growing importance in the dynamic, developing market in China that requires people to be good at thinking and putting their ideas and insights into action.","zh":"中国雇主说，他们十分器重能够完成工作、做成事的人，接下来他们要看创造力——在动态的、发展中的中国市场，这是一个重要性日渐凸显的属性，它需要人们善于思考，并将想法和见解化为行动。"},{"n":8,"en":"Graduates seeking work in finance and accountancy should have a good level of commercial awareness and be able to demonstrate a breadth of knowledge outside their academic comfort zone, said UK employers. Second on their list of desirable attributes was the ability to demonstrate a disposition towards customer-related activity.","zh":"英国雇主说，在金融和会计行业谋职的毕业生应该具备良好的商业意识，并且能够在他们的学术舒适区之外展示宽广的知识面。雇主心目中，排在毕业生理想属性第二位的是展现乐于参加与客户相关活动的能力。"},{"n":9,"en":"Perhaps because of the fast growth of China’s economy which has required updating of law and regulation, employers in the financial sector value graduates with the ability to continuously update their knowledge.","zh":"也许是由于中国经济的快速发展需要更新法律、法规知识，金融领域的雇主看重有能力不断更新知识的毕业生。"},{"n":10,"en":"“Banking in China is challenged by change,” said one Chinese bank executive. “We not only care about what our new staff have learned — that is textbook knowledge mainly. We care about whether the new person can autonomously learn in the future.”","zh":"“中国的银行业面临变化的挑战，”一位中国的银行高管表示。“我们不仅关心我们的新员工已经学会了什么——那主要是书本知识，我们也关心新员工在将来是否会自主学习。”"},{"n":11,"en":"Employers in both countries valued the personal skills of graduates seeking work in human resources. UK employers viewed the most important attribute as time management and good organisation. Personal skills, including being approachable, confident, emotionally strong, empathetic and patient, were the second most important requirement.","zh":"两国雇主都看重在人力资源领域求职的毕业生的个人技能。英国雇主认为最重要的属性是时间管理和良好的组织能力。个人技能——包括平易近人、充满自信、心理上坚强、善于理解他人并有耐心，排在重要性的第二位。"},{"n":12,"en":"The Chinese HR managers stressed the importance of a new recruit being ethically strong and possessing high moral principles followed by good communication skills.","zh":"中国人力资源经理们强调，新员工要具备端正的品行和崇高的道德水准。其次，他们还需具备良好的沟通能力。"},{"n":13,"en":"Li Jiahua, a professor of higher education and Vice-president of the China Youth University for Political Science, told the council conference that despite the cultural and economic differences between the two countries, higher education in both was facing similar challenges in terms of student motivation and employment.","zh":"中国青年政治学院副院长、高等教育教授李家华在英国文化协会的会议上说，尽管中英两国在文化、经济领域有诸多不同，两国的高等教育在学生的学习动力和就业方面面临类似的挑战。"},{"n":14,"en":"“There is a risk of college students losing touch with society and they need help to understand how companies work and what is involved in the different jobs and professions. We educators in both countries need to work together to address this risk.”","zh":"“大学生可能会与社会脱节，他们需要帮助，以了解公司如何运作以及不同的工作和职业需要哪些技能。我们两个国家的教育工作者需要共同努力应对这一风险。”"}],"audio_full":"r2full.mp3","vocab":[]}],"vocab":[{"w":"career","def":"n.","zh":"生涯，职业","ex":["I took this new job because I felt that I could make a good career for myself there."]},{"w":"quit","def":"v. stop doing sth. or leave a job or a place","zh":"停止;辞职，离开","ex":["Despite opposition from his family, he quit school and became an actor. If we expect that life won’t be perfect, we’ll be able to avoid that impulse to quit."]},{"w":"basically","def":"ad. for the most part; chiefly","zh":"大体上；基本上","ex":["She’s made one or two spelling errors — but the essay is basically well written."]},{"w":"take it upon/on oneself to do sth.","def":"accept responsibility for doing sth. without being asked","zh":"自行承担或去做某事，将...视作己任","ex":["The CEO took it upon himself to personally thank each guest at the meeting."]},{"w":"evaluate","def":"vt. determine the importance, effectiveness, or worth of; assess","zh":"评估;评价","ex":["What are the most important points to consider when evaluating an employee’s performance?"]},{"w":"give sb. an ultimatum","def":"","zh":"给某人最后通牒","ex":["The club gave him an ultimatum — either he apologized, or he would be expelled(开除)from the team.","take its/a toll (on sb./sth.): have a bad effect (on sb./sth.); cause a lot of damage, deaths, suffering, etc. 产生恶果;造成重大损失(或伤亡、灾难等) e.g. The recession is taking its toll on the housing market.Several separate wildfires in California are taking a terrible toll."]},{"w":"temporary","def":"a. not lasting or needed for very long","zh":"短暂的；暂时的","ex":["According to the report, over 6% of the labor force are working on a temporary basis."]},{"w":"exit","def":"n.","zh":"退出，(尤指演员)退场；出口","ex":["Brexit refers to Britain’s exit from the E.U.At the end of the performance, there was a mad dash for the exit."]},{"w":"productive","def":"a. having positive results; resulting in or providing a large amount or supply of sth.","zh":"富有成效的；多产的","ex":["We had a very productive meeting — a lot of problems were solved.What was once desert has become productive farmland."]},{"w":"better off","def":"in a preferable position or situation","zh":"境况更好","ex":["I know you’re unhappy that the relationship ended, but you’re better off without him."]},{"w":"in the long run","def":"over a relatively long or extended length of time in the future","zh":"从长远看","ex":["True, there’s some uncertainty in the Chinese economy. But in the long run, you’ve got to be confident."]},{"w":"put energy into","def":"","zh":"向...投入精力","ex":["She’s put a lot of energy into making the house look nice."]},{"w":"relief","def":"n.(","zh":"不快过后的)轻松；解脱","ex":["It was such a relief to hear that Marta was found safe and well."]},{"w":"wash over","def":"(of a feeling) suddenly affect sb. strongly, so that they are not aware of anything else(","zh":"情绪)突然而深刻地袭来","ex":["A feeling of warmth washed over him at the thought of his daughter."]},{"w":"for good","def":"permanently; forever","zh":"永久地，永远地","ex":["He had thought his cancer was gone for good but, sadly, this was not the case."]},{"w":"eagerness","def":"n.","zh":"热切，渴望","ex":["The book describes Amelia Earhart’s eagerness for new experiences.","every ounce of (one’s) courage/energy/strength, etc.: all the courage/energy/strength etc. that one has 所有的勇气/精力/体力等 e.g. He tried to open the door by using every ounce of his strength."]},{"w":"plus","def":"conj. and also","zh":"而且；加上","ex":["The Johnsons decided to move to the suburb, where their kids could play in the yard. Plus, the school there is really nice."]},{"w":"to this day","def":"up to and including the present moment","zh":"到现在，直到今天","ex":["To this day nobody knows what happened to him."]},{"w":"consistent","def":"a. happening in the same way and continuing for a period of time","zh":"连续的；持续的","ex":["It is an institution which had consistent growth in the 1980s, 1990s and continues to grow every year."]},{"w":"fall back on","def":"depend on (sb. or sth.) that one has kept in reserve","zh":"求助于；依靠","ex":["We fell back on our savings to get us through the hard times."]},{"w":"expense","def":"n. (usu. pl.)","zh":"开销，花费","ex":["If you intend to go back to school, we have to start cutting down on our expenses."]},{"w":"rack up","def":"acquire or accumulate a large number or amount of (sth.)","zh":"累积","ex":["Any kind of travel tends to rack up several incidental(附带的)costs — taxi fares, Internet access fees, phone calls, tips, laundry charges, etc."]},{"w":"stability","def":"n. the quality of being stable","zh":"稳定；稳固","ex":["It’s my good luck to have grown up in a period of relative economic stability.","commit (oneself) to doing sth.: promise or pledge to do sth. 承诺或保证做某事 e.g. The government has committed itself to improving healthcare for all."]},{"w":"uncertainty","def":"n. the state of being uncertain","zh":"不确定性","ex":["Look deeply at the risks as well as the benefits of new technology. If those risks can be managed, keep going even in the face of uncertainty."]},{"w":"introductory","def":"a. of, relating to, or constituting an introduction","zh":"介绍的；引导的","ex":["This is an introductory course in business management."]},{"w":"fine-tune","def":"vt. make very small changes to sth. so that it is as good as it can possibly be","zh":"对...微调","ex":["A speech coach works with actors to fine-tune their accent for the film."]},{"w":"application","def":"n. an official request for sth., usually in writing(","zh":"通常指书面的)申请；请求","ex":["I’ve sent off applications for four different jobs."]},{"w":"opportunity","def":"n. an occasion or situation that makes it possible to do or achieve sth.","zh":"机会;时机","ex":["She was given the opportunity to manage a day-care center.","pull the trigger (on sth.): make a final decision or commit to a certain course of action (about sth.) 做出最终决定 e.g. He couldn’t pull the trigger on any home, and announced he would continue to rent."]},{"w":"whine about","def":"complain about (sb./sth.) in an irritating, childish, or peevish way","zh":"抱怨，发牢骚","ex":["Timmy whined about his coworkers for the entire evening."]},{"w":"dread","def":"vt. be in terror of; fear intensely","zh":"对...感到恐惧;非常害怕","ex":["He’s dreading the exam — he’s sure he’s going to fail."]}],"exercises":[{"id":"opener","part":"opener","type":"qa","title_en":"Opener — Warming Up","title_zh":"单元导览 · 热身问答","instr_en":"Watch a video clip about the job hunting process, then work with your partner and answer the questions.","instr_zh":"观看关于求职过程的视频，然后与同伴一起回答下列问题。","items":[{"q":"In your job hunting process, what should you do first of all?","zh":"在求职过程中，你首先应该做什么？","a":"You should, first of all, create your personal brand by finding out what you want, what you know and who you are.","az":"首先要打造个人品牌：弄清楚自己想要什么、知道什么、是怎样的人。"},{"q":"How may you learn about job openings?","zh":"你可以通过哪些途径了解职位空缺？","a":"You may learn about job openings through many different channels, but remember the majority of jobs are never advertised.","az":"可以通过多种渠道了解，但要记住大多数职位从不公开招聘。"},{"q":"Why should your CV be easy to read and relevant to the job?","zh":"为什么简历要便于阅读并与职位相关？","a":"On average an employer uses 20 to 30 seconds to scan through your CV, so it should be easy to read and relevant to the job you are applying for.","az":"平均而言，雇主只花20到30秒浏览简历，因此简历要易读、并与所申请职位相关。"},{"q":"How can you show you are genuinely interested in the job?","zh":"怎样才能表现出你对这份工作是真心感兴趣的？","a":"You should adapt your application to the job description. You are advised to use the ad actively because it is often filled with hints on what the company is looking for.","az":"应当根据岗位描述调整申请材料；要主动利用招聘广告，因为它常常透露出公司在寻找什么样的人。"},{"q":"What is your job during the interview?","zh":"面试时你的任务是什么？","a":"Hiring anyone could be a huge risk to the company, so your job during the interview is to show that you are the least risky choice / the right choice.","az":"雇用任何人对公司都可能是巨大风险，所以你的任务是证明自己是风险最小的选择、也就是正确的选择。"}]},{"id":"org","part":"text","type":"qa","title_en":"Text Organization","title_zh":"课文结构分析","instr_en":"Pair work: The writer narrates her experience of quitting her first job in sequential order. Complete the table below and then compare your notes with your partner.","instr_zh":"结对练习：作者按时间顺序讲述自己辞去第一份工作的经历。补全下表，然后与同伴对照。","items":[{"q":"When: at her first job — working conditions, mental state, and actions taken","zh":"时间：做第一份工作时——工作状况、心理状态与采取的行动","a":"She was basically treated like a workhorse and there wasn’t much learning. She felt unfulfilled at the end of each workday. However, she never thought about quitting as it would be unacceptable by any standard. She must have called her mom again and again, who after evaluating her situation commanded that she quit her job. And she felt utterly relieve
