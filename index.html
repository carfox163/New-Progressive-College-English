eventually escape our control? Opinions {{7}} on how seriously we should take this possibility. Some people {{8}} the hope that sufficient safeguards can be {{9}} the design of the super-intelligent robots of the future.","answers":["on the rise","enhance","existence","voiced","pose","trend","vary","take/draw comfort from","integrated into"]},{"id":"trans","part":"text","type":"translate","dir":"zh2en","title_en":"Comprehensive Practice 4.2 — Translation","title_zh":"综合练习 4.2 · 段落汉译英","instr_en":"Translate the following paragraph into English, using the words and phrases in the box.","instr_zh":"用下面方框中的词或短语把下列段落译成英语。","bank":["make strides in sth./doing sth.","pose","existence","have access to","potential","decrease","voice","enhance"],"items":[{"q":"虽然一些科学家说他们担忧人工智能会对人类生存带来威胁，人们对发明可以思考的机器的努力从未停止过。许多企业正在探究学习方式类似于人类的计算机系统。他们往往把研究实验室设在硅谷，以便利用那里巨大的顶尖工程师和科学家人才库。有的研究实验室致力于“深度学习”，这是新兴的计算机科学领域，探寻如何用硬件和软件模仿人类大脑。例如，基于深度学习的语音搜索识别错误率据称已经降低到2%。近年来，深度学习研究已经取得了很大进展，但是，该项技术仍然有很长的路要走。","a":"Although some scientists have voiced their fears that artificial intelligence may pose a threat to the existence of the human race, efforts to create thinking machines have never stopped. Many companies are exploring computer systems that can learn in ways similar to humans. They often set up research labs in Silicon Valley, where they can have access to a huge talent pool of top engineers and scientists. Some labs are dedicated to “deep learning” — an emerging computer science field that seeks to mimic the human brain with hardware and software. For example, it is claimed that the error rate of voice search based on deep learning has been decreased to 2%. In recent years, great strides have been made in exploring deep learning. However, the technology still has a long way to go."}]},{"id":"r1match","type":"qa","title_en":"Comprehension Check — Reading 1","title_zh":"阅读1 段落定位","instr_en":"Skim the text and identify the paragraph from which the information in each of the following statements is derived. Write down the paragraph number in the brackets.","instr_zh":"快速浏览课文，判断下列每句话的信息出自哪一段，并写出段落编号。","items":[{"q":"A. Not many teachers will be needed due to the technological innovations in learning.","zh":"由于学习方式的技术创新，未来需要的教师不会很多。","a":"第 8 段"},{"q":"B. Companies will benefit a lot from technological improvements in robotics and automation.","zh":"企业将从机器人技术和自动化方面的技术进步中获益良多。","a":"第 1 段"},{"q":"C. It is critical to enable the broader masses of people to share in the benefits from technological advance.","zh":"让更广大的民众共享技术进步带来的好处至关重要。","a":"第 13 段"},{"q":"D. Only those who have had enough education will have the opportunity to participate in the coming manufacturing revolution.","zh":"只有受过足够教育的人才有机会参与即将到来的制造业革命。","a":"第 3 段"},{"q":"E. Technological innovation partly accounts for the rise in income and wealth inequality.","zh":"技术创新在一定程度上解释了收入与财富不平等的加剧。","a":"第 11 段"}],"part":"r1"},{"id":"r1tr","type":"translate","title_en":"Translation — Reading 1","title_zh":"阅读1 英译中","instr_en":"Translate the following underlined sentences from the article into Chinese.","instr_zh":"把下列句子译成中文，注意画线部分的表达。","items":[{"q":"But, unless the proper policies to nurture job growth are put in place, it remains uncertain whether demand for labor will continue to grow as technology marches forward.","a":"但是，除非制定适当的政策来培育就业增长，否则随着技术的进步，劳动力需求是否继续增长仍难以确定。"},{"q":"And, by transforming how services are provided to the public, the e-government trend can offset the employment losses with productivity gains.","a":"而且，通过改变向公众提供服务的方式，电子政务的趋势可以用生产率的提高来抵消岗位的流失。"},{"q":"Child labor was abolished throughout the developed world, working hours and conditions became more humane, and a social safety net was put in place to protect vulnerable workers and stabilize the (often fragile) macro economy.","a":"发达国家普遍废除了童工，工作时间和工作条件变得更人道，社会保障体系得以建立，以保护弱势劳动者、稳定往往十分脆弱的宏观经济。"},{"q":"Even that may not be sufficient, in which case it will become necessary to provide permanent income support to those whose jobs are displaced by software and machines.","a":"即便如此或许仍不足够，倘若如此，就有必要为那些工作被软件和机器取代的人提供永久性收入支持。"}],"part":"r1"},{"id":"r2cloze","part":"r2","type":"cloze","title_en":"Reading 2 — Word Bank Cloze","title_zh":"阅读2 · 选词填空","instr_en":"Read the following passage carefully. Select one word for each blank from a list of choices given in the word bank. You may not use any of the words in the bank more than once.","instr_zh":"仔细阅读下面短文，从词库中为每个空格选一个词，每个词只能使用一次。","bank":["account","imports","mass","shifting","aims","indigenous","modernize","surpass","federation","installs","reliant","totaling","forecast","manufacture","ratio"],"passage":"Over the past decade, China has made a large push to develop its robotics and AI industry. Through initiatives such as Internet Plus, the Chinese government {{1}} to quickly grow China’s domestic high-tech industry to compete with high-tech manufacturing economies abroad. The Internet Plus initiative lays out a five-year plan to {{2}} China’s industry, and pays special attention to its manufacturing processes, including {{3}} labor-intensive work to robots. The initiative has had positive results with increased spending and favorable policy. However, while China now {{4}} more robots than any other country, most of the core parts are still {{5}} on imports, and not many robot makers are ready for {{6}} production. The hope is that through innovation fostering plans, China can reduce dependency on foreign robot {{7}} in favor of home-grown core technologies developed domestically. The objective is to increase the percentage of home-made robots to 70 percent by 2025. However, this is easier said than done. Robotics is a very complex field that requires an extremely deep knowledge base. Core components demand a very specific skills set to develop and {{8}}. The foreign robotics and AI companies took decades of research and development to arrive at where they are now. Clearly, if China is to reach its goals, there needs to be much more effort directed into research and cultivating {{9}} talent. Despite these challenges, it is still possible for China to become a global leader in robotics. The good news is that China’s spending on research and development has been on the rise in recent years, which should help attract more experts, and deepen the collective knowledge base. If this trend continues, China could very likely reach or even {{10}} other high-tech nations in robotics and AI innovation in the coming decade.","answers":["aims","modernize","shifting","installs","reliant","mass","imports","manufacture","indigenous","surpass"]},{"id":"r2mc","type":"mc","title_en":"Comprehension Check — Reading 2","title_zh":"阅读2 课文理解","instr_en":"Choose the best answer for each of the following.","instr_zh":"为下列各题选择最佳答案。","items":[{"q":"Which of the following countries was the largest market for robots in 2014?","zh":"下列哪个国家是 2014 年最大的机器人市场？","opts":[{"k":"A","en":"China.","zh":"中国。"},{"k":"B","en":"Japan.","zh":"日本。"},{"k":"C","en":"Germany.","zh":"德国。"},{"k":"D","en":"The United States.","zh":"美国。"}],"a":"A"},{"q":"The purpose of “Made in China 2025” is to ______.","zh":"“中国制造 2025”的目的是______。","opts":[{"k":"A","en":"surpass the United States in the robot industry","zh":"在机器人产业上超越美国"},{"k":"B","en":"replace labor-intensive jobs with robots","zh":"用机器人取代劳动密集型岗位"},{"k":"C","en":"dominate the world robotics market","zh":"主导世界机器人市场"},{"k":"D","en":"modernize China's industry","zh":"实现中国工业现代化"}],"a":"D"},{"q":"China still has a long way to go in the robotics industry because ______.","zh":"中国在机器人产业上仍有很长的路要走，因为______。","opts":[{"k":"A","en":"few robot-related firms have been established","zh":"与机器人相关的公司寥寥无几"},{"k":"B","en":"talented robotics scientists are in short supply","zh":"优秀的机器人科学家供不应求"},{"k":"C","en":"key parts of robots are still imported","zh":"机器人的关键部件仍然依赖进口"},{"k":"D","en":"investment in the robot industry is hard to find","zh":"机器人产业难以获得投资"}],"a":"C"},{"q":"What do we learn about China's robotics industry?","zh":"关于中国的机器人产业，我们了解到什么？","opts":[{"k":"A","en":"It has been quickly introduced to the service sector.","zh":"它已被迅速引入服务领域。"},{"k":"B","en":"It has little impact on blue-collar workers' employment.","zh":"它对蓝领工人的就业几乎没有影响。"},{"k":"C","en":"It is greatly boosting productivity in the manufacturing sector.","zh":"它极大地提升了制造业的生产率。"},{"k":"D","en":"It lacks a solid foundation to ensure its healthy growth.","zh":"它缺乏确保健康发展的坚实基础。"}],"a":"B"},{"q":"Though the author gives no direct answer to the question “Will China be a leader in robotics”, he seems ______.","zh":"尽管作者没有直接回答“中国会成为机器人领域的领导者吗”，但他似乎______。","opts":[{"k":"A","en":"to be worried about its market share","zh":"担心其市场份额"},{"k":"B","en":"to be optimistic about its long-term prospects","zh":"对其长期前景持乐观态度"},{"k":"C","en":"to hold a wait-and-see attitude about its future","zh":"对其未来持观望态度"},{"k":"D","en":"to be skeptical about its capabilities to catch up","zh":"对其追赶能力持怀疑态度"}],"a":"B"}],"part":"r2"},{"id":"r2tr","part":"r2","type":"translate","dir":"zh2en","title_en":"Reading 2 — Translation","title_zh":"阅读2 · 段落汉译英","instr_en":"Translate the following passage into English.","instr_zh":"把下列段落译成英语。","items":[{"q":"在工业机器人领域，我国目前约占全球市场份额的三分之一，是全球第一大工业机器人应用市场。我国机器人的运用正在从制造行业扩展到服务行业，包括家用、教育、医学和保健领域。","a":"In the field of industrial robots, China currently accounts for about one-third of the global market share and is the world’s number one market for industrial robot applications. The application of robots in China is extending from manufacturing industry into the service sector, including household use, education, medicine and healthcare."}]}]}]</script>

const $ = s => document.querySelector(s);
const el = (t, cls, html) => { const e = document.createElement(t); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; };
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const state = {
  unit: DATA[0].id,
  zh: localStorage.getItem('zh') === '1',
  exzh: localStorage.getItem('exzh') === '1',
  ans: localStorage.getItem('ans') === '1',
  fs: parseFloat(localStorage.getItem('fs') || '1'),
  tf: JSON.parse(localStorage.getItem('tf') || '{}')
};

/* ---------- 侧栏单元列表 ---------- */
function renderDocList(){
  const box = $('#doclist');
  box.innerHTML = '';
  let book = '';
  DATA.forEach(u => {
    if (u.book !== book) {
      book = u.book;
      box.appendChild(el('div','bookhead', book === 'Book 3' ? '第三册 Book 3' : '第四册 Book 4'));
    }
    const b = el('button','unitbtn' + (u.id===state.unit?' active':''),
      `<span class="u">${u.unit.replace('Unit ','U')}</span><span>${esc(u.title_zh)}<br><span style="color:var(--muted);font-size:12.5px">${esc(u.title_en)}</span></span>`);
    b.onclick = () => { location.hash = u.id; };
    box.appendChild(b);
  });
}

/* ---------- 首页目录 ---------- */
function unitStat(u){
  const items = (u.exercises||[]).reduce((a,s)=> a + ((s.items||[]).length || (s.answers||[]).length), 0);
  return { passages:(u.passages||[]).length, vocab:(u.vocab||[]).length, sets:(u.exercises||[]).length, items };
}
function homeHTML(){
  const tot = {passages:0, vocab:0, sets:0, items:0};
  DATA.forEach(u => { const s = unitStat(u);
    tot.passages += s.passages; tot.vocab += s.vocab; tot.sets += s.sets; tot.items += s.items; });
  const stat = (n, t) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`;
  const books = [];
  DATA.forEach(u => { if (!books.includes(u.book)) books.push(u.book); });
  const label = bk => bk === 'Book 3' ? '第三册 · Book 3' : (bk === 'Book 4' ? '第四册 · Book 4' : bk);
  const sections = books.map(bk => `
    <section class="home-book">
      <div class="home-bookhead">${esc(label(bk))}<span class="line"></span></div>
      <div class="home-grid">
        ${DATA.filter(u => u.book === bk).map(u => {
          const s = unitStat(u);
          return `<a class="ucard" href="#${u.id}">
            <div class="uc-top"><span class="uc-no">${esc(u.unit.replace('Unit ','U'))}</span>
              <span class="uc-book">${esc(u.book)}</span></div>
            <div class="uc-t">${esc(u.title_zh)}</div>
            <div class="uc-en">${esc(u.title_en)}</div>
            <div class="uc-meta"><span>${s.passages} 篇课文</span>
              <span>${s.vocab} 个词条</span><span>${s.items} 道练习</span></div>
            <div class="uc-go">进入单元 <i>→</i></div>
          </a>`;
        }).join('')}
      </div>
    </section>`).join('');
  return `
  <section class="home-hero">
    <div class="home-brand">
      ${LOGO ? `<img class="home-logo" src="${LOGO}" alt="CreativeLearner">` : ''}
      <div class="home-titles">
        <div class="home-kicker">全新版大学进阶英语 · 综合教程（第二版）</div>
        <h1 class="home-title">Book 3 &amp; Book 4 · 精读课件</h1>
        <p class="home-sub">六个单元完整课件：课文全文与逐段录音、重点词汇（可朗读）、课后练习（答案 + 中文对照），
          另含篇章结构分析、难句理解与视听说练习。</p>
      </div>
    </div>
    <div class="home-stats">
      ${stat(DATA.length, '个单元')}${stat(tot.passages, '篇课文')}
      ${stat(tot.vocab, '个重点词条')}${stat(tot.sets, '组练习')}${stat(tot.items, '道题目')}
    </div>
  </section>
  ${sections}
  <section class="home-tips">
    <h4>使用说明</h4>
    <div class="tipgrid">
      <div class="tip"><b>三个开关（右上角）</b><p>「英汉对照」逐段显示译文；「中文对照」显示练习题干译文；
        「答案」显示参考答案，判断题与选择题会即时判对错。</p></div>
      <div class="tip"><b>课文朗读</b><p>每篇课文随机指定 Sonia 或 Ryan 一人整篇在线朗读（不逐段换人）；
        标题下可「整篇连播」或「逐段跟读」，段落右侧点 ▶ 可单段复听，段落自动高亮跟随。</p></div>
      <div class="tip"><b>重点词汇朗读</b><p>词汇区标题右侧「连续朗读」用微软 Ryan 语音依次朗读全表单词（不读释义），
        单击任意单词也能发音。</p></div>
      <div class="tip"><b>快捷键</b><p><kbd>Z</kbd> 英汉对照 · <kbd>X</kbd> 练习中文 · <kbd>A</kbd> 答案 ·
        <kbd>空格</kbd> 播放/暂停；右上角 A− / A+ 调整字号。</p></div>
    </div>
  </section>
  <div class="footer">全新版大学进阶英语 综合教程（第二版）第三、四册 · 精读课件 · CreativeLearner</div>`;
}
function showHome(){
  if (typeof stopSpeak === 'function') stopSpeak();
  if (typeof haltSpeech === 'function') haltSpeech();
  document.body.classList.add('onhome');
  $('#crumb').textContent = '目录首页';
  const hb = $('#homebtn'); if (hb) hb.classList.add('on');
  $('#home').innerHTML = homeHTML();
  window.scrollTo({top:0});
}

/* ---------- 渲染单元 ---------- */
function unitById(id){ return DATA.find(u => u.id === id) || DATA[0]; }

function render(){
  const u = unitById(state.unit);
  document.body.classList.remove('onhome');
  const hb = $('#homebtn'); if (hb) hb.classList.remove('on');
  if (typeof stopSpeak === 'function') stopSpeak();
  document.title = `${u.title_zh} · 精读课件`;
  $('#crumb').innerHTML = `<b>${u.book}</b> · ${u.unit} · ${esc(u.title_zh)}`;
  const w = $('#wrap');
  w.innerHTML = '';

  /* hero */
  const hero = el('section','hero');
  hero.innerHTML = `
    <div class="eyebrow">${u.book} · ${u.unit}<span class="line"></span></div>
    <h2>${esc(u.title_en)}</h2>
    <p class="zh">${esc(u.title_zh)}</p>
    <div class="meta">
      <span class="chip">课文 <b>3</b> 篇</span>
      <span class="chip">段落 <b>${u.passages.reduce((a,p)=>a+p.paras.length,0)}</b> 段</span>
      <span class="chip">在线朗读 <b>${u.passages.length}</b> 篇</span>
      <span class="chip">重点词汇 <b>${u.vocab.length}</b> 条</span>
      <span class="chip">练习 <b>${u.exercises.length}</b> 组</span>
    </div>`;
  w.appendChild(hero);

  /* 章节顺序：导览 → 主课文 → 词汇 → 练习 → 阅读1 → 词汇 → 练习 → 阅读2 → 词汇 → 练习 */
  const navs = [];
  const exSets = u.exercises || [];
  const setsOf = part => exSets.filter(x => (x.part || 'text') === part);

  /* 导览 */
  const ov = el('section','block'); ov.id = u.id+'-overview';
  const goals = (u.goals||[]).map(g=>`<li>${esc(g)}</li>`).join('');
  ov.innerHTML = `<div class="blockhead"><h3>单元导览<span>Opener</span></h3></div>
    <div class="goals"><ol>${goals}</ol></div>
    <div class="toc">${u.passages.map(p=>`

      d.innerHTML = `

/* ---------- 词汇区 ---------- */
/* 用微软 Ryan 等英文语音朗读单词：只念词形，不念释义与词性 */
const SPEAK_OK = typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined';
const ICON_SPEAK = '<svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg>';
const ICON_STOPP = '<svg viewBox="0 0 10 12" aria-hidden="true"><rect x="0" y="1" width="10" height="10" rx="1.5"/></svg>';
let ryanVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices() || [];
  if (!vs.length) return null;
  const score = v => {
    const n = (v.name || '').toLowerCase(), l = (v.lang || '').toLowerCase().replace('_','-');
    return (/ryan/.test(n) ? 100 : 0)
      + (l === 'en-us' ? 40 : /^en/.test(l) ? 22 : 0)
      + (/natural|online/.test(n) ? 12 : 0)
      + (/microsoft/.test(n) ? 8 : 0)
      + (v.localService ? 0 : 4);
  };
  return vs.slice().sort((a, b) => score(b) - score(a))[0] || null;
}
function ensureVoice(){
  if (!SPEAK_OK) return null;
  if (!ryanVoice) ryanVoice = pickVoice();
  return ryanVoice;
}
if (SPEAK_OK){
  speechSynthesis.onvoiceschanged = () => { ryanVoice = pickVoice(); };
  speechSynthesis.getVoices();   /* 预热语音列表 */
}
function cleanWord(w){
  return String(w || '')
    .replace(/\bsth\.?/gi, 'something')
    .replace(/\bsb\.?/gi, 'somebody')
    .replace(/[／\/、，,；;：:()（）\[\]【】]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
/* 把题干/句子整理成适合朗读的英文：去中文提示、去标记符号、缩写补全 */
function speakableText(raw){
  let t = String(raw || '');
  if (!/[A-Za-z]/.test(t)) return '';
  t = stripCJK(t)[0] || t;
  t = t.replace(/\[\[(.+?)\]\]/g, '$1')
       .replace(/_{3,}/g, ' blank ')
       .replace(/\bsth\.?/gi, 'something')
       .replace(/\bsb\.?/gi, 'somebody')
       .replace(/[／\/、，,；;：:()（）\[\]【】「」『』“”‘’]/g, ' ')
       .replace(/\s+/g, ' ').trim();
  return /[A-Za-z]{2,}/.test(t) ? t : '';
}
function markSpeak(node){
  document.querySelectorAll('.speaking,.solo').forEach(x => x.classList.remove('speaking','solo'));
  if (node) node.classList.add('speaking');
}
function speak(text, node, done){
  if (!SPEAK_OK){ if (typeof done === 'function') done(); return; }
  const fire = () => {
    const ut = new SpeechSynthesisUtterance(text || '');
    const v = ensureVoice();
    if (v){ ut.voice = v; ut.lang = v.lang; } else { ut.lang = 'en-US'; }
    ut.rate = 0.92; ut.pitch = 1;
    ut.onend = ut.onerror = () => { if (typeof done === 'function') done(); };
    try { speechSynthesis.speak(ut); } catch(e){ if (typeof done === 'function') done(); }
  };
  /* 仅在上一段还在读时才 cancel：避免 Chrome 把紧随其后的新句子一起取消 */
  if (speechSynthesis.speaking || speechSynthesis.pending){
    speechSynthesis.cancel();
    setTimeout(fire, 60);
  } else {
    fire();
  }
}
function speakWord(w, node, done){ speak(cleanWord(w) || String(w || ''), node, done); }

/* 单击某个节点朗读；再点一次停止 */
function speakNode(node){
  const txt = speakableText(node.textContent || '');
  if (!txt) return false;
  const was = node.classList.contains('speaking');
  stopSpeak();
  if (was) return true;
  node.classList.add('speaking');
  node.scrollIntoView({block:'nearest'});
  speak(txt, node, () => node.classList.remove('speaking'));
  return true;
}

/* 把完形正文按句子切分成可点读的小段 */
function splitSentences(p){
  const out = []; let cur = null;
  const ensure = () => { const s = document.createElement('span'); s.className = 'sspk'; out.push(s); cur = s; return s; };
  Array.from(p.childNodes).forEach(n => {
    if (n.nodeType === 3){
      String(n.textContent).split(/([.!?]["'”’]?\s+)/).forEach(part => {
        if (!part) return;
        (cur || ensure()).appendChild(document.createTextNode(part));
        if (/[.!?]["'”’]?\s+$/.test(part)) cur = null;
      });
    } else {
      (cur || ensure()).appendChild(n);
    }
  });
  if (!out.length) return;
  p.textContent = '';
  out.forEach(s => p.appendChild(s));
}

let vseq = null;   /* 连续朗读队列 */
function seqBtnReset(){
  document.querySelectorAll('.vplay,.explay').forEach(b => {
    b.classList.remove('on');
    b.innerHTML = ICON_SPEAK + '<span>' + (b.dataset.label || '连续朗读') + '</span>';
  });
}
function clearPlaying(){ document.querySelectorAll('.para.playing').forEach(x => x.classList.remove('playing')); }
/* 统一停止：课文在线朗读 + 词汇/题干点读，一并复位按钮与高亮 */
function haltSpeech(){
  if (SPEAK_OK) speechSynthesis.cancel();
  vseq = null;
  if (typeof tts !== 'undefined') tts = null;
  markSpeak(null);
  clearPlaying();
  seqBtnReset();
  document.querySelectorAll('.pill.on').forEach(b => b.classList.remove('on'));
}
function stopSpeak(){ haltSpeech(); }
function ttsStop(){ haltSpeech(); }
function vocabNext(){
  if (!vseq) return;
  if (vseq.i >= vseq.nodes.length){ stopSpeak(); return; }
  const node = vseq.nodes[vseq.i];
  markSpeak(node);
  node.scrollIntoView({block:'nearest'});
  const txt = speakableText(node.textContent) || String(node.textContent || '');
  speak(txt, node, () => {
    if (!vseq) return;
    vseq.i += 1;
    setTimeout(vocabNext, 240);
  });
}
function startSeq(nodes, btn){
  stopSpeak();
  if (!nodes || !nodes.length) return;
  vseq = { nodes, i: 0, btn };
  if (btn){
    btn.classList.add('on');
    btn.innerHTML = ICON_STOPP + '<span>停止朗读</span>';
    const v = ensureVoice();
    btn.title = '当前语音：' + (v ? v.name : '系统默认 en-US');
  }
  vocabNext();
}
function startVocab(vs, btn){ startSeq(Array.from(vs.querySelectorAll('.vitem .vw')), btn); }

function vocabBlock(list, id, titleZh, titleEn, withSearch){
  const vs = el('section','block'); vs.id = id;
  vs.innerHTML = `<div class="blockhead"><h3>${esc(titleZh)}<span>${esc(titleEn)}</span></h3>
    ${SPEAK_OK ? `<button class="pill vplay" title="用微软 Ryan 语音依次朗读本表单词（只读词形，不读释义）">${ICON_SPEAK}<span>连续朗读</span></button>` : ''}</div>
    ${withSearch?`<div class="vsearch"><input class="vq" placeholder="搜索单词、短语或中文释义…" autocomplete="off">
      <span class="note vcount"></span></div>`:''}
    <div class="vlist"></div>`;
  const vlist = vs.querySelector('.vlist');
  const draw = (kw) => {
    const k = (kw||'').trim().toLowerCase();
    const rows = list.filter(v => !k || (v.w||'').toLowerCase().includes(k) || (v.zh||'').includes(k) || (v.def||'').toLowerCase().includes(k));
    vlist.innerHTML = rows.map(v => `<div class="vitem">
      <div class="vtop"><span class="vw" title="点击朗读">${esc(v.w)}</span>${v.zh?`<span class="vzh">${esc(v.zh)}</span>`:''}</div>
      ${v.def?`<div class="vdef">${esc(v.def)}</div>`:''}
      ${(v.ex||[]).length?`<ul class="vex">${v.ex.slice(0,3).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}
    </div>`).join('') || `<div class="emptyhint">没有匹配的词条。</div>`;
    if (withSearch) vs.querySelector('.vcount').textContent = rows.length + ' / ' + list.length + ' 条';
  };
  draw('');
  if (withSearch) vs.querySelector('.vq').oninput = e => draw(e.target.value);
  const btn = vs.querySelector('.vplay');
  if (btn){
    btn.dataset.label = '连续朗读';
    btn.onclick = () => { vseq && vseq.btn === btn ? stopSpeak() : startVocab(vs, btn); };
  }
  if (SPEAK_OK) vlist.addEventListener('click', e => {
    const w = e.target.closest('.vw');
    if (!w) return;
    stopSpeak();
    const item = w.closest('.vitem');
    item.classList.add('solo');
    speakWord(w.textContent, item, () => item.classList.remove('solo'));
  });
  return vs;
}

/* ---------- 练习区 ---------- */
function exSection(u, sets, key, lab){
  const sec = el('section','block'); sec.id = u.id+'-'+key+'-ex';
  sec.innerHTML = `<div class="blockhead"><h3>${esc(lab[0])}<span>${esc(lab[1])}</span></h3></div>`;

function exCard(u, set){
  const si = u.exercises.indexOf(set);
  const card = el('div','exset');
  const bank = (set.bank||[]).length
    ? `<div class="cbank">${set.bank.map(b=>`<span>${esc(b)}</span>`).join('')}</div>` : '';
  let body = '';
  if (set.type === 'cloze'){
    const parts = String(set.passage||'').split(/\{\{(\d+)\}\}/);
    let html = '';
    for (let i = 0; i < parts.length; i++){
      if (i % 2 === 0) html += esc(parts[i]);
      else {
        const n = parseInt(parts[i], 10);
        html += `<span class="cnb"><i>${n}</i><u>&nbsp;</u><b>${esc((set.answers||[])[n-1]||'')}</b></span>`;
      }
    }
    body = `<p class="cztext">${html}</p>`;
  } else {
    const isCN = set.dir === 'zh2en';
    body = `<ol class="items">${(set.items||[]).map((it, ii) => {
      const answered = it.a ? `<div class="ansbox"><span class="lab">参考答案</span>${fmtA(it.a, set.type, it)}</div>` : '';
      const tf = set.type==='tf' ? `<div class="tfrow" data-tf="${u.id}|${si}|${ii}">
          <button class="tfbtn" data-v="T">T</button><button class="tfbtn" data-v="F">F</button></div>` : '';
      const mc = set.type==='mc' && it.opts ? `<div class="tfrow mcrow" data-tf="${u.id}|${si}|${ii}">` +
          it.opts.map(o=>`<button class="tfbtn mcbtn" data-v="${esc(o.k)}"><span class="k">${esc(o.k)}</span>
            <span class="ot">${esc(o.en)}</span>${o.zh?`<span class="oz">${esc(o.zh)}</span>`:''}</button>`).join('') + `</div>` : '';
      return `<li><div class="q${isCN?' cn':''}">${fmtQ(it.q)}</div>
        ${it.zh && !isCN ? `<div class="qzh">${esc(it.zh)}</div>` : ''}
        ${it.hint?`<div class="qhint">提示：${esc(it.hint)}</div>`:''}
        ${tf}${mc}${answered}</li>`;
    }).join('')}</ol>`;
  }
  card.innerHTML = `
    <div class="exhead"><h5>${esc(set.title_en)}</h5>${set.title_zh?`<span class="zh">${esc(set.title_zh)}</span>`:''}</div>
    <div class="exinstr">${esc(set.instr_en)}${set.instr_zh?`<div class="zh">${esc(set.instr_zh)}</div>`:''}</div>
    ${bank}${body}`;
  if (SPEAK_OK) markExSpeak(card);
  return card;
}

/* 题干点读：给英文题干、参考答案英文行、完形句子加上朗读能力 */
function markExSpeak(card){
  card.querySelectorAll('.q').forEach(q => {
    if (q.classList.contains('cn')) return;
    if (!speakableText(q.textContent)) return;
    q.classList.add('spkable');
    q.title = '点击朗读这句英文（再点一次停止）';
  });
  card.querySelectorAll('.ansbox .en').forEach(x => {
    if (!speakableText(x.textContent)) return;
    x.classList.add('spkable');
    x.title = '点击朗读参考答案（再点一次停止）';
  });
  const cz = card.querySelector('.cztext');
  if (cz){
    splitSentences(cz);
    cz.querySelectorAll('.sspk').forEach(s => { s.title = '点击朗读这一句（再点一次停止）'; });
  }
  const nodes = Array.from(card.querySelectorAll('.q.spkable, .sspk'));
  const head = card.querySelector('.exhead');
  if (!head || !nodes.length) return;
  const btn = document.createElement('button');
  btn.className = 'pill explay';
  btn.dataset.label = '依次朗读';
  btn.innerHTML = ICON_SPEAK + '<span>依次朗读</span>';
  btn.title = '用微软 Ryan 语音依次朗读本组英文题干（只读题干，不读答案）';
  btn.onclick = () => { vseq && vseq.btn === btn ? stopSpeak() : startSeq(nodes, btn); };
  head.appendChild(btn);
}

function fmtQ(s){
  return esc(s || '')
    .replace(/\[\[(.+?)\]\]/g, '<u>$1</u>')
    .replace(/_{3,}/g, '<span class="bl"></span>')
    .replace(/\n/g, '<br>');
}
/* 把文本里的中文提示摘出来：返回 [纯英文文本, 摘出的中文]，保证参考答案区不夹中文 */
function stripCJK(s){
  const zh = [];
  let t = String(s || '');
  t = t.replace(/[（(]([^）)]*[一-龥][^）)]*)[）)]/g, (m, p1) => { zh.push(p1); return ''; });
  t = t.replace(/^\s*([^\n]*?[一-龥][^\n]*?[。！？])\s*/, (m, p1) => { zh.push(p1); return ''; });
  t = t.replace(/[ \t]{2,}/g, ' ').replace(/\s+([，,。.;:！!？?）)])/g, '$1').replace(/[（(]\s*[）)]/g, '').trim();
  return [t, zh.filter(Boolean).join('；')];
}
function fmtA(a, type, it){
  if (type==='tf') return `<span class="en">${esc(a)}</span>`;
  if (type==='mc' && it && it.opts){
    const o = it.opts.find(x=>x.k === String(a).trim().toUpperCase()[0]);
    if (o) return `<span class="en">${esc(o.k)}. ${esc(o.en)}</span>${o.zh?`<div class="zh">${esc(o.zh)}</div>`:''}`;
  }
  const q = String((it && it.q) || '');
  const zh0 = (it && it.az) || '';
  if (q.indexOf('______') >= 0){
    const st = stripCJK(q);
    const pre = stripCJK(String(q).split('______')[0])[0].trim();
    const whole = pre.length > 8 && String(a).toLowerCase().indexOf(pre.slice(-18).toLowerCase()) >= 0;
    const filled = whole ? String(a) : (st[0] || q).replace(/_{3,}/, '「' + a + '」');
    const zh = zh0 || st[1];
    return `<span class="en">${fmtQ(filled)}</span>${zh?`<div class="zh">${esc(zh)}</div>`:''}`;
  }
  const av = stripCJK(a);
  if (av[0] && /[A-Za-z]/.test(av[0])){
    const zh = zh0 || av[1];
    return `<span class="en">${fmtQ(av[0])}</span>${zh?`<div class="zh">${esc(zh)}</div>`:''}`;
  }
  return `<span class="en">${esc(a)}</span>${zh0?`<div class="zh">${esc(zh0)}</div>`:''}`;
}

function renderNav(items){

let io = null;
function observeSections(u){
  if (io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if (en.isIntersecting){
        document.querySelectorAll('#unitnav a').forEach(a=>a.classList.toggle('on', a.dataset.target===en.target.id));
      }
    });
  }, {rootMargin:'-70px 0px -70% 0px', threshold:0});
  document.querySelectorAll('.block').forEach(b=>io.observe(b));
}

/* ---------- 状态 ---------- */
function applyState(){
  document.body.classList.toggle('show-zh', state.zh);
  document.body.classList.toggle('show-exzh', state.exzh);
  document.body.classList.toggle('show-ans', state.ans);
  document.documentElement.style.setProperty('--fs', state.fs);
  $('#sw-zh').setAttribute('aria-pressed', state.zh);
  $('#sw-exzh').setAttribute('aria-pressed', state.exzh);
  $('#sw-ans').setAttribute('aria-pressed', state.ans);
  localStorage.setItem('zh', state.zh?'1':'0');
  localStorage.setItem('exzh', state.exzh?'1':'0');
  localStorage.setItem('ans', state.ans?'1':'0');
  localStorage.setItem('fs', state.fs);
  paintTF();
}
function paintTF(){
  document.querySelectorAll('.tfrow').forEach(row=>{
    const key = row.dataset.tf;
    const chosen = state.tf[key];
    const ans = (DATA.find(u=>u.id===state.unit).exercises[+key.split('|')[1]]||{items:[]}).items[+key.split('|')[2]];
    const correct = ans && ans.a ? String(ans.a).trim().toUpperCase()[0] : null;
    row.querySelectorAll('.tfbtn').forEach(b=>{
      b.classList.remove('sel','ok','bad');
      const isCorrect = state.ans && correct && b.dataset.v === correct;
      const isChosen = chosen === b.dataset.v;
      if (isCorrect) b.classList.add('ok');
      else if (isChosen) b.classList.add(state.ans ? 'bad' : 'sel');
    });
  });
}

/* ---------- 课文在线朗读（Microsoft Sonia / Ryan 随机分配） ---------- */
/* 语音打分：优先 Sonia / Ryan，其次 natural/online、en-US、Microsoft 的英语语音 */
function voiceScore(v){
  const n = (v.name || '').toLowerCase(), l = (v.lang || '').toLowerCase().replace('_','-');
  return (l === 'en-us' ? 40 : /^en/.test(l) ? 22 : 0)
    + (/natural|online/.test(n) ? 12 : 0)
    + (/microsoft/.test(n) ? 8 : 0)
    + (v.localService ? 0 : 4);
}
function bestVoice(list){
  return (list || []).slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
}
const TTS = window.TTS = { sonia: null, ryan: null, en: null, ready: false };
function initTTS(){
  if (!SPEAK_OK) return;
  const vs = speechSynthesis.getVoices() || [];
  if (!vs.length) return;
  const en = vs.filter(v => /^en/i.test(v.lang || ''));
  TTS.sonia = bestVoice(en.filter(v => /sonia/i.test(v.name || '')));
  TTS.ryan  = bestVoice(en.filter(v => /ryan/i.test(v.name || '')));
  TTS.en    = bestVoice(en);
  TTS.ready = true;
  paintVoices();
}
/* 顶部/每篇提示当前实际使用的朗读者 */
function paintVoices(){
  const names = [TTS.sonia, TTS.ryan].filter(Boolean)
    .map(v => String(v.name).replace(/\s*-\s*English.*$/, '').replace(/\s*\(Natural\)/i, ''));
  const txt = names.length ? names.join(' / ') : (TTS.en ? '系统默认英语语音' : '未检测到英文语音');
  document.querySelectorAll('.ttsvoices').forEach(x => { x.textContent = txt; });
  /* 语音列表通常是异步加载的：拿到后把此前占位为 auto 的课文重新分配一次 */
  if (names.length){
    document.querySelectorAll('.passvoice[data-pv]').forEach(el => {
      const uid = el.dataset.pv.split('|')[0], pid = el.dataset.pv.split('|')[1];
      const p = unitById(uid).passages.find(x => x.id === pid);
      if (!p) return;
      if (!speakerMap[uid + '|' + pid + '|0'] || speakerMap[uid + '|' + pid + '|0'] === 'auto'){
        assignSpeakers(uid, pid, p.paras);
      }
      paintPassageVoice(uid, pid);
    });
  }
}
if (SPEAK_OK){
  initTTS();
  speechSynthesis.onvoiceschanged = () => { ryanVoice = pickVoice(); initTTS(); };
  /* Edge 首次 getVoices() 可能为空，稍后再取一次 */
  setTimeout(initTTS, 400);
}
const SPK = { sonia: 'Sonia', ryan: 'Ryan' };
function voiceOf(name){
  if (name === 'sonia') return TTS.sonia || TTS.en;
  if (name === 'ryan')  return TTS.ryan  || TTS.en;
  return TTS.en;
}
function speakerLabel(name){ return SPK[name] || '默认'; }
/* 每篇课文随机指定一位朗读者（Sonia / Ryan），整篇由同一人读完，不逐段交替 */
const speakerMap = {};
function randSpeaker(){
  const hasS = !!TTS.sonia, hasR = !!TTS.ryan;
  if (!hasS && !hasR) return 'auto';
  if (hasS && !hasR) return 'sonia';
  if (hasR && !hasS) return 'ryan';
  return Math.random() < 0.5 ? 'sonia' : 'ryan';
}
function assignSpeakers(uid, pid, paras){
  let sp = null;
  paras.forEach((pa, i) => {
    const key = uid + '|' + pid + '|' + i;
    if (speakerMap[key] && speakerMap[key] !== 'auto') sp = speakerMap[key];
  });
  if (!sp) sp = randSpeaker();
  paras.forEach((pa, i) => { speakerMap[uid + '|' + pid + '|' + i] = sp; });
}
/* 长段切成小块，绕开浏览器单次朗读被截断的问题 */
function chunkText(t){
  const s = String(t || '').replace(/\s+/g, ' ').trim();
  if (!s) return [];
  const parts = s.match(/[^.!?]+[.!?]+["'”’]?\s*|[^.!?]+$/g) || [s];
  const out = []; let buf = '';
  parts.forEach(p => {
    if ((buf + p).length > 200 && buf){ out.push(buf.trim()); buf = p; }
    else buf += p;
  });
  if (buf.trim()) out.push(buf.trim());
  return out;
}
let tts = null;   /* {jobs, i, gap, scroll, btn} */
function ttsMark(node){
  clearPlaying();
  if (node){
    node.classList.add('playing');
    if (tts && tts.scroll) node.scrollIntoView({block:'center', behavior:'smooth'});
  }
}
function speakChunks(chunks, voice, done){
  if (!SPEAK_OK){ done(); return; }
  if (!chunks.length){ done(); return; }
  let k = 0;
  const step = () => {
    if (!tts || k >= chunks.length){ if (tts) done(); return; }
    const ut = new SpeechSynthesisUtterance(chunks[k]);
    if (voice){ ut.voice = voice; ut.lang = voice.lang; } else ut.lang = 'en-US';
    ut.rate = 0.95; ut.pitch = 1;
    ut.onend = ut.onerror = () => { k++; setTimeout(step, 110); };
    try { speechSynthesis.speak(ut); } catch(e){ k++; setTimeout(step, 110); }
  };
  step();
}
function ttsNext(){
  if (!tts) return;
  if (tts.i >= tts.jobs.length){ haltSpeech(); return; }
  const job = tts.jobs[tts.i];
  ttsMark(job.node);
  const v = voiceOf(job.who);
  speakChunks(chunkText(job.text), v, () => {
    if (!tts) return;
    tts.i += 1;
    setTimeout(ttsNext, tts.gap);
  });
}
function runTTS(jobs, opt){
  if (!SPEAK_OK || !jobs.length) return;
  haltSpeech();
  const o = opt || {};
  tts = { jobs, i: 0, gap: o.gap == null ? 260 : o.gap, scroll: !!o.scroll, btn: o.btn || null };
  if (tts.btn) tts.btn.classList.add('on');
  ttsNext();
}
function paraNode(uid, pid, idx){
  return document.querySelector(`.para[data-uid="${uid}"][data-pid="${pid}"][data-index="${idx}"]`);
}
function paraJobs(uid, pid){
  const u = unitById(uid), p = u.passages.find(x => x.id === pid);
  assignSpeakers(uid, pid, p.paras);
  const jobs = [];
  p.paras.forEach((pa, i) => {
    if (!pa.en) return;
    jobs.push({ uid, pid, idx: i, text: pa.en, who: speakerMap[uid+'|'+pid+'|'+i], node: paraNode(uid, pid, i) });
  });
  return jobs;
}
function playParaTTS(uid, pid, idx){
  const u = unitById(uid), p = u.passages.find(x => x.id === pid);
  const pa = p.paras[idx];
  if (!pa || !pa.en) return;
  assignSpeakers(uid, pid, p.paras);
  runTTS([{ uid, pid, idx, text: pa.en, who: speakerMap[uid+'|'+pid+'|'+idx], node: paraNode(uid, pid, idx) }],
         { gap: 0, scroll: false });
}
function playAllTTS(uid, pid, gap, btn){
  runTTS(paraJobs(uid, pid), { gap: gap, scroll: true, btn: btn });
}
function reshuffle(uid, pid){
  const u = unitById(uid), p = u.passages.find(x => x.id === pid);
  p.paras.forEach((pa, i) => { delete speakerMap[uid+'|'+pid+'|'+i]; });
  assignSpeakers(uid, pid, p.paras);
  paintPassageVoice(uid, pid);
}
function paintPassageVoice(uid, pid){
  const who = speakerMap[uid+'|'+pid+'|0'] || 'auto';
  document.querySelectorAll(`.passvoice[data-pv="${uid}|${pid}"]`).forEach(b => {
    b.className = 'passvoice ' + (who === 'auto' ? '' : who);
    b.textContent = speakerLabel(who);
    b.title = '朗读者：' + speakerLabel(who) + '（整篇课文由同一人朗读）';
  });
}

/* ---------- 绑定 ---------- */
let currentUid = null;
function bindUnit(u){
  currentUid = u.id;
  document.querySelectorAll('[data-playall]').forEach(btn=>{
    btn.onclick = ()=>{
      const [uid, pid] = btn.dataset.playall.split(':');
      if (btn.dataset.mode === 'stop'){ ttsStop(); return; }
      playAllTTS(uid, pid, 1100, btn);   /* 逐段跟读：段间留 1.1 秒便于跟读 */
    };
  });
  document.querySelectorAll('[data-playfull]').forEach(btn=>{
    btn.onclick = ()=>{
      const [uid, pid] = btn.dataset.playfull.split(':');
      playAllTTS(uid, pid, 300, btn);    /* 整篇连播：段间 0.3 秒 */
    };
  });
  document.querySelectorAll('[data-reshuffle]').forEach(btn=>{
    btn.onclick = ()=>{ const [uid, pid] = btn.dataset.reshuffle.split(':'); reshuffle(uid, pid); };
  });
  document.querySelectorAll('.play').forEach(btn=>{
    btn.onclick = ()=>{
      const [uid, pid, idx] = btn.dataset.p.split('|');
      const node = btn.closest('.para');
      if (node.classList.contains('playing')){ ttsStop(); return; }
      playParaTTS(uid, pid, +idx);
    };
  });
  document.querySelectorAll('.tfrow').forEach(row=>{
    row.querySelectorAll('.tfbtn').forEach(b=>{
      b.onclick = ()=>{ state.tf[row.dataset.tf] = b.dataset.v; localStorage.setItem('tf', JSON.stringify(state.tf)); paintTF(); };
    });
  });
  document.querySelectorAll('.toccard').forEach(c=>{
    c.onclick = (e)=>{ e.preventDefault(); const t = document.querySelector(c.getAttribute('href')); if(t) t.scrollIntoView({behavior:'smooth'}); };
  });
}

/* ---------- 顶栏交互 ---------- */
$('#sw-zh').onclick = ()=>{ state.zh = !state.zh; applyState(); };
$('#sw-exzh').onclick = ()=>{ state.exzh = !state.exzh; applyState(); };
$('#sw-ans').onclick = ()=>{ state.ans = !state.ans; applyState(); };
$('#fsup').onclick = ()=>{ state.fs = Math.min(1.3, +(state.fs+0.05).toFixed(2)); applyState(); };
$('#fsdown').onclick = ()=>{ state.fs = Math.max(0.85, +(state.fs-0.05).toFixed(2)); applyState(); };
$('#menubtn').onclick = ()=>{ $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); };
$('#scrim').onclick = closeSidebar;
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
  if (e.key === 'z' || e.key === 'Z'){ state.zh = !state.zh; applyState(); }
  else if (e.key === 'a' || e.key === 'A'){ state.ans = !state.ans; applyState(); }
  else if (e.key === 'x' || e.key === 'X'){ state.exzh = !state.exzh; applyState(); }
  else if (e.key === ' '){
    e.preventDefault();
    if (tts) { ttsStop(); return; }
    const u = unitById(state.unit), p = (u.passages || [])[0];
    if (p) playAllTTS(u.id, p.id, 300, null);
  }
});

window.addEventListener('scroll', ()=>{
  const h = document.documentElement;
  const pct = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
  $('#progress').style.width = (pct*100).toFixed(1)+'%';
}, {passive:true});

/* 题干点读：点击英文题干 / 参考答案英文 / 完形句子即可朗读，再点一次停止 */
if (SPEAK_OK){
  document.addEventListener('click', e => {
    const n = e.target.closest('.q.spkable, .ansbox .en.spkable, .sspk');
    if (!n) return;
    const sel = window.getSelection ? String(window.getSelection() || '') : '';
    if (sel) return;                       /* 选中文字时不朗读，方便复制 */
    speakNode(n);
  });
}

window.addEventListener('hashchange', ()=>{
  const id = location.hash.slice(1);
  if (id === 'home' || id === ''){ stopSpeak(); showHome(); closeSidebar(); return; }
  if (id && DATA.some(u=>u.id===id)){ state.unit = id; renderDocList(); closeSidebar(); render(); }
});

/* ---------- 启动 ---------- */
const initHash = location.hash.slice(1);
if (initHash && DATA.some(u=>u.id===initHash)) state.unit = initHash;
renderDocList();
render();
applyState();
if (!initHash || initHash === 'home') showHome();
$('#homebtn').onclick = ()=>{
  if (location.hash.slice(1) === 'home') showHome(); else location.hash = 'home';
  closeSidebar();
};
</script>
